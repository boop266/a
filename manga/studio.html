================================================================================
 漫画工房（studio.html）── データの形のまとめ  ※スキーマを変えたら、ここも必ず更新する

■ 1. 台本（script）── 正規化後の形（normalizeScript の出力。Claude の出力はこの形に寄せて検証・補完される）
{
  v: 1, title: string(≤24), genre: string(≤40), logline: string(≤200),
  ending: "end" | "continue",                  // 最後のコマに「おわり」か「つづく」
  episode: number(1〜), seriesTitle: string,     // 続編は episode≥2、seriesTitle＝第1話の題名
  art: ART,                                     // 作品全体の絵柄（■2）。編集者が決める
  characters: [CHAR],                           // 最大8人
  cover: { bg: BG, time: TIME, weather: WEATHER, cast: [CAST](≤3), catch: string(≤28) },
  pages: [ { rows: [n,...]  /* 上の段から各段のコマ数 1〜3。合計＝panels.length */, panels: [PANEL](1〜7) } ]  // 表紙を除く本文
}
CHAR = { id, name, role, desc,
  species: human|cat|dog|rabbit|bear|bird|fox|mouse|frog|panda|tanuki|penguin|lion|robot|ghost|cloud|star|monster|slime|alien,
  age: child|teen|adult|elder,  body: slim|normal|round|tall,
  hair: short|bob|long|ponytail|twintail|spiky|bun|curly|bald|braid|messy,  hairColor: black|white|tone|light（動物は毛色）,
  eyes: round|sharp|sleepy|dot|sparkle|narrow,
  outfit: tshirt|shirt|suit|dress|uniform|sailor|kimono|armor|labcoat|hoodie|robe|apron|jersey|spacesuit|none,
  pattern: white|black|tone|light|stripe|dots|check|star|null,
  items: [WORN または HELD](≤4),  color: white|gray|dark|black|tone|null（cloud/ghost/star/slime/monster の体）,  size: 0.5〜1.8 }
  WORN = glasses|sunglasses|hat|fedora|cap|crown|helmet|headband|scarf|ribbon|cape|mask|eyepatch|beard|mustache|bowtie|necklace|hairflower|bandage|horns|halo|wings|headphones|earmuffs|hairbutton
  HELD = sword|staff|wand|book|umbrella|bag|flower|phone|cup|lantern|letter|ball|blaster|shield|food|mic|key|camera|fishingrod|broom|bouquet|map|box|guitar|sweets|basket|bucket|beater|shirt|towel|socks
PANEL = {
  shot: up(顔のアップ・1人)|bust|full|long|bg(人物なし),
  bg: BG,  time: day|evening|night,  weather: clear|cloudy|rain|snow|storm|fog,
  cast: [CAST](≤5),
  say: [ { who: CHAR.id | "off"(コマの外の声), type: speech|shout|think|whisper|electric|mono, text: string(≤60, \n で改行) } ],
  narr: string(≤80),  sfx: [ { text: string(≤8), size: s|m|l } ](≤3),
  fx: [rainbow|focus|speed|speedv|dark|spotlight|flashback|sparkle|hearts|gloom|shake|impact|explosion|fire|smoke|magic|question|exclaim|flowers|tone|sweat|wind|bubbles](≤4),
  laundry: [string](≤8, bg=yard のとき干す物。作画モジュールには bgSpec.laundry で渡る),
  props: [ string | { name, x?, y?, s?, facing? } ](≤8, 床に置く小物。bgSpec.props で渡り、さらに1つずつ drawProp(ctx, name, {x, y=床の線, unit=人物と同じ, facing}, art) で描く),
  big: bool|null, scale: 0.2〜3|null（背景の大きさ。bgSpec.big / bgSpec.scale で渡る。例：大きな虹）,
  art: ART_PARTIAL | null,                      // このコマだけ絵柄を部分的に上書き（例：劇画オチ）
  key: bool|null,                               // 見せ場のコマ。高画質モードでは構図違いを2〜3案描いて、編集者が画像を見て選ぶ
  draw: [DRAW](≤2) | null,                      // 自由作画枠。Claude が SVG で描いた一枚絵をコマに重ねる（人物は描かない）
  camera: CAMERA | null,                        // 背景の視点（bgSpec.camera で渡る。3D の背景で効く）
  bg3d: rampart|ruins|tower|rocks|wasteland|town|city|metropolis|ruined_city|factory|grassland | null,  // 2D に無い 3D の背景名（bg は 2D の代わりの背景。BG_ALIAS）
  scene3d: SCENE3D | null                       // 3D の場面。scene3d.on のコマだけ、shot が full/long/bg のときに drawScene で描く
}
CAMERA = { angle?: worm|low|eye|high|bird|top, lens?: tele|normal|wide|ultra, yaw?: −180〜180 }
SCENE3D = { on: bool（編集者が scene3dPanels で選んだときだけ true。作者の on は無視）, camera: CAMERA|null,
            actors: [ { type: knight|mannequin|beast|horse|bones|skull|sword|spear|shield|rock|tree|rubble|debris|concrete|ruin|pipe|tank, pos?: [x, z]|[x, y, z], yaw?, pose?, height?, tilt?, size?, r?, n?, h?, weapon?, shield?, cape? } ](≤6),
            fx?: { focus?, speed? }, note }   ※顔のある人物は 3D にしない（cast はいつも 2D）
DRAW = { prompt: string(≤200, 何を描くか), layer: bg(背景の代わり・覆う)|fg(人物の手前・収める)|fx(効果・収める),
         box?: { x, y, w, h }(コマ内の 0〜1。省略でコマ全体), engine?: '3d'(styles3d の drawObject で描く),
         id?: string(描けたら付く。SVG 本体は draw_<workId> に保存), note?: string, rounds?: 講評で直した回数 }
  描く順：背景 → draw(bg) → 小物 → 人物 → draw(fg) → 効果 → draw(fx) → 吹き出し
CAST = { id, x: 0.05〜0.95|null(自動), face: left|right|front|back|null(自動), expr: EXPR, pose: POSE, hold: HELD|"none"|null,
         color: (cloud等の色の上書き)|null, rain: 0〜3|null(雲の雨), look: up|down|side|null,
         float: true|0〜3（大人の身長の何倍浮かせるか）|null, lift: px|null, exprLevel: 0〜2（表情の強さ）|null }   ※どれも作画モジュールの box にそのまま渡る
  EXPR = normal|smile|happy|laugh|surprised|shock|angry|rage|sad|cry|worried|think|determined|nervous|sleepy|smug|love|scared|embarrassed|blank|pain|funny|puff（別名 appuppu / cheeks）|funny2
  POSE = stand|walk|run|jump|sit|kneel|point|wave|surprise|cheer|fight|punch|cast|think|cry|hold|armscross|reach|shrug|hips|hide|float
BG = rainbow|yard（物干しの庭。PANEL.laundry に干す物の配列）|room|classroom|office|kitchen|cafe|washitsu|hospital|lab|library|station|street|shopping|park|forest|beach|mountain|field|sky|space|spaceship|castle|throne|cave|shrine|desert|underwater|rooftop|edo|gym|stage|plain|tone|black|flowers|sparkle（別名も受け付ける：BG_ALIAS）

■ 2. 絵柄（art）── 連続パラメータ。値の範囲は作画担当の styles/art.js（MangaStylesKit）に合わせている
ART = {
  headRatio: 2〜8（頭身。2=強いデフォルメ、8=リアル。0〜1 で来たら「頭の大きさ」とみなし 8−6×値 に直す）, deform, eyeSize: 0〜1, eyeStyle: dot|simple|sparkle|sharp|realistic,
  line: { weight, taper, jitter, roughness: 0〜1 },
  hatching, crossHatch, black, tone: 0〜1, toneKind: dot|gradient|kakeami|none,
  detail, perspective, dynamism, sparkle, softness, grain: 0〜1, panelFrame: clean|rough|borderless|rounded,
  direction: string(≤200 作画方針), aim: string(≤60 狙いの一言。本棚・読む画面で読者に見せる), reason: string(≤300), renderer?: 作画モジュール名
}
ART_PARTIAL = ART の一部の項目だけ（line は項目ごとに上書き）＋ note: string(≤60 演出の意図)
・コマで有効な絵柄 = mergeArt(script.art, panel.art)。作画モジュールには opts としてこれを渡す。

■ 3. 保存される作品（work）── db: data/users/<user.id()>/work_<id>
{ id, script: SCRIPT（完成稿）, nameScript: SCRIPT（作者の最初のネーム。編集前。ネームと完成の比較に使う）|null, meeting: MEETING|null,
  profile: PROFILE, feat: FEAT, artFeat: ARTFEAT, extras: EXTRAS|null,
  meta: { createdAt: ms, mode: random|pref|sequel|sample, seed: SEED|null,
          aim: { kind: random|pref|sequel, target?: 0〜100(狙った好み度), fit?: 0〜100(できあがり予測), brief?: string } | null,
          editor: [ { stage: name|check, round?, verdict: ok|revise, notes: [string], originality: string, sparks?: [string], warnings?: number, artFix?: string } ],
          warnings: [string](自動チェックの残り), log: [LOG](下), extrasError?: エラーコード, seriesId: 第1話の id | null, bundled?: true(見本),
          calls?: { used, max, plan: '標準'|'高画質' }（この作品で Claude を呼んだ回数と上限） } }
DRAWINGS（db: data/users/<id>/draw_<workId>）= { svgs: { DRAW.id: サニタイズ済みの SVG 文字列(≤30000字) }, savedAt }（240KB を超えたら大きい物から省く）
  SVG は読み込むたびにもう一度サニタイズする（許可した要素・属性だけ。script / foreignObject / style / text / image / on* / 外部の href・url() / javascript: / data: は消す）
PROFILE（編集者の仕上がりチェックが付ける。無ければ台本から推定 source:'heuristic'）
  = { axes: { humor, warmth, tension, tempo, dark, fantasy, romance, action, mystery, tearjerk, absurd, charDriven,
              talky, growth, everyday, scale, twist, afterglow, cute, smart: 0〜1 }（意味は AXES。物語の味であって絵柄ではない）,
      tags: { genre, setting, protagonist, age, relation, ending, humor, motif: [string](各≤4) }, source: editor|heuristic }
FEAT（台本から計算・0〜1）= { dialog, sfx, closeup, cast, narr, pages, panels, shout, think, night, fx, nonhuman }
ARTFEAT（絵柄から計算・0〜1）= { headRatio((h−2)/6), deform, eyeSize, line.weight, line.taper, line.jitter, line.roughness, hatching, crossHatch,
         black, tone, detail, perspective, dynamism, sparkle, softness, grain, gap(物語と絵柄のズレ: 0=王道, 1=大きくズラした) }
  gap = PROFILE.axes から線形に予想した「王道の絵柄」（EXPECT）と、実際の art との平均絶対差 ÷ 0.4（0〜1に丸め）

MEETING（企画会議。最初の工程。議事録とデザイン案をそのまま保存）
  = { transcript: [ { who: 作者|編集者|作画, text } ], pitches: [ { title, logline, hook } ], chosen: 採用した案の番号, decision: string,
      characters: [ { id, name, role, designs: [CHAR](2〜3通り), comments: [string](案ごとの一言), chosen: 採用した案の番号 } ],
      art: ART|null（絵柄の仮決め）, raw: prompts.js の validateMeeting の結果（あれば。作者・裏話の指示に渡す） }
  ・作者のネームでは、採用したデザイン（designs[chosen]）の見た目の値で characters を上書きする
EXTRAS（裏話。作品と同じ文書 work.extras に保存。見本にも付けられる）
  = { characters: [ { id: CHAR.id, name, profile: string(≤400 設定資料の文), trivia: [string](≤5) } ],
      world: [ { title, body(≤500) } ],  authorNote: string(≤900 作者あとがき),  editorNote: string(≤800 編集後記),
      foreshadowing: [ { setup, payoff } ](伏線の解説),  scrapped: [ { idea, why } ](没ネタ),  sequelHints: [string](続編につながるヒント),
      visual: { designs:[{id,label,comment}], nameVsFinal:[{panel:'ページ-コマ',comment}], expressions:[{id,expr,comment}] } | null }
  ・characters[] には past / secret / designNote も入る。prompts.js の validateExtras の形（world{summary,rules,places}, authorAfterword, cutIdeas…）も受け付けて変換する
  ・キャラクター設定資料の絵は保存しない（表示のたびに CHAR と art から立ち絵を描く）
  ・続編を作るとき、前作の extras（characters / world / foreshadowing / sequelHints）を作者への指示に入れる
meta.log（制作の各工程のログ。裏話の材料）= [
  { stage:'meeting', t, pitches:[題], chosen, decision, characters:[ { name, designs, chosen } ], art },
  { stage:'writer', t, name:{ title, logline, pages, characters:[string], beats:[ページごとの一行] }, issues },
  { stage:'name', t, verdict, notes, originality, editedByEditor: DIFF|null, art:{aim,reason,direction}, panelArt:[…], sparks:[ { label, parts, used:bool } ] },
  { stage:'revise', t, after:'ネーム検討'|'仕上がりチェックN', notes, changes: DIFF },
  { stage:'check', t, round, verdict, notes, originality, warnings, artFix, images },
  { stage:'draw', t, page, panel, layer, prompt, rounds, issues:[[string]], removed:[消した要素・属性], ok },
  { stage:'key', t, page, panel, variants:[案の名前], chosen, reason },
  { stage:'extras', t, ok } ]
呼び出しの予算（PLANS）：標準 = 1作品 最大14回・自由作画2枚・描き直し無し・見せ場1コマ（画像が送れるときだけ）
                       高画質 = 最大40回・自由作画6枚・画像を見て2回まで描き直し・見せ場2コマを3案から選ぶ（画面の「高画質モード」）
  modelTier：作者・編集者・自由作画・講評 = 'complex'、壊れたJSONの修復 = 'quick'（1回だけ）。画像は limits().images が真のときだけ送る。
  DIFF = { title:[前,後]|null, pages:[前,後]|null, linesRemoved, linesAdded, examples:[ { before, after } ], characters:[前,後]|null }
  extrasPrompt に渡す history = { firstName, editorNotes:[ { stage, verdict, notes, originality } ], revisions:[ { after, notes, changes } ],
                                  artIntent:{ aim, reason, direction, fixes, panels:[ { page, panel, note } ] }, unusedSparks:[string], usedSparks:[string] }

■ 4. 反応ログ ── db: data/users/<id>/fb_<workId>、data/users/<id>/history
FB = { liked: bool, disliked: bool（いまいち）, opens: number, finished: bool（最後のページまで）, maxPage: number(0=表紙),
       dwell: [秒](ページごとの滞在の合計、1ページ最大180秒), rereads: number, sequel: bool（続編を作った）, lastRead: ms }
HISTORY = { items: [ { id: workId, t: ms } ](開いた順・最新300件) }
・db が使えないときは localStorage の "mangakobo:" + 同じキー、それも無理ならメモリ。
・保存の決まり：どの文書にも savedAt（ms）を付ける。起動の読み込みが終わるまで書き込みは待たせる。
  書き込みは、まず localStorage の "mangakobo-pending:" + キーに同期的に控え（タブを閉じても消えない）、db が受け取ったら消す。
  db への書き込みが失敗しても保存先は切り替えず、localStorage の "mangakobo-pending:" + キーに控えて、次の起動で db に送り直す。
  読み込んだ文書は（db では凍結されているので）複製してから使う。作品は work.id で一意にまとめ、同じ id なら savedAt の新しいほうを残す。
  読み込み中にできた反応・履歴は、読み込んだ分と足し合わせる。

■ 5. 企画の種（seed）── 作者・編集者への指示に渡す
SEED = { mode: random|pref|sequel, genre, setting, hero, relation, conflict, tone, ending, gimmick, motifs: [string], pages: 8〜12,
         axes: { 20軸: 0〜1 }（狙う物語の味）, wish?: 読者のリクエスト,
         likes?, avoid?, combo?: [string], craft?: { FEAT のキー: 値 }, explore?: [string], shifted?: [軸],
         artHints?: [string]（絵柄の好み。編集者への参考情報だけ。最終判断は編集者）,
         episode?, prevEnding?（続編） }

■ 6. 外部モジュールの境界（無いとき・例外のときは組み込みの暫定版に戻る。50_app の Mod を参照）
window.Taste（taste.js）
  analyze(works{id:WORK}, feedback{id:FB}, history[{id,t}]) → ANALYSIS
     ANALYSIS = { n, nPos, nNeg, avgConf, more(あと何作|null),
                  axes:{ 軸: { pref(−0.5〜0.5), conf(0〜1), likedMean, base } }, feats:{ FEATのキー: 同 }, art:{ ARTFEATのキー: 同 },
                  tags:[ { t:"cat:値", lo(対数オッズ), conf, n, p, q } ](lo の大きい順), combos:[ { a, b, syn, nBoth, conf } ],
                  unique:[ { kind:'axis', k, s, d } | { kind:'tag', tg, pop } ], rows:[ { w:WORK, r(報酬), parts:[string] } ] }
  prefSeed(ANALYSIS, rand) → SEED の pref 部分（genre/setting/hero/relation/conflict/tone/ending/gimmick/motifs/pages/axes/likes/avoid/combo/craft/artHints/explore）
  predictFit(ANALYSIS, PROFILE, ART?) → 0〜100 | null
window.MangaPrompts（prompts.js）── どれも Claude に渡す指示文（string）を返す
  ※ prompts.js の名前と引数（drawSeed, artSparks, meetingPrompt, authorPrompt, authorRevisePrompt, editorPlanPrompt, editorReviewPrompt,
    tasteNarrativePrompt, extrasPrompt, parseJSON, validateScript/Meeting/Plan/Review/Extras）でも、下の名前でも受ける（50_app の Mod が変換）
  randomSeed(rand) → SEED,  sparks(rand) → [ { label, parts:[string], art: ART_PARTIAL } ]（ひらめきの種）,
  writer(SEED, prevWork|undefined), editorName(SCRIPT, SEED, issues[string], sparks), editorCheck(SCRIPT, SEED, issues, warnings, hasImages, finalRound),
  revise(SCRIPT, SEED, notes[string]), tasteWords(data) → string, meetingPrompt({ seed, sparks:[SEED](2〜3), prev?: WORK }) → string（返事は MEETING か prompts.js の minutes 形式）,
  extrasPrompt({ script: SCRIPT, art: ART, artIntent: { aim, reason, direction, panels }, history }) → string（返事は EXTRAS の形）,
  repair(text) → object|null（壊れたJSONの修復）, validate(kind:'script'|'editorName'|'editorCheck'|'extras', obj) → obj（検証・補完）
  返事の形：editorName → { verdict, notes, originality, script|null, art: ART, panelArt: [ { page(表紙=1), panel(1〜), art: ART_PARTIAL, note } ] }
           editorCheck → { verdict, notes, originality, script|null, artFix: ART_PARTIAL|null, profile: PROFILE }
window.MangaSamples（samples/index.js）= [ { id?, script: SCRIPT(生の台本でよい), profile?: PROFILE, extras?: EXTRAS, createdAt? } ]
画風モジュール（styles/）は <meta name="manga-styles" content="styles/index.js"> で読み込み、作画モジュールが drawCharacterSheet / drawExpressionSheet を
持っていれば、裏話の設定資料・表情集に使う。ラフ（ネーム）描画では opts.sketch = true を渡す。
window.MangaStyles.register(name, { drawCharacter(ctx, CHAR, pose, expr, box, opts), drawBackground(ctx, bgSpec, box, opts),
                                    drawEffect(ctx, effectSpec, box, opts), drawProp?(ctx, name, {x,y,unit,facing}, opts), metrics?(CHAR, opts) })   ※詳しくは 35_art の説明
3D作画（styles3d/、window.MangaInk3D）：開発版は <meta name="manga-styles3d" content="styles3d/index.js">、1ファイル版は styles3d の各ファイルを
  <script type="text/plain" data-m3d> に入れ、three r128 を CDN（window.MANGA3D_THREE_URL で差し替え可）から読んでから実行する。three は埋め込まない。
  manga3d-ready → MangaInk3D.register('ink3d', { only: ['drawBackground', 'drawEffect'] })。背景は 3D の場面がはっきり合うもの
  （rampart ruins tower rocks wasteland forest cave town city room sky metropolis ruined_city factory grassland（3D 担当が足した場面は読み込み時に自動で追加）＋ castle→rampart, street→city, mountain→rocks）だけ 3D、ほかは 2D（ink）。
  ラフ（sketch）・art.use3d === false・3D の失敗（false／例外）・manga3d-failed のときは 2D。scene3d は MangaInk3D.drawScene(ctx, { bg, actors, camera, fx }, box, art)。
  prompts.js には setVocab({ bg: 2D＋3D の背景, cameraAngle, cameraLens, actors3d }) で語彙を渡す。
ほかの 3D 作画も、次の形で受け入れる（styles と同じ形）：
window.MangaStyles3D.register(name, { supports: { bg:[名]|'*', props:[名]|'*', species:[名], objects:'*' },
                                      drawBackground?(ctx, bgSpec, box, opts), drawProp?(ctx, name, box, opts),
                                      drawCharacter?(ctx, CHAR, pose, expr, box, opts), drawObject?(ctx, DRAW, box, opts), ready?: Promise })
  supports にある物だけ 3D に回し、false / null を返すか例外なら 2D（ink → 組み込み）に戻る。art.use3d === false の作品では使わない。

   絵柄はジャンルから決めない。編集者が物語を読んで、自分のセンスと狙いで決める。

     charSpec : 正規化済みの人物定義（species, age, body, hair, hairColor, eyes, outfit, pattern, items, color, size, name, desc）
     box(人物) : { footX, footY, unit(大人の身長≒100単位のときの px), facing:-1|0|1, back, look, hold, color, rain, panel:{x,y,w,h}, rand }

  const dice = (x, y, s, rot, n) => { c1.save(); c1.translate(x, y); c1.rotate(rot); c1.beginPath(); c1.roundRect(-s / 2, -s / 2, s, s, s * 0.18); c1.fillStyle = '#fff'; c1.fill(); c1.lineWidth = 4; c1.strokeStyle = '#000'; c1.stroke(); const P = { 1: [[0, 0]], 3: [[-1, -1], [0, 0], [1, 1]], 5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]] }[n]; c1.fillStyle = '#000'; for (const [dx, dy] of P) { c1.beginPath(); c1.arc(dx * s * 0.26, dy * s * 0.26, s * 0.08, 0, TAU); c1.fill(); } c1.restore(); };
  speedLines(c1, { x: 0, y: 0, w: 144, h: 144 }, rng(3), 'h', 14); dice(52, 80, 58, -0.25, 5); dice(100, 56, 44, 0.3, 3);
  const c2 = $('icoPref').getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0, 0, 144, 144);
  concentration(c2, { x: 0, y: 0, w: 144, h: 144 }, rng(5), 72, 66, 40, 60);
  artFor({ art: ART_DEFAULT }, null).drawCharacter(c2, normalizeCharacter({ id: 'ico', species: 'cat', age: 'child', hairColor: 'white', eyes: 'sparkle', outfit: 'none' }, 0, []), 'stand', 'love', { footX: 72, footY: 196, unit: 1.6, facing: 0, panel: { x: 0, y: 0, w: 144, h: 144 }, rand: rng(2) });
}

/* 読み込んだ文書を状態に合わせる。作品は work.id で一意に。見本の id は上書きしない。
   読み込み中にできた反応・履歴（起動直後の操作）は消さずに足し合わせる */
function mergeLoaded(all) {
  const byId = {};
  for (const [k, v] of Object.entries(all)) {
    if (!k.startsWith('work_') || !v || !v.script) continue;
    const id = v.id || k.slice(5); if (state.works[id] && state.works[id].meta && state.works[id].meta.bundled) continue;
    if (byId[id] && (byId[id].savedAt || 0) > (v.savedAt || 0)) continue;
    byId[id] = { ...v, id };
  }
  for (const v of Object.values(byId)) { try { const n = normalizeScript(v.script); state.works[v.id] = { ...v, script: { ...n.script, episode: v.script.episode || 1, seriesTitle: v.script.seriesTitle || '' }, profile: v.profile || heuristicProfile(n.script), meta: v.meta || { createdAt: v.savedAt || 0, mode: 'random', editor: [], warnings: [] } }; } catch (e) { console.warn('作品を読み込めませんでした', v.id, e); } }
  for (const [k, v] of Object.entries(all)) if (k.startsWith('review_') && v && Array.isArray(v.rounds)) state.reviews[k.slice(7)] = { rounds: v.rounds };
  for (const [k, v] of Object.entries(all)) if (k.startsWith('draw_') && v && v.svgs && typeof v.svgs === 'object') for (const [id, svg] of Object.entries(v.svgs)) if (!DRAW.has(id)) registerDrawing(id, svg);
  for (const [k, v] of Object.entries(all)) if (k.startsWith('fb_') && v && typeof v === 'object') { const id = k.slice(3), cur = state.fb[id]; state.fb[id] = cur ? { ...v, liked: cur.liked || v.liked, disliked: cur.disliked || v.disliked, opens: (v.opens || 0) + (cur.opens || 0), finished: cur.finished || v.finished, maxPage: Math.max(cur.maxPage || 0, v.maxPage || 0), dwell: (v.dwell || []).map((x, i) => (x || 0) + ((cur.dwell || [])[i] || 0)), rereads: (v.rereads || 0) + (cur.rereads || 0), sequel: cur.sequel || v.sequel, lastRead: Math.max(cur.lastRead || 0, v.lastRead || 0) } : { dwell: [], ...v }; }
  const h = all.history && Array.isArray(all.history.items) ? all.history.items : [];
  const seen = new Set(); state.history = [...h, ...state.history].filter(x => x && x.id && !seen.has(x.id + ':' + x.t) && seen.add(x.id + ':' + x.t)).sort((a, b) => a.t - b.t).slice(-300);
  state.loaded = true;
}
/* ---------- 起動 ---------- */
async function boot() {
  for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => setTab(b.dataset.tab));
  $('btnRandom').addEventListener('click', () => runMake('random'));
  $('btnPref').addEventListener('click', () => runMake('pref'));
  $('btnStop').addEventListener('click', () => state.ctl && state.ctl.abort());
  state.hq = lsGet(Store.prefix + 'hq') === '1'; $('hqToggle').checked = state.hq; $('hqInfo').textContent = planNow().note;
  $('hqToggle').addEventListener('change', () => { state.hq = $('hqToggle').checked; lsSet(Store.prefix + 'hq', state.hq ? '1' : '0'); $('hqInfo').textContent = planNow().note; });
  $('nextBtn').addEventListener('click', () => showPage(state.page + 1, 1));
  $('prevBtn').addEventListener('click', () => showPage(state.page - 1, -1));
  $('likeBtn').addEventListener('click', () => setLike('like'));
  $('exBtn').addEventListener('click', () => openExtras(state.cur));
  $('exBack').addEventListener('click', () => { if (state.exId) openWork(state.exId, Math.min(state.page, state.works[state.exId].script.pages.length), false); setTab('read'); });
  $('mehBtn').addEventListener('click', () => setLike('meh'));
  $('seqBtn').addEventListener('click', () => { const w = state.works[state.cur]; if (!canMake()) { toast('続編は Claude.ai で開くと作れます'); return; } setTab('make'); runMake('sequel', w); });
  for (const b of $('filters').children) b.addEventListener('click', () => { state.filter = b.dataset.f; renderShelf(); });
  const sh = $('sheet'); let tx = null, ty = null;
  sh.addEventListener('click', e => { const r = sh.getBoundingClientRect(); if (e.clientX - r.left < r.width / 2) showPage(state.page + 1, 1); else showPage(state.page - 1, -1); });
  sh.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); if (dx < 0) showPage(state.page + 1, 1); else showPage(state.page - 1, -1); } tx = null; });
  $('fsBtn').addEventListener('click', toggleFS); $('fsClose').addEventListener('click', e => { e.stopPropagation(); exitFS(); });
  $('fsLike').addEventListener('click', () => setLike('like')); $('fsMeh').addEventListener('click', () => setLike('meh'));
  $('fsEx').addEventListener('click', () => openExtras(state.cur));
  $('fsSeq').addEventListener('click', () => { exitFS(); $('seqBtn').click(); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && FS.on && FS.api) { FS.api = false; exitFS(); } });
  for (const ev of ['pointermove', 'pointerdown']) document.addEventListener(ev, () => { if (FS.on) showHud(); }, { passive: true });
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (FS.on && e.key === 'Escape' && !FS.api) { exitFS(); return; } if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey && (state.tab === 'read' || FS.on)) { e.preventDefault(); if (state.tab !== 'read') setTab('read'); toggleFS(); } });
  document.addEventListener('keydown', e => { if (state.tab !== 'read' || e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') { showPage(state.page + 1, 1); e.preventDefault(); } if (e.key === 'ArrowRight') { showPage(state.page - 1, -1); e.preventDefault(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) commitDwell(); else if (state.tab === 'read') markStart(); });
  window.addEventListener('pagehide', () => { commitDwell(); flushSaves(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSaves(); });

  state.works[SAMPLE_ID] = sampleWork();
  if (Array.isArray(window.MangaSamples)) window.MangaSamples.forEach((x, i) => { try { const raw = x && x.script ? x.script : x; const n = normalizeScript(raw); const id = 'sample-' + (x.id || i); state.works[id] = { id, script: n.script, nameScript: x.nameScript || null, meeting: normalizeMeeting(x.meeting), profile: normalizeProfile(x.profile) || heuristicProfile(n.script), extras: normalizeExtras(x.extras, n.script), feat: scriptFeatures(n.script), meta: { createdAt: Date.parse(x.createdAt || '2026-10-01T09:00:00Z') - i, mode: 'sample', seed: null, aim: null, editor: [], warnings: [], bundled: true } }; } catch (e) { console.warn('見本を読み込めませんでした', i, e); } });
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  const ui = (() => { try { return JSON.parse(lsGet(Store.prefix + 'ui') || '{}'); } catch (e) { return {}; } })();
  const hashTab = (location.hash || '').slice(1);
  renderMake(); drawIcons();
  loadRendererModules();
  Store.init();

  try { const P = window.MangaPrompts; if (P && typeof P.setVocab === 'function') { const V = P.VOCAB || {}; const u = (a, b) => [...new Set([...(a || []), ...b])]; P.setVocab({ bg: u(V.bg, [...BG_LIST, ...SCENES3D]), cameraAngle: CAM_ANGLES, cameraLens: CAM_LENSES, actors3d: ACTORS3D, fx: u(V.fx, FX_LIST), held: u(V.held, HELD), worn: u(V.worn, WORN), species: u(V.species, SPECIES), expr: u(V.expr, EXPRS), pose: u(V.pose, POSES) }); } } catch (e) { console.warn('setVocab', e); }
  // Claude の機能（sample）を確かめる。届かない環境では null になる
  const c = window.claude;
  const samplePromise = (c && typeof c.use === 'function') ? c.use('sample').catch(() => null) : Promise.resolve(null);
  samplePromise.then(async s => {
    state.sample = s; state.sampleWhy = s ? 'ok' : 'absent';
    if (s && s.limits) { const lim = await s.limits().catch(() => null); if (lim && lim.images) { state.imgOK = true; state.imgMax = Math.min(4, lim.images.maxCount || 4); state.imgBytes = Number(lim.images.maxInputBytes) || 5e6; } }
    if (state.tab === 'make') renderMake(); if (state.tab === 'taste') renderTaste(); if (state.cur) renderReadHead();
  });
  const all = await Store.loadAll();
  mergeLoaded(all);
  await fontsReady; cache.clear(); thumbCache.clear();
  const tab = ['make', 'read', 'shelf', 'taste'].includes(hashTab) ? hashTab : ui.tab || 'make';
  if (ui.cur && state.works[ui.cur]) { state.cur = ui.cur; state.page = ui.page || 0; renderReadHead(); showPage(state.page, 0); }
  setTab(tab);
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { cache.clear(); thumbCache.clear(); if (state.tab === 'read' && state.cur) showPage(state.page, 0); });
  window.__mk = { DRAW, sanitizeSVG, registerDrawing, layoutPage, panelImage, keyVariants, PLANS, Mod, state, Store, analyze: analysisNow, normalizeScript, renderPage, checkScript, runMake, openWork, setTab, repairJSON, styles: () => window.MangaStyles.list() };
}
