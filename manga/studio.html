<title>漫画工房</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap");
/* 机の上に原稿を広げる工房。画面は道具、主役は白い原稿。 */
:root{
  --desk:#eef2f4; --card:#fbfcfc; --ink:#16191d; --sub:#5c6873; --rule:#d3dce2; --rule-strong:#aab6bf;
  --accent:#2f8fc7; --accent-ink:#ffffff; --accent-soft:#d6ebf7;
  --like:#d2456b; --like-soft:#fadde6; --neg:#8a5a9e; --neg-soft:#ece0f2; --warn:#a96a10; --warn-soft:#fbefd9;
  --paper:#ffffff; --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(22,25,29,.14);
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","IPAGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111417; --card:#191d22; --ink:#edf1f4; --sub:#9ba7b2; --rule:#2b323a; --rule-strong:#46515c;
  --accent:#6cbbe8; --accent-ink:#0d1a22; --accent-soft:#1d3342;
  --like:#f07a9a; --like-soft:#3a1f29; --neg:#c39ad4; --neg-soft:#2e2336; --warn:#e2a54a; --warn-soft:#33281a;
  --paper:#ffffff; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111417; --card:#191d22; --ink:#edf1f4; --sub:#9ba7b2; --rule:#2b323a; --rule-strong:#46515c;
  --accent:#6cbbe8; --accent-ink:#0d1a22; --accent-soft:#1d3342;
  --like:#f07a9a; --like-soft:#3a1f29; --neg:#c39ad4; --neg-soft:#2e2336; --warn:#e2a54a; --warn-soft:#33281a;
  --paper:#ffffff; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;padding:0 16px;overflow-x:hidden}
.app{max-width:980px;margin:0 auto;padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.logo{font-family:var(--display);font-size:clamp(26px,6vw,34px);line-height:1;letter-spacing:.04em}
.logo small{font-family:var(--body);font-weight:900;font-size:.42em;letter-spacing:.2em;vertical-align:.5em;margin-left:.3em;color:var(--sub)}
.tagline{font-size:12px;color:var(--sub);letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:repeat(4,auto);gap:4px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:3px}
.tabs button{border:0;border-radius:999px;padding:7px 14px;font-weight:900;font-size:14px;background:transparent;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--desk)}
@media (max-width:560px){.top{flex-direction:column;align-items:stretch}.tabs{grid-template-columns:repeat(4,1fr)}.tabs button{padding:8px 4px;font-size:13px}}
button{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;font-weight:700;line-height:1.25}
button:hover{background:var(--accent-soft)}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default;background:transparent}
.tabs button:hover{background:var(--accent-soft)} .tabs button[aria-selected="true"]:hover{background:var(--ink)}
h2{font-family:var(--body);font-weight:900;font-size:clamp(19px,4.6vw,24px);line-height:1.3;margin:0;text-wrap:balance}
h3{font-weight:900;font-size:16px;margin:0 0 6px;letter-spacing:.04em}
.sub{color:var(--sub);font-size:13px}
.notice{border:1.5px dashed var(--rule-strong);border-radius:12px;padding:12px 14px;background:var(--card);margin:0;font-size:14px}
.notice b{display:block;font-size:15px}
section[hidden]{display:none!important}

/* ---- 作る ---- */
.make{display:grid;gap:16px}
.make-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.make-cards{grid-template-columns:1fr}}
.make-card{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;text-align:left;border-radius:16px;border:2px solid var(--ink);background:var(--card);padding:16px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:0}
.make-card:hover{background:var(--card);transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.make-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.make-card canvas{width:72px;height:72px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper)}
.make-card b{display:block;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;line-height:1.2}
.make-card small{display:block;color:var(--sub);font-size:13px;margin-top:4px;font-weight:400}
.make-card .aimline{color:var(--accent);font-weight:900}
.wish{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wish label{font-weight:900;font-size:14px}
.wish input{flex:1 1 220px;min-width:0;font:inherit;border:1.5px solid var(--rule-strong);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink)}
.progress{border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:16px;display:grid;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;counter-reset:st}
@media (max-width:560px){.steps{grid-template-columns:1fr 1fr}}
.steps li{border:1.5px solid var(--rule-strong);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--sub);position:relative;min-width:0}
.steps li b{display:block;font-size:14px;color:var(--ink)}
.steps li.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.steps li.on b::after{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--accent);margin-left:.4em;animation:blink 1s infinite}
.steps li.done{border-color:var(--ink)} .steps li.done b::before{content:"✓ "}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.steps li.on b::after{animation:none}}
.ticker{font-size:14px;min-height:3.2em;border-left:4px solid var(--accent);padding:4px 10px;background:var(--desk);border-radius:0 8px 8px 0;overflow-wrap:anywhere}
.ticker .q{font-weight:700}
.seedcard{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule-strong);border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--card);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.k{border-color:var(--ink);font-weight:700}
.chip.pos{border-color:var(--accent);background:var(--accent-soft)}
.chip.neg{border-color:var(--neg);background:var(--neg-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}

/* ---- 読む ---- */
.read{display:grid;gap:12px;justify-items:center}
.read-head{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}
.read-head>div{min-width:0}
.aim{font-size:12.5px;border:1.5px solid var(--accent);color:var(--ink);background:var(--accent-soft);border-radius:999px;padding:3px 12px;font-weight:700}
.sheet{position:relative;background:var(--paper);box-shadow:var(--shadow);line-height:0;max-width:100%;border-radius:2px;cursor:pointer;touch-action:pan-y;user-select:none}
.sheet canvas{display:block;max-width:100%;width:auto;height:auto;max-height:calc(100vh - 230px);min-height:260px}
.sheet.flip{animation:flip .34s cubic-bezier(.2,.8,.2,1)} .sheet.flipb{animation:flipb .34s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(1400px) rotateY(-22deg) translateX(-5%);opacity:.3;transform-origin:right center}to{transform:none;opacity:1}}
@keyframes flipb{from{transform:perspective(1400px) rotateY(22deg) translateX(5%);opacity:.3;transform-origin:left center}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.flip,.sheet.flipb{animation:none}}
.pbar{width:min(480px,100%);height:5px;border-radius:9px;background:var(--rule);overflow:hidden;direction:rtl}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.nav{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.big{background:var(--ink);color:var(--desk);font-size:17px;padding:10px 24px}
.big:hover{background:var(--ink);opacity:.9}
.nombre{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px;min-width:6em;text-align:center}
.nombre b{color:var(--ink);font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.acts button{font-size:14px;padding:7px 14px;border-color:var(--rule-strong)}
#likeBtn[aria-pressed="true"]{background:var(--like);border-color:var(--like);color:#fff}
#mehBtn[aria-pressed="true"]{background:var(--neg-soft);border-color:var(--neg)}
#seqBtn{border-color:var(--ink);font-weight:900}
.keys{font-size:12px;color:var(--sub);margin:0;text-align:center}
kbd{font-family:var(--body);font-size:11px;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}
details.memo{width:min(720px,100%);border:1.5px solid var(--rule);border-radius:12px;background:var(--card);padding:8px 14px}
details.memo summary{cursor:pointer;font-weight:900;font-size:14px}
details.memo ul{margin:6px 0;padding-left:1.2em;font-size:13.5px}
.minibars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:12px;margin:6px 0}
.minibar{display:grid;grid-template-columns:5.5em 1fr;gap:6px;align-items:center}
.minibar i{display:block;height:6px;border-radius:4px;background:var(--rule);position:relative;overflow:hidden}
.minibar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--accent);border-radius:4px}

/* ---- 本棚 ---- */
.shelf{display:grid;gap:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:13.5px;padding:6px 14px;border-color:var(--rule-strong)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.book{display:grid;gap:6px;text-align:left;border:0;border-radius:6px;padding:0;background:transparent;min-width:0}
.book:hover{background:transparent}
.book .cv{position:relative;line-height:0;box-shadow:var(--shadow);border-radius:2px;overflow:hidden;background:var(--paper)}
.book canvas{width:100%;height:auto;display:block}
.book .t{font-weight:900;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.book .m{font-size:12px;color:var(--sub);line-height:1.4;font-weight:400}
.badge{position:absolute;top:6px;left:6px;font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--ink);color:var(--desk);font-weight:900}
.badge.like{left:auto;right:6px;background:var(--like);color:#fff}
.series{border:1.5px solid var(--ink);border-radius:14px;padding:12px;background:var(--card);display:grid;gap:10px;grid-column:1/-1}
.series .eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--rule);padding:6px 0;font-size:14px;flex-wrap:wrap}
.hist li time{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;min-width:7.5em}
.hist li button{font-size:13px;padding:4px 12px;border-color:var(--rule-strong)}
.empty{color:var(--sub);font-size:14px;padding:20px;text-align:center;border:1.5px dashed var(--rule-strong);border-radius:12px}

/* ---- 好み分析 ---- */
.taste{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1.5px solid var(--rule-strong);border-radius:12px;padding:10px 12px;background:var(--card);min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.panel{border:1.5px solid var(--rule);border-radius:14px;padding:14px;background:var(--card);min-width:0}
.panel>p{margin:0 0 8px}
.div-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px}
.dbar{display:grid;grid-template-columns:minmax(4.5em,7em) 1fr minmax(4.5em,7em) 3.2em;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.dbar .l{text-align:right;color:var(--sub)} .dbar .r{color:var(--sub)}
.dbar .l.hot,.dbar .r.hot{color:var(--ink);font-weight:900}
.dbar .track{position:relative;height:14px;background:var(--desk);border-radius:4px}
.dbar .track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--rule-strong)}
.dbar .fill{position:absolute;top:2px;bottom:2px;border-radius:3px}
.dbar .fill.p{background:var(--accent)} .dbar .fill.n{background:var(--neg)}
.dbar .c{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--sub);text-align:right}
.tags2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.tags2{grid-template-columns:1fr}}
.taglist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.taglist li{display:grid;grid-template-columns:1fr 4.2em;gap:8px;align-items:center;font-size:13px}
.taglist .meter{height:6px;border-radius:4px;background:var(--rule);overflow:hidden}
.taglist .meter i{display:block;height:100%}
.combos,.uniq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.combos li,.uniq li{border-left:4px solid var(--accent);padding:4px 10px;font-size:14px;background:var(--desk);border-radius:0 8px 8px 0}
.uniq li.n{border-left-color:var(--neg)}
.words{white-space:pre-wrap;font-size:14.5px;line-height:1.8;border-left:4px solid var(--ink);padding:8px 12px;background:var(--desk);border-radius:0 8px 8px 0;min-height:2em;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);z-index:10;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo">漫画工房<small>MANGA KOBO</small></span><span class="tagline">作者と編集者が、あなたのために一本描きます</span></div>
    <nav class="tabs" role="tablist" aria-label="画面">
      <button role="tab" id="tb-make" data-tab="make" aria-selected="true">作る</button>
      <button role="tab" id="tb-read" data-tab="read" aria-selected="false">読む</button>
      <button role="tab" id="tb-shelf" data-tab="shelf" aria-selected="false">本棚</button>
      <button role="tab" id="tb-taste" data-tab="taste" aria-selected="false">好み分析</button>
    </nav>
  </header>

  <section id="tab-make" class="make" role="tabpanel" aria-labelledby="tb-make">
    <p id="makeOff" class="notice" hidden></p>
    <div class="make-cards" id="makeCards">
      <button class="make-card" id="btnRandom"><canvas id="icoRandom" width="144" height="144" aria-hidden="true"></canvas><span><b>ランダムで作る</b><small>ジャンルも舞台も結末も、サイコロで決めた企画で描きます</small></span></button>
      <button class="make-card" id="btnPref"><canvas id="icoPref" width="144" height="144" aria-hidden="true"></canvas><span><b>好みで作る</b><small id="prefHint">あなたの反応から好みを読み取って描きます</small></span></button>
    </div>
    <div class="wish" id="wishRow"><label for="wish">入れてほしいこと</label><input id="wish" maxlength="60" placeholder="空でOK（例：雨の日、商店街、おばあちゃん）"></div>
    <div class="progress" id="progress" hidden aria-live="polite">
      <ol class="steps" id="steps">
        <li data-step="writer"><b>作者</b>ネームを書いています</li>
        <li data-step="editor"><b>編集者</b>チェック中</li>
        <li data-step="revise"><b>作者</b>直しています</li>
        <li data-step="finish"><b>仕上げ</b>原稿にしています</li>
      </ol>
      <div class="ticker" id="ticker">準備しています…</div>
      <div class="seedcard" id="seedCard"></div>
      <div class="row"><button id="btnStop">止める</button><span class="sub" id="roundInfo"></span></div>
    </div>
    <div id="makeErr" class="notice" hidden></div>
    <div>
      <h3>本棚から</h3>
      <div class="recent" id="recent"></div>
    </div>
  </section>

  <section id="tab-read" class="read" role="tabpanel" aria-labelledby="tb-read" hidden>
    <div class="read-head"><div><h2 id="rTitle"></h2><div class="sub" id="rMeta"></div></div><span class="aim" id="rAim" hidden></span></div>
    <div class="sheet" id="sheet" title="左半分をタップで次へ／右半分で前へ"></div>
    <div class="pbar" aria-hidden="true"><i id="barFill"></i></div>
    <div class="nav">
      <button class="big" id="nextBtn" title="次のページ（漫画は左へ進みます）">← 次</button>
      <span class="nombre" id="nombre" role="status"></span>
      <button id="prevBtn" title="前のページ">前 →</button>
    </div>
    <div class="acts">
      <button id="likeBtn" aria-pressed="false">♥ いいね</button>
      <button id="mehBtn" aria-pressed="false">いまいち</button>
      <button id="seqBtn">続編を作る</button>
    </div>
    <p class="keys"><kbd>←</kbd> 次のページ　<kbd>→</kbd> 前のページ　／ ページの左側をタップ・左へスワイプでも進めます</p>
    <details class="memo" id="memo"><summary>制作メモ（企画の種・編集者のチェック）</summary><div id="memoBody"></div></details>
  </section>

  <section id="tab-shelf" class="shelf" role="tabpanel" aria-labelledby="tb-shelf" hidden>
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">すべて</button>
      <button data-f="liked" aria-pressed="false">♥ いいねした作品</button>
      <button data-f="history" aria-pressed="false">読んだ履歴</button>
    </div>
    <div id="shelfBody"></div>
  </section>

  <section id="tab-taste" class="taste" role="tabpanel" aria-labelledby="tb-taste" hidden>
    <div id="tasteBody"></div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(() => {
'use strict';
/* =========================================================
   漫画工房 ── 汎用の漫画描画エンジン
   （manga/index.html のエンジンの技法：縦書き吹き出し・トーン・集中線・効果音 などを土台にした汎用版）
   ========================================================= */
const W = 840, H = 1188, TAU = Math.PI * 2;
const FONT = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","IPAGothic",sans-serif';
const DISP = '"Dela Gothic One","Hiragino Sans","Yu Gothic","IPAGothic",sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let x = t; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- トーン（網点・柄） ---------- */
const _pc = {};
function patCanvas(key, size, draw) {
  if (_pc[key]) return _pc[key];
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return (_pc[key] = c);
}

  ART.drawCharacter(c2, normalizeCharacter({ id: 'ico', species: 'cat', age: 'child', hairColor: 'white', eyes: 'sparkle', outfit: 'none' }, 0, []), 'stand', 'love', { footX: 72, footY: 196, unit: 1.6, facing: 0, panel: { x: 0, y: 0, w: 144, h: 144 }, rand: rng(2) });
}

/* ---------- 起動 ---------- */
async function boot() {
  for (const b of document.querySelectorAll('.tabs button')) b.addEventListener('click', () => setTab(b.dataset.tab));
  $('btnRandom').addEventListener('click', () => runMake('random'));
  $('btnPref').addEventListener('click', () => runMake('pref'));
  $('btnStop').addEventListener('click', () => state.ctl && state.ctl.abort());
  $('nextBtn').addEventListener('click', () => showPage(state.page + 1, 1));
  $('prevBtn').addEventListener('click', () => showPage(state.page - 1, -1));
  $('likeBtn').addEventListener('click', () => setLike('like'));
  $('mehBtn').addEventListener('click', () => setLike('meh'));
  $('seqBtn').addEventListener('click', () => { const w = state.works[state.cur]; if (!canMake()) { toast('続編は Claude.ai で開くと作れます'); return; } setTab('make'); runMake('sequel', w); });
  for (const b of $('filters').children) b.addEventListener('click', () => { state.filter = b.dataset.f; renderShelf(); });
  const sh = $('sheet'); let tx = null, ty = null;
  sh.addEventListener('click', e => { const r = sh.getBoundingClientRect(); if (e.clientX - r.left < r.width / 2) showPage(state.page + 1, 1); else showPage(state.page - 1, -1); });
  sh.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); if (dx < 0) showPage(state.page + 1, 1); else showPage(state.page - 1, -1); } tx = null; });
  document.addEventListener('keydown', e => { if (state.tab !== 'read' || e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') { showPage(state.page + 1, 1); e.preventDefault(); } if (e.key === 'ArrowRight') { showPage(state.page - 1, -1); e.preventDefault(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) commitDwell(); else if (state.tab === 'read') markStart(); });
  window.addEventListener('pagehide', commitDwell);

  state.works[SAMPLE_ID] = sampleWork();
  const fontsReady = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
  const ui = (() => { try { return JSON.parse(lsGet(Store.prefix + 'ui') || '{}'); } catch (e) { return {}; } })();
  const hashTab = (location.hash || '').slice(1);
  renderMake(); drawIcons();
  // Claude の機能（sample）を確かめる。届かない環境では null になる
  const c = window.claude;
  const samplePromise = (c && typeof c.use === 'function') ? c.use('sample').catch(() => null) : Promise.resolve(null);
  samplePromise.then(async s => {
    state.sample = s; state.sampleWhy = s ? 'ok' : 'absent';
    if (s && s.limits) { const lim = await s.limits().catch(() => null); if (lim && lim.images) { state.imgOK = true; state.imgMax = Math.min(4, lim.images.maxCount || 4); } }
    if (state.tab === 'make') renderMake(); if (state.tab === 'taste') renderTaste(); if (state.cur) renderReadHead();
  });
  await Store.init();
  const all = await Store.loadAll();
  for (const [k, v] of Object.entries(all)) {
    if (k.startsWith('work_') && v && v.script) { try { const n = normalizeScript(v.script); state.works[v.id] = { ...v, script: { ...n.script, episode: v.script.episode || 1, seriesTitle: v.script.seriesTitle || '' }, profile: v.profile || heuristicProfile(n.script) }; } catch (e) {} }
    else if (k.startsWith('fb_')) state.fb[k.slice(3)] = v;
    else if (k === 'history' && v && Array.isArray(v.items)) state.history = v.items;
  }
  await fontsReady; cache.clear(); thumbCache.clear();
  const tab = ['make', 'read', 'shelf', 'taste'].includes(hashTab) ? hashTab : ui.tab || 'make';
  if (ui.cur && state.works[ui.cur]) { state.cur = ui.cur; state.page = ui.page || 0; renderReadHead(); showPage(state.page, 0); }
  setTab(tab);
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { cache.clear(); thumbCache.clear(); if (state.tab === 'read' && state.cur) showPage(state.page, 0); });
  window.__mk = { state, Store, analyze: analysisNow, normalizeScript, renderPage, checkScript, runMake, openWork, setTab, repairJSON, art: () => ART.name };
}
boot();

})();
