<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うちの物干しに雲がいる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
:root{
  --desk:#eef2f4; --card:#fbfcfc; --ink:#16191d; --tone:#5c6873; --rule:#d3dce2;
  --blue:#2f8fc7; --blue-soft:#d6ebf7;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(22,25,29,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111417; --card:#191d22; --ink:#edf1f4; --tone:#9ba7b2; --rule:#2b323a;
  --blue:#6cbbe8; --blue-soft:#1d3342; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111417; --card:#191d22; --ink:#edf1f4; --tone:#9ba7b2; --rule:#2b323a;
  --blue:#6cbbe8; --blue-soft:#1d3342; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding:0 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:18px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
header{text-align:center;display:flex;flex-direction:column;gap:2px}
h1{font-family:var(--body);font-weight:900;font-size:clamp(22px,5vw,34px);line-height:1.15;margin:0;letter-spacing:.02em}
.lead{margin:0;color:var(--tone);font-size:13px;letter-spacing:.08em}
.sheet{position:relative;background:#fff;box-shadow:var(--shadow);line-height:0;max-width:100%;border-radius:2px;
  outline:1px solid rgba(0,0,0,.06);cursor:pointer;touch-action:manipulation}
.sheet canvas{display:block;max-width:100%;max-height:calc(100vh - 262px);min-height:240px;width:auto;height:auto}
.sheet.flip{animation:flip .36s cubic-bezier(.2,.8,.2,1)}
.sheet.flipb{animation:flipb .36s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(1400px) rotateY(-24deg) translateX(-5%);opacity:.25;transform-origin:right center}to{transform:none;opacity:1}}
@keyframes flipb{from{transform:perspective(1400px) rotateY(24deg) translateX(5%);opacity:.25;transform-origin:left center}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.flip,.sheet.flipb{animation:none}}
.controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
button{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:9px 18px;font-weight:700;line-height:1.2}
button:hover{background:var(--blue-soft)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.3;cursor:default;background:transparent}
.big{background:var(--ink);color:var(--desk);font-size:17px;padding:11px 26px}
.big:hover{background:var(--ink);transform:translateY(-1px)}
.nombre{font-variant-numeric:tabular-nums;color:var(--tone);font-size:14px;letter-spacing:.06em;min-width:6.5em;text-align:center}
.nombre b{color:var(--ink);font-size:17px}
.nombre .cv{font-size:13px;color:var(--tone);font-weight:400}
@media (min-width:700px){.bar{width:min(480px,100%);height:5px;border-radius:9px;background:var(--rule);overflow:hidden;direction:rtl}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.keys{font-size:12px;color:var(--tone);margin:0;text-align:center}
kbd{font-family:var(--body);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--card)}
.sub{font-size:13px;padding:6px 14px;border-color:var(--rule)}
/* フルスクリーン（API が使えないときは CSS だけで没入表示） */
body.fs{padding:0;overflow:hidden;background:#0d0f12}
body.fs .wrap{max-width:none;height:100vh;height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);justify-content:center;gap:0}
body.fs .wrap>:not(.sheet){display:none}
body.fs .sheet{box-shadow:none;outline:0}
body.fs .sheet canvas{max-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:100vw;min-height:0}
.fshud{position:fixed;left:0;right:0;top:0;z-index:10;display:none;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);color:#fff;
  font-size:13px;font-variant-numeric:tabular-nums;transition:opacity .4s}
body.fs .fshud{display:flex}
.fshud.idle{opacity:0;pointer-events:none}
.fshud button{color:#fff;border-color:rgba(255,255,255,.8);padding:6px 14px;font-size:13px}
.fshud button:hover{background:rgba(255,255,255,.15)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>うちの物干しに雲がいる</h1>
    <p class="lead">オリジナル読み切り漫画・全<span id="total">15</span>ページ</p>
  </header>
  <div class="sheet" id="sheet" title="左半分をタップで次へ／右半分で前へ"></div>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  <div class="controls">
    <button class="big" id="nextBtn" title="次のページ（漫画は左へ進みます）">← 次</button>
    <span class="nombre" id="nombre" role="status"></span>
    <button id="prevBtn" title="前のページ">前 →</button>
  </div>
  <div class="controls">
    <button class="sub" id="firstBtn">表紙へ</button>
    <button class="sub" id="fsBtn">フルスクリーン</button>
  </div>
  <p class="keys"><kbd>←</kbd> 次　<kbd>→</kbd> 前　<kbd>F</kbd> フルスクリーン　（左側タップ・左スワイプでも次へ）</p>
</div>
<div class="fshud" id="fsHud"><span id="fsPage"></span><button id="fsClose">閉じる</button></div>

<script>
(() => {
'use strict';
/* =========================================================
   描画エンジン
   ========================================================= */
const W = 840, H = 1188;
const FONT = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","IPAGothic",sans-serif';
const DISP = '"Dela Gothic One","Hiragino Sans","Yu Gothic","IPAGothic",sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let x = t; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

/* スクリーントーン（網点）。k はいまの拡大率：拡大していても網点の大きさは変えない */
function tone(ctx, size = 6, rad = 1.4, k = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#000';
  g.beginPath(); g.arc(size / 2, size / 2, rad, 0, TAU); g.fill();
  g.beginPath(); for (const [x, y] of [[0, 0], [size, 0], [0, size], [size, size]]) { g.moveTo(x, y); g.arc(x, y, rad, 0, TAU); } g.fill();
  const p = ctx.createPattern(c, 'repeat');
  if (k !== 1 && p.setTransform) p.setTransform(new DOMMatrix([1 / k, 0, 0, 1 / k, 0, 0]));
  return p;
}
const LIGHT = (ctx, k) => tone(ctx, 6, 1.15, k), MID = (ctx, k) => tone(ctx, 6, 1.75, k), DARK = (ctx, k) => tone(ctx, 5, 2.05, k);

function concentration(ctx, b, r, cx, cy, clear, n = 150) {
  ctx.fillStyle = '#000'; const R = Math.hypot(b.w, b.h) * 1.2;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + r() * 0.03, w = 0.004 + r() * 0.011, inner = clear * (0.9 + r() * 0.6);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a - w) * R, cy + Math.sin(a - w) * R);
    ctx.lineTo(cx + Math.cos(a + w) * R, cy + Math.sin(a + w) * R); ctx.lineTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner); ctx.fill();
  }
}
function speedLines(ctx, b, r, dir = 'h', n = 55) {
  ctx.strokeStyle = '#000';
  for (let i = 0; i < n; i++) {
    ctx.lineWidth = 0.6 + r() * 2; ctx.beginPath();
    if (dir === 'h') { const y = b.y + r() * b.h, x = b.x + r() * b.w * 0.4, len = b.w * (0.25 + r() * 0.6); ctx.moveTo(x, y); ctx.lineTo(x + len, y); }
    else { const x = b.x + r() * b.w, y = b.y + r() * b.h * 0.5, len = b.h * (0.25 + r() * 0.6); ctx.moveTo(x, y); ctx.lineTo(x, y + len); }
    ctx.stroke();
  }
}
function toneGradient(ctx, b, r0, r1, step = 7, y0 = 0, y1 = 1) {
  ctx.fillStyle = '#000';
  const ya = b.y + b.h * y0, yb = b.y + b.h * y1;
  for (let y = ya, row = 0; y < yb; y += step * 0.866, row++) {
    const t = (y - ya) / (yb - ya), rad = r0 + (r1 - r0) * t; if (rad < 0.25) continue;
    ctx.beginPath();
    for (let x = b.x + (row % 2 ? step / 2 : 0); x < b.x + b.w + step; x += step) { ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, TAU); }
    ctx.fill();
  }
}
function star4(ctx, x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y); ctx.quadraticCurveTo(x, y, x, y + s);
  ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#000'; ctx.stroke();
}

/* ---------- 縦書き ---------- */
const VMAP = { 'ー': '｜', '―': '｜', '…': '︙', '〜': '≀', '～': '≀', '（': '︵', '）': '︶', '「': '﹁', '」': '﹂', '-': '｜' };
const SMALL = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ';
function vglyph(ctx, ch, x, y, fs) {
  if (ch === '、' || ch === '。') ctx.fillText(ch, x + fs * 0.6, y - fs * 0.55);
  else if (SMALL.includes(ch)) ctx.fillText(ch, x + fs * 0.12, y - fs * 0.1);
  else ctx.fillText(VMAP[ch] || ch, x, y);
}
function vcols(t, maxRows) {
  const cols = [];
  for (const part of t.split('\n')) { const a = [...part]; for (let i = 0; i < a.length; i += maxRows) cols.push(a.slice(i, i + maxRows)); }
  return cols;
}
function drawV(ctx, cols, cx, cy, fs, lh) {
  const rows = Math.max(...cols.map(c => c.length)), tw = (cols.length - 1) * lh + fs, th = rows * fs;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  cols.forEach((col, ci) => { const x = cx + tw / 2 - fs / 2 - lh * ci; col.forEach((ch, ri) => vglyph(ctx, ch, x, cy - th / 2 + fs * (ri + 0.5), fs)); });
}

/* ---------- 線で縁取った手足 ---------- */
function limb(ctx, pts, w, fill, lw) {
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path(); ctx.strokeStyle = '#000'; ctx.lineWidth = w + lw * 2; ctx.stroke();
  path(); ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.stroke();
}
function blob(ctx, x, y, rx, ry, fill, lw, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = '#000'; ctx.stroke();
}

/* =========================================================
   登場人物
   ハル  ：黒髪のおかっぱ＋ボタンの髪どめ、しましまTシャツ、黒い半ズボン
   お母さん：網点の髪をおだんごにまとめ、白いエプロン、黒くて長いスカート
   モク  ：ちいさな雨雲。悲しいと灰色になって雨がふる。笑うと白くふくらむ
   ========================================================= */
const GEO = {
  haru: { hc: -77, R: 19, shY: -56, shX: 9.5, waist: -37, hip: -30, L: 11, legX: 5, legW: 6.2, armW: 5.4, k: 19 / 100, headY: 0.77 },
  mom: { hc: -86.5, R: 13, shY: -72, shX: 12, waist: -51, hip: -18, L: 14.5, legX: 4.3, legW: 4.6, armW: 4.6, k: 13 / 100, headY: 0.865 },
};

function armPose(pose, s, F, g) {
  const S = [s * g.shX, g.shY + 1.5], L = g.L;
  const rel = (e, h) => [[S[0] + e[0] * L, S[1] + e[1] * L], [S[0] + h[0] * L, S[1] + h[1] * L]];
  const down = () => rel([s * .22, .92], [s * .3, 1.85]);
  const up = () => rel([s * .62, -.75], [s * .78, -1.75]);
  switch (pose) {
    case 'up': return up();
    case 'wave': return s === F ? rel([s * .95, -.45], [s * 1.1, -1.5]) : down();
    case 'hips': return rel([s * 1.0, .75], [s * .25, 1.45]);
    case 'hold': return rel([s * .4, .95], [-s * .38, 1.5]);
    case 'point': return s === F ? rel([s * .95, -.1], [s * 1.9, -.35]) : down();
    case 'pointup': return s === F ? rel([s * .7, -.6], [s * 1.0, -1.7]) : down();
    case 'reach': return rel([F * .7 + s * .22, -.3], [F * 1.45 + s * .28, -1.0]);
    case 'grab': return rel([F * .7 + s * .2, .45], [F * 1.5 + s * .15, .7]);
    case 'run': return s === F ? rel([s * .7, .6], [s * 1.4, .1]) : rel([s * .55, .8], [s * 1.0, 1.65]);
    case 'tickle': return rel([F * .6 + s * .25, .5], [F * 1.45 + s * .2, .25]);
    case 'broom': return rel([F * .45 + s * .32, -.55], [F * .75 + s * .18, -1.45]);
    case 'broomdown': return s === F ? rel([s * .4, .9], [s * .8, 1.7]) : down();
    case 'hang': return rel([F * .85 + s * .3, -.55], [F * 1.45 + s * .32, -1.35]);
    case 'wide': return rel([s * .95, -.2], [s * 1.9, -.5]);
    case 'dance': return s === F ? up() : rel([s * 1.0, .1], [s * 1.75, -.55]);
    case 'cheeks': { const hx = s * g.R * 0.95, hy = g.hc + g.R * 0.35; return [[s * g.R * 1.3, g.hc + g.R * 1.25], [hx, hy]]; }
    case 'chin': if (s === F) return [[S[0] + s * L * .75, S[1] + L * .9], [F * g.R * 0.32, g.hc + g.R * 0.9]]; return rel([s * 1.0, .75], [s * .25, 1.45]);
    case 'fan': if (s === F) return [[S[0] + s * L * 1.0, S[1] + L * .35], [s * g.R * 1.45, g.hc + g.R * 0.25]]; return rel([s * 1.0, .75], [s * .25, 1.45]);
    case 'brow': if (s === F) return [[S[0] + s * L * .9, S[1] + L * .2], [s * g.R * 0.45, g.hc - g.R * 0.85]]; return down();
    default: return down();
  }
}

function drawPerson(ctx, X, Y, h, id, o, r) {
  const g = GEO[id], A = id === 'mom', u = h / 100, F = o.f || 0, fw = F || 1;
  const lwPx = clamp(1.4 + h * 0.0045, 1.8, 4.6), lw = lwPx / u;
  ctx.save(); ctx.translate(X, Y); ctx.scale(u, u); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const pose = o.p || 'down', legs = o.legs || (pose === 'run' ? 'run' : 'stand');
  let dy = 0;
  if (legs === 'jump') { ctx.translate(0, -14); }
  /* --- 足 --- */
  const hip = g.hip;
  if (legs === 'crouch') {
    dy = A ? 14 : 12;
    for (const s of [-1, 1]) { limb(ctx, [[s * g.legX, hip + dy], [s * (g.legX + 4) + fw * 6, hip + dy - 6], [s * (g.legX + 1), -3]], g.legW, '#fff', lw); blob(ctx, s * (g.legX + 1) + fw * 2, -1.8, 5.2, 2.8, '#000', lw); }
  } else for (const s of [-1, 1]) {
    let pts;
    const front = s === fw;
    if (legs === 'run') pts = front ? [[s * g.legX * 0.6, hip], [fw * 8, hip * 0.5], [fw * 9, -3]] : [[s * g.legX * 0.6, hip], [-fw * 3, hip * 0.45], [-fw * 9, hip * 0.35]];
    else if (legs === 'jump') pts = [[s * g.legX, hip], [s * (g.legX + 4), hip * 0.45], [s * g.legX - fw * 5, -6]];
    else pts = [[s * g.legX, hip], [s * (g.legX + 0.6), -3]];
    limb(ctx, pts, g.legW, '#fff', lw);
    const f = pts[pts.length - 1]; blob(ctx, f[0] + fw * (F ? 1.5 : 0), f[1] + 0.6, A ? 4.3 : 5.0, A ? 2.4 : 2.9, '#000', lw);
  }
  ctx.translate(0, dy);
  /* --- 胴 --- */
  ctx.lineWidth = lw; ctx.strokeStyle = '#000';
  if (A) {
    ctx.beginPath(); ctx.moveTo(-11, -52); ctx.lineTo(11, -52); ctx.lineTo(16.5, -17); ctx.quadraticCurveTo(0, -15, -16.5, -17); ctx.closePath(); ctx.fillStyle = '#111'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5.5, -75); ctx.lineTo(5.5, -75); ctx.lineTo(12.5, -70); ctx.lineTo(11, -50); ctx.lineTo(-11, -50); ctx.lineTo(-12.5, -70); ctx.closePath(); ctx.fillStyle = MID(ctx, u); ctx.fill(); ctx.stroke();
    if (!o.back) { // エプロン
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-7, -67); ctx.lineTo(7, -67); ctx.lineTo(8, -51); ctx.lineTo(12.5, -50); ctx.lineTo(14, -21); ctx.quadraticCurveTo(0, -19.5, -14, -21); ctx.lineTo(-12.5, -50); ctx.lineTo(-8, -51); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-6.5, -67); ctx.lineTo(-4, -75); ctx.moveTo(6.5, -67); ctx.lineTo(4, -75); ctx.moveTo(-12.5, -50); ctx.lineTo(12.5, -50); ctx.stroke();
      ctx.beginPath(); ctx.rect(-5, -42, 10, 8); ctx.stroke();
    } else { // 後ろ姿：エプロンのリボン
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.rect(-11.5, -52, 23, 3); ctx.fill(); ctx.stroke();
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 4, -51, 4, 2.4, s * 0.3, 0, TAU); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(s * 1, -50); ctx.lineTo(s * 4, -42); ctx.lineTo(s * 6.5, -43); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
  } else {
    ctx.beginPath(); ctx.moveTo(-11.5, -38); ctx.lineTo(11.5, -38); ctx.lineTo(12.5, -26); ctx.lineTo(1.2, -26); ctx.lineTo(0, -31); ctx.lineTo(-1.2, -26); ctx.lineTo(-12.5, -26); ctx.closePath(); ctx.fillStyle = '#111'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, -60); ctx.lineTo(5, -60); ctx.lineTo(10.5, -56); ctx.lineTo(12, -36); ctx.lineTo(-12, -36); ctx.lineTo(-10.5, -56); ctx.closePath();
    ctx.save(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); ctx.clip(); const dots = new Path2D(); for (let y = -55, row = 0; y < -35; y += 5.2, row++) for (let x = -13 + (row % 2) * 3.2; x < 14; x += 6.4) { dots.moveTo(x + 1.35, y); dots.arc(x, y, 1.35, 0, TAU); } ctx.fillStyle = '#000'; ctx.fill(dots); ctx.restore();
  }
  /* --- 腕 --- */
  const armsAfterHead = ['cheeks', 'chin', 'brow'].includes(pose);
  const hands = [];
  const drawArms = () => {
    for (const s of [-1, 1]) {
      const [E, Hh] = armPose(pose, s, fw, g), S = [s * g.shX, g.shY + 1.5];
      const mid = [S[0] + (E[0] - S[0]) * 0.55, S[1] + (E[1] - S[1]) * 0.55];
      limb(ctx, [S, E, Hh], g.armW, '#fff', lw);

/* =========================================================
   ビューアー
   ========================================================= */
const N = STORY.length, cache = new Map();
let fontsReady = null;
function waitFonts() {
  if (fontsReady) return fontsReady;
  const loads = document.fonts ? Promise.all([document.fonts.load(`700 20px "Zen Kaku Gothic New"`), document.fonts.load(`900 20px "Zen Kaku Gothic New"`), document.fonts.load(`20px "Dela Gothic One"`)]).catch(() => {}) : Promise.resolve();
  fontsReady = Promise.race([loads, new Promise(res => setTimeout(res, 2500))]);
  return fontsReady;
}
async function renderPage(i) { await waitFonts(); return renderPageSync(i); }
window.MANGA = { pageCount: N, renderPage, warnings: i => { renderPageSync(i); return warnings.slice(); } };

const $ = id => document.getElementById(id);
let cur = 0, busy = 0;
$('total').textContent = N;
async function show(i, dir = 1) {
  i = clamp(i, 0, N - 1); const my = ++busy;
  if (!cache.has(i)) cache.set(i, await renderPage(i));
  if (my !== busy) return;
  cur = i;
  const cv = cache.get(i), sh = $('sheet');
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', i === 0 ? '表紙' : `${i + 1}ページ`);
  sh.replaceChildren(cv);
  sh.classList.remove('flip', 'flipb'); void sh.offsetWidth; sh.classList.add(dir >= 0 ? 'flip' : 'flipb');
  $('nombre').innerHTML = i === 0 ? '<span class="cv">表紙</span>' : `<b>${i + 1}</b> / ${N}`;
  $('nextBtn').disabled = i >= N - 1; $('prevBtn').disabled = i <= 0;
  $('nextBtn').textContent = i >= N - 1 ? 'おしまい' : (i === 0 ? '← 読む' : '← 次');
  $('fsPage').textContent = i === 0 ? '表紙' : `${i + 1} / ${N}`;
  $('barFill').style.width = `${(i + 1) / N * 100}%`;
  // 先読み
  setTimeout(() => { for (const k of [i + 1, i - 1]) if (k >= 0 && k < N && !cache.has(k)) cache.set(k, renderPageSync(k)); }, 60);
}
$('nextBtn').onclick = () => show(cur + 1, 1);
$('prevBtn').onclick = () => show(cur - 1, -1);
$('firstBtn').onclick = () => show(0, -1);
let swiped = false;
$('sheet').addEventListener('click', e => { if (swiped) { swiped = false; return; } const rc = $('sheet').getBoundingClientRect(), left = e.clientX < rc.left + rc.width / 2;
  if (left) show(cur + 1, 1); else show(cur - 1, -1); });
// スワイプ：左へ払うと次のページ（漫画は左へ進む）
let tx = 0, ty = 0;
$('sheet').addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
$('sheet').addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) { swiped = true; setTimeout(() => { swiped = false; }, 400); if (dx < 0) show(cur + 1, 1); else show(cur - 1, -1); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur + 1, 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur - 1, -1); }
});
// フルスクリーン：使えれば本物、だめなら CSS の没入表示
let hudTimer = 0;
function pokeHud() { const h = $('fsHud'); h.classList.remove('idle'); clearTimeout(hudTimer); hudTimer = setTimeout(() => h.classList.add('idle'), 2500); }
function setFs(on) {
  document.body.classList.toggle('fs', on); $('fsBtn').textContent = on ? 'フルスクリーンを終える' : 'フルスクリーン';
  if (on) pokeHud();
}
async function toggleFs() {
  const on = !document.body.classList.contains('fs');
  if (on) { setFs(true); try { await document.documentElement.requestFullscreen?.(); } catch {} }
  else { setFs(false); if (document.fullscreenElement) try { await document.exitFullscreen(); } catch {} }
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false); });
$('fsBtn').onclick = toggleFs;
$('fsClose').onclick = e => { e.stopPropagation(); toggleFs(); };
['pointermove', 'pointerdown'].forEach(t => document.addEventListener(t, () => { if (document.body.classList.contains('fs')) pokeHud(); }, { passive: true }));
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFs(); }
  else if (e.key === 'Escape' && document.body.classList.contains('fs') && !document.fullscreenElement) setFs(false);
});
show(0, 1);
})();
