<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="八つ枠"><meta name="theme-color" content="#14122a">
<title>八つ枠のカバン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho+B1:wght@500;600;800&display=swap">
<style>:root{--bg:#0a090c;--ink:#e9dfc6;--dim:#a39884;--gold:#d9b35e;--brass:#b08a44;--brass2:#6e5426;--teal:#8fe0cc;--red:#c4463a;--curse:#b06cf0;--stoneC:#3b3936;--parchC:#dccaa0;--inkD:#3a2a18;
 --stone:none;--parch:none;--leather:none}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.ttl0{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 4px}.ttl0 b{font-size:26px;letter-spacing:3px;color:#282850;text-shadow:0 2px 0 #f0c04e}.ttl0 i{display:grid;grid-template-columns:repeat(4,18px);gap:3px;padding:7px 9px;background:#7a4a2a;border-radius:8px 8px 12px 12px;box-shadow:0 0 0 2px #3a2010}.ttl0 i s{width:18px;height:18px;background:#2a1a10;border-radius:3px;box-shadow:inset 0 0 0 1px #c09050}.ttl0 i s:first-child{background:radial-gradient(#ffe9a0,#d08a20);animation:ttl0 1.6s ease-in-out infinite}@keyframes ttl0{50%{filter:brightness(1.35)}}.ttl0 small{font-size:12px;color:#5a5478;letter-spacing:2px}
body{background:var(--bg);color:var(--ink);font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;margin:0;font-size:15px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.wrap{position:fixed;inset:0}
.stage{position:absolute;inset:0}
canvas#scr{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;background:#000;cursor:pointer}
/* vignette frame */
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px 18px #000a,inset 0 0 0 1px #0008}
/* ===== stone material helpers */
.stoneP{background:var(--stone),linear-gradient(#4a4744,#2b2926);background-blend-mode:overlay,normal;box-shadow:inset 0 1px 0 #ffffff22,inset 0 -2px 0 #0006,0 0 0 1px #14120f,0 0 0 2px var(--brass2),0 0 0 3px #14120f,0 4px 12px #000c}
/* ===== HUD */
.hud{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:3;display:grid;grid-template-columns:auto auto;gap:3px 10px;align-items:center;padding:8px 12px 7px;font-size:12px;color:var(--dim);border-radius:3px;
 background:var(--stone),linear-gradient(#45423ee6,#2a2825e6);background-blend-mode:overlay,normal;box-shadow:inset 0 1px 0 #ffffff1c,0 0 0 1px #14120f,0 0 0 2px var(--brass2),0 4px 12px #000b}
.hud>span:first-child{display:none}
.hud .bar{grid-column:1/-1;width:128px;height:9px;background:#120f0c;box-shadow:inset 0 1px 2px #000,0 0 0 1px var(--brass2);position:relative;overflow:hidden}
.hud .bar i{display:block;height:100%;background:linear-gradient(#e0604a,#8a2418);transition:width .3s;box-shadow:inset 0 1px 0 #ffb09a88}
.hud b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hud #hpt{font-size:14px;font-weight:800;color:#ffd9c0;grid-row:1;grid-column:1/-1;justify-self:start;margin-top:-1px;margin-left:2px;text-shadow:0 1px 2px #000}
.hud .gold{color:var(--gold)}
.floorname{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:3;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--ink);padding:8px 12px;border-radius:3px;pointer-events:none;
 background:var(--stone),linear-gradient(#45423ee6,#2a2825e6);background-blend-mode:overlay,normal;box-shadow:inset 0 1px 0 #ffffff1c,0 0 0 1px #14120f,0 0 0 2px var(--brass2),0 4px 12px #000b;text-shadow:0 1px 0 #000}
body.titling .toast{top:var(--ttop,150px)}
.toast{transition:top .25s;position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;padding-inline:16px;z-index:3}
.toast span{display:inline-block;max-width:34em;padding:7px 14px;font-size:13px;line-height:1.5;color:var(--inkD);transition:opacity .4s;
 background:var(--parch),linear-gradient(#e6d6ae,#cdb886);background-blend-mode:multiply,normal;box-shadow:0 0 0 1px #6e5426,0 3px 10px #000c;border-radius:2px}
/* ===== controls overlay */
.row{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-inline:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;z-index:3;pointer-events:none;flex-direction:row-reverse}
.row>*{pointer-events:auto}
.btns{display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:8px;align-items:flex-end;max-width:62%}
button.b{font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.06em;padding:10px 14px;color:var(--ink);cursor:pointer;border:0;border-radius:3px;
 background:var(--stone),linear-gradient(#57534e,#34312d);background-blend-mode:overlay,normal;box-shadow:inset 0 1px 0 #ffffff26,inset 0 -2px 0 #0007,0 0 0 1px #14120f,0 0 0 2px var(--brass2),0 3px 8px #000b;text-shadow:0 1px 0 #000}
button.b:active{transform:translateY(1px);filter:brightness(1.15)}
button.b.sub{color:var(--dim)}
button.b.go{color:#2a1c08;text-shadow:0 1px 0 #f4dca0;background:linear-gradient(#f0d488,#b08a44 60%,#8a6a2c);box-shadow:inset 0 1px 0 #fff4c8,inset 0 -2px 0 #5a4418,0 0 0 1px #2a1c08,0 0 14px #d9b35e66,0 3px 8px #000b}
button.b:disabled{opacity:.4;filter:grayscale(.5)}
#btns button.b:first-child{width:62px;height:62px;border-radius:50%;padding:0;font-size:12px;line-height:1.15;display:grid;place-items:center;white-space:pre-line}
.hint{margin:0;color:var(--dim);font-size:12px;line-height:1.7;width:100%}
.pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:2px;padding:4px;border-radius:26px;background:radial-gradient(#0000,#0000 60%,#0000)}
.pad button{font-family:inherit;border:0;color:var(--ink);font-size:15px;cursor:pointer;border-radius:6px;opacity:.9;
 background:var(--stone),linear-gradient(#56524d,#33302c);background-blend-mode:overlay,normal;box-shadow:inset 0 1px 0 #ffffff24,inset 0 -3px 0 #0007,0 0 0 1px #14120f,0 2px 6px #000b;text-shadow:0 1px 0 #000}
.pad button:active{filter:brightness(1.3);box-shadow:inset 0 2px 4px #0008,0 0 0 1px var(--gold)}
/* ===== bag sheet */

.sheet .btns{width:100%}
.sheet .btns .b{max-width:100%}
.sheet .btns .b.go{width:100%;white-space:normal;text-align:center;font-size:13px;line-height:1.35;padding:10px 8px}
body.sheeton .row,body.sheeton .abar,body.sheeton .frow{display:none!important}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;padding-inline:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateY(108%);transition:transform .28s cubic-bezier(.2,.9,.25,1.08);pointer-events:none}
.sheet.open{transform:none;pointer-events:auto}
.sheet.fightm .in{max-height:46vh}
.sheet .in{width:100%;max-width:560px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;max-height:74vh;overflow:auto;border-radius:4px;position:relative;
 background:var(--stone),linear-gradient(#4b4844,#2a2825);background-blend-mode:overlay,normal;
 box-shadow:inset 0 1px 0 #ffffff22,inset 0 0 0 1px #14120f,inset 0 0 0 5px #2a2825,inset 0 0 0 6px var(--brass),inset 0 0 0 7px #14120f,0 -6px 24px #000d}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-inline:4px}
.sh-head b{color:var(--gold);font-weight:800;font-size:16px;letter-spacing:.12em;text-shadow:0 1px 0 #000}
.sh-head small{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.rar{font-size:10px;padding:1px 6px;margin-left:8px;border-radius:2px;letter-spacing:.1em;vertical-align:2px;box-shadow:inset 0 0 0 1px currentColor}
.rar.r0{color:#b9b0a4}.rar.r1{color:#8ab8e8}.rar.r2{color:#c8a0f0}
.top2{display:flex;gap:8px;align-items:stretch}
.tray{flex:1;padding:6px;display:flex;gap:8px;align-items:center;min-height:62px;color:var(--inkD);border-radius:2px;background:var(--parch),linear-gradient(#e6d6ae,#cdb886);background-blend-mode:multiply,normal;box-shadow:0 0 0 1px var(--brass2)}
.tray small{color:#6a5634;font-size:11px;display:block}
.drop{flex:1;border:1px dashed #6e5426;color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;min-height:62px;background:#0005;border-radius:2px}
.drop.hot{border-color:var(--gold);color:var(--gold);background:#2a211288}
.grid{display:grid;gap:3px;justify-content:center;position:relative;touch-action:none;padding:6px;border-radius:3px;background:#15120f;box-shadow:inset 0 2px 8px #000,0 0 0 1px #5a4a30,0 1px 0 #ffffff14}
.cell{background:linear-gradient(#211d19,#1a1714);box-shadow:inset 0 1px 2px #000a,inset 0 0 0 1px #2e2822}
.cell.hole{background:transparent;box-shadow:none}
.cell.ok{background:radial-gradient(#fff4c8 0,#d9b35e 55%,#8a6a2c);box-shadow:0 0 10px #d9b35e99;opacity:.55}
.cell.bad{background:#000;box-shadow:inset 0 0 6px #000;opacity:.9}
.pc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:grab;padding:2px;min-width:0;overflow:hidden;font-family:inherit;color:var(--inkD);z-index:1;position:relative;touch-action:none;border:0;border-radius:2px;
 background:var(--parch),linear-gradient(#e8d8b0,#cbb584);background-blend-mode:multiply,normal;box-shadow:inset 0 0 0 1px #8a7048,inset 0 0 8px #6e542640,0 2px 3px #000a;transition:transform .12s,box-shadow .12s}
.pc canvas{width:30px;height:30px;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 1px 0 #0006)}
.pc span{font-size:11px;font-weight:600;line-height:1.1;text-align:center;pointer-events:none}
.pc em{font-style:normal;font-size:10px;font-weight:800;color:#a8401c;pointer-events:none}
.pc em.bad{color:#6a2a9a}
.pc.tre{background:var(--parch),linear-gradient(#f2dc98,#c9a654);box-shadow:inset 0 0 0 1px #8a6a2c,inset 0 0 10px #fff4c888,0 2px 3px #000a}.pc.tre span{color:#5a3e0c}
.pc.mon{background:var(--parch),linear-gradient(#cfe0cc,#9cb89a)}.pc.mon span{color:#1e3a30}
.pc.cur{background:var(--parch),linear-gradient(#b8a0c8,#806890);box-shadow:inset 0 0 0 1px #4a2a5a,inset 0 0 12px #2a0a3a,0 2px 3px #000a}
.pc.cur::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,#2a0a3a22 6px 8px);pointer-events:none}
.pc.syn{box-shadow:inset 0 0 0 1px #8a7048,0 0 0 2px #e8923a,0 0 12px #e8923a99}
.pc.sel{box-shadow:inset 0 0 0 1px #8a7048,0 0 0 2px var(--gold),0 0 14px #d9b35ecc;transform:translateY(-2px)}
.pc.off{opacity:.38;filter:grayscale(.6)}
.pc.out{outline:1px dashed var(--teal);opacity:.6}
.pc.ghost{position:fixed;z-index:9;opacity:.92;pointer-events:none;box-shadow:0 10px 22px #000,0 0 0 2px var(--gold);transform:rotate(-3deg) scale(1.06)}
.pc.lift{opacity:.2}
.pc i{display:block;width:80%;height:3px;background:#0006;pointer-events:none}.pc i b{display:block;height:100%;background:#2a8a70}
/* ===== modal: stone tablet */
.modal{position:fixed;inset:0;background:radial-gradient(#0008,#000d);display:grid;place-items:center;padding:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));z-index:6;overflow:auto;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.box{width:100%;max-width:470px;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;border-radius:4px;position:relative;
 background:var(--stone),linear-gradient(#4a4743,#2b2926);background-blend-mode:overlay,normal;
 box-shadow:inset 0 1px 0 #ffffff22,inset 0 0 0 1px #14120f,inset 0 0 0 6px #2b2926,inset 0 0 0 7px var(--brass),inset 0 0 0 8px #14120f,0 10px 40px #000}
.box::before,.box::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4dca0,#8a6a2c 60%,#3a2a10);top:12px;left:12px;box-shadow:0 0 0 1px #14120f}
.box::after{left:auto;right:12px}
.box h2{margin:0;font-size:19px;color:var(--gold);font-weight:800;letter-spacing:.14em;text-align:center;text-shadow:0 1px 0 #000;padding-inline:16px}
.box h3{margin:8px 0 0;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.24em;display:flex;align-items:center;gap:8px}
.box h3::before,.box h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#6e5426,transparent)}
.box p{margin:0;font-size:13px;line-height:1.75;color:var(--inkD);padding:10px 12px;border-radius:2px;background:var(--parch),linear-gradient(#e6d6ae,#cdb886);background-blend-mode:multiply,normal;box-shadow:0 0 0 1px var(--brass2),inset 0 0 14px #6e542655}
.box p.hint{background:none;box-shadow:none;color:var(--dim);padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:inherit;color:var(--ink);padding:7px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;border:0;border-radius:2px;
 background:linear-gradient(#3e3b37,#2a2825);box-shadow:inset 0 1px 0 #ffffff18,0 0 0 1px #14120f,0 0 0 2px #4a4030}
.chip canvas{width:22px;height:22px;image-rendering:pixelated}
.chip.on{color:#2a1c08;background:linear-gradient(#f0d488,#b08a44);box-shadow:inset 0 1px 0 #fff4c8,0 0 0 1px #2a1c08,0 0 10px #d9b35e66}
.chip.b2{color:var(--teal);box-shadow:0 0 0 1px #14120f,0 0 0 2px #3f8a80}
#tabs{justify-content:center;gap:4px;padding-bottom:6px;border-bottom:1px solid #6e542688}
#tabs .chip{font-weight:800;letter-spacing:.1em;padding:6px 10px}
input{font-family:inherit}
input[type=range]{accent-color:var(--gold)}
@media (prefers-reduced-motion:reduce){.sheet,.pc{transition:none}.modal{animation:none}}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.sheet .hint{display:block;font-size:12px;color:#cbbf9f;margin:2px 4px 0;line-height:1.5}
.sheet .btns button{white-space:nowrap}

/* ===== v19 UI grammar: 石=補助 / 真鍮=実行 / ×=閉じる / 情報はボタンに見せない */
.hud{background:linear-gradient(90deg,#0009,#0000);box-shadow:none;padding:6px 14px 6px 10px}
.floorname{background:linear-gradient(270deg,#0009,#0000);box-shadow:none;padding:6px 10px 6px 18px}
#btns{flex-direction:column;align-items:flex-end;gap:10px;max-width:none;flex-wrap:nowrap}
.ctlrow{display:flex;gap:10px;align-items:flex-end}
.ctl{font-family:inherit;border:0;cursor:pointer;color:var(--ink);display:grid;place-items:center;border-radius:50%;width:48px;height:48px;padding:0;
 background:var(--stone),radial-gradient(circle at 40% 30%,#5e5a54,#2e2b28 75%);background-blend-mode:overlay,normal;box-shadow:inset 0 1px 0 #ffffff26,inset 0 -3px 0 #0007,0 0 0 1px #14120f,0 3px 8px #000b}
.ctl svg{width:22px;height:22px}
.ctl small{position:absolute;font-size:9px;margin-top:38px;color:var(--dim);text-shadow:0 1px 0 #000;letter-spacing:.05em}
.ctl{position:relative}
body.mapon .row{display:none!important}
.ctl.bag{width:62px;height:62px;box-shadow:inset 0 1px 0 #ffffff26,inset 0 -3px 0 #0007,0 0 0 1px #14120f,0 0 0 3px var(--brass2),0 3px 10px #000b}
.ctl.bag svg{width:28px;height:28px}
.ctl.bag b{position:absolute;bottom:-7px;right:-4px;font-size:10px;font-weight:800;background:#14120f;color:var(--gold);padding:1px 5px;border-radius:8px;box-shadow:0 0 0 1px var(--brass2)}
.ctl:active{filter:brightness(1.3)}
.ctl.on{box-shadow:inset 0 2px 6px #000a,0 0 0 2px var(--gold)}
.mainact{font-family:inherit;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:6px;min-width:150px;color:#2a1c08;text-align:left;
 background:linear-gradient(#f4dc98,#c09a4e 55%,#8a6a2c);box-shadow:inset 0 1px 0 #fff4c8,inset 0 -3px 0 #5a4418,0 0 0 1px #2a1c08,0 0 18px #d9b35e88,0 4px 10px #000c;animation:mainin .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes mainin{from{transform:scale(.7);opacity:0}}
.mainact svg{width:30px;height:30px;flex:none}
.mainact span{display:flex;flex-direction:column;line-height:1.15}
.mainact b{font-size:17px;font-weight:800;letter-spacing:.12em}
.mainact small{font-size:10px;opacity:.8;font-weight:600}
.mainact:active{transform:translateY(2px);filter:brightness(1.1)}
/* round d-pad */
.pad{width:150px;height:150px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:0;padding:0;border-radius:26px;
 background:var(--stone),radial-gradient(circle,#4a4642 0,#2c2a27 70%);background-blend-mode:overlay,normal;box-shadow:inset 0 2px 0 #ffffff1c,inset 0 -4px 8px #0008,0 0 0 1px #14120f,0 0 0 3px var(--brass2),0 0 0 4px #14120f,0 6px 16px #000c;opacity:.92}
.pad button{background:none;box-shadow:none;border-radius:14px;color:var(--gold);font-size:18px;opacity:1;text-shadow:0 1px 0 #000,0 0 6px #d9b35e66}
.pad button:active{background:radial-gradient(#d9b35e55,#0000 70%);box-shadow:none}
.pad button.dg{font-size:15px;opacity:.85;color:#d9b35e}
.pad button.dg:active{opacity:1}
.pad span:nth-child(5){display:block;width:18px;height:18px;margin:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4dca0,#8a6a2c 60%,#3a2a10);box-shadow:0 0 0 1px #14120f}
/* close × (top-right, everywhere) */
.xbtn{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--ink);z-index:3;
 background:radial-gradient(circle at 40% 30%,#5e5a54,#2a2825);box-shadow:inset 0 1px 0 #ffffff22,0 0 0 1px #14120f,0 0 0 2px var(--brass2)}
.xbtn svg{width:16px;height:16px}
.sheet .in{padding-top:16px}
.sh-head{padding-right:40px}
.fleelink{font-family:inherit;background:none;border:0;color:var(--dim);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
.distrow{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.distrow button{width:46px;height:46px;border-radius:50%;border:0;font-size:22px;color:var(--gold);cursor:pointer;background:radial-gradient(circle at 40% 30%,#5e5a54,#2a2825);box-shadow:inset 0 1px 0 #ffffff22,0 0 0 1px #14120f,0 0 0 2px var(--brass2)}
.distrow button:disabled{opacity:.25}
.distrow div{text-align:center;color:var(--gold);font-weight:800;letter-spacing:.1em;min-width:6em}
.distrow div small{display:block;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:0}
.drop{border:0;min-height:54px;color:#8a7a60;font-size:11px;background:var(--stone),linear-gradient(#26231f,#1a1815);background-blend-mode:overlay,normal;box-shadow:inset 0 2px 8px #000,0 0 0 1px #3a3228}
.drop.hot{color:var(--gold);box-shadow:inset 0 0 14px #d9b35e66,0 0 0 1px var(--gold)}
/* dialogs: one brass primary, small cancel under it */
.box .btns{flex-direction:column;align-items:stretch;gap:8px}
.box .btns .b:not(.sub){font-size:16px;padding:13px;color:#2a1c08;text-shadow:0 1px 0 #f4dca0;background:linear-gradient(#f4dc98,#c09a4e 55%,#8a6a2c);box-shadow:inset 0 1px 0 #fff4c8,inset 0 -3px 0 #5a4418,0 0 0 1px #2a1c08,0 3px 8px #000b}
.box .btns .b.sub{align-self:center;background:none;box-shadow:none;font-size:12px;padding:6px 10px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.box #tb>.b:not(.sub){color:#2a1c08;text-shadow:0 1px 0 #f4dca0;background:linear-gradient(#f4dc98,#c09a4e 55%,#8a6a2c);box-shadow:inset 0 1px 0 #fff4c8,inset 0 -3px 0 #5a4418,0 0 0 1px #2a1c08,0 3px 8px #000b;font-size:16px;padding:13px}
.pc.chg{box-shadow:inset 0 0 0 1px #8a7048,0 0 0 2px #ffd35a,0 0 16px #ffd35a;animation:pulse .5s infinite alternate}
#toast{font-size:15px!important;line-height:1.6!important}.pad button{font-size:24px}.fleebtn{display:block;margin:6px auto 0;padding:8px 16px;font-size:14px;width:auto}.pulse{animation:pls 1s infinite}@keyframes pls{50%{box-shadow:0 0 14px #f0c04e;filter:brightness(1.4)}}.rar{white-space:nowrap}#dodge{position:fixed;left:50%;bottom:28%;transform:translateX(-50%);z-index:60;display:none;padding:14px 26px;font-size:18px;border-radius:30px;background:#2a2016;color:#f4dca0;border:2px solid #d9b35e;box-shadow:0 0 14px #d9b35e88}body{font-size:15px}
.modal{align-items:center}.modal .box{max-height:100%;overflow-y:auto;overscroll-behavior:contain}

 align-items:center;justify-content:center;gap:8px;padding:0 8px 5px;pointer-events:auto}

 background:var(--stone),linear-gradient(#57534e,#34312d);background-blend-mode:overlay,normal;
 box-shadow:inset 0 1px 0 #ffffff26,0 0 0 1px #14120f,0 0 0 2px var(--brass2),0 3px 8px #000b;text-shadow:0 1px 0 #000}
.frow button.rnd{width:48px;min-width:48px;padding:0;font-size:22px;color:var(--gold);border-radius:50%}

.frow button.kill{background:linear-gradient(#f4dc98,#c09a4e 55%,#8a6a2c);color:#2a1c08;text-shadow:0 1px 0 #f4dca0;font-size:16px;font-weight:800;
 box-shadow:inset 0 1px 0 #fff4c8,0 0 0 1px #2a1c08,0 0 16px #ffd35a;animation:pulse .55s infinite alternate}

 background:var(--parch),linear-gradient(#e8d8b0,#cbb584);background-blend-mode:multiply,normal;
 box-shadow:inset 0 0 0 1px #8a7048,0 1px 3px #000a}

 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:2px}

.slot.off{opacity:.34;filter:grayscale(.7)}
.slot.rdy{box-shadow:inset 0 0 0 1px #8a7048,0 0 0 2px var(--gold),0 0 10px #d9b35e99}

/* 下の操作列を8枠のぶん持ち上げる */
.row{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.sheet{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
#dodge{bottom:34%}

/* ===== 帰還の見せ場 */
.ret{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 35%,#3a2e14,#0a090c 70%);animation:retin .5s ease-out;cursor:pointer}
.ret.out{animation:retout .26s ease-in forwards}
@keyframes retin{from{opacity:0}to{opacity:1}}@keyframes retout{to{opacity:0}}
.retin{position:relative;width:min(420px,100%);text-align:center}
.retlight{position:absolute;left:50%;top:-40px;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:radial-gradient(#ffe7a066,#0000 65%);animation:glow 2.4s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{transform:scale(.85);opacity:.6}to{transform:scale(1.1);opacity:1}}
.ret h2{position:relative;margin:0;font-size:42px;letter-spacing:.4em;padding-left:.4em;color:#f4e2b0;text-shadow:0 0 18px #d9b35e,0 3px 0 #000;animation:retword .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes retword{from{transform:translateY(12px) scale(.9);opacity:0;letter-spacing:.9em}to{transform:none;opacity:1}}
.rettier{margin:6px 0 16px;color:var(--gold);font-size:14px;font-weight:600;letter-spacing:.08em}
.retgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:4px}
.retit{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:4px;opacity:0;transform:translateY(10px) scale(.9);transition:all .28s cubic-bezier(.2,.9,.3,1.3);
 background:var(--parch),linear-gradient(#e6d6ae,#cdb886);background-blend-mode:multiply,normal;box-shadow:0 0 0 1px #6e5426,0 3px 8px #000a;color:var(--inkD)}
.retit.on{opacity:1;transform:none}
.retit.big{box-shadow:0 0 0 1px #6e5426,0 0 14px #ffd35a,0 3px 8px #000a}
.retit canvas{width:32px;height:32px;image-rendering:pixelated}
.retit span{font-size:12px;font-weight:600;line-height:1.2}
.retit em{font-style:normal;font-size:12px;font-weight:800;color:#8a5a12}

.rettotal small{color:var(--dim);font-size:12px;letter-spacing:.1em}

.ret.done .rettotal b{animation:pop .4s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{from{transform:scale(1.35)}to{transform:none}}

@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.ret,.ret h2,.retlight,.retit,.ret.done .rettotal b,.ret.done .retskip{animation:none!important;transition:none!important}}

.ret.fall{background:radial-gradient(ellipse at 50% 35%,#2a0e0c,#050405 70%);animation:fallin 1s ease-out}

/* 一言の重なり：前の一言は小さく下に */
#toastOld{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:4px}
#toastOld div{font-size:11px;line-height:1.4;color:var(--ink);opacity:.72;text-shadow:0 1px 2px #000,0 0 6px #000;max-width:30em;transition:opacity .4s}

/* 配合の書 */
.bbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:8px 0}

.bb.leg{box-shadow:inset 0 0 0 1px #8a7040,0 0 10px #d9b35e44}.bb.leg.got{box-shadow:0 0 0 1px #6e5426,0 0 14px #ffd35a}
/* 瀕死 */
body.lowhp .stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 90px 30px #b0201899;animation:lowhp 1.1s ease-in-out infinite}

/* 工房 */
.kobo{display:flex;gap:10px;align-items:center;margin:8px 0 4px;padding:8px 10px;border-radius:4px;background:#1a1620;box-shadow:inset 0 0 0 1px #3a3442}
.kobo.on{background:#221c14;box-shadow:inset 0 0 0 1px #6e5426}
.kobo .ic{width:36px;height:36px;flex:none;display:grid;place-items:center;background:#0e0c12;border-radius:3px}
.kobo .ic canvas{width:32px;height:32px;image-rendering:pixelated}
.kobo b{display:block;font-size:14px;color:var(--ink)}.kobo small{font-size:12px;color:var(--dim);line-height:1.4}

/* 装備の出来 */
.slot.q2{box-shadow:inset 0 0 0 2px #6ab8ff88}.slot.q3{box-shadow:inset 0 0 0 2px #c07cffaa,0 0 8px #c07cff66}.slot.q4{box-shadow:inset 0 0 0 2px #ffd35acc,0 0 10px #ffd35a88}
/* ===================================================================
   見た目 E1：ゲームボーイカラー風
   クリーム色の窓・紺の縁・紫の内線・ドット文字。世界の絵はフルカラーのまま。
   =================================================================== */
:root{--bg:#e8e0f8;--ink:#282850;--dim:#6a6a90;--gold:#e84858;--brass:#7868c8;--brass2:#7868c8;--teal:#2a9a8a;--red:#e84858;--curse:#8a4ad0;--parchC:#fffdf4;--inkD:#282850;
 --e-win:#fffdf4;--e-ink:#282850;--e-line:#7868c8;--e-red:#e84858;--e-lav:#f1ecfc;--e-dim:#6a6a90;
 --e-frame:0 0 0 3px #282850,inset 0 0 0 2px #fffdf4,inset 0 0 0 4px #7868c8}
body{background:#e8e0f8;color:#282850;font-family:"DotGothic16","Hiragino Maru Gothic ProN",sans-serif;letter-spacing:.02em}
canvas#scr{background:#14122a}
.stage::after{box-shadow:inset 0 0 40px 8px #14122a99}
/* 窓の共通形 */
.hud,.floorname,.toast.on,.sheet .in,.box,.frow button,.place,.retit,.kobo,.bb{background:#fffdf4!important;color:#282850;border-radius:10px;box-shadow:var(--e-frame)!important;text-shadow:none!important}
/* 上の窓：体力・持ち帰り・階 */
.hud{left:calc(8px + env(safe-area-inset-left,0px));right:calc(54px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));padding:7px 12px 6px;color:#6a6a90;font-size:12px;grid-template-columns:auto auto 1fr}
.hud .bar{width:118px;height:10px;background:#f1ecfc;box-shadow:0 0 0 2px #282850;border-radius:2px}
.hud .bar i{background:#e84858;box-shadow:inset 0 2px 0 #ff8a96}
.hud #hpt{color:#282850;text-shadow:none;font-size:14px}
.hud b{color:#282850}.hud .gold{color:#e84858}
.floorname{right:calc(62px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));background:none!important;box-shadow:none!important;color:#282850;font-size:14px;letter-spacing:.08em;padding:4px 6px}
/* 一言の窓：消えずに残る。押すと記録 */
.toast{top:calc(80px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));padding:0;text-align:left;pointer-events:auto;display:none;transition:none}
.toast.on{display:block;padding:9px 30px 9px 14px}
.toast span,.toast span.hot{display:block;max-width:none;padding:0;background:none!important;box-shadow:none!important;color:#282850;font-size:15px;line-height:1.55;border-radius:0}
.toast span.hot{color:#d02840}
.toast::after{content:"▼";position:absolute;right:12px;bottom:6px;color:#e84858;font-size:12px;animation:blink 1.2s infinite}
#toastOld{display:block;margin:2px 0 0;gap:0}
#toastOld div{font-size:12px;line-height:1.5;color:#6a6a90;opacity:1;text-shadow:none;max-width:none}
#toastOld div.gone{opacity:1}
body.titling .toast{top:calc(80px + env(safe-area-inset-top,0px))}
.ctl.bag b{top:-6px;bottom:auto;right:-6px}
/* 丸いボタン：待つ・地図・カバン・メニュー */
.ctl{background:#7868c8!important;color:#fff;box-shadow:0 0 0 3px #282850,0 4px 0 #282850!important}
.ctl.bag{background:#e84858!important;box-shadow:0 0 0 3px #282850,0 5px 0 #282850!important}
.ctl.bag b,.ctl b{background:#fffdf4;color:#282850;box-shadow:0 0 0 2px #282850}
.ctl small{color:#282850;background:#fffdf4;padding:0 4px;border-radius:4px;box-shadow:0 0 0 2px #282850;text-shadow:none;margin-top:44px;font-size:9px}
.ctl.on{box-shadow:0 0 0 3px #282850,0 0 0 6px #e84858!important}
.ctl:active{transform:translateY(3px);box-shadow:0 0 0 3px #282850,0 1px 0 #282850!important}
.ctl.menu{background:#fffdf4!important;color:#282850;box-shadow:0 0 0 3px #282850,inset 0 0 0 2px #fffdf4,inset 0 0 0 4px #7868c8!important;border-radius:10px;top:calc(8px + env(safe-area-inset-top,0px))}
/* いちばん大きな「いまできること」＝Aボタンの赤 */
.mainact{background:#e84858!important;color:#fff;box-shadow:0 0 0 3px #282850,0 6px 0 #282850!important;border-radius:14px}
.mainact small{opacity:.9}
.mainact:active{transform:translateY(4px);box-shadow:0 0 0 3px #282850,0 2px 0 #282850!important}
/* 十字キー */
.pad{background:#5a5a78!important;box-shadow:0 0 0 3px #282850,0 5px 0 #282850!important;opacity:.95}
.pad button,.pad button.dg{color:#fffdf4;text-shadow:none}
.pad button:active{background:#7868c8}
.pad span:nth-child(5){background:#282850;box-shadow:none}
.pad.gh{background:#5a5a7844!important;box-shadow:none!important}
#stick{background:#7868c822;box-shadow:0 0 0 3px #7868c8aa}
#stick i{background:#e84858;box-shadow:0 0 0 3px #282850}
/* 下の8枠 */
.abar{background:#e8e0f8;box-shadow:0 -3px 0 #282850;padding-top:7px;gap:5px}
.slot{background:#fffdf4;color:#282850;border-radius:8px;box-shadow:0 0 0 2px #282850,inset 0 0 0 2px #fffdf4,inset 0 0 0 3px #7868c855}

function showRecipes(){
 let can=[];try{can=craftable()}catch(e){}
 const canSet=new Set(can.map(c=>c.r.out));
 const nm=id=>(ITEM[id]&&ITEM[id].n)||id;
 const have=id=>G.bag&&G.bag.items&&G.bag.items.some(q=>q.id==id);
 const open=CRAFT.filter(r=>!r.sec||RECIPE[r.out]);
 const hidden=CRAFT.filter(r=>r.sec&&!RECIPE[r.out]);
 const made=CRAFT.filter(r=>RECIPE[r.out]).length;
 const row=r=>{const ok=canSet.has(r.out),mk=!!RECIPE[r.out];
  const mat=r.need.map(alts=>alts.map(id=>(have(id)?'<b style="color:#8cf0a0">':'<span style="opacity:.65">')+nm(id)+(have(id)?'</b>':'</span>')).join('／')).join(' ＋ ');
  return '<p style="font-size:13px;line-height:1.6;margin:7px 0;'+(ok?'color:#f0c04e':'')+'">'
   +(ok?'▶ ':mk?'✓ ':'・')+'<b>'+r.n+'</b>　'+mat
   +'<br><span style="opacity:.65;font-size:12px">'+r.t+'</span></p>'};
 $('modal').innerHTML='<div class="modal"><div class="box"><h2>レシピ本（作った '+made+'/'+CRAFT.length+'）</h2>'

function placeHazards(F,fi){if(fi<3||BOSSF[fi]||F.ship)return;const wat=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(F.water[y]&&F.water[y][x])wat.push([x,y]);
 F.foes.forEach(f=>{if(f.k=='raiju'){if(!wat.length){f.k='frog';Object.assign(f,{n:FOE.frog.n});return}const q=wat[Math.floor(Math.random()*wat.length)];f.x=f.hx=q[0];f.y=f.hy=q[1];f.rx=f.x*T;f.ry=f.y*T}});
 if(wat.length>=8&&Math.random()<(layerOf(fi)==1||layerOf(fi)==5?.55:.3)){const shoreW=wat.filter(([x,y])=>DIRS8.some(([a,b])=>!F.m[y+b][x+a]&&!(F.water[y+b]&&F.water[y+b][x+a])));const pool=shoreW.length&&Math.random()<.75?shoreW:wat;const c=pool[Math.floor(Math.random()*pool.length)];if(F.dist[c[1]][c[0]]>=5){F.volts=[{x:c[0],y:c[1],hp:3}];
   const near=wat.filter(([x,y])=>cd(x,y,c[0],c[1])<=3&&cd(x,y,c[0],c[1])>=1&&!F.items.some(i=>i.x==x&&i.y==y));if(near.length){const q=near[Math.floor(Math.random()*near.length)];F.items.push({x:q[0],y:q[1],id:pick(['gem','idol','crown','raiseki','hyoushou'])})}
   const dry=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(!F.m[y][x]&&!(F.water[y]&&F.water[y][x])&&!(F.holes&&F.holes.has(x+','+y))&&F.dist[y][x]>=3&&cd(x,y,c[0],c[1])>=4&&!F.items.some(i=>i.x==x&&i.y==y))dry.push([x,y]);
   if(dry.length&&Math.random()<.8){const q=dry[Math.floor(Math.random()*dry.length)];F.items.push({x:q[0],y:q[1],id:pick(['hyouka','hyouka','boots','raika'])})}}}}
function floorTwist0(F,fi,r){const cells=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(!F.m[y][x]&&!(F.water[y]&&F.water[y][x]))cells.push([x,y]);
 if(r<.09){F.twist='dry';cells.forEach(([x,y])=>{if(Math.random()<.82)F.garden[y][x]=true});
  const far=cells.filter(([x,y])=>F.dist[y][x]>=10);for(let k=0;k<1+(fi>=10?1:0)&&far.length;k++){const q=far.splice(Math.floor(Math.random()*far.length),1)[0];if(F.foes.some(f=>f.x==q[0]&&f.y==q[1]))continue;F.foes.push(mkFoe('salam',q[0],q[1],Math.min(1,fi*.33)))}}
 else if(r<.17&&fi>=4){F.twist='oil';F.oil=F.oil||new Set();const n=5+Math.floor(Math.random()*3);for(let k=0;k<n;k++){const c=cells[Math.floor(Math.random()*cells.length)];if(!c||F.dist[c[1]][c[0]]<4)continue;
   for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const x=c[0]+i,y=c[1]+j;if(!F.m[y][x]&&!(F.water[y]&&F.water[y][x])&&Math.random()<.8)F.oil.add(x+','+y)}}}}

function bioProt(F){const P=new Set();const add=q=>{if(q)P.add((q.x!=null?q.x:q[0])+','+(q.y!=null?q.y:q[1]))};
 [F.start,F.exit,F.up,F.down,F.chest,F.sdoor,F.relic].forEach(add);(F.items||[]).forEach(add);(F.srcs||[]).forEach(add);(F.foes||[]).forEach(add);(F.graves||[]).forEach(add);(F.cocoons||[]).forEach(add);(F.evs||[]).forEach(add);(F.barrels||[]).forEach(add);(F.torches||[]).forEach(add);(F.volts||[]).forEach(add);(F.thin||[]).forEach(add);(F.loose||[]).forEach(add);
 (F.gim||[]).forEach(g=>{add(g);if(g.pocket)g.pocket.forEach(add);if(g.brz)g.brz.forEach(add);if(g.bx!=null)add([g.bx,g.by]);if(g.px!=null)add([g.px,g.py]);if(g.levers)g.levers.forEach(add)});
 const st=F.start;if(st)for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)P.add((st[0]+i)+','+(st[1]+j));return P}
const bioFloor=(F,x,y)=>F.m[y]&&F.m[y][x]===0&&!(F.water[y]&&F.water[y][x]);
function bioPatch(F,P,th,sc,fn){const sd=Math.random()*50;let n=0;for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){if(!bioFloor(F,x,y)||P.has(x+','+y)||(F.holes&&F.holes.has(x+','+y)))continue;if(vnoise(x/sc+sd,y/sc+sd*.7)>th){fn(x,y);n++}}return n}
const BIOME={
 // 裂け谷：床を横切る深い裂け目。橋は燃える。飛び込めば一階下へ
 chasm(F){F.holes=F.holes||new Set();F.bridges=F.bridges||new Set();const P=bioProt(F);const w=Math.random()<.4?2:1;let x=(MW>>1)-3+Math.floor(Math.random()*6);
  for(let y=1;y<MH-1;y++){x+=Math.floor(Math.random()*3)-1;x=Math.max(8,Math.min(MW-10,x));for(let k=0;k<w;k++){const X=x+k;if(bioFloor(F,X,y)&&!P.has(X+','+y))F.holes.add(X+','+y)}}
  if(F.holes.size<4)return false;
  // どの床からも、橋を渡れば行き来できるように架ける
  const key=(x,y)=>x+','+y;for(let it=0;it<14;it++){const D=Array.from({length:MH},()=>Array(MW).fill(1e9)),par={};const dq=[[F.start[0],F.start[1]]];D[F.start[1]][F.start[0]]=0;
   while(dq.length){const[cx,cy]=dq.shift();for(const[a,b]of DIRS){const nx=cx+a,ny=cy+b;if(!(F.m[ny]&&F.m[ny][nx]===0))continue;const c=F.holes.has(key(nx,ny))?1:0;if(D[cy][cx]+c<D[ny][nx]){D[ny][nx]=D[cy][cx]+c;par[key(nx,ny)]=[cx,cy];if(c)dq.push([nx,ny]);else dq.unshift([nx,ny])}}}
   let tgt=null;for(let y=1;y<MH-1&&!tgt;y++)for(let x2=1;x2<MW-1;x2++){if(F.m[y][x2]===0&&!F.holes.has(key(x2,y))&&D[y][x2]>0&&D[y][x2]<1e9){tgt=[x2,y];break}}
   if(!tgt)break;let c=tgt;while(c&&!(c[0]==F.start[0]&&c[1]==F.start[1])){const k=key(c[0],c[1]);if(F.holes.has(k)){F.holes.delete(k);F.bridges.add(k)}c=par[k]}}
  return true},
 // 茂み：背の高い草。中にいると遠くから見えない（敵も同じ）。よく燃える
 bush(F){F.bush=new Set();const P=bioProt(F);bioPatch(F,P,.52,3.2,(x,y)=>{F.bush.add(x+','+y);F.garden[y][x]=true});return F.bush.size>=12},
 // 氷原：床が凍っている。踏むと止まるまで滑る。火で溶ける
 ice(F){F.ice=F.ice||new Set();const P=bioProt(F);bioPatch(F,P,.5,3.6,(x,y)=>{F.ice.add(x+','+y);F.garden[y][x]=false});
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(F.water[y]&&F.water[y][x]&&Math.random()<.6){F.water[y][x]=false;F.ice.add(x+','+y)}return F.ice.size>=12},
 // 泥沼：足を取られて一手遅れる。重い敵は動きが鈍る。火は燃え移らない
 mud(F){F.mud=new Set();const P=bioProt(F);bioPatch(F,P,.5,3.4,(x,y)=>{F.mud.add(x+','+y);F.garden[y][x]=false});return F.mud.size>=12},
 // 光苔の洞：灯りのない階。光る苔の上は明るく、そのぶん見つかりやすい
 glow(F){F.glowm=new Set();const P=bioProt(F);bioPatch(F,P,.56,2.6,(x,y)=>F.glowm.add(x+','+y));(F.rooms||[]).forEach(r=>{if(!r.start)r.lit=false});return F.glowm.size>=8},
 // 柱の間：開けた場所に柱が立つ。視線を切る物陰になる
 pillar(F){const P=bioProt(F);let n=0;const pl=[];for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++){if(!bioFloor(F,x,y)||P.has(x+','+y))continue;let open=true;for(let j=-1;j<=1&&open;j++)for(let i=-1;i<=1;i++)if(!bioFloor(F,x+i,y+j)){open=false;break}
   if(!open||pl.some(q=>cd(q[0],q[1],x,y)<3)||Math.random()>.75)continue;pl.push([x,y])}
  if(pl.length<3)return false;pl.forEach(([x,y])=>{F.m[y][x]=1;n++});return true}};
// 通れなくなる地形の上に、必ず一本は道を通す（溶岩は冷えて固まる）
function bioOpen(F,blk,fix){const key=(x,y)=>x+','+y;for(let it=0;it<16;it++){const D=Array.from({length:MH},()=>Array(MW).fill(1e9)),par={};const dq=[[F.start[0],F.start[1]]];D[F.start[1]][F.start[0]]=0;
  while(dq.length){const[cx,cy]=dq.shift();for(const[a,b]of DIRS){const nx=cx+a,ny=cy+b;if(!(F.m[ny]&&F.m[ny][nx]===0))continue;if(F.holes&&F.holes.has(key(nx,ny)))continue;const c=blk.has(key(nx,ny))?1:0;if(D[cy][cx]+c<D[ny][nx]){D[ny][nx]=D[cy][cx]+c;par[key(nx,ny)]=[cx,cy];if(c)dq.push([nx,ny]);else dq.unshift([nx,ny])}}}
  let tgt=null;for(let y=1;y<MH-1&&!tgt;y++)for(let x=1;x<MW-1;x++){if(F.m[y][x]===0&&!blk.has(key(x,y))&&!(F.holes&&F.holes.has(key(x,y)))&&D[y][x]>0&&D[y][x]<1e9){tgt=[x,y];break}}
  if(!tgt)break;let c=tgt;while(c&&!(c[0]==F.start[0]&&c[1]==F.start[1])){const k=key(c[0],c[1]);if(blk.has(k)){blk.delete(k);if(fix)fix(k)}c=par[k]}}}

 // 溶岩原：あちこちに溶岩だまり。少しずつ広がる。水をかければ蒸気、氷の瓶で固まる
 lava(F){F.lava=F.lava||new Set();const P=bioProt(F);bioPatch(F,P,.6,3.3,(x,y)=>{F.lava.add(x+','+y);F.garden[y][x]=false});if(F.lava.size<6)return false;bioOpen(F,F.lava,null);return F.lava.size>=6},

function spCore(F){const P=new Set();const add=q=>{if(q)P.add((q.x!=null?q.x:q[0])+','+(q.y!=null?q.y:q[1]))};[F.start,F.exit,F.up,F.down,F.chest,F.sdoor,F.relic].forEach(add);
 (F.gim||[]).forEach(g=>{add(g);if(g.pocket)g.pocket.forEach(add);if(g.brz)g.brz.forEach(add);if(g.bx!=null)add([g.bx,g.by]);if(g.px!=null)add([g.px,g.py]);if(g.levers)g.levers.forEach(add)});
 (F.graves||[]).forEach(add);(F.thin||[]).forEach(add);(F.torches||[]).forEach(add);(F.volts||[]).forEach(add);(F.cocoons||[]).forEach(add);
 const st=F.start;if(st)for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++)P.add((st[0]+i)+','+(st[1]+j));return P}
function spArea(F,w,h,P,far,mw,mh){P=spCore(F);mw=mw||3;mh=mh||3;
 for(let W=w,H=h;W>=mw&&H>=mh;W>H?W--:H--){for(const fr of [far||8,5,3]){const c=[];for(let y=1;y<MH-H;y++)for(let x=1;x<MW-W;x++){let ok=true;for(let j=0;j<H&&ok;j++)for(let i=0;i<W;i++){const X=x+i,Y=y+j;if(F.m[Y][X]!==0||P.has(X+','+Y)||(F.holes&&F.holes.has(X+','+Y))){ok=false;break}}
   if(ok&&(F.dist[y+(H>>1)]&&F.dist[y+(H>>1)][x+(W>>1)]||0)>=fr)c.push([x,y])}
  if(c.length){const a=c[Math.floor(Math.random()*c.length)];const inA=q=>q.x>=a[0]&&q.x<a[0]+W&&q.y>=a[1]&&q.y<a[1]+H;F.foes=F.foes.filter(f=>!inA(f));F.srcs=(F.srcs||[]).filter(q=>!inA(q));F.evs=(F.evs||[]).filter(q=>!inA(q));F.items=F.items.filter(q=>!(q.hid&&inA(q)));return [a[0],a[1],W,H]}}}return null}
const spLoot=(F,x,y,how)=>{if(!F.items.some(q=>q.x==x&&q.y==y))F.items.push({x,y,id:pick(['gem','idol','crown','locket','gem']),how})};
const spFoe=(F,x,y,k,o)=>{if(F.foes.some(f=>f.x==x&&f.y==y))return null;const f=mkFoe(k||pick((GEN_BY_L[layerOf(GENFI)]||['skel']).concat(['skel'])),x,y,Math.min(1,GENFI*.33+.2));Object.assign(f,o||{});F.foes.push(f);return f};

const WKEY=(x,y)=>x+','+y;
// ---- 流れ（水流）。流入口から入り、毎ターン動き、物を押し、抜けていく ----
function curAt(x,y){if(isIce(x,y)||!(G.water[y]&&G.water[y][x]))return null;const C=G.cur;if(!C||!C.cells)return null;return C.cells.has(x+','+y)?C:null}
function curBlocked(x,y){ // 岩・板でせき止められているか
 try{if((G.gim||[]).some(g=>g.type=='boulder'&&g.px==x&&g.py==y))return true;
  if((G.dams||[]).some(d=>d.x==x&&d.y==y))return true}catch(e){}return false}
// 階段・出口のマス。流れはここを通さず、立っている者も流されない（降りられなくなるのを防ぐ）
function onStair(x,y){return [G.down,G.exit,G.up].some(q=>q&&q[0]==x&&q[1]==y)}
function makeCurrent(){ // 階の水に流れを一本通す
 try{G.cur=null;const cells=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(G.water[y][x])cells.push([x,y]);
  if(cells.length<6)return;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];const dir=dirs[Math.floor(Math.random()*4)];
  // 流れは「一本の筋」。水全部ではなく、進行方向につながった帯だけが流れる
  const start=cells[Math.floor(Math.random()*cells.length)];
  const set=new Set();const q=[start];const MAXC=8+Math.floor(Math.random()*9);
  while(q.length&&set.size<MAXC){const[x,y]=q.shift();const k=x+','+y;if(set.has(k))continue;
   if(!(G.water[y]&&G.water[y][x]))continue;if(onStair(x,y))continue;set.add(k);
   const a2=x+dir[0],b2=y+dir[1];if(a2>0&&b2>0&&a2<MW-1&&b2<MH-1&&G.water[b2]&&G.water[b2][a2])q.push([a2,b2]);
   const px=x-dir[0],py=y-dir[1];if(px>0&&py>0&&px<MW-1&&py<MH-1&&G.water[py]&&G.water[py][px])q.push([px,py]);
   // 横に一マスだけ広げる（幅のある流れ）
   const s1=[dir[1],dir[0]];[[x+s1[0],y+s1[1]],[x-s1[0],y-s1[1]]].forEach(([a3,b3])=>{
    if(a3>0&&b3>0&&a3<MW-1&&b3<MH-1&&G.water[b3]&&G.water[b3][a3]&&Math.random()<.5)q.push([a3,b3])})}
  if(set.size<4)return;
  const spd=Math.random()<.5?1:(Math.random()<.75?2:3);
  G.cur={dir,cells:set,spd,t:0,src:start};
 }catch(e){G.cur=null}}
function curPush(o,isP){ // 流れに乗っているものを一マス送る
 const C=curAt(o.x,o.y);if(!C)return false;
 if(isP&&onStair(o.x,o.y))return false;
 if(isP&&bagUsed()>=Math.ceil(bagCap()*.75)){if(!G.heavyHint){G.heavyHint=1;toast('荷物の重みで、流れに踏みとどまった');learn('heavycur','重い荷物：カバンが4分の3以上埋まっていると、流れに押されない。宝を抱えた帰り道ほど、流れに強い')}return false}
 if(isP){const sm=swimMate();if(sm){if(!G.swimHint){G.swimHint=1;toast((sm.name||ITEM[sm.id].n)+'が流れに逆らって、引っぱってくれる');learn('field_swim',ITEM[sm.id].n+'：'+FIELD.swim.d)}return false}}
 const nx=o.x+C.dir[0],ny=o.y+C.dir[1];
 if(curBlocked(nx,ny))return false;
 if(!isP&&(FOE[o.k]||{}).aqua)return false;            // 水棲は流れを味方にする
 if(!isP&&(FOE[o.k]||{}).heavy&&Math.random()<.6)return false; // 重いものは踏みとどまる
 if(isPit(nx,ny)){ // 流れの先が穴なら、そのまま落ちる
  if(isP){fallDown('流れに押されて、穴へ落ちた');return true}
  o.hp=0;try{toast(o.n+'が流されて、穴に消えた')}catch(e){}return true}
 if(!walk(nx,ny))return false;
 if(foeAt(nx,ny)||(!isP&&G.p.x==nx&&G.p.y==ny))return false;
 if(isP){G.prev=[o.x,o.y]}
 o.x=nx;o.y=ny;
 return true}
function curStep(){
 const C=G.cur;if(!C)return;C.t=(C.t||0)+1;
 const every=C.spd>=2?1:2;if(C.t%every)return;
 const n=C.spd>=3?2:1;
 for(let i=0;i<n;i++){
  // 1. 流れの上の火は消える
  try{(G.fires||[]).forEach(f=>{if(curAt(f.x,f.y))f.life=0})}catch(e){}
  // 2. 油は水面を流れていく
  try{if(G.oil&&G.oil.size){[...G.oil].forEach(k=>{const[x,y]=k.split(',').map(Number);
   if(!curAt(x,y))return;const a=x+C.dir[0],b=y+C.dir[1];
   if(curBlocked(a,b)||!walk(a,b))return;G.oil.delete(k);G.oil.add(a+','+b)})}}catch(e){}
  // 3. 落ちている物も流される（＝取り逃す）
  try{(G.items||[]).forEach(it=>{if(it.hid||!curAt(it.x,it.y))return;
   const a=it.x+C.dir[0],b=it.y+C.dir[1];if(curBlocked(a,b))return;
   if(isPit(a,b)){it.gone=1;return}
   if(walk(a,b)){it.x=a;it.y=b}});
   for(let i2=(G.items||[]).length-1;i2>=0;i2--)if(G.items[i2].gone)G.items.splice(i2,1)}catch(e){}
  // 4. 敵が押される
  try{(G.foes||[]).forEach(f=>{if(f.hp<=0)return;if(curPush(f,false)&&G.seen.has(f.x+','+f.y)&&Math.random()<.3)toast(f.n+'が流れに押されていく')})}catch(e){}
  // 5. こちらも押される
  try{if(!G.fight&&curPush(G.p,true)){sfx('splash');if(i==0){toast('流れに押される');if(!KNOW.curhint)learn('curhint','強い流れ：凍らせれば氷の橋になる。岩や板でせき止めてもいい。カバンが重ければ（4分の3以上）押されない。鉤縄で向こう岸の杭へ跳ぶ手もある')}reveal();syncDist&&0}}catch(e){}
 }}
function floodStep(){ // 水は1ターンに数マスずつ、低い所（通路）へ広がる
 const F=G.flood;if(!F||F.done)return;F.t++;
 if(F.st==0){if(F.t>=F.at){F.st=1;F.t=0;sfxAt('rise',(F.x-G.p.x)/9,.7,'amb');toast('遠くで、ゴゴゴ……と重い音がした');learn('flood','放流：遠くで重い音がしたら、水が来る。低い所から順に沈む。松明は濡れると消える')}return}

  if(F.t==1){F.front=[[F.x,F.y]];F.seen=new Set([WKEY(F.x,F.y)])}
  if(F.t>=6){F.st=2;F.t=0;sfx('splash');G.shake=8;toast('水が流れ込んでくる！')}

  return}

  if(!F.front||!F.front.length||F.cells.length>=F.n){F.done=1;toast('水が落ち着いた。足元まで来ている');return}
  const nx=[];let added=0;
  for(const[x,y]of F.front){for(const[dx,dy]of DIRS){const a=x+dx,b=y+dy;if(a<1||b<1||a>=MW-1||b>=MH-1)continue;const k=WKEY(a,b);

    if(++added>=4)break}

  F.front=nx.length?nx:F.front.filter(()=>false);

 // 水場が増えるとスライムが寄ってくる

  if(cs.length&&G.foes.filter(f=>f.hp>0&&(f.k=='slime'||f.k=='slimeB')).length<(G.fi<3?2:4)){const c=pick(cs);const f=mkFoe(G.fi>=5&&Math.random()<.4?'slimeB':'slime',c[0],c[1],Math.min(1,G.fi*.03+.2));f.rx=c[0]*T;f.ry=c[1]*T;G.foes.push(f);if(G.seen.has(WKEY(c[0],c[1])))toast('水のにおいに、何かが寄ってきた')}}

function freezeAt(cx,cy,rad){G.ice=G.ice||new Set();let nw=0,nl=0,nf=0,nfoe=0;setTimeout(()=>{if(nw)react('freeze',cx,cy)},0);

const AIMR=6;
// 狙った先へ一直線。壁と、斜めにすり抜けられない角で止まる。狙いがなければ向いている方へ
function aimPath(n){const p=G.p;const c=[];if(G.aimAt){let x=p.x,y=p.y;const x1=G.aimAt.x,y1=G.aimAt.y;const ax=Math.abs(x1-x),ay=Math.abs(y1-y),sx=x<x1?1:-1,sy=y<y1?1:-1;let e=ax-ay;
  for(let i=0;i<n;i++){if(x==x1&&y==y1)break;const e2=2*e;let nx=x,ny=y;if(e2>-ay){e-=ay;nx+=sx}if(e2<ax){e+=ax;ny+=sy}if(!walk(nx,ny)||!diagOK(x,y,nx-x,ny-y))break;x=nx;y=ny;c.push([x,y])}return c}
 let dx=G.faceX||0,dy=G.faceY||0;if(!dx&&!dy)dx=p.flip?-1:1;let x=p.x,y=p.y;for(let k=0;k<n;k++){if(!walk(x+dx,y+dy))break;x+=dx;y+=dy;c.push([x,y])}return c}
function aimOK(x,y){const p=G.p;if(!(walk(x,y)&&G.seen.has(x+','+y)&&cd(x,y,p.x,p.y)<=AIMR&&!(x==p.x&&y==p.y)&&losClear(p.x,p.y,x,y)))return false;const sv=G.aimAt;G.aimAt={x,y};const c=aimPath(AIMR);G.aimAt=sv;const l=c[c.length-1];return !!l&&l[0]==x&&l[1]==y}
function canThrow(pc){const d=ITEM[pc.id];return !!d&&!d.mon&&!d.curse&&pc.id!='balloon'}
function aimStart(pc){if(!pc||G.fight||G.over)return;if(!canThrow(pc)){sfx('no');toast(ITEM[pc.id].mon?'仲間は投げられない':'呪われていて手放せない');return}
 G.aim={pc};G.travel=null;sfx('tick');{const P=propsOf(pc.id);toast((P.length?P.map(k=>PROPI[k]).join('')+' ':'')+ITEM[pc.id].n+(P.length?'（'+P.join('・')+'）':'')+'：投げる先をタップ。自分をタップで前に置く')}learn('aim','狙って投げる：下の枠を長押しするか、カバンで「狙って投げる」を選ぶと、投げる先をタップで選べる。何でも投げられる。落ちた先で割れ、燃え、凍り、転がる');ui()}
function aimTap(tx,ty){const pc=G.aim.pc,p=G.p;const i=G.bag.items.indexOf(pc);if(i<0){G.aim=null;ui();return}

 G.faceX=Math.sign(tx-p.x);G.faceY=Math.sign(ty-p.y);if(tx!=p.x)p.flip=tx<p.x;G.aimAt={x:tx,y:ty};

// ===== 相性：種族と性質で、効くもの・効かないものが違う =====
// 刃が通らない硬い敵は槌・槍・溜めで、火に強い敵は水や氷で、濡れた敵や鉄の体は雷で。斬って弾くだけでは済まない
const ELNM={fire:'火',water:'水',volt:'雷',ice:'氷',poison:'毒',blade:'刃'};
function weakOf(f){const D=FOE[f.k]||{},fam=FAM[f.k],el=(()=>{try{return elOfFoe(f)}catch(e){return null}})();const w={fire:1,water:1,volt:1,ice:1,poison:1,blade:1};
 if(D.flam||fam=='plant'||fam=='bug')w.fire=2;if(D.fireOK||fam=='fire'||el=='fire'){w.fire=0;w.water=2;w.ice=2}
 if(D.wet||D.aqua||fam=='water'||el=='water')w.volt=2;if(D.volt||el=='volt'){w.volt=0;w.water=.5}
 if(D.armor||f.armor){w.blade=.25;w.volt=Math.max(w.volt,2)}if(fam=='dead'){w.poison=0;w.fire=Math.max(w.fire,1.5)}
 if(fam=='ooze'){w.ice=2;w.poison=.5}if(fam=='bug')w.poison=2;if(D.fly)w.poison=Math.min(w.poison,.5);return w}
const emul=(f,el,n)=>{const m=weakOf(f)[el];if(m!=null&&m!=1&&G.seen&&G.seen.has(f.x+','+f.y)){const key='weak_'+(FAM[f.k]||f.k)+'_'+el;if(!G.weakSeen)G.weakSeen={};if(!G.weakSeen[key]){G.weakSeen[key]=1;setTimeout(()=>toast(m>1?f.n+'には'+ELNM[el]+'がよく効く！':m==0?f.n+'に'+ELNM[el]+'は効かない':f.n+'に'+ELNM[el]+'は効きにくい'),200);learn('weak','相性：種族と性質で、効くものが違う。草木・虫は火、濡れた者と鉄の体は雷、火の者は水と氷、ぷるは氷、虫は毒。死者に毒は効かない。魔物をタップすれば分かる')}}return Math.round(n*(m==null?1:m))};
const perilOf=f=>{if(f.elite)return .5;if(PERIL[f.k]!=null)return PERIL[f.k];const D=FOE[f.k]||{};return D.boss?.4:(D.heavy||f.big)?.35:(D.armor||f.armor)?.3:D.fast?.2:.12};

 if(fireAt(x,y)){G.fires=G.fires.filter(q=>!(q.x==x&&q.y==y));(G.steam=G.steam||[]).push({x,y,t:0,life:6});try{react('fire+water',x,y)}catch(e){}}if(typeof hasOil=='function'&&hasOil(x,y))try{react('water+oil',x,y)}catch(e){}
 const f=foeAt(x,y);if(f){f.wetC=Math.max(f.wetC||0,4);f.burn=0}try{onWaterChanged()}catch(e){}try{drawBase()}catch(e){}

function roomsOf(m,water,start){const rid=Array.from({length:MH},()=>Array(MW).fill(-1));

 const rooms=[];const lab=Array.from({length:MH},()=>Array(MW).fill(-1));
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){if(!open(x,y)||lab[y][x]>=0)continue;const q=[[x,y]],cells=[];lab[y][x]=rooms.length;while(q.length){const[a,b]=q.pop();cells.push([a,b]);for(const[dx,dy]of DIRS){const nx=a+dx,ny=b+dy;if(nx>0&&ny>0&&nx<MW-1&&ny<MH-1&&lab[ny][nx]<0&&open(nx,ny)){lab[ny][nx]=rooms.length;q.push([nx,ny])}}}
  if(cells.length<5){cells.forEach(([a,b])=>lab[b][a]=-2);continue}
  if(cells.length<=60){rooms.push({cells});continue}
  const k=Math.ceil(cells.length/45);const key=c=>c[0]+','+c[1];const inC=new Set(cells.map(key));const seeds=[cells[Math.floor(Math.random()*cells.length)]];
  while(seeds.length<k){let best=null,bd=-1;for(const c of cells){const d=Math.min(...seeds.map(q=>Math.abs(q[0]-c[0])+Math.abs(q[1]-c[1])));if(d>bd){bd=d;best=c}}seeds.push(best)}
  const own=new Map();const qq=seeds.map((c,i)=>{own.set(key(c),i);return[c[0],c[1],i]});let h=0;while(h<qq.length){const[a,b,i]=qq[h++];for(const[dx,dy]of DIRS){const K=(a+dx)+','+(b+dy);if(inC.has(K)&&!own.has(K)){own.set(K,i);qq.push([a+dx,b+dy,i])}}}
  const parts=seeds.map(()=>[]);cells.forEach(c=>parts[own.get(key(c))].push(c));parts.forEach(pc=>{if(pc.length>=5)rooms.push({cells:pc})})}

function bodyFinish(g,pal){const H=g.length,W=g[0].length;const out=g.map(r=>r.slice());
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(g[y][x]!='M')continue;const below=y+1>=H||g[y+1][x]=='.';const above=y==0||g[y-1][x]=='.';if(below)out[y][x]='D';else if(above&&(x+y)%2==0)out[y][x]='L'}
 const fin=out.map(r=>r.slice());for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(out[y][x]!='.')continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>out[y+b]&&out[y+b][x+a]&&out[y+b][x+a]!='.'))fin[y][x]='k'}

const bodyMask=a=>a.map(r=>r.replace(/[^.]/g,'#')).join('|');
// lim を渡すと、差が lim に届いた時点で数えるのをやめる（「lim以上か」だけ分かればよいとき用。結果の判定は同じ）
const MSPL=new Map();const mspl=a=>{let r=MSPL.get(a);if(!r){r=a.split('|');MSPL.set(a,r)}return r};
function maskDist(a,b,lim){const A=mspl(a),B=mspl(b);const h=Math.max(A.length,B.length),w=Math.max(A[0].length,B[0].length);let d=0;
 for(let y=0;y<h;y++){const ra=A[A.length-h+y]||'',rb=B[B.length-h+y]||'';const oa=Math.floor((w-(ra.length||w))/2),ob=Math.floor((w-(rb.length||w))/2);for(let x=0;x<w;x++){const ca=ra[x-oa]=='#',cb=rb[x-ob]=='#';if(ca!=cb){d++;if(lim&&d>=lim)return d}}}return d}

function reqWho(){const ks=['pan','kid',...vill].filter(k=>VILL[k]);return pick(ks)}
function reqGen(){const deep=Math.max(1,+store('yw17_deep')||0,M2.maxF||0);const lay=Math.min(9,Math.floor(deep/10));const easy=(M2.done||0)<2;const have=M2.reqs.map(q=>q.t);let ts=easy?['fetch','slay','reach']:['fetch','fetch','hunt','slay','slay','reach',...(Math.random()<.4?['ally']:[])];if(ts.some(x=>!have.includes(x)))ts=ts.filter(x=>!have.includes(x)||x=='fetch'&&have.filter(y=>y=='fetch').length<2);const t=pick(ts.length?ts:['fetch']);const who=reqWho();const g=30+lay*25+Math.floor(Math.random()*20);const r={id:Date.now().toString(36)+Math.floor(Math.random()*999),t,who,g,run:runs};
 if(t=='fetch'){const pool=REQMAT.slice(0,Math.min(REQMAT.length,4+lay*2));const got=pool.filter(id=>M2.gotItem&&M2.gotItem[id]);r.item=pick(got.length&&(easy||Math.random()<.7)?got:pool);r.n=easy?1:1+Math.floor(Math.random()*(lay?3:2))}
 else if(t=='hunt'){const L=Math.floor(Math.random()*(lay+1));const ks=[...new Set((LAYERMOB[L]||LAYERMOB[0]).concat(L==0?SHALLOW:[]))].filter(k=>FOE[k]&&!FOE[k].boss);const met=ks.filter(k=>(M2.kills[k]||0)>0).sort((a,b)=>(M2.kills[b]||0)-(M2.kills[a]||0)).slice(0,5);const sn=ks.filter(k=>codex['m:'+k]);r.k=pick(met.length&&(easy||Math.random()<.8)?met:sn.length?sn:ks);r.n=easy?1:1+Math.floor(Math.random()*3);r.base=M2.kills[r.k]||0}
 else if(t=='slay'){r.n=easy?3:4+Math.floor(Math.random()*5);r.base=Object.values(M2.kills).reduce((a,b)=>a+b,0)}
 else if(t=='reach'){r.f=Math.min(100,Math.max(2,deep+(easy||Math.random()<.7?1:2)))}
 else{const ks=Object.keys(FOE).filter(k=>FOE[k].cap&&ITEM[k]&&!FOE[k].boss&&(LAYERMOB[Math.min(lay,9)]||[]).concat(SHALLOW).includes(k));r.k=pick(ks.length?ks:['slime'])}
 if(Math.random()<.5)r.gift=pick(REQMAT.slice(0,6));return r}
function reqFill(){const n=hasB2('lamp')?4:3;if(M2.reqRun!==runs){M2.reqRun=runs;let old=0;M2.reqs=M2.reqs.filter(r=>{if(!reqDone(r)&&runs-(r.run||0)>=3){old++;return false}return true});M2.reqOld=old;let g=0;while(M2.reqs.length<n&&g++<20){const r=reqGen();if(M2.reqs.some(q=>reqText(q)==reqText(r)))continue;M2.reqs.push(r)}saveM2()}}
function reqText(r){const N=k=>(FOE[k]||ITEM[k]||{}).n||k;return r.t=='slay'?'どんな魔物でもいいから、'+r.n+'体やっつけて':r.t=='fetch'?ITEM[r.item].n+'を'+r.n+'つ持ってきて':r.t=='hunt'?N(r.k)+'を'+r.n+'体やっつけて':r.t=='reach'?r.f+'Fまで行って、様子を教えて':N(r.k)+'を牧場で見せてほしい'}
function reqProg(r){if(r.t=='slay')return[Math.min(r.n,Object.values(M2.kills).reduce((a,b)=>a+b,0)-(r.base||0)),r.n];if(r.t=='fetch')return[Math.min(r.n,whCount(r.item)),r.n];if(r.t=='hunt')return[Math.min(r.n,(M2.kills[r.k]||0)-r.base),r.n];if(r.t=='reach')return[Math.min(r.f,M2.maxF||0),r.f];return[farm.some(m=>m.k==r.k)?1:0,1]}
const reqDone=r=>{const[a,b]=reqProg(r);return a>=b};
function reqClaim(r){if(!reqDone(r))return;if(r.t=='fetch')for(let i=0;i<r.n;i++){const j=wh.findIndex(o=>o.id==r.item);if(j>=0)wh.splice(j,1)}
 gold+=r.g;if(r.gift)wh.push({id:r.gift});const f0=M2.friend[r.who]||0;M2.friend[r.who]=f0+1;M2.reqs=M2.reqs.filter(q=>q!==r);M2.done=(M2.done||0)+1;
 let msg=VILL[r.who].n+'「ありがとう、助かったよ！」　'+r.g+'G'+(r.gift?'と'+ITEM[r.gift].n:'')+'をもらった';
 const lv=M2.friend[r.who];if(FRGIFT[lv]&&!M2.gifts[r.who+lv]){M2.gifts[r.who+lv]=1;wh.push({id:FRGIFT[lv]});msg+='。仲良しのしるしに'+ITEM[FRGIFT[lv]].n+'もくれた ♥'}

function kickDest(f){const p=G.p,D=FOE[f.k]||{};const dx=Math.sign(f.x-p.x),dy=Math.sign(f.y-p.y);if(!dx&&!dy)return null;const x=f.x+dx,y=f.y+dy,k=x+','+y;let w='',good=true;

 else if(isPit(x,y)&&!D.fly)w=(D.boss||f.max>=20)?'穴に足を取られる':'穴へ落ちる';
 else if(G.lava&&G.lava.has(k)&&!D.fly)w='溶岩へ';
 else if((G.fires||[]).some(q=>q.x==x&&q.y==y)&&!FIREOK(f.k))w='炎の中へ';
 else if((G.thin||[]).some(t=>t.x==x&&t.y==y))w='薄い壁ごと崩す';
 else if(foeAt(x,y))w='仲間にぶつける';
 else if(!freeTile(x,y))w='壁に叩きつける';
 else if(isIce(x,y))w='氷の上を滑っていく';
 else if(inWater(x,y)&&!WETOK(f.k)&&!D.fly)w='水の中へ（足が重くなる）';

 else if(hasOil(x,y))w='油の上へ';
 else if(G.webs&&G.webs.has(k))w='糸の上へ';
 else good=false;
