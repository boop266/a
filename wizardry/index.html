<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深淵の迷宮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--fg:#ececec;--dim:#8d8d8d;--line:#e2e2e2;--hp:#62d862;--hpl:#e6c445;--hpd:#e65050;--mp:#62adff;--gold:#ffd54d;--sel:#1f34d6;--bad:#c46cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--fg);font-family:'DotGothic16',ui-monospace,monospace;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{display:grid;max-width:1040px;height:100%;margin:0 auto;padding:10px;gap:10px;
  grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"view side" "msg side" "pad side"}
.win{border:3px double var(--line);background:#000;padding:8px 10px;position:relative}
#viewWrap{grid-area:view;position:relative;border:3px double var(--line);line-height:0;overflow:hidden;background:#000}
#view{width:100%;aspect-ratio:4/3;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#mini{position:absolute;right:6px;top:6px;width:84px;height:84px;image-rendering:pixelated;border:1px solid #888;background:rgba(0,0,0,.55)}
#hud{position:absolute;left:8px;top:6px;line-height:1.35;font-size:13px;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;pointer-events:none}
#hud .light{color:#ffcf6b}
#mute{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);border:1px solid #666;font-size:14px;padding:3px 8px;line-height:1.2;text-align:center}
#msg{grid-area:msg;overflow:hidden;font-size:15px;line-height:1.55;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end}
#msg div{opacity:.5}#msg div:nth-last-child(-n+2){opacity:1}
#side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-height:0}
#party{font-size:14px;padding:6px 8px}
#pfloat{position:absolute;inset:0;pointer-events:none;overflow:visible}
.flt{position:absolute;right:16px;font-size:17px;text-shadow:0 0 3px #000,0 0 3px #000,0 0 3px #000;animation:flt .95s ease-out forwards}
@keyframes flt{0%{transform:translateY(4px) scale(1.3);opacity:1}100%{transform:translateY(-24px);opacity:0}}
.pm{display:grid;grid-template-columns:5.2em 3.8em 2.6em 1fr;align-items:center;gap:4px;padding:4px;border-bottom:1px dashed #333}
.pm:last-of-type{border-bottom:none}
.pm.act{background:var(--sel)}
.pm.dead{color:#6a6a6a}
.pm.hurt{animation:hurt .4s}
@keyframes hurt{0%{background:#8a1010;transform:translateX(-5px)}25%{transform:translateX(5px)}50%{transform:translateX(-3px)}100%{transform:none}}
.pm.healed{animation:healed .6s}
@keyframes healed{0%{background:#1a6a2a}100%{background:transparent}}
.pm .st{font-size:12px}
.bar{height:5px;background:#222;margin-top:2px}.bar i{display:block;height:100%;transition:width .25s}
.nums{font-size:12px;color:#ddd;white-space:nowrap}
.mpn{color:var(--mp)}
#gold{font-size:13px;color:var(--gold);text-align:right;padding-top:4px}
#cmd{flex:1;min-height:150px;overflow:auto}
#cmd h3{margin:0 0 6px;font-weight:normal;font-size:14px;color:var(--dim)}
#cmd .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#cmd .opts.one{grid-template-columns:1fr}
button{font-family:inherit;font-size:15px;color:var(--fg);background:#000;border:1px solid #bbb;padding:8px 6px;text-align:left;cursor:pointer;line-height:1.25}
button:hover:not(:disabled),button:focus-visible{background:var(--sel);outline:none}
button:disabled{color:#555;border-color:#444;cursor:default}
button small{color:var(--dim);font-size:11px;display:block}
button .k{color:var(--gold);margin-right:4px}
#pad{grid-area:pad;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#pad button{text-align:center;font-size:20px;padding:10px 0}
#pad.hide{visibility:hidden}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
#overlay.on{display:flex}
#ovbox{max-width:560px;width:100%;max-height:100%;overflow:auto}
#ovbox h3{margin:0 0 8px;font-weight:normal}
#mapc{width:100%;image-rendering:pixelated;display:block;background:#000}
.nm{display:grid;grid-template-columns:5em 1fr;align-items:center;gap:8px;margin:8px 0}
.nm input{font-family:inherit;font-size:17px;background:#000;color:#fff;border:1px solid #aaa;padding:6px 8px;width:100%}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
#title canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:.85}
#title .t{position:relative;text-align:center;padding:0 16px}
#title h1{font-weight:normal;font-size:clamp(40px,10vw,84px);margin:0;letter-spacing:.12em;color:#f3e7c9;text-shadow:0 0 18px #ff7a2a,0 0 44px #6b1500,0 3px 0 #000}
#title p{color:#ccc;margin:6px 0 26px;letter-spacing:.3em;text-shadow:0 2px 0 #000}
#title button{display:block;margin:10px auto;min-width:220px;text-align:center;font-size:18px;background:rgba(0,0,0,.65)}
#title .help{color:#999;font-size:12px;margin-top:18px;line-height:1.7;text-shadow:0 1px 0 #000}
.dmg{color:#ff8080}.heal{color:#8dff8d}.sys{color:var(--gold)}.bad{color:var(--bad)}.dim{color:var(--dim)}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto;height:auto;min-height:100%;padding:6px;gap:6px}
  html,body{overflow:auto}
  #msg{min-height:86px;font-size:14px}
  #cmd{min-height:0}
  #pad button{padding:12px 0}
  #pad.hide{display:none}
  #side{display:contents}
  #app{grid-template-areas:"view" "pad" "cmd" "msg" "party"}
  #cmd{grid-area:cmd}#party{grid-area:party}
  #msg{min-height:72px;font-size:13px;line-height:1.5}
  .pm{grid-template-columns:4.6em 4.4em 2.4em 1fr;font-size:13px;padding:3px 2px}
  .pm .dim{font-size:11px!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="viewWrap"><canvas id="view" width="320" height="240"></canvas><canvas id="mini" width="63" height="63"></canvas><div id="hud"></div><button id="mute" title="音のオン・オフ">♪</button></div>
  <div id="msg" class="win"></div>
  <div id="side">
    <div id="party" class="win"><div id="prows"></div><div id="pfloat"></div></div>
    <div id="cmd" class="win"></div>
  </div>
  <div id="pad">
    <button data-k="q" title="左へ横歩き (Q)">◁</button>
    <button data-k="w" title="前へ (W/↑)">▲</button>
    <button data-k="e" title="右へ横歩き (E)">▷</button>
    <button data-k="a" title="左を向く (A/←)">↶</button>
    <button data-k="s" title="後ろへ (S/↓)">▼</button>
    <button data-k="d" title="右を向く (D/→)">↷</button>
  </div>
</div>
<div id="overlay"><div id="ovbox" class="win"></div></div>
<div id="title"><canvas id="tcv" width="320" height="240"></canvas>
  <div class="t"><h1>深淵の迷宮</h1><p>ABYSS OF VARG</p>
  <button id="bNew">はじめから</button><button id="bCont">つづきから</button>
  <div class="help">移動：W/A/S/D・矢印　横歩き：Q/E　待つ：Space<br>地図：M　キャンプ：C　メニューは数字キーでも選べます</div></div>
</div>
<script>
'use strict';
// ================= 基本 =================
const $=s=>document.querySelector(s);
const R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash3(a,b,c){let h=(a*374761393+b*668265263+c*1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const DX=[0,1,0,-1],DY=[-1,0,1,0],DIRN=['北','東','南','西'];
const N=21;
let SPEED=1; // テスト用（0で待ち時間なし）
const esc=s=>String(s).replace(/[<>&"']/g,'');

// ================= 音 =================
let AC=null,master=null,sfxBus=null,musBus=null,leadBus=null,echoSend=null,NB=null,muted=false;
try{muted=localStorage.getItem('abyss_mute')==='1'}catch(e){}
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=muted?0:.7;master.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=.75;sfxBus.connect(master);
  musBus=AC.createGain();musBus.gain.value=.5;musBus.connect(master);
  leadBus=AC.createGain();leadBus.connect(musBus);
  const dl=AC.createDelay(1);dl.delayTime.value=.37;const fb=AC.createGain();fb.gain.value=.4;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1700;
  echoSend=AC.createGain();echoSend.gain.value=0;leadBus.connect(echoSend);echoSend.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(musBus);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
  setInterval(schedule,25);
  if(wantMusic){const w=wantMusic;wantMusic=null;playMusic(w[0],w[1])}
}
function setMute(m){muted=m;try{localStorage.setItem('abyss_mute',m?'1':'0')}catch(e){}if(master)master.gain.value=m?0:.7;$('#mute').textContent=m?'×':'♪'}
function tone(f,d,type='square',v=.12,slide=0,delay=0,bus){
  if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(bus||sfxBus);o.start(t);o.stop(t+d+.03)
}
function noise(d,v=.15,freq=400,delay=0,type='lowpass',bus,at){
  if(!AC)return;const t=at!=null?at:AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(bus||sfxBus);s.start(t,Math.random()*.5);s.stop(t+d+.05)
}
const SFX={
  step(){noise(.08,.16,240);noise(.04,.05,1400,.02,'highpass')},
  bump(){tone(70,.2,'sine',.32,-30);noise(.12,.22,160)},
  door(){tone(95,.35,'sawtooth',.05,-35);noise(.35,.12,500);tone(220,.08,'square',.03,-60,.3)},
  turn(){noise(.07,.05,900)},
  notice(){tone(880,.07,'square',.05);tone(1320,.12,'square',.05,0,.07)},
  enc(){tone(110,.5,'sawtooth',.1);tone(117,.5,'sawtooth',.1);noise(.3,.25,2000);tone(220,.15,'square',.08);tone(208,.4,'square',.08,0,.15)},
  hit(){noise(.12,.35,1800);tone(160,.08,'square',.08,-80)},
  crit(){noise(.2,.45,3200);tone(320,.18,'square',.1,-220);tone(90,.2,'sine',.25,-40)},
  miss(){noise(.1,.08,4000,0,'highpass')},
  hurt(){tone(90,.2,'sawtooth',.15,-50);noise(.15,.25,700)},
  fire(){noise(.7,.3,1100);tone(200,.6,'sawtooth',.06,-150);noise(.4,.15,3000,.1,'highpass')},
  magic(){for(let i=0;i<5;i++)tone(600+i*180,.12,'triangle',.06,0,i*.05)},
  heal(){[523,659,784,1046].forEach((f,i)=>tone(f,.28,'sine',.08,0,i*.07))},
  sleep(){tone(420,.9,'sine',.07,-260);tone(630,.9,'sine',.04,-390,.1)},
  die(){tone(300,.6,'square',.08,-260);noise(.4,.15,600)},
  lvl(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.07,0,i*.09))},
  coin(){tone(988,.08,'square',.06);tone(1318,.25,'square',.06,0,.08)},
  trap(){noise(.45,.4,600);tone(80,.45,'sawtooth',.12,-40)},
  stairs(){for(let i=0;i<6;i++)noise(.07,.13,280,i*.12)},
  charge(){tone(60,1.3,'sawtooth',.1,220);noise(1.2,.06,300)},
  sel(){tone(880,.035,'square',.035)},
  mstep(v){noise(.09,.08*v,170);noise(.05,.03*v,700,.06)},
  splash(){noise(.2,.12,900,0,'bandpass')},
};
function sfx(n,a){try{SFX[n]&&SFX[n](a)}catch(e){}}

// ---- 作曲（その場で鳴らす小さな音楽） ----
const NI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nm(s){const m=/^([A-G])([#b]?)(-?\d)$/.exec(s);if(!m)return 0;return NI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12}
const mf=m=>440*Math.pow(2,(m-69)/12);
function chord(s){const m=/^([A-G])([#b]?)(m?)/.exec(s);const r=NI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return[(r+12)%12,m[3]==='m']}
const TR={
  title:{bpm:62,lead:'D5 - - - A4 - - - | F5 - E5 - D5 - - - | . . . . F5 - - - | G5 - F5 - D5 - - - | . . . . Bb4 - - - | D5 - C5 - Bb4 - A4 - | . . . . E5 - - - | C#5 - - - - - - -',
    ch:'Dm Dm Bb Bb Gm Gm A A',bass:'hold',pad:1,lv:.04,wave:'triangle',echo:.5},
  dungeon:{bpm:58,lead:'A4 - - - . . E5 - | D5 - - - C5 - - - | . . . . A4 - C5 - | B4 - - - - - . . | F5 - - - E5 - - - | D5 - C5 - D5 - - - | . . . . B4 - G#4 - | A4 - - - - - - -',
    ch:'Am Am F G Dm F E E',bass:'hold',pad:1,lv:.036,wave:'triangle',echo:.55},
  town:{bpm:96,lead:'A4 C5 E5 - D5 C5 B4 C5 | A4 - F4 - A4 C5 F5 - | E5 - D5 C5 G4 - C5 - | D5 - B4 G4 D5 E5 D5 - | E5 - A5 - G5 E5 D5 C5 | D5 - C5 A4 C5 D5 F5 - | E5 D5 C5 - B4 - G4 - | A4 - - - - - . .',
    ch:'Am F C G Am F G Am',bass:'rf',arp:1,lv:.04,wave:'square',echo:.18,dr:'..h...h.',dv:.5},
  battle:{bpm:152,lead:'E5 - B4 E5 G5 - F#5 E5 | G5 - E5 C5 E5 - D5 C5 | D5 - A4 D5 F#5 - E5 D5 | D#5 - F#5 - B5 - A5 F#5 | G5 - F#5 E5 B4 - E5 G5 | C6 - B5 G5 E5 - G5 C6 | A5 - G5 E5 C5 - E5 A5 | B5 - A5 F#5 D#5 - B4 -',
    ch:'Em C D B Em C Am B',bass:'drive',lv:.032,wave:'square',dr:'khshkksh',dv:1},
  boss:{bpm:166,lead:'D4 - F4 A4 D5 - C5 A4 | Bb4 - A4 F4 D4 - F4 Bb4 | G4 - Bb4 D5 C5 - Bb4 G4 | A4 - C#5 - E5 - C#5 A4 | F5 - E5 D5 A4 - D5 F5 | F5 - D5 Bb4 F4 - Bb4 D5 | D5 - C5 Bb4 G4 - Bb4 D5 | C#5 - A4 - E5 - E4 -',
    ch:'Dm Bb Gm A Dm Bb Gm A',bass:'drive',arp:1,lv:.034,wave:'sawtooth',dr:'kkshkhss',dv:1.1},
  win:{bpm:160,once:1,lead:'C5 E5 G5 C6 - G5 C6 -',ch:'C',bass:'hold',lv:.05,wave:'square'},
  lose:{bpm:64,once:1,lead:'A4 - G4 - F4 - E4 - | - - - - . . . .',ch:'Am Am',bass:'hold',lv:.045,wave:'triangle',echo:.5},
  ending:{bpm:84,lead:'C5 - E5 G5 C6 - B5 G5 | A5 - F5 - A5 C6 F6 - | E6 - D6 C6 G5 - C6 - | D6 - B5 G5 D6 E6 D6 - | E6 - A5 - G5 E5 D5 C5 | D5 - C5 A4 C5 D5 F5 - | E5 D5 C5 - B4 - G4 - | C5 - - - - - . .',
    ch:'C F C G Am F G C',bass:'rf',arp:1,lv:.04,wave:'square',echo:.3}};
const FLOOR_TP=[0,0,-2,-4,1,-5];
let mus=null,mStep=0,mTime=0,musKey='',wantMusic=null,afterOnce=null;
function parseLead(s){return s.split(/\s+/).filter(t=>t&&t!=='|')}
function playMusic(name,tp=0){
  const k=name+':'+tp;
  if(!AC){wantMusic=[name,tp];return}
  const tr=TR[name];if(!tr)return;
  // ファンファーレの途中なら、鳴り終わってから次の曲へ
  if(mus&&mus.tr.once&&!tr.once&&name!=='battle'&&name!=='boss'){afterOnce=[name,tp];return}
  afterOnce=null;if(musKey===k)return;musKey=k;
  mus={tr,steps:parseLead(tr.lead),chords:tr.ch.split(/\s+/),tp};mStep=0;mTime=AC.currentTime+.06;
  echoSend.gain.setTargetAtTime(tr.echo||0,AC.currentTime,.05);
}
function schedule(){
  if(!AC||!mus)return;const sd=60/mus.tr.bpm/2;
  while(mTime<AC.currentTime+.16){playStep(mStep,mTime,sd);mTime+=sd;mStep++;
    if(mStep>=mus.steps.length){if(mus.tr.once){mus=null;musKey='';if(afterOnce){const a=afterOnce;afterOnce=null;setTimeout(()=>playMusic(a[0],a[1]),600)}return}mStep=0}}
}
function mnote(f,t,d,type,v,dest,vib){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.2;lg.gain.value=f*vib;l.connect(lg);lg.connect(o.frequency);l.start(t+.08);l.stop(t+d+.1)}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setTargetAtTime(v*.55,t+.01,d*.5);g.gain.setTargetAtTime(0,t+d*.9,.04);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.3)
}
function drum(c,t,v){
  if(c==='k'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.32*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(musBus);o.start(t);o.stop(t+.2)}
  if(c==='s'){noise(.12,.16*v,1900,0,'bandpass',musBus,t);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(190,t);g.gain.setValueAtTime(.07*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g);g.connect(musBus);o.start(t);o.stop(t+.1)}
  if(c==='h')noise(.035,.05*v,7000,0,'highpass',musBus,t);
}
function playStep(i,t,sd){
  const tr=mus.tr,tp=mus.tp,tok=mus.steps[i];const bar=i>>3,bi=i&7;
  const[root,minor]=chord(mus.chords[bar%mus.chords.length]);const third=minor?3:4;
  if(tok&&tok!=='-'&&tok!=='.'){let n=1;while(mus.steps[i+n]==='-')n++;mnote(mf(nm(tok)+tp),t,n*sd*.96,tr.wave||'square',tr.lv,leadBus,.005)}
  const b=36+root+tp;
  if(tr.bass==='rf'){if(bi%4===0)mnote(mf(b),t,sd*1.7,'triangle',.13,musBus);if(bi%4===2)mnote(mf(b+7),t,sd*1.7,'triangle',.11,musBus)}
  else if(tr.bass==='drive')mnote(mf(bi%2?b+12:b),t,sd*.8,'triangle',.15,musBus);
  else if(tr.bass==='hold'&&bi===0)mnote(mf(b),t,sd*8,'triangle',.12,musBus);
  if(tr.pad&&bi===0)for(const iv of[0,third,7])mnote(mf(48+root+iv+tp+12),t,sd*7.8,'sine',.018,musBus);
  if(tr.arp){const iv=[0,third,7,12][[0,1,2,3,2,1,2,1][bi]];mnote(mf(60+root+iv+tp),t,sd*.9,'triangle',.022,musBus)}
  if(tr.dr){const c=tr.dr[bi];if(c&&c!=='.')drum(c,t,tr.dv||1)}
}

// ================= データ =================
const THEME=[null,{n:'B1 苔むした回廊'},{n:'B2 赤土の坑道'},{n:'B3 水没した墓所'},{n:'B4 凍てつく書庫'},{n:'B5 深淵の玉座'}];

function getMap(fl){
  if(MAPS[fl])return MAPS[fl];
  const rnd=mulberry(G.seed+fl*7919);const rr=(a,b)=>a+Math.floor(rnd()*(b-a+1));const rp=a=>a[Math.floor(rnd()*a.length)];
  const m=Array.from({length:N},()=>Array(N).fill(1));
  const st=[[1,1]];m[1][1]=0;
  while(st.length){const[x,y]=st[st.length-1];
    const ds=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<N-1&&ny<N-1&&m[ny][nx]===1});
    if(!ds.length){st.pop();continue}
    const[dx,dy]=ds[Math.floor(rnd()*ds.length)];m[y+dy/2][x+dx/2]=0;m[y+dy][x+dx]=0;st.push([x+dx,y+dy])}
  for(let i=0;i<4;i++){const w=rp([3,5]),h=rp([3,5]);const x=1+2*rr(0,(N-2-w)>>1),y=1+2*rr(0,(N-2-h)>>1);
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)m[yy][xx]=0}
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(m[y][x]!==1||(x+y)%2===0)continue;
    if(((m[y][x-1]===0&&m[y][x+1]===0)||(m[y-1][x]===0&&m[y+1][x]===0))&&rnd()<.1)m[y][x]=0}
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
    if(m[y][x]!==0||(x+y)%2===0)continue;
    const h=m[y][x-1]!==1&&m[y][x+1]!==1&&m[y-1][x]===1&&m[y+1][x]===1,v=m[y-1][x]!==1&&m[y+1][x]!==1&&m[y][x-1]===1&&m[y][x+1]===1;
    if((h||v)&&rnd()<.14)m[y][x]=2}
  const floors=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(m[y][x]===0&&x%2&&y%2)floors.push([x,y]);
  const up=fl===1?[1,1]:floors[Math.floor(rnd()*floors.length)];
  const dist=bfs(m,up);let far=up,fd=0;for(const c of floors){const d=dist[c[1]*N+c[0]];if(d>fd){fd=d;far=c}}
  m[up[1]][up[0]]=4;m[far[1]][far[0]]=fl===5?9:3;
  const free=floors.filter(c=>m[c[1]][c[0]]===0&&Math.abs(c[0]-up[0])+Math.abs(c[1]-up[1])>=3);
  const place=(t,n)=>{for(let i=0;i<n&&free.length;i++){const c=free.splice(Math.floor(rnd()*free.length),1)[0];m[c[1]][c[0]]=t}};
  place(10,1);place(5,3);place(6,1);place(7,1+fl);if(fl>=2)place(8,fl);
  const mm=new Uint8Array(N*N);for(let y=0;y<N;y++)for(let x=0;x<N;x++)mm[y*N+x]=m[y][x];
  const dax=new Uint8Array(N*N);for(let i=0;i<N*N;i++)if(mm[i]===2){const x=i%N,y=i/N|0;dax[i]=m[y][x-1]!==1?1:2}
  // 壁のたいまつ
  const tor=new Uint8Array(N*N*4),torches=[];
  const cand=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(m[y][x]!==1)continue;for(let k=0;k<4;k++){const ox=x+DX[k],oy=y+DY[k];if(ox<0||oy<0||ox>=N||oy>=N)continue;const t=m[oy][ox];if(t!==1&&t!==2)cand.push([x,y,k])}}
  const nt=[0,13,11,10,9,8][fl];
  {const c=cand.filter(c=>Math.abs(c[0]+DX[c[2]]-up[0])+Math.abs(c[1]+DY[c[2]]-up[1])===1);if(c.length){const t=rp(c);tor[(t[1]*N+t[0])*4+t[2]]=1;torches.push(t)}}
  for(let i=0;i<nt&&cand.length;i++){const t=cand.splice(Math.floor(rnd()*cand.length),1)[0];if(torches.some(o=>Math.abs(o[0]-t[0])+Math.abs(o[1]-t[1])<4))continue;tor[(t[1]*N+t[0])*4+t[2]]=1;torches.push(t)}
  // 置き物
  const objs=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=m[y][x];if(t===4||t===5||t===6||t===9||t===10)objs.push({x:x+.5,y:y+.5,cx:x,cy:y,t})}
  const decoKinds=fl===3?['skull','bones','candle']:fl===5?['skull','candle','bones']:['bones','skull','bones'];
  for(let i=0;i<7+fl;i++){const c=floors[Math.floor(rnd()*floors.length)];if(m[c[1]][c[0]]!==0)continue;objs.push({x:c[0]+.2+rnd()*.6,y:c[1]+.2+rnd()*.6,cx:c[0],cy:c[1],t:rp(decoKinds)})}
  const pk=new Uint8Array(N*N);for(const k in G.pits){const[f,x,y]=k.split(',').map(Number);if(f===fl)pk[y*N+x]=1}
  const M={fl,m,mm,up,down:far,dax,door:new Float32Array(N*N),dt:new Float32Array(N*N),tor,torches,objs,pk,mons:[],lg:null,spawned:false};
  MAPS[fl]=M;buildLight(M);
  if(fl===5)M.mons.push({id:'boss',boss:1,spec:[['boss',1],['garg',2]],x:far[0],y:far[1],rx:far[0]+.5,ry:far[1]+.5,f:0,alive:G.amulet?0:1,sleep:0,alert:0,stun:0,emote:0,bob:0});
  return M;
}
function bfs(m,s){const d=new Int16Array(N*N).fill(-1);const q=[s];d[s[1]*N+s[0]]=0;let h=0;
  while(h<q.length){const[x,y]=q[h++];for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=N||ny>=N)continue;if(m[ny][nx]===1||d[ny*N+nx]>=0)continue;d[ny*N+nx]=d[y*N+x]+1;q.push([nx,ny])}}return d}
function tile(x,y){if(x<0||y<0||x>=N||y>=N)return 1;return getMap(G.floor).mm[y*N+x]}

const TORCHC=[null,[1,.62,.3],[1,.55,.25],[.35,.95,.75],[.55,.72,1],[1,.32,.15]];
const AMB=[null,[.04,.04,.045],[.045,.035,.03],[.025,.045,.05],[.035,.04,.055],[.055,.022,.025]];
function buildLight(M){
  const lg=new Float32Array(N*N*3);const m=M.m;
  const add=(sx,sy,lx,ly,I,c,rad)=>{const d=new Int16Array(N*N).fill(-1);const q=[[sx,sy]];d[sy*N+sx]=0;let h=0;
    while(h<q.length){const[x,y]=q[h++];const i=y*N+x;const ex=x+.5-lx,ey=y+.5-ly;const v=I/(1+(ex*ex+ey*ey)*.55);
      lg[i*3]+=v*c[0];lg[i*3+1]+=v*c[1];lg[i*3+2]+=v*c[2];
      if(d[i]>=rad)continue;for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=N||ny>=N||m[ny][nx]===1||d[ny*N+nx]>=0)continue;d[ny*N+nx]=d[i]+1;q.push([nx,ny])}}};
  for(const[x,y,k]of M.torches)add(x+DX[k],y+DY[k],x+.5+DX[k]*.45,y+.5+DY[k]*.45,1.0,TORCHC[M.fl],6);
  for(const o of M.objs){
    if(o.t===4)add(o.cx,o.cy,o.x,o.y,M.fl===1?1.1:.75,[1,.95,.8],4);
    if(o.t===6)add(o.cx,o.cy,o.x,o.y,.5,[.3,.6,1],2);
    if(o.t===10)add(o.cx,o.cy,o.x,o.y,.35,[.4,.9,1],2);
    if(o.t===9)add(o.cx,o.cy,o.x,o.y,1.2,[1,.15,.2],4);
    if(o.t==='candle')add(o.cx,o.cy,o.x,o.y,.45,[1,.75,.4],2);
  }
  // 壁の中は周りの平均（なめらかに補間するため）
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(m[y][x]!==1)continue;const s=[0,0,0];let n=0;for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=N||ny>=N||m[ny][nx]===1)continue;const j=(ny*N+nx)*3;s[0]+=lg[j];s[1]+=lg[j+1];s[2]+=lg[j+2];n++}
    if(n){const i=(y*N+x)*3;lg[i]=s[0]/n;lg[i+1]=s[1]/n;lg[i+2]=s[2]/n}}
  M.lg=lg;
}

function rollEnc(fl){
  const pool=Object.keys(MON).filter(k=>MON[k].fl[0]<=fl&&MON[k].fl[1]>=fl);
  const ng=fl>=3?ri(1,3):ri(1,2);const res=[];
  for(let i=0;i<ng;i++){const id=pick(pool);if(res.find(r=>r[0]===id))continue;res.push([id,ri(1,Math.min(MON[id].max,1+Math.ceil(fl/2)+(i?0:1)))])}
  return res;
}
function spawnOne(M,minD){
  const o=G.floor===M.fl?[G.x,G.y]:M.up;const D=bfs(M.m,o);const c=[];
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){const i=y*N+x;if(M.mm[i]!==0||D[i]<minD||M.mons.some(m=>m.alive&&m.x===x&&m.y===y))continue;c.push([x,y])}
  if(!c.length)return;const[x,y]=pick(c);const spec=rollEnc(M.fl);const lead=spec.slice().sort((a,b)=>MON[b[0]].hp-MON[a[0]].hp)[0][0];
  M.mons.push({id:lead,spec,x,y,rx:x+.5,ry:y+.5,f:ri(0,3),alive:1,sleep:R()<.3?1:0,alert:0,stun:0,emote:0,bob:R()*6});
}
const monAt=(M,x,y)=>M.mons.find(m=>m.alive&&m.x===x&&m.y===y);
function monCan(M,x,y){const t=M.mm[y*N+x];if(t===1||t===3||t===4||t===9)return false;if(x===G.x&&y===G.y)return false;return!monAt(M,x,y)}
function los(M,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),n=Math.ceil(L/.2);
  for(let i=1;i<n;i++){const x=ax+dx*i/n,y=ay+dy*i/n,j=(y|0)*N+(x|0);const t=M.mm[j];if(t===1)return false;if(t===2&&M.door[j]<.5)return false}return true}
function dirTo(ax,ay,bx,by){for(let k=0;k<4;k++)if(ax+DX[k]===bx&&ay+DY[k]===by)return k;return-1}

const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function mkTex(w,h,fn){

  const e=document.createElement('canvas');e.width=w;e.height=h;const ex=e.getContext('2d');ex.fillStyle='#fff';
  fn(x,ex,w,h);const id=x.getImageData(0,0,w,h);const em=ex.getImageData(0,0,w,h).data;

  return{w,h,px:new Uint32Array(id.data.buffer),em:E,cv:c};
}
function pass(x,w,h,f){const d=x.getImageData(0,0,w,h),a=d.data;for(let y=0;y<h;y++)for(let i=0;i<w;i++){const k=(y*w+i)*4;if(a[k+3]===0)continue;const r=f(i,y,a[k],a[k+1],a[k+2]);if(r){a[k]=r[0];a[k+1]=r[1];a[k+2]=r[2]}}x.putImageData(d,0,0)}
function vnoise(seed,P=8){const g=new Float32Array(P*P);const r=mulberry(seed);for(let i=0;i<P*P;i++)g[i]=r();
  const at=(x,y)=>g[(((x%P)+P)%P)+(((y%P)+P)%P)*P];
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);const a=at(xi,yi),b=at(xi+1,yi),c=at(xi,yi+1),d=at(xi+1,yi+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}}

function texBrick(o){return mkTex(64,64,(x,e)=>{

    for(let i=-1;i<=nb;i++){const X=i*bw+off,Y=row*bh,v=cols[((i%nb)+nb)%nb];x.fillStyle=rgb(o.base.map(k=>k+v));x.fillRect(X+1,Y+1,bw-2,bh-2);
      x.fillStyle='rgba(255,235,210,.15)';x.fillRect(X+1,Y+1,bw-2,1);x.fillRect(X+1,Y+1,1,bh-2);
      x.fillStyle='rgba(0,0,0,.32)';x.fillRect(X+1,Y+bh-2,bw-2,1);x.fillRect(X+bw-2,Y+1,1,bh-2)}}
  pass(x,64,64,(i,y,a,b,c)=>{const k=(fbm(n,i,y)-.5)*o.nz+(r()-.5)*o.grain;let rr=a+k,gg=b+k,bb=c+k;
    if(o.moss){const mo=fbm(n,i+21,y+13)*(.45+.75*y/64);if(mo>.55){const t=Math.min(1,(mo-.55)*4)*.7;rr=rr*(1-t)+o.moss[0]*t;gg=gg*(1-t)+o.moss[1]*t;bb=bb*(1-t)+o.moss[2]*t}}
    if(o.frost){const f=fbm(n,i+5,y+40)*(1.25-y/64);if(f>.6){const t=Math.min(1,(f-.6)*3)*.65;rr+=(215-rr)*t;gg+=(232-gg)*t;bb+=(255-bb)*t}}
    return[rr,gg,bb]});
  for(let k=0;k<(o.cracks||0);k++){let cx=r()*64,cy=r()*48;x.fillStyle='rgba(0,0,0,.5)';for(let s=0;s<16;s++){x.fillRect(cx|0,cy|0,1,1);cx+=(r()*2-1)*1.2;cy+=r()*1.4+.2}}

    for(let i=0;i<L;i++){const xx=(X+i)%64;x.fillStyle=i%5===0?'#ffd060':'#ff4a10';x.fillRect(xx,Y,1,1);e.fillRect(xx,Y,1,1);if(r()<.45){x.fillStyle='#b02a08';x.fillRect(xx,(Y+63)%64,1,1);e.fillRect(xx,(Y+63)%64,1,1)}}}}
  if(o.after)o.after(x,e,r);
})}
function texRock(o){return mkTex(64,64,(x,e)=>{
  const r=mulberry(o.seed),n=vnoise(o.seed+3);const pts=[];for(let i=0;i<(o.cells||11);i++)pts.push([r()*64,r()*64,(r()-.5)*o.var]);
  const id=x.createImageData(64,64),a=id.data;
  for(let y=0;y<64;y++)for(let i=0;i<64;i++){let d1=1e9,d2=1e9,c=0,cx=0,cy=0;
    for(const p of pts)for(let oy=-64;oy<=64;oy+=64)for(let ox=-64;ox<=64;ox+=64){const dx=i-p[0]-ox,dy=y-p[1]-oy,d=dx*dx+dy*dy;if(d<d1){d2=d1;d1=d;c=p[2];cx=dx;cy=dy}else if(d<d2)d2=d}

      x.fillStyle='rgba(255,220,160,.16)';hor?x.fillRect(X,Y,W,1):x.fillRect(X,Y,1,H);
      for(let g=0;g<7;g++){x.fillStyle='rgba(40,20,8,.5)';hor?x.fillRect(X+(r()*W|0),Y+1+(r()*(H-2)|0),4+(r()*6|0),1):x.fillRect(X+1+(r()*(W-2)|0),Y+(r()*H|0),1,4+(r()*6|0))}};
    wood(0,0,6,64,0);wood(58,0,6,64,0);wood(0,0,64,6,1);x.fillStyle='#1e1e22';x.fillRect(2,2,2,2);x.fillRect(60,2,2,2)}

function texFlag(o){return mkTex(64,64,(x,e)=>{

  for(let k=0;k<4;k++){const nx=G.x+DX[k],ny=G.y+DY[k];if(!solid(tile(nx,ny))){G.f=k;break}}
  if(!M.spawned){M.spawned=true;for(let i=0;i<4+fl;i++)spawnOne(M,6)}
  for(const m of M.mons)if(m.alive&&!m.boss&&Math.abs(m.x-G.x)+Math.abs(m.y-G.y)<4)m.alive=0;
  mode='dungeon';act=null;cam=camTarget();markSeen();$('#pad').classList.remove('hide');drawParty();curTag=null;
}
function dungeonIdle(){
  mode='dungeon';busy=false;activeIdx=-1;drawParty();$('#pad').classList.remove('hide');playMusic('dungeon',FLOOR_TP[G.floor]);
  if(curTag==='idle')return;
  menu(THEME[G.floor].n,[{l:'キャンプ',s:'呪文・道具・様子 (C)',v:'camp'},{l:'地図',s:'歩いた所 (M)',v:'map'},{l:'その場で待つ',s:'1手やりすごす (Space)',v:'wait'}],{tag:'idle'}).then(v=>{
    if(mode!=='dungeon'||busy)return;curTag=null;
    if(v==='camp')camp();else if(v==='map'){showMap();dungeonIdle()}else if(v==='wait')waitTurn()});
}
let queued=null;

  if(mode!=='dungeon'||busy)return;if(act){queued=k;return}
  busy=true;

  if(mode==='dungeon'){busy=false;if(curTag!=='idle')dungeonIdle();if(queued){const q=queued;queued=null;inputMove(q)}}else queued=null;
}
async function waitTurn(){if(mode!=='dungeon'||busy)return;busy=true;log('息をひそめて 様子をうかがった。','dim');await worldTurn();if(mode==='dungeon'){busy=false;if(curTag!=='idle')dungeonIdle()}}
async function doMove(k){
  const M=getMap(G.floor);
  if(k==='a'||k==='d'){const s=k==='d'?1:-1;G.f=(G.f+4+s)%4;sfx('turn');markSeen();drawHud();await anim('turn',150,{x:cam.x,y:cam.y,a:cam.a+s*Math.PI/2});return}
  const dir=k==='w'?G.f:k==='s'?(G.f+2)%4:k==='q'?(G.f+3)%4:(G.f+1)%4;
  const nx=G.x+DX[dir],ny=G.y+DY[dir],t=tile(nx,ny);
  if(t===1){sfx('bump');shake=3;await anim('bump',170,null,{dx:DX[dir],dy:DY[dir]});return}
  const mo=monAt(M,nx,ny);
  if(mo){await engage(mo,'party',dir);return}
  if(t===2&&M.door[ny*N+nx]<.9){openDoor(M,nx,ny);sfx('door');await wait(210)}
  G.x=nx;G.y=ny;sfx(M.fl===3?'splash':'step');G.steps++;
  await anim('move',k==='w'?180:210,{x:nx+.5,y:ny+.5,a:cam.a});
  await afterStep(M,nx,ny,t);
}
function markSeen(){const s=G.seen[G.floor]||(G.seen[G.floor]=new Array(N*N).fill(0));const see=G.light>0?6:3;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=G.x+dx,y=G.y+dy;if(x>=0&&y>=0&&x<N&&y<N)s[y*N+x]=1}
  for(let k=1;k<=see;k++){const x=G.x+DX[G.f]*k,y=G.y+DY[G.f]*k;if(x<0||y<0||x>=N||y>=N)break;s[y*N+x]=1;if(tile(x,y)===1)break}}
function openDoor(M,x,y){const i=y*N+x;M.dt[i]=1;if(!SPEED)M.door[i]=1}
function closeDoors(M){for(let i=0;i<N*N;i++){if(M.mm[i]!==2||M.dt[i]===0)continue;const x=i%N,y=i/N|0;if(Math.abs(x-G.x)+Math.abs(y-G.y)<=1)continue;if(M.mons.some(m=>m.alive&&Math.abs(m.x-x)+Math.abs(m.y-y)<=1))continue;M.dt[i]=0;if(!SPEED)M.door[i]=0}}

    if(v){sfx('stairs');if(G.floor===1){log('地上に 戻ってきた。','sys');goTown();return}enterFloor(G.floor-1,'down');log(`${THEME[G.floor].n} に戻った。`);return}}
  else if(t===5&&!G.taken[k]){G.taken[k]=1;sfx('coin');const g=ri(25,45)*G.floor;G.gold+=g;log(`古い宝箱を見つけた！ <span class="sys">${g}G</span>`);
    const it=pick(['傷薬','毒消し','たいまつ','帰還の巻物','霊薬','傷薬']);if(G.bag.length<BAGMAX){G.bag.push(it);log(`${it} を手に入れた。`)}else log(`${it} もあったが 袋がいっぱいだ。`,'dim');drawParty()}

    if(v){if(G.taken[k])log('泉は もう 濁ってしまった。','dim');else{G.taken[k]=1;const r=R();
      if(r<.55){sfx('heal');fx('heal',{d:900});G.party.forEach((p,i)=>{if(alive(p)){p.hp=p.mhp;p.poison=0;pfloat(i,'全快','heal')}});log('体の奥から 力が湧く！ 全員の傷が癒えた。','heal')}
      else if(r<.8){sfx('magic');G.party.forEach(p=>{if(alive(p))p.mp=p.mmp});log('頭が 澄みわたる。 MPが 戻った！','heal')}
      else{sfx('trap');G.party.forEach(p=>{if(alive(p))p.poison=1});log('うっ…！ 毒の水だった！','bad')}}drawParty()}}
  else if(t===10)log(SIGNS[G.floor],'sys');
  else if(t===7){if(G.pits[k])log('落とし穴の ふちを 慎重に渡った。','dim');else{
      const th=G.party.find(p=>p.c==='盗賊'&&alive(p));G.pits[k]=1;M.pk[y*N+x]=1;
      if(th&&R()<.25+th.lv*.06)log(`${th.n}「待って！ 足元に 落とし穴！」`,'sys');
      else{sfx('trap');shake=10;fx('red');G.party.forEach((p,i)=>{if(alive(p)){const d=Math.min(p.hp,ri(2,5)+G.floor*2);p.hp-=d;pfloat(i,'-'+d,'dmg')}});log('床が抜けた！ 落とし穴だ！','dmg');drawParty();
        if(!G.party.some(alive)){gameOver();return}}}}
  else if(t===8){G.f=(G.f+ri(1,3))%4;act=null;cam=camTarget();drawHud();log('…足元が わずかに 揺れた気がする。','dim')}
  if(mode!=='dungeon')return;
  await worldTurn();
  if(mode==='dungeon'&&G.steps%40===0&&M.mons.filter(m=>m.alive&&!m.boss).length<3+M.fl)spawnOne(M,9);
}
async function worldTurn(){
  const M=getMap(G.floor);const D=bfs(M.m,[G.x,G.y]);const now=performance.now();let enc=null;const notice=G.light>0?6:3.5;
  for(const m of M.mons){if(!m.alive||m.boss)continue;const d=D[m.y*N+m.x];
    if(m.stun>0){m.stun--;continue}
    if(m.sleep){if(d>=0&&d<=2&&R()<(hasThief()?.2:.4)){m.sleep=0;m.alert=1;m.emote=now+1100;sfx('notice')}continue}
    if(!m.alert&&d>=0&&Math.hypot(m.x-G.x,m.y-G.y)<=notice&&los(M,m.x+.5,m.y+.5,G.x+.5,G.y+.5)){m.alert=1;m.emote=now+1100;if(d<=6)sfx('notice')}
    if(m.alert&&(d<0||d>12))m.alert=0;
    if(m.alert){if(d===1){if(!enc)enc=m;continue}
      let best=null;for(let k=0;k<4;k++){const nx=m.x+DX[k],ny=m.y+DY[k];if(nx<0||ny<0||nx>=N||ny>=N||!monCan(M,nx,ny))continue;const dd=D[ny*N+nx];if(dd>=0&&dd<d&&(!best||dd<best.d))best={k,d:dd}}
      if(best)moveMon(M,m,best.k,d)}
    else if(R()<.55){const ks=[0,1,2,3].filter(k=>{const nx=m.x+DX[k],ny=m.y+DY[k];return nx>=0&&ny>=0&&nx<N&&ny<N&&monCan(M,nx,ny)});if(!ks.length)continue;
      let k=ks.includes(m.f)&&R()<.7?m.f:pick(ks);if(ks.length>1&&k===(m.f+2)%4)k=pick(ks.filter(z=>z!==(m.f+2)%4));moveMon(M,m,k,d)}}
  if(enc)await engage(enc,'mon');
}
function moveMon(M,m,k,d){m.x+=DX[k];m.y+=DY[k];m.f=k;if(M.mm[m.y*N+m.x]===2)openDoor(M,m.x,m.y);if(d>=0&&d<=4)sfx('mstep',1-d/5)}
async function engage(m,by,dir){
  let sur=null;
  if(by==='party'){if(!m.boss&&(m.sleep||(m.f===dir&&!m.alert)))sur='party';G.f=dir}
  else{const dk=dirTo(G.x,G.y,m.x,m.y);if(dk===(G.f+2)%4)sur='enemy';if(dk>=0)G.f=dk}
  act=null;cam=camTarget();m.sleep=0;
  if(m.boss){log('玉座の間だ。 深淵の王が 目を開いた。','bad');await wait(800)}
  let r=await battle(m.spec,{surprise:sur,boss:m.boss,mon:m});
  while(r==='alarm')r=await battle(rollEnc(G.floor),{});
}
function showMap(){

  x.save();x.translate(G.x*12+6,G.y*12+6);x.rotate(G.f*Math.PI/2);x.fillStyle='#fff';x.beginPath();x.moveTo(0,-5);x.lineTo(4,4);x.lineTo(-4,4);x.fill();x.restore();

async function campUse(p,s,name,isSpell){
  let tgt=null,ti=-1;
  if(s.t==='ally'||s.t==='dead'){const v=await menu('誰に？',G.party.map((q,i)=>({l:q.n,s:`HP ${q.hp}/${q.mhp}${q.poison?' 毒':''}`,v:i,dis:s.t==='dead'?alive(q):!alive(q)})),{back:1});if(v==='__back')return false;tgt=G.party[v];ti=v}
  if(s.heal&&tgt.hp>=tgt.mhp&&!(s.cure&&tgt.poison)){log(`${tgt.n}は もう元気だ。`,'dim');return false}
  if(s.cure&&!s.heal&&!tgt.poison){log(`${tgt.n}は 毒に冒されていない。`,'dim');return false}
  if(isSpell)p.mp-=s.mp;
  if(s.heal){const h=Math.min(tgt.mhp-tgt.hp,ri(s.heal[0],s.heal[1]));tgt.hp+=h;if(s.cure)tgt.poison=0;sfx('heal');fx('heal',{d:800});drawParty();pfloat(ti,'+'+h,'heal');log(`${tgt.n}の HPが ${h} 回復した。`,'heal')}
  else if(s.cure){tgt.poison=0;sfx('heal');log(`${tgt.n}の 毒が消えた。`,'heal')}
  else if(s.revive){tgt.hp=Math.ceil(tgt.mhp/2);sfx('heal');fx('white');log(`${tgt.n}が 蘇った！`,'heal')}
  else if(s.light){G.light=Math.max(G.light,s.light);sfx('magic');fx('white',{d:400});log('あたたかな光が 闇を押しのけた。 ……遠くで 何かが 身じろぎした。','sys')}
  else if(s.warp){sfx('magic');fx('white',{d:900});log('巻物が燃え上がり、気づけば 町の門の前にいた。','sys');closeOverlay();await wait(500);goTown();return true}
  drawParty();return true;
}

async function battle(spec,o={}){
  mode='battle';busy=true;$('#pad').classList.add('hide');curTag=null;act=null;cam=camTarget();
  B={groups:spec.map(([id,c])=>({id,m:MON[id],list:Array.from({length:c},()=>({hp:MON[id].hp+ri(0,MON[id].hp>>2),sleep:0}))})),flash:{},fade:{},lunge:{},def:new Set(),buff:0,charge:false,boss:o.boss,mon:o.mon,sel:-1};
  playMusic(o.boss?'boss':'battle');sfx('enc');fx('white',{d:300});shake=7;drawParty();
  log(B.groups.map(g=>`<span class="dmg">${g.m.n}${g.list.length>1?'×'+g.list.length:''}</span>`).join('、')+' が あらわれた！');
  if(o.boss)log('「愚かな…。 光の届かぬ底で 朽ちるがいい」','bad');
  if(o.surprise==='party')log('<span class="sys">不意をついた！ 先に 動ける！</span>');
  if(o.surprise==='enemy')log('<span class="dmg">背後から 襲われた！</span>');
  await wait(550);
  let round=0;
  while(true){
    if(round===0&&o.surprise==='enemy')await runRound([],'e');
    else{const acts=await chooseAll();
      if(acts==='run'){const al=G.party.filter(alive),le=liveEnemies();
        const pa=al.reduce((s,p)=>s+agi(p),0)/al.length,ea=le.reduce((s,x)=>s+x.g.m.agi,0)/le.length;
        if(!B.boss&&R()<.55+(pa-ea)*.03){log('うまく 逃げ出した！');if(B.mon){B.mon.stun=4;B.mon.alert=0}await wait(450);B=null;dungeonIdle();return'run'}
        log('逃げられない！','dmg');await wait(400);await runRound([],'e')}
      else await runRound(acts,round===0&&o.surprise==='party'?'p':'')}
    const end=checkEnd();if(end==='win')return await victory();if(end==='lose'){gameOver();return'lose'}
    for(let i=0;i<4;i++){const p=G.party[i];if(alive(p)&&p.poison){const d=Math.max(1,p.mhp>>4);p.hp=Math.max(0,p.hp-d);pfloat(i,'-'+d,'dmg');log(`${p.n}は 毒で ${d} のダメージ`,'bad');if(!alive(p))log(`${p.n}は 倒れた…`,'dmg')}if(p.sleep>0)p.sleep--}
    B.groups.forEach(g=>g.list.forEach(e=>{if(e.sleep>0)e.sleep--}));B.def.clear();if(B.buff>0)B.buff--;drawParty();
    if(!G.party.some(alive)){gameOver();return'lose'}
    round++;
  }
}
const liveEnemies=()=>B.groups.flatMap(g=>g.list.filter(e=>e.hp>0).map(e=>({g,e})));
function checkEnd(){if(!liveEnemies().length)return'win';if(!G.party.some(alive))return'lose';return null}
async function pickGroup(title){
  const live=B.groups.map((g,i)=>({g,i})).filter(o=>o.g.list.some(e=>e.hp>0));
  if(live.length===1)return live[0].i;
  B.sel=live[0].i;const v=await menu(title,live.map(o=>({l:o.g.m.n,s:`×${o.g.list.filter(e=>e.hp>0).length}`,v:o.i})),{back:1});B.sel=-1;return v;
}
async function chooseAll(){
  const acts=[];let i=0;
  while(i<4){
    const p=G.party[i];if(!alive(p)||p.sleep){i++;continue}
    activeIdx=i;drawParty();
    const first=!acts.some(Boolean);
    const sps=Object.entries(SP).filter(([n,s])=>s.c===p.c&&s.lv<=p.lv&&s.b);
    const v=await menu(`${p.n}は どうする？`,[
      {l:'たたかう',v:'atk',dis:i>=2,s:i>=2?'後列からは届かない':''},{l:'呪文',v:'sp',dis:!sps.length},{l:'守る',v:'def',s:'受ける傷が半分'},
      {l:'道具',v:'it',dis:!G.bag.some(n=>!IT[n].campOnly)},first?{l:'逃げる',v:'run'}:null],{back:i>0&&acts.some(Boolean)});
    if(v==='__back'){do{i--}while(i>0&&!acts[i]);acts[i]=null;continue}
    if(v==='run'){activeIdx=-1;return'run'}
    let a=null;
    if(v==='atk'){const g=await pickGroup('どの敵を？');if(g==='__back')continue;a={k:'atk',p,g}}
    if(v==='def')a={k:'def',p};
    if(v==='sp'){const sn=await menu(`${p.n}の呪文　MP ${p.mp}`,sps.map(([n,s])=>({l:n,s:`MP${s.mp}　${s.d}`,v:n,dis:p.mp<s.mp})),{back:1});if(sn==='__back')continue;
      const s=SP[sn];let g=null,t=null;
      if(s.t==='one'||s.t==='grp'){g=await pickGroup('どの敵に？');if(g==='__back')continue}
      if(s.t==='ally'){t=await menu('誰に？',G.party.map((q,j)=>({l:q.n,s:`HP ${q.hp}/${q.mhp}${q.poison?' 毒':''}${q.sleep?' 眠り':''}`,v:j,dis:!alive(q)})),{back:1});if(t==='__back')continue}
      a={k:'sp',p,sn,s,g,t}}
    if(v==='it'){const usable=G.bag.map((n,j)=>({n,j})).filter(o=>!IT[o.n].campOnly&&!acts.some(a=>a&&a.k==='it'&&a.ii===o.j));
      const ii=await menu('どれを使う？',usable.map(o=>({l:o.n,s:IT[o.n].d,v:o.j})),{back:1});if(ii==='__back')continue;
      const it=IT[G.bag[ii]];const t=await menu('誰に？',G.party.map((q,j)=>({l:q.n,s:`HP ${q.hp}/${q.mhp}`,v:j,dis:it.t==='dead'?alive(q):!alive(q)})),{back:1});if(t==='__back')continue;
      a={k:'it',p,ii,name:G.bag[ii],t}}
    acts[i]=a;i++;
  }
  activeIdx=-1;drawParty();
  const its=acts.filter(a=>a&&a.k==='it').sort((a,b)=>b.ii-a.ii);for(const a of its)G.bag.splice(a.ii,1);
  return acts.filter(Boolean);
}
async function runRound(acts,only){
  cmdEl.innerHTML='<h3>　</h3><div class="dim" style="font-size:13px">……（画面かメッセージを押すと 早送り）</div>';curOpts=null;
  const order=[];
  acts.forEach(a=>{if(a.k==='def'){B.def.add(a.p);log(`${a.p.n}は 身を守っている。`,'dim')}else order.push({side:'p',a,sp:agi(a.p)+ri(0,8)})});
  if(only!=='p')B.groups.forEach((g,gi)=>g.list.forEach(e=>{if(e.hp>0)order.push({side:'e',g,gi,e,sp:g.m.agi+ri(0,8)})}));
  order.sort((a,b)=>b.sp-a.sp);
  for(const o of order){
    if(checkEnd())return;
    if(o.side==='p'){if(!alive(o.a.p)||o.a.p.sleep)continue;activeIdx=G.party.indexOf(o.a.p);drawParty();await doPlayer(o.a)}
    else{if(o.e.hp<=0||o.e.sleep>0)continue;await doEnemy(o.g,o.gi,o.e)}
    activeIdx=-1;drawParty();
  }
}
const liveIn=gi=>B.groups[gi].list.filter(e=>e.hp>0);
function retarget(gi){if(gi!=null&&gi>=0&&liveIn(gi).length)return gi;return B.groups.findIndex((g,j)=>liveIn(j).length)}
function hurtEnemy(gi,e,d,how,crit){
  const g=B.groups[gi];e.hp-=d;if(e.sleep&&how!=='fire'&&R()<.5)e.sleep=0;const now=performance.now();
  B.flash[gi]=now+260;fx('num',{x:groupX(gi)+ri(-14,14),y:110+ri(-6,6),text:String(d),c:crit?'#ffd54d':'#ffffff',big:crit,d:800});
  if(e.hp<=0){e.hp=0;G.kills++;log(`${g.m.n}を 倒した！`,'sys');if(!liveIn(gi).length)B.fade[gi]=now+550;sfx('die')}
}
async function doPlayer(a){
  const p=a.p;
  if(a.k==='atk'){
    const gi=retarget(a.g);if(gi<0)return;const g=B.groups[gi];const e=pick(liveIn(gi));
    const sleeping=e.sleep>0;const hit=sleeping||R()<.84+(agi(p)-g.m.agi)*.015;
    log(`${p.n}の こうげき！`);await wait(200);
    if(!hit){sfx('miss');fx('num',{x:groupX(gi),y:110,text:'MISS',c:'#9ab',d:700});log(`${g.m.n}は ひらりとかわした。`,'dim');await wait(360);return}
    let d=Math.max(1,atk(p)+ri(0,(atk(p)>>1)+2)-g.m.def);
    const crit=R()<(p.c==='盗賊'?.2:.06)||(sleeping&&R()<.5);if(crit)d=Math.floor(d*(sleeping?1.8:2));
    if(g.m.phys)d=Math.max(1,Math.floor(d*g.m.phys));
    sfx(crit?'crit':'hit');fx('slash',{x:groupX(gi),y:130,d:250});shake=crit?8:3;
    log(`${crit?'<span class="sys">会心の一撃！</span> ':''}${g.m.n}に <span class="dmg">${d}</span> のダメージ${g.m.phys?'（刃が すり抜ける…）':''}`);
    hurtEnemy(gi,e,d,'',crit);await wait(400);return;
  }
  if(a.k==='sp'){
    const s=a.s;if(p.mp<s.mp){log(`${p.n}は MPが 足りない！`,'dim');return}p.mp-=s.mp;drawParty();
    log(`${p.n}は <span class="sys">${a.sn}</span> を唱えた！`);await wait(240);
    if(s.pow){sfx('fire');const targets=s.t==='all'?B.groups.map((g,i)=>i):[retarget(a.g)];
      for(const gi of targets){if(gi<0||!liveIn(gi).length)continue;fx('fire',{x:groupX(gi),y:150,d:750});
        const es=s.t==='one'?[pick(liveIn(gi))]:liveIn(gi);let tot=0;
        for(const e of es){const d=ri(s.pow[0],s.pow[1])+p.lv;tot+=d;hurtEnemy(gi,e,d,'fire')}log(`${B.groups[gi].m.n}に 合わせて <span class="dmg">${tot}</span>`)}
      await wait(480);return}
    if(s.sleep){sfx('sleep');const gi=retarget(a.g);if(gi<0)return;const g=B.groups[gi];fx('sleep',{x:groupX(gi),y:110,d:900});let n=0;
      for(const e of liveIn(gi))if(!g.m.boss&&g.m.sp!=='ghost'&&g.m.sp!=='skel'&&R()<.75){e.sleep=ri(2,3);n++}
      log(n?`${g.m.n} ${n}体が 眠りに落ちた。`:`${g.m.n}には 効かなかった！`,n?'':'dim');await wait(450);return}
    if(s.heal||s.cure){const t=G.party[a.t];if(!alive(t)){log('しかし 手遅れだった…','dim');return}
      if(s.heal){const h=Math.min(t.mhp-t.hp,ri(s.heal[0],s.heal[1]));t.hp+=h;drawParty();pfloat(a.t,'+'+h,'heal');log(`${t.n}の HPが <span class="heal">${h}</span> 回復。`)}
      if(s.cure&&(t.poison||t.sleep)){t.poison=0;t.sleep=0;log(`${t.n}は 正気に戻った。`,'heal')}
      sfx('heal');fx('heal',{d:800});await wait(400);return}
    if(s.buff){B.buff=3;sfx('magic');fx('shield',{d:700});log('光の壁が 仲間を包んだ。','sys');await wait(400);return}
    if(s.light){G.light=Math.max(G.light,s.light);sfx('magic');log('光が 広がった。','sys');await wait(300);return}
  }
  if(a.k==='it'){const it=IT[a.name],t=G.party[a.t];log(`${p.n}は ${a.name} を使った。`);await wait(240);
    if(it.revive){if(alive(t)){log('しかし 何も起きなかった。','dim');if(G.bag.length<BAGMAX)G.bag.push(a.name)}else{t.hp=Math.ceil(t.mhp/2);sfx('heal');fx('white');drawParty();pfloat(a.t,'復活','heal');log(`${t.n}が 蘇った！`,'heal')}}
    else if(!alive(t))log('しかし 手遅れだった…','dim');
    else{if(it.heal){const h=Math.min(t.mhp-t.hp,ri(it.heal[0],it.heal[1]));t.hp+=h;drawParty();pfloat(a.t,'+'+h,'heal');log(`${t.n}の HPが <span class="heal">${h}</span> 回復。`)}if(it.cure){t.poison=0;log(`${t.n}の 毒が消えた。`,'heal')}sfx('heal');fx('heal',{d:700})}
    await wait(380)}
}
function pickTarget(){const al=G.party.map((p,i)=>({p,i})).filter(o=>alive(o.p));const w=al.map(o=>o.i<2?3:1);let r=R()*w.reduce((a,b)=>a+b,0);for(let k=0;k<al.length;k++){r-=w[k];if(r<=0)return al[k].p}return al[al.length-1].p}
function damageParty(p,d){
  if(B&&B.def.has(p))d=Math.ceil(d/2);if(B&&B.buff)d=Math.max(0,d-4);
  d=Math.min(d,p.hp);p.hp-=d;if(p.sleep&&R()<.6)p.sleep=0;const i=G.party.indexOf(p);
  log(`${p.n}は <span class="dmg">${d}</span> のダメージ！`);
  if(!alive(p)){p.poison=0;p.sleep=0;log(`<span class="dmg">${p.n}は 倒れた…</span>`);sfx('die')}
  drawParty();pfloat(i,'-'+d,'dmg');return d;
}
async function doEnemy(g,gi,e){
  const m=g.m;if(!G.party.some(alive))return;const now=()=>performance.now();
  if(m.boss){
    if(B.charge){B.charge=false;log(`<span class="bad">${m.n}の 「深淵の業火」！</span>`);sfx('fire');fx('dark',{d:900});fx('red',{d:700});shake=14;B.lunge[gi]=now()+240;await wait(350);
      for(const p of G.party.filter(alive))damageParty(p,ri(22,34));await wait(650);return}
    if(R()<.33){B.charge=true;sfx('charge');log(`<span class="bad">${m.n}は 杖を 高く掲げた！ 闇が 集まっていく…</span>`);await wait(650);return}
    for(let i=0;i<2;i++){if(!G.party.some(alive))return;const p=pickTarget();B.lunge[gi]=now()+240;log(`${m.n}の 杖が 振り下ろされる！`);sfx('hurt');fx('red',{d:250});shake=7;await wait(200);damageParty(p,Math.max(1,m.atk+ri(0,8)-def(p)));await wait(320)}
    return}
  if(m.spell&&R()<.35){B.lunge[gi]=now()+240;log(`${m.n}は 呪文を唱えた！`,'bad');sfx('fire');fx('red',{d:500});await wait(300);for(const p of G.party.filter(alive))damageParty(p,ri(4,9)+G.floor);await wait(420);return}
  if(m.gaze&&R()<.3){const p=pickTarget();B.lunge[gi]=now()+240;log(`${m.n}の 眠りの視線！`,'bad');sfx('sleep');await wait(300);
    if(R()<.65){p.sleep=2;log(`${p.n}は 眠ってしまった…`,'bad')}else log(`${p.n}は 目をそらした！`,'dim');drawParty();await wait(380);return}
  const p=pickTarget();B.lunge[gi]=now()+240;log(`${m.n}の こうげき！`);await wait(170);
  if(!p.sleep&&R()>.78-(agi(p)-m.agi)*.012){sfx('miss');log(`${p.n}は かわした。`,'dim');await wait(300);return}
  sfx('hurt');fx('red',{d:260});shake=5;
  const d=damageParty(p,Math.max(1,m.atk+ri(0,m.atk>>1)-def(p)));
  if(m.poison&&alive(p)&&R()<.35){p.poison=1;log(`${p.n}は 毒に冒された！`,'bad');drawParty()}
  if(m.drain)e.hp+=d>>1;
  await wait(340);
}
async function victory(){
  const xp=B.groups.reduce((s,g)=>s+g.m.xp*g.list.length,0),gold=B.groups.reduce((s,g)=>s+g.m.g*g.list.length,0)+ri(0,G.floor*4);
  const boss=B.boss,mon=B.mon;if(mon)mon.alive=0;
  playMusic('win');await wait(250);
  if(boss){
    G.amulet=1;log('<span class="sys">深淵の王は 黒い塵となって 崩れ落ちた。</span>');await wait(1000);
    log('玉座に 「暁のアミュレット」が 残されている。 手に取ると、温かい。','sys');await wait(1000);
    log('地上へ 帰ろう。','sys');B=null;await wait(1600);dungeonIdle();return'win';
  }
  const live=G.party.filter(alive);live.forEach(p=>p.xp+=xp);G.gold+=gold;
  log(`戦いに勝った！ 経験値 <span class="sys">${xp}</span>・<span class="sys">${gold}G</span>`);
  if(live.some(p=>p.xp>=nextXp(p.lv)))log('（宿屋で休むと 成長できそうだ ★）','dim');
  drawParty();B=null;await wait(900);
  if(R()<.45)return await chest();
  dungeonIdle();return'win';
}
// ---- 宝箱 ----
const TRAPS=['なし','毒針','石つぶて','ガス爆弾','警報'];
async function chest(){
  mode='chest';const fl=G.floor;
  const trap=R()<.3+fl*.08?pick(fl>=2?['毒針','石つぶて','ガス爆弾','警報']:['毒針','石つぶて']):'なし';
  log('敵が 宝箱を 残していった。');
  while(true){
    const v=await menu('宝箱',[{l:'開ける',v:'open'},{l:'調べる',s:'罠を見抜く',v:'insp'},{l:'罠を外す',s:'罠の名を言い当てて',v:'dis'},{l:'立ち去る',v:'leave'}]);
    if(v==='leave'){log('宝箱を 置いていった。','dim');dungeonIdle();return'win'}
    if(v==='insp'){const ci=await menu('誰が調べる？',G.party.map((p,i)=>({l:p.n,s:p.c,v:i,dis:!alive(p)})),{back:1});if(ci==='__back')continue;const p=G.party[ci];
      const ok=R()<(p.c==='盗賊'?.82+p.lv*.03:.35);const g=ok?trap:pick(TRAPS.filter(t=>t!==trap));
      log(`${p.n}「……${g==='なし'?'罠は 無さそうだ':g+' だと思う'}」`);continue}
    if(v==='dis'){const ci=await menu('誰が外す？',G.party.map((p,i)=>({l:p.n,s:p.c,v:i,dis:!alive(p)})),{back:1});if(ci==='__back')continue;const p=G.party[ci];
      const nmv=await menu('罠の名は？',TRAPS.filter(t=>t!=='なし').map(t=>({l:t,v:t})),{back:1});if(nmv==='__back')continue;
      if(nmv===trap&&R()<(p.c==='盗賊'?.78+p.lv*.03:.4)){sfx('sel');log(`${p.n}は 罠を 外した！`,'sys');return loot(null)}
      if(trap==='なし'){log('罠は 無かったようだ。');return loot(null)}
      log(`${p.n}「しまった…！」`,'dmg');return loot(trap,p)}
    if(v==='open')return loot(trap,G.party.find(alive));
  }
}
async function loot(trap,p){
  if(trap&&trap!=='なし'){sfx('trap');shake=8;fx('red');await wait(200);
    if(trap==='毒針'){p.poison=1;const d=Math.min(p.hp,ri(1,4));p.hp-=d;drawParty();pfloat(G.party.indexOf(p),'-'+d,'dmg');log(`毒針が ${p.n}に 刺さった！`,'bad')}
    if(trap==='石つぶて'){log('石つぶてが 飛び散った！','dmg');const ds=G.party.map(q=>alive(q)?Math.min(q.hp,ri(2,5)+G.floor*2):0);G.party.forEach((q,i)=>q.hp-=ds[i]);drawParty();ds.forEach((d,i)=>d&&pfloat(i,'-'+d,'dmg'))}
    if(trap==='ガス爆弾'){log('毒のガスが 噴き出した！','bad');for(const q of G.party.filter(alive))if(R()<.6)q.poison=1}
    drawParty();await wait(500);if(!G.party.some(alive)){gameOver();return'lose'}
  }
  const g=ri(10,24)*G.floor+ri(0,10);G.gold+=g;sfx('coin');log(`宝箱の中に <span class="sys">${g}G</span>。`);
  if(R()<.45){const it=pick(['傷薬','傷薬','毒消し','たいまつ','帰還の巻物','霊薬']);if(G.bag.length<BAGMAX){G.bag.push(it);log(`${it} を 見つけた！`,'sys')}else log(`${it} があったが 袋がいっぱいだ。`,'dim')}
  drawParty();
  if(trap==='警報'){log('けたたましい音が 響き渡る！ 何かが 来る！','dmg');await wait(700);return'alarm'}
  dungeonIdle();return'win';
}
async function gameOver(){
  mode='dead';busy=true;B=null;$('#pad').classList.add('hide');drawParty();sfx('die');fx('red',{d:2000});playMusic('lose');
  log('<span class="dmg">パーティは 全滅した……</span>');await wait(1300);
  let has=false;try{has=!!localStorage.getItem('abyss_save')}catch(e){}
  const v=await menu('闇が すべてを 呑みこんだ。',[{l:'最後の記録から',v:'load',dis:!has},{l:'はじめから',v:'new'}]);
  clearLog();
  if(v==='load'&&load())log('……気がつくと、宿屋の寝台の上だった。','sys');
  else{newGame();log('新たな冒険者たちが 町に着いた。','sys')}
  goTown();
}
async function ending(){
  mode='end';$('#pad').classList.add('hide');clearLog();playMusic('ending');drawParty();
  const lines=['暁のアミュレットが 掲げられると、','迷宮の塔から 赤い光が 消えた。','','城塞都市リルガに 久しぶりの 朝が来る。',`倒した魔物 ${G.kills}体　歩いた距離 ${G.steps}歩`,'','── 深淵の迷宮　完 ──'];
  for(const l of lines){log(l||'　','sys');await wait(1000)}
  await menu('ありがとう！',[{l:'もう一度 はじめから',v:1}]);
  try{localStorage.removeItem('abyss_save')}catch(e){}newGame();clearLog();await partySetup();goTown();
}

// ================= 入力 =================
addEventListener('keydown',e=>{
  if(mode==='title')return;
  if(e.target&&e.target.tagName==='INPUT')return;
  audioInit();
  if($('#overlay').classList.contains('on')){if(!ovModal&&(e.key==='Escape'||e.key==='m'||e.key==='M'||e.key==='Enter'||e.key===' '))closeOverlay();return}
  if(skipWait&&(e.key===' '||e.key==='Enter')){skipWait();e.preventDefault();return}
  if(curOpts&&/^[1-9]$/.test(e.key)){const o=curOpts[+e.key-1];if(o&&!o.dis){o.go();e.preventDefault();return}}
  if(curOpts&&curOpts.back&&(e.key==='Escape'||e.key==='Backspace'||((e.key==='c'||e.key==='C')&&curOpts.title==='キャンプ'))){curOpts.back();return}
  const k={ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d',w:'w',s:'s',a:'a',d:'d',q:'q',e:'e',W:'w',S:'s',A:'a',D:'d',Q:'q',E:'e'}[e.key];
  if(k&&mode==='dungeon'){e.preventDefault();inputMove(k);return}
  if(mode==='dungeon'&&!busy&&!act){
    if(e.key==='m'||e.key==='M')showMap();
    else if(e.key==='c'||e.key==='C'){curTag=null;camp()}
    else if(e.key===' '){e.preventDefault();curTag=null;waitTurn()}}
});
// ボタン長押しで歩き続ける
document.querySelectorAll('#pad button').forEach(b=>{let iv=null;const stop=()=>{if(iv){clearInterval(iv);iv=null}};
  b.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();inputMove(b.dataset.k);stop();iv=setInterval(()=>inputMove(b.dataset.k),230)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop))});
let sw=null;cv.addEventListener('pointerdown',e=>{sw=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw[0],dy=e.clientY-sw[1];sw=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30){skipWait&&skipWait();return}
  if(Math.abs(dx)>Math.abs(dy))inputMove(dx<0?'d':'a');else inputMove(dy<0?'w':'s')});

// ================= タイトル =================
const tcv=$('#tcv'),tctx=tcv.getContext('2d');
function titleSetup(){newGame();G.floor=1;G.light=999;let best=-1;
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)for(let f=0;f<4;f++){if(solid(tile(x,y)))continue;let k=0;while(!solid(tile(x+DX[f]*(k+1),y+DY[f]*(k+1)))&&k<9)k++;if(k>best){best=k;G.x=x;G.y=y;G.f=f}}
  cam=camTarget()}
function titleStep(){
  if(act)return;const M=getMap(1),f=G.f;const nx=G.x+DX[f],ny=G.y+DY[f];
  if(!solid(tile(nx,ny))&&R()<.9){if(tile(nx,ny)===2)M.door[ny*N+nx]=M.dt[ny*N+nx]=1;G.x=nx;G.y=ny;anim('move',1300,{x:nx+.5,y:ny+.5,a:cam.a},{lin:1})}
  else{const opts=[1,3].filter(s=>!solid(tile(G.x+DX[(f+s)%4],G.y+DY[(f+s)%4])));const s=opts.length?pick(opts):1;G.f=(f+s)%4;anim('turn',1200,{x:cam.x,y:cam.y,a:cam.a+(s===1?1:-1)*Math.PI/2})}
}
function partySetup(){return new Promise(res=>{
  overlay(`<h3>冒険者たちの名前</h3><div class="dim" style="font-size:13px;margin-bottom:6px">好きな名前に変えられます（そのままでも大丈夫）</div>`+G.party.map((p,i)=>`<label class="nm"><span>${p.c}</span><input maxlength="6" value="${p.n}" data-i="${i}"></label>`).join('')+
    `<button id="goBtn" style="width:100%;text-align:center;margin-top:10px">この4人で 町へ</button>`,true);
  $('#goBtn').onclick=()=>{document.querySelectorAll('#ovbox input').forEach(inp=>{const v=esc(inp.value.trim()).slice(0,6);if(v)G.party[+inp.dataset.i].n=v});sfx('sel');closeOverlay();res()};
})}
async function start(cont){
  audioInit();mode='boot';$('#title').style.display='none';act=null;
  if(!(cont&&load())){newGame();await partySetup()}
  clearLog();
  if(!cont){log('城塞都市リルガ。 町はずれの塔の下に、底の知れない迷宮が 口を開けている。');log('最深部に棲む「深淵の王」を倒し、暁のアミュレットを 持ち帰れ。','sys')}
  else log('冒険の記録を 読みこんだ。','sys');
  goTown();
}
buildTextures();titleSetup();setMute(muted);
try{$('#bCont').disabled=!localStorage.getItem('abyss_save')}catch(e){$('#bCont').disabled=true}
$('#bNew').onclick=()=>start(false);$('#bCont').onclick=()=>start(true);
$('#title').addEventListener('pointerdown',()=>{audioInit();playMusic('title')},{once:true});
requestAnimationFrame(frame);
// テスト用の窓口
window.__abyss={get G(){return G},get mode(){return mode},get busy(){return busy},get B(){return B},get act(){return act},
  setSpeed(s){SPEED=s},inputMove,getMap,tile,enterFloor,battle,
  menuState(){return curOpts?{title:curOpts.title,opts:curOpts.map(o=>({l:o.l,dis:!!o.dis})),back:!!curOpts.back}:null},
  choose(i){const o=curOpts&&curOpts[i];if(o&&!o.dis){o.go();return true}return false},back(){if(curOpts&&curOpts.back){curOpts.back();return true}return false}};
