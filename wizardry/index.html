<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>深淵の迷宮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--fg:#ececec;--dim:#8d8d8d;--line:#e2e2e2;--hp:#62d862;--hpl:#e6c445;--hpd:#e65050;--mp:#62adff;--gold:#ffd54d;--sel:#1f34d6;--bad:#c46cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--fg);font-family:'DotGothic16',ui-monospace,monospace;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{display:grid;max-width:1000px;height:100%;margin:0 auto;padding:10px;gap:10px;
  grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"view side" "msg side" "pad side"}
.win{border:3px double var(--line);background:#000;padding:8px 10px;position:relative}
#viewWrap{grid-area:view;position:relative;border:3px double var(--line);line-height:0;overflow:hidden}
#view{width:100%;aspect-ratio:4/3;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#mini{position:absolute;right:6px;top:6px;width:84px;height:84px;image-rendering:pixelated;border:1px solid #aaa;background:rgba(0,0,0,.6)}
#hud{position:absolute;left:8px;top:6px;line-height:1.3;font-size:13px;text-shadow:0 0 3px #000,0 0 3px #000}
#hud .light{color:#ffcf6b}
#msg{grid-area:msg;overflow:hidden;font-size:15px;line-height:1.55;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
#msg div{opacity:.55}#msg div:last-child,#msg div.new{opacity:1}
#side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-height:0}
#party{font-size:14px;padding:6px 8px}
.pm{display:grid;grid-template-columns:5.2em 3.6em 2.6em 1fr;align-items:center;gap:4px;padding:4px 4px;border-bottom:1px dashed #333}
.pm:last-child{border-bottom:none}
.pm.act{background:var(--sel)}
.pm.dead{color:#777}
.pm .st{font-size:12px}
.bar{height:5px;background:#222;margin-top:2px}.bar i{display:block;height:100%}
.nums{font-size:12px;color:#ddd;white-space:nowrap}
.mpn{color:var(--mp)}
#gold{font-size:13px;color:var(--gold);text-align:right;padding-top:4px}
#cmd{flex:1;min-height:150px;overflow:auto}
#cmd h3{margin:0 0 6px;font-weight:normal;font-size:14px;color:var(--dim)}
#cmd .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#cmd .opts.one{grid-template-columns:1fr}
button{font-family:inherit;font-size:15px;color:var(--fg);background:#000;border:1px solid #bbb;padding:8px 6px;text-align:left;cursor:pointer;line-height:1.25}
button:hover:not(:disabled),button:focus-visible{background:var(--sel);outline:none}
button:disabled{color:#555;border-color:#444;cursor:default}
button small{color:var(--dim);font-size:11px;display:block}
button .k{color:var(--gold);margin-right:4px}
#pad{grid-area:pad;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#pad button{text-align:center;font-size:20px;padding:10px 0}
#pad.hide{visibility:hidden}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
#overlay.on{display:flex}
#ovbox{max-width:560px;width:100%;max-height:100%;overflow:auto}
#mapc{width:100%;image-rendering:pixelated;display:block;background:#000}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
#title canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:.8}
#title .t{position:relative;text-align:center}
#title h1{font-weight:normal;font-size:clamp(40px,10vw,84px);margin:0;letter-spacing:.12em;color:#f3e7c9;text-shadow:0 0 18px #ff7a2a,0 0 40px #6b1500}
#title p{color:#bbb;margin:6px 0 26px;letter-spacing:.3em}
#title button{display:block;margin:10px auto;min-width:220px;text-align:center;font-size:18px;background:rgba(0,0,0,.6)}
.dmg{color:#ff8080}.heal{color:#8dff8d}.sys{color:var(--gold)}.bad{color:var(--bad)}.dim{color:var(--dim)}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;grid-template-areas:"view" "pad" "msg" "side";height:auto;min-height:100%;padding:6px;gap:6px}
  html,body{overflow:auto}
  #msg{min-height:84px;font-size:14px}
  #cmd{min-height:0}
  .pm{grid-template-columns:4.8em 3.4em 2.4em 1fr;font-size:13px;padding:3px 2px}
}
</style>
</head>

<script>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let AC=null,master=null,drone=null;
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);startDrone()}catch(e){AC=null}
}
function tone(f,d,type='square',v=.12,slide=0,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)
}
function noise(d,v=.15,hp=400,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;const len=Math.max(1,AC.sampleRate*d|0);const b=AC.createBuffer(1,len,AC.sampleRate);const c=b.getChannelData(0);
  for(let i=0;i<len;i++)c[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=hp;const g=AC.createGain();g.gain.value=v;
  s.connect(f);f.connect(g);g.connect(master);s.start(t)
}
function startDrone(){
  const g=AC.createGain();g.gain.value=.025;g.connect(master);
  [55,82.4,110.3].forEach((f,i)=>{const o=AC.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=f;const l=AC.createOscillator();l.frequency.value=.07+i*.05;const lg=AC.createGain();lg.gain.value=1.4;l.connect(lg);lg.connect(o.frequency);o.connect(g);o.start();l.start()});
  drone=g
}
const SFX={

  bump(){tone(70,.18,'sine',.3,-30);noise(.1,.2,180)},
  door(){tone(120,.25,'sawtooth',.06,-60);noise(.25,.1,600)},
  turn(){noise(.05,.06,900)},
  enc(){tone(110,.5,'sawtooth',.1);tone(117,.5,'sawtooth',.1);tone(220,.15,'square',.08,0,.0);tone(208,.4,'square',.08,0,.15)},
  hit(){noise(.12,.35,1800);tone(160,.08,'square',.08,-80)},
  crit(){noise(.18,.4,3000);tone(300,.15,'square',.1,-200)},

// ============ データ ============
const THEME=[null,

const IT={

// ---- 魔物の絵（16x16） ----
const SPR={
slime:["................","................","................","................","......1111......","....11222211....","...1122111111...","..112111111111..","..111441144111..","..111441144111..",".11111111111111.",".11111333311111.",".11111111111111.","..333333333333..","................","................"],
rat:["................","..111......111..",".15551....15551.",".15551111115551.","..111111111111..","..114111111411..","..114111111411..","..111111111111..","...1111331111...","3..1111331111..3","33..11111111..33","..3..111111..3..","....11111111....","...1111111111...","..111.1111.111..","..11...11...11.."],
bat:["................","................","................","3..............3","33............33","333...1..1...333","3333..1111..3333","3333314114133333","3333311111133333",".333.111111.333.","..3...1551...3..","......1111......",".......11.......","................","................","................"],
hum:["......1111......",".....111111.....","....11411411....","....11111111....","....11133111....",".....111111.....","...2222222222...","..122222222221..","..122222222221..","..1.22222222.1..","..5.22233222.1..","..5..222222..1..","..5..22..22.....","..5..33..33.....",".....33..33.....","....333..333...."],
skel:[".....111111.....","....11111111....","....13311331....","....11111111....",".....131131.....","......1111......","...1.111111.1...","..1..1.11.1..1..","..1..111111..1..","..5..1.11.1..5..",".....111111.....","......1111......",".....11..11.....",".....1....1.....","....11....11....","................"],
ghost:["................",".....111111.....","...1111111111...","..111111111111..","..113311113311..","..113311113311..","..111111111111..","..111113311111..","..111133331111..","..111111111111..","..111111111111..","..112111111211..","..12.121121.21..","..2..2.22.2..2..","................","................"],

  slime:{n:'スライム',sp:'slime',pal:{1:'#4cc24c',2:'#b6ffb0',3:'#1e5a24',4:'#101010'},hp:6,atk:3,def:0,agi:3,xp:6,g:3,fl:[1,2],max:5},
  rat:{n:'オオネズミ',sp:'rat',pal:{1:'#8a6a4a',3:'#d8a0a0',4:'#ff3030',5:'#e8a0a8'},hp:5,atk:4,def:0,agi:10,xp:5,g:2,fl:[1,2],max:5},

  orc:{n:'オーク',sp:'hum',pal:{1:'#5e8a5a',2:'#5a5a66',3:'#2a2420',4:'#ff4a2a',5:'#d8d8e0'},hp:24,atk:9,def:3,agi:6,xp:24,g:16,fl:[3,4],max:3},

// ============ 状態 ============
let G=null, MAPS={}, B=null;
let mode='title', busy=false;
function newGame(){
  G={seed:(Math.random()*1e9)|0,floor:0,x:0,y:0,f:1,gold:120,bag:['傷薬','傷薬','たいまつ'],taken:{},seen:{},pits:{},light:0,amulet:0,steps:0,since:0,kills:0,
    party:[mk('アルス','戦士'),mk('ミリ','盗賊'),mk('セラ','僧侶'),mk('ゼノ','魔法使い')]};
}
function mk(n,c){const k=CLS[c];return{n,c,lv:1,xp:0,hp:k.hp,mhp:k.hp,mp:k.mp,mmp:k.mp,batk:k.atk,bdef:k.def,bagi:k.agi,w:0,a:0,poison:0,sleep:0}}
const alive=p=>p.hp>0;
const atk=p=>p.batk+p.w*3+p.lv;
const def=p=>p.bdef+p.a*2+(p.lv>>1);
const agi=p=>p.bagi+(p.lv>>1);
const nextXp=lv=>Math.floor(28*Math.pow(lv,1.8));
function save(){try{localStorage.setItem('abyss_save',JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem('abyss_save');if(s){G=JSON.parse(s);MAPS={};return true}}catch(e){}return false}

// ============ 迷宮生成 ============
// 0床 1壁 2扉 3下り 4上り 5宝 6泉 7落とし穴 8回転床 9玉座 10石碑
function getMap(fl){
  if(MAPS[fl])return MAPS[fl];
  const rnd=mulberry(G.seed+fl*7919);const rr=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const m=Array.from({length:N},()=>Array(N).fill(1));
  const st=[[1,1]];m[1][1]=0;
  while(st.length){const[x,y]=st[st.length-1];
    const ds=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<N-1&&ny<N-1&&m[ny][nx]===1});
    if(!ds.length){st.pop();continue}
    const[dx,dy]=ds[Math.floor(rnd()*ds.length)];m[y+dy/2][x+dx/2]=0;m[y+dy][x+dx]=0;st.push([x+dx,y+dy])}

  for(const s of stars){ctx.fillStyle=`rgba(255,255,230,${.4+.4*Math.sin(now/600+s[2])})`;ctx.fillRect(s[0]|0,s[1]|0,1,1)}
  ctx.fillStyle='#f4ecc8';ctx.beginPath();ctx.arc(250,46,16,0,7);ctx.fill();ctx.fillStyle='#05061a';ctx.beginPath();ctx.arc(244,42,15,0,7);ctx.fill();
  // 遠くの塔（迷宮）
  ctx.fillStyle='#0b0a14';ctx.fillRect(140,60,40,130);poly([[134,60],[186,60],[160,22]],'#0b0a14');
  const p=.6+.4*Math.sin(now/300);ctx.fillStyle=`rgba(255,60,60,${p})`;ctx.fillRect(157,74,6,8);
  const gl=ctx.createRadialGradient(160,190,2,160,190,40);gl.addColorStop(0,`rgba(255,120,40,${.5*p})`);gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(110,150,100,60);
  const bld=[[0,130,60,110,1],[50,150,46,90,0],[92,140,40,100,1],[196,135,50,105,0],[240,120,44,120,1],[280,150,40,90,0]];
  for(const[b,y,w,h,r]of bld){ctx.fillStyle='#120f1c';ctx.fillRect(b,y,w,h);if(r)poly([[b-4,y],[b+w+4,y],[b+w/2,y-24]],'#120f1c');else poly([[b-3,y],[b+w+3,y],[b+w+3,y-6],[b-3,y-6]],'#120f1c');
    for(let wy=y+12;wy<y+h-20;wy+=18)for(let wx=b+8;wx<b+w-8;wx+=14){const on=hash(wx,wy,3)>.35;ctx.fillStyle=on?`rgba(255,${190+(Math.sin(now/700+wx)*20|0)},90,.9)`:'#1e1a2a';ctx.fillRect(wx,wy,5,7)}}
  ctx.fillStyle='#0a0810';ctx.fillRect(0,200,W,40);
}
let mini=$('#mini'),mctx=mini.getContext('2d');
function renderMini(){
  mctx.clearRect(0,0,63,63);if(mode!=='dungeon'&&mode!=='battle'&&mode!=='chest')return;const s=G.seen[G.floor]||[];
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=G.x+dx,y=G.y+dy;if(x<0||y<0||x>=N||y>=N)continue;if(!s[y*N+x])continue;const t=tile(x,y);
    mctx.fillStyle=t===1?'#777':t===2?'#a8703c':t===3?'#e04848':t===4?'#ffd54d':t===9&&!G.amulet?'#ff3a6a':(t===5&&!G.taken[key(x,y)])?'#e8b030':t===6?'#58a8ff':t===10?'#bbb':(t===7&&G.pits[key(x,y)])?'#a050ff':'#1c1c22';
    mctx.fillRect((dx+3)*9,(dy+3)*9,9,9)}
  mctx.fillStyle='#fff';mctx.save();mctx.translate(31.5,31.5);mctx.rotate(G.f*Math.PI/2);mctx.beginPath();mctx.moveTo(0,-4);mctx.lineTo(3.5,3.5);mctx.lineTo(-3.5,3.5);mctx.fill();mctx.restore();
}
function frame(now){
  flick=.9+.06*Math.sin(now/83)+.04*Math.sin(now/37+1);
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.3)shake=0}
  if(mode==='town'||(mode==='end'))renderTown(now);
  else if(G&&G.floor>0){renderDungeon(now);if(mode==='battle'&&B)renderBattle(now)}
  else{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  renderFX(now);if(G)vignette();ctx.restore();
  renderMini();
  requestAnimationFrame(frame);
}

async function town(){
  mode='town';G.floor=0;$('#pad').classList.add('hide');drawParty();save();
  if(G.amulet){await ending();return}
  while(mode==='town'){
    drawParty();
    const innCost=G.party.filter(alive).reduce((s,p)=>s+p.lv*6,0);
    const v=await menu('城塞都市リルガ',[
      {l:'宿屋',s:`休んで回復・成長 ${innCost}G`,v:'inn'},
      {l:'鍛冶屋',s:'武器と鎧を鍛える',v:'smith'},
      {l:'道具屋',s:'薬や巻物',v:'shop'},
      {l:'寺院',s:'蘇生・毒の治療',v:'temple'},
      {l:'仲間の様子',v:'status'},
      {l:'迷宮へ向かう',s:'深淵の口へ',v:'go'}]);
    if(v==='inn'){
      if(G.gold<innCost){log('お金が 足りない…','dmg');continue}
      G.gold-=innCost;sfx('heal');log('宿屋で ぐっすり眠った。','heal');
      for(const p of G.party){if(!alive(p))continue;p.hp=p.mhp;p.mp=p.mmp;p.poison=0;p.sleep=0;
        while(p.xp>=nextXp(p.lv)){await levelUp(p)}}
      drawParty();save();log('冒険の記録を つけた。','sys');
    }
    else if(v==='smith')await smith();
    else if(v==='shop')await shop();
    else if(v==='temple')await temple();
    else if(v==='status')await statusView();
    else if(v==='go'){
      if(!G.party.some(alive)){log('動ける仲間が いない。','dmg');continue}
      enterFloor(1,'up');log('冷たい風が 吹き上げてくる。 深淵の迷宮 B1。');sfx('stairs');return dungeonIdle();
    }
  }
}
async function levelUp(p){
  const k=CLS[p.c];p.lv++;const hg=ri(k.hpg[0],k.hpg[1]);p.mhp+=hg;p.hp=p.mhp;
  p.batk+=p.c==='戦士'?2:1;if(p.c==='戦士'||p.lv%2)p.bdef++;if(p.c==='盗賊')p.bagi++;
  if(k.mpg){p.mmp+=k.mpg+(p.lv%3===0?1:0);p.mp=p.mmp}
  sfx('lvl');log(`<span class="sys">${p.n}は レベル${p.lv}になった！</span> 最大HP+${hg}`);
  const learned=Object.entries(SP).filter(([n,s])=>s.c===p.c&&s.lv===p.lv).map(([n])=>n);
  if(learned.length)log(`${p.n}は ${learned.join('・')} を覚えた！`,'sys');
  drawParty();await wait(600);
}

}
async function shop(){

// ============ 迷宮 ============
function enterFloor(fl,via){
  G.floor=fl;const M=getMap(fl);const p=via==='up'?M.up:M.down;G.x=p[0];G.y=p[1];
  for(let k=0;k<4;k++){const t=tile(G.x+DX[k],G.y+DY[k]);if(!solid(t)){G.f=k;break}}
  mode='dungeon';$('#pad').classList.remove('hide');markSeen();drawParty();G.since=0;
}
function dungeonIdle(){
  mode='dungeon';busy=false;activeIdx=-1;drawParty();$('#pad').classList.remove('hide');
  menu(`${THEME[G.floor].n}`,[{l:'キャンプ',s:'呪文・道具・様子',v:'camp'},{l:'地図',s:'歩いた所を見る',v:'map'}]).then(v=>{
    if(mode!=='dungeon'||busy)return;if(v==='camp')camp();else if(v==='map'){showMap();dungeonIdle()}});
}
async function tryMove(kind){
  if(busy||mode!=='dungeon'||anim)return;
  if(kind==='a'||kind==='d'){G.f=(G.f+(kind==='d'?1:3))%4;sfx('turn');markSeen();drawParty();return}
  const dir=kind==='w'?G.f:kind==='s'?(G.f+2)%4:kind==='q'?(G.f+3)%4:(G.f+1)%4;
  const nx=G.x+DX[dir],ny=G.y+DY[dir],t=tile(nx,ny);
  if(t===1){sfx('bump');shake=4;return}
  if(t===2)sfx('door');else sfx('step');
  G.x=nx;G.y=ny;anim={type:kind==='w'?'f':kind==='s'?'b':kind==='q'?'l':'r',t0:performance.now(),dur:150};
  markSeen();G.steps++;G.since++;
  if(G.light>0){G.light--;if(G.light===0)log('明かりが 消えた。 闇が 濃くなる…','dim')}
  if(G.steps%4===0)for(const p of G.party)if(alive(p)&&p.poison){p.hp=Math.max(1,p.hp-1)}
  drawParty();
  busy=true;await wait(150);busy=false;
  await onEnter(nx,ny,t);
}
async function onEnter(x,y,t){
  const k=key(x,y);
  if(t===3){busy=true;const v=await menu('下へ続く 階段がある。',[{l:'下りる',v:1},{l:'やめる',v:0}]);
    if(v){sfx('stairs');enterFloor(G.floor+1,'up');log(`さらに 深く… <span class="sys">${THEME[G.floor].n}</span>`);}
    return dungeonIdle()}
  if(t===4){busy=true;const v=await menu(G.floor===1?'地上の光が 差している。':'上へ続く はしごがある。',[{l:G.floor===1?'町へ戻る':'上る',v:1},{l:'やめる',v:0}]);
    if(v){sfx('stairs');if(G.floor===1){log('地上に 戻ってきた。','sys');return town()}enterFloor(G.floor-1,'down');log(`${THEME[G.floor].n} に戻った。`)}
    return dungeonIdle()}
  if(t===5&&!G.taken[k]){busy=true;G.taken[k]=1;sfx('coin');const g=ri(25,45)*G.floor;G.gold+=g;log(`古い宝箱を見つけた！ <span class="sys">${g}G</span>`);
    const it=pick(['傷薬','毒消し','たいまつ','帰還の巻物','霊薬','傷薬']);if(G.bag.length<BAGMAX){G.bag.push(it);log(`${it} を手に入れた。`)}drawParty();return dungeonIdle()}
  if(t===6){busy=true;const v=await menu('冷たい水が 湧く泉がある。',[{l:'飲んでみる',v:1},{l:'やめる',v:0}]);
    if(v){if(G.taken[k]){log('泉は もう 濁ってしまった。','dim')}else{G.taken[k]=1;const r=R();
      if(r<.55){sfx('heal');fx('heal',{d:900});G.party.forEach(p=>{if(alive(p)){p.hp=p.mhp;p.poison=0}});log('体の奥から 力が湧く！ 全員の傷が癒えた。','heal')}
      else if(r<.8){sfx('magic');G.party.forEach(p=>{if(alive(p))p.mp=p.mmp});log('頭が 澄みわたる。 MPが 戻った！','heal')}
      else{sfx('trap');G.party.forEach(p=>{if(alive(p))p.poison=1});log('うっ…！ 毒の水だった！','bad')}}drawParty()}
    return dungeonIdle()}
  if(t===10){log(SIGNS[G.floor],'sys');return}
  if(t===7){if(G.pits[k]){log('落とし穴の ふちを 慎重に渡った。','dim')}else{
      const th=G.party.find(p=>p.c==='盗賊'&&alive(p));G.pits[k]=1;
      if(th&&R()<.25+th.lv*.06){log(`${th.n}「待って！ 足元に 落とし穴！」`,'sys')}
      else{sfx('trap');shake=10;fx('red');G.party.forEach(p=>{if(alive(p)){p.hp=Math.max(0,p.hp-ri(2,5)-G.floor*2)}});log('床が抜けた！ 落とし穴だ！','dmg');drawParty();if(await checkWipe())return}}}
  if(t===8){G.f=(G.f+ri(1,3))%4;markSeen();drawParty();log('…足元が わずかに 揺れた気がする。','dim')}
  if(t===9&&!G.amulet){busy=true;log('玉座の間だ。 深淵の王が 目を開いた。','bad');await wait(900);return battle([['boss',1],['garg',2]],{boss:1})}
  if(G.since>3&&R()<.06+G.floor*.012){G.since=0;busy=true;return battle(rollEnc())}
}
function rollEnc(){
  const fl=G.floor;const pool=Object.keys(MON).filter(k=>MON[k].fl[0]<=fl&&MON[k].fl[1]>=fl);
  const ng=fl>=3?ri(1,3):ri(1,2);const res=[];
  for(let i=0;i<ng;i++){const id=pick(pool);if(res.find(r=>r[0]===id))continue;res.push([id,ri(1,Math.min(MON[id].max,1+Math.ceil(fl/2)+ (i?0:1)))])}
  return res;
}
async function checkWipe(){if(G.party.some(alive))return false;await gameOver();return true}

    x.fillRect(xx*12,yy*12,12,12);if(t!==1){x.strokeStyle='#111';x.strokeRect(xx*12+.5,yy*12+.5,11,11)}}

  $('#ovbox').insertAdjacentHTML('beforeend',`<div style="font-size:12px;margin-top:8px;line-height:1.7"><span style="color:#ffd54d">■</span>上り <span style="color:#e04848">■</span>下り <span style="color:#a8703c">■</span>扉 <span style="color:#e8b030">■</span>宝 <span style="color:#58a8ff">■</span>泉 <span style="color:#bbb">■</span>石碑 <span style="color:#a050ff">■</span>落とし穴 <span style="color:#ff3a6a">■</span>玉座</div><button data-close style="margin-top:10px;width:100%;text-align:center">とじる</button>`);
}
async function camp(){
  busy=true;$('#pad').classList.add('hide');
  while(true){drawParty();
    const v=await menu('キャンプ',[{l:'呪文',v:'sp'},{l:'道具',v:'it',dis:!G.bag.length},{l:'仲間の様子',v:'st'},{l:'地図',v:'map'},{l:'出発する',v:'x'}]);

    if(v==='st')statusView();if(v==='map')showMap();

      const p=G.party[ci];const list=Object.entries(SP).filter(([n,s])=>s.c===p.c&&s.lv<=p.lv);
      const sn=await menu(`${p.n}の呪文`,list.map(([n,s])=>({l:n,s:`MP${s.mp}　${s.d}`,v:n,dis:!s.camp||p.mp<s.mp})),{back:1});if(sn==='__back')continue;
      await campUse(p,SP[sn],sn,true)}
    if(v==='it'){const ii=await menu('どれを使う？',G.bag.map((n,i)=>({l:n,s:IT[n].d,v:i})),{back:1});if(ii==='__back')continue;
      const n=G.bag[ii];if(await campUse(null,IT[n],n,false))G.bag.splice(ii,1)}

async function campUse(p,s,name,isSpell){

  if(s.heal){const h=Math.min(tgt.mhp-tgt.hp,ri(s.heal[0],s.heal[1]));tgt.hp+=h;if(s.cure)tgt.poison=0;sfx('heal');fx('heal',{d:800});log(`${tgt.n}の HPが ${h} 回復した。`,'heal')}
  else if(s.cure){tgt.poison=0;sfx('heal');log(`${tgt.n}の 毒が消えた。`,'heal')}

  else if(s.warp){sfx('magic');fx('white',{d:900});log('巻物が燃え上がり、気づけば 町の門の前にいた。','sys');closeOverlay();await wait(600);town();return true}

// ============ 戦闘 ============
async function battle(spec,o={}){
  mode='battle';busy=true;$('#pad').classList.add('hide');
  B={groups:spec.map(([id,c])=>({id,m:MON[id],list:Array.from({length:c},()=>({hp:MON[id].hp+ri(0,MON[id].hp>>2),sleep:0}))})),flash:{},fade:{},def:new Set(),buff:0,charge:false,boss:o.boss,sel:-1};
  sfx('enc');fx('white',{d:300});shake=6;drawParty();
  log(B.groups.map(g=>`<span class="dmg">${g.m.n}${g.list.length>1?'×'+g.list.length:''}</span>`).join('、')+' が あらわれた！');
  if(o.boss)log('「愚かな…。 光の届かぬ底で 朽ちるがいい」','bad');
  await wait(500);
  while(true){
    const acts=await chooseAll();
    if(acts==='run'){
      const pa=G.party.filter(alive).reduce((s,p)=>s+agi(p),0)/G.party.filter(alive).length;const ea=liveEnemies().reduce((s,x)=>s+x.g.m.agi,0)/liveEnemies().length;
      if(!B.boss&&R()<.55+(pa-ea)*.03){log('うまく 逃げ出した！');await wait(500);B=null;return dungeonIdle()}
      log('逃げられない！','dmg');await wait(400);await runRound([]);
    }else await runRound(acts);
    const end=checkEnd();if(end==='win')return victory();if(end==='lose'){await gameOver();return}
    // ターンの終わり
    for(const p of G.party){if(alive(p)&&p.poison){const d=Math.max(1,p.mhp>>4);p.hp=Math.max(0,p.hp-d);log(`${p.n}は 毒で ${d} のダメージ`,'bad');if(!alive(p))log(`${p.n}は 倒れた…`,'dmg')}
      if(p.sleep>0)p.sleep--}
    B.groups.forEach(g=>g.list.forEach(e=>{if(e.sleep>0)e.sleep--}));B.def.clear();drawParty();
    if(!G.party.some(alive)){await gameOver();return}
  }
}
const liveEnemies=()=>B.groups.flatMap(g=>g.list.filter(e=>e.hp>0).map(e=>({g,e})));
function checkEnd(){if(!liveEnemies().length)return'win';if(!G.party.some(alive))return'lose';return null}
async function pickGroup(title){
  const live=B.groups.map((g,i)=>({g,i})).filter(o=>o.g.list.some(e=>e.hp>0));
  if(live.length===1)return live[0].i;
  B.sel=live[0].i;
  const v=await menu(title,live.map(o=>({l:o.g.m.n,s:`×${o.g.list.filter(e=>e.hp>0).length}`,v:o.i})),{back:1});B.sel=-1;return v;
}
async function chooseAll(){
  const acts=[];let i=0;
  while(i<4){
    const p=G.party[i];if(!alive(p)||p.sleep){i++;continue}
    activeIdx=i;drawParty();
    const first=!acts.some(Boolean);
    const sps=Object.entries(SP).filter(([n,s])=>s.c===p.c&&s.lv<=p.lv&&s.b);
    const v=await menu(`${p.n}は どうする？`,[
      {l:'たたかう',v:'atk',dis:i>=2,s:i>=2?'後列からは届かない':''},
      {l:'呪文',v:'sp',dis:!sps.length},
      {l:'守る',v:'def',s:'受ける傷が半分'},
      {l:'道具',v:'it',dis:!G.bag.length},
      first?{l:'逃げる',v:'run'}:null],{back:i>0&&acts.some(Boolean)});
    if(v==='__back'){do{i--}while(i>0&&!acts[i]);acts[i]=null;continue}
    if(v==='run'){activeIdx=-1;return'run'}
    let a=null;
    if(v==='atk'){const g=await pickGroup('どの敵を？');if(g==='__back')continue;a={k:'atk',p,g}}
    if(v==='def')a={k:'def',p};
    if(v==='sp'){const sn=await menu(`${p.n}の呪文　MP ${p.mp}`,sps.map(([n,s])=>({l:n,s:`MP${s.mp}　${s.d}`,v:n,dis:p.mp<s.mp})),{back:1});if(sn==='__back')continue;
      const s=SP[sn];let g=null,t=null;
      if(s.t==='one'||s.t==='grp'){g=await pickGroup('どの敵に？');if(g==='__back')continue}
      if(s.t==='ally'){t=await menu('誰に？',G.party.map((q,j)=>({l:q.n,s:`HP ${q.hp}/${q.mhp}${q.poison?' 毒':''}`,v:j,dis:!alive(q)})),{back:1});if(t==='__back')continue}
      a={k:'sp',p,sn,s,g,t}}
    if(v==='it'){const ii=await menu('どれを使う？',G.bag.map((n,j)=>({l:n,s:IT[n].d,v:j,dis:IT[n].campOnly||IT[n].light})),{back:1});if(ii==='__back')continue;
      const it=IT[G.bag[ii]];const t=await menu('誰に？',G.party.map((q,j)=>({l:q.n,s:`HP ${q.hp}/${q.mhp}`,v:j,dis:it.t==='dead'?alive(q):!alive(q)})),{back:1});if(t==='__back')continue;
      a={k:'it',p,ii,name:G.bag[ii],t}}
    acts[i]=a;i++;
  }
  activeIdx=-1;drawParty();
  // 道具は先に袋から抜いておく（同じ物の二重使用を防ぐ）
  const its=acts.filter(a=>a&&a.k==='it').sort((a,b)=>b.ii-a.ii);for(const a of its)G.bag.splice(a.ii,1);
  return acts.filter(Boolean);
}
async function runRound(acts){
  const order=[];
  acts.forEach(a=>{if(a.k==='def'){B.def.add(a.p);log(`${a.p.n}は 身を守っている。`,'dim')}else order.push({side:'p',a,sp:agi(a.p)+ri(0,8)})});
  B.groups.forEach((g,gi)=>g.list.forEach(e=>{if(e.hp>0)order.push({side:'e',g,gi,e,sp:g.m.agi+ri(0,8)})}));
  order.sort((a,b)=>b.sp-a.sp);
  for(const o of order){
    if(checkEnd())return;
    if(o.side==='p'){if(!alive(o.a.p)||o.a.p.sleep)continue;activeIdx=G.party.indexOf(o.a.p);drawParty();await doPlayer(o.a)}
    else{if(o.e.hp<=0)continue;if(o.e.sleep>0)continue;await doEnemy(o.g,o.gi,o.e)}
    activeIdx=-1;drawParty();
  }
}
function liveIn(gi){return B.groups[gi].list.filter(e=>e.hp>0)}
function retarget(gi){if(gi!=null&&liveIn(gi).length)return gi;const i=B.groups.findIndex((g,j)=>liveIn(j).length);return i}
async function hurtEnemy(gi,e,d,how){
  const g=B.groups[gi];e.hp-=d;if(e.sleep&&how!=='fire'&&R()<.5)e.sleep=0;
  B.flash[gi]=performance.now()+260;
  if(e.hp<=0){e.hp=0;G.kills++;log(`${g.m.n}を 倒した！`,'sys');B.fade[gi]=performance.now()+400;sfx('die')}
}
async function doPlayer(a){
  const p=a.p;
  if(a.k==='atk'){
    const gi=retarget(a.g);if(gi<0)return;const g=B.groups[gi];const e=pick(liveIn(gi));
    const sleeping=e.sleep>0;const hit=sleeping||R()<.82+(agi(p)-g.m.agi)*.015;
    log(`${p.n}の こうげき！`);await wait(220);
    if(!hit){sfx('miss');log(`${g.m.n}は ひらりとかわした。`,'dim');await wait(380);return}
    let d=Math.max(1,atk(p)+ri(0,(atk(p)>>1)+2)-g.m.def);
    const crit=R()<(p.c==='盗賊'?.18:.06)||sleeping&&R()<.5;if(crit)d=Math.floor(d*(sleeping?1.8:2));
    if(g.m.phys)d=Math.max(1,Math.floor(d*g.m.phys));
    sfx(crit?'crit':'hit');fx('slash',{x:groupX(gi),y:130,d:250});shake=crit?7:3;
    log(`${crit?'<span class="sys">会心の一撃！</span> ':''}${g.m.n}に <span class="dmg">${d}</span> のダメージ${g.m.phys?'（刃が すり抜ける…）':''}`);
    await hurtEnemy(gi,e,d);await wait(420);return;
  }
  if(a.k==='sp'){
    const s=a.s;if(p.mp<s.mp){log(`${p.n}は MPが 足りない！`,'dim');return}p.mp-=s.mp;drawParty();
    log(`${p.n}は <span class="sys">${a.sn}</span> を唱えた！`);await wait(260);
    if(s.pow){sfx('fire');
      const targets=s.t==='all'?B.groups.map((g,i)=>i):[retarget(a.g)];
      for(const gi of targets){if(gi<0||!liveIn(gi).length)continue;fx('fire',{x:groupX(gi),y:150,d:700});
        const es=s.t==='one'?[pick(liveIn(gi))]:liveIn(gi);
        for(const e of es){const d=ri(s.pow[0],s.pow[1])+p.lv;await hurtEnemy(gi,e,d,'fire');log(`${B.groups[gi].m.n}に <span class="dmg">${d}</span>`)}}
      await wait(480);return}
    if(s.sleep){sfx('sleep');const gi=retarget(a.g);if(gi<0)return;const g=B.groups[gi];fx('sleep',{x:groupX(gi),y:110,d:900});let n=0;
      for(const e of liveIn(gi)){if(!g.m.boss&&g.m.sp!=='ghost'&&g.m.sp!=='skel'&&R()<.75){e.sleep=ri(2,3);n++}}
      log(n?`${g.m.n} ${n}体が 眠りに落ちた。`:`${g.m.n}には 効かなかった！`,n?'':'dim');await wait(450);return}
    if(s.heal||s.cure){const t=G.party[a.t];if(!alive(t)){log('しかし 手遅れだった…','dim');return}
      if(s.heal){const h=Math.min(t.mhp-t.hp,ri(s.heal[0],s.heal[1]));t.hp+=h;log(`${t.n}の HPが <span class="heal">${h}</span> 回復。`)}if(s.cure&&t.poison){t.poison=0;log(`${t.n}の 毒が消えた。`,'heal')}
      sfx('heal');fx('heal',{d:800});drawParty();await wait(420);return}
    if(s.buff){B.buff=3;sfx('magic');fx('white',{d:300});log('光の壁が 仲間を包んだ。','sys');await wait(400);return}
    if(s.light){G.light=Math.max(G.light,s.light);sfx('magic');log('光が 広がった。','sys');await wait(300);return}
  }
  if(a.k==='it'){const it=IT[a.name],t=G.party[a.t];log(`${p.n}は ${a.name} を使った。`);await wait(250);
    if(it.revive){if(alive(t)){log('しかし 何も起きなかった。','dim');G.bag.length<BAGMAX&&G.bag.push(a.name)}else{t.hp=Math.ceil(t.mhp/2);sfx('heal');fx('white');log(`${t.n}が 蘇った！`,'heal')}}
    else if(!alive(t)){log('しかし 手遅れだった…','dim')}
    else{if(it.heal){const h=Math.min(t.mhp-t.hp,ri(it.heal[0],it.heal[1]));t.hp+=h;log(`${t.n}の HPが <span class="heal">${h}</span> 回復。`)}if(it.cure){t.poison=0;log(`${t.n}の 毒が消えた。`,'heal')}sfx('heal');fx('heal',{d:700})}
    drawParty();await wait(400)}
}
function pickTarget(){const al=G.party.map((p,i)=>({p,i})).filter(o=>alive(o.p));const w=al.map(o=>o.i<2?3:1);let r=R()*w.reduce((a,b)=>a+b,0);for(let k=0;k<al.length;k++){r-=w[k];if(r<=0)return al[k].p}return al[al.length-1].p}
async function damageParty(p,d,cls){
  if(B&&B.def.has(p))d=Math.ceil(d/2);if(B&&B.buff)d=Math.max(0,d-3);
  p.hp=Math.max(0,p.hp-d);if(p.sleep&&R()<.6)p.sleep=0;

  if(!alive(p)){p.poison=0;p.sleep=0;log(`<span class="dmg">${p.n}は 倒れた…</span>`);sfx('die')}
  drawParty();return d;
}
async function doEnemy(g,gi,e){
  const m=g.m;if(!G.party.some(alive))return;
  if(m.boss){
    if(B.charge){B.charge=false;log(`<span class="bad">${m.n}の 「深淵の業火」！</span>`);sfx('fire');fx('dark',{d:900});fx('red',{d:700});shake=14;await wait(350);
      for(const p of G.party.filter(alive))await damageParty(p,ri(22,34));await wait(600);return}
    if(R()<.33){B.charge=true;sfx('charge');log(`<span class="bad">${m.n}は 杖を 高く掲げた！ 闇が 集まっていく…</span>`);await wait(600);return}
    for(let i=0;i<2;i++){if(!G.party.some(alive))return;const p=pickTarget();log(`${m.n}の 杖が 振り下ろされる！`);sfx('hurt');fx('red',{d:250});shake=6;await wait(200);await damageParty(p,Math.max(1,m.atk+ri(0,8)-def(p)));await wait(320)}
    return}
  if(m.spell&&R()<.35){log(`${m.n}は 呪文を唱えた！`,'bad');sfx('fire');fx('red',{d:500});await wait(300);for(const p of G.party.filter(alive))await damageParty(p,ri(4,9)+G.floor);await wait(400);return}
  const p=pickTarget();log(`${m.n}の こうげき！`);await wait(180);
  if(R()>.78-(agi(p)-m.agi)*.012){sfx('miss');log(`${p.n}は かわした。`,'dim');await wait(320);return}
  sfx('hurt');fx('red',{d:260});shake=5;
  const d=await damageParty(p,Math.max(1,m.atk+ri(0,m.atk>>1)-def(p)));
  if(m.poison&&alive(p)&&R()<.35){p.poison=1;log(`${p.n}は 毒に冒された！`,'bad')}

  drawParty();await wait(360);
}
async function victory(){

async function chest(){

      const ok=R()<(p.c==='盗賊'?.82+p.lv*.03:.35);const g=ok?trap:pick(TRAPS.filter(t=>t!==trap));

    if(v==='dis'){const ci=await menu('誰が外す？',G.party.map((p,i)=>({l:p.n,s:p.c,v:i,dis:!alive(p)})),{back:1});if(ci==='__back')continue;const p=G.party[ci];
      const nm=await menu('罠の名は？',TRAPS.filter(t=>t!=='なし').map(t=>({l:t,v:t})),{back:1});if(nm==='__back')continue;

  for(const l of lines){log(l||'　','sys');await wait(900)}
  const v=await menu('ありがとう！',[{l:'もう一度 はじめから',v:1}]);
  localStorage.removeItem('abyss_save');newGame();clearLog();town();
}

// ============ 入力 ============
addEventListener('keydown',e=>{
  audioInit();
  if($('#overlay').classList.contains('on')){if(e.key==='Escape'||e.key==='m'||e.key==='M'||e.key==='Enter'){closeOverlay()}return}
  if(skipWait&&(e.key===' '||e.key==='Enter')){skipWait();e.preventDefault();return}
  if(curOpts&&/^[1-9]$/.test(e.key)){const o=curOpts[+e.key-1];if(o&&!o.dis){o.go();e.preventDefault();return}}
  if(curOpts&&curOpts.back&&(e.key==='Escape'||e.key==='Backspace')){curOpts.back();return}
  const k={ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d',w:'w',s:'s',a:'a',d:'d',q:'q',e:'e',W:'w',S:'s',A:'a',D:'d',Q:'q',E:'e'}[e.key];
  if(k&&mode==='dungeon'){e.preventDefault();tryMove(k);return}
  if((e.key==='m'||e.key==='M')&&mode==='dungeon'&&!busy){showMap()}
  if((e.key==='c'||e.key==='C')&&mode==='dungeon'&&!busy){camp()}
});
document.querySelectorAll('#pad button').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();audioInit();tryMove(b.dataset.k)}});
let sw=null;cv.addEventListener('pointerdown',e=>{sw=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw[0],dy=e.clientY-sw[1];sw=null;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx<0?'d':'a');else tryMove(dy<0?'w':'s')});

// ============ タイトル ============
const tcv=$('#tcv'),tctx=tcv.getContext('2d');let titleOn=true;
function titleLoop(now){if(!titleOn)return;
  // タイトルの奥でゆっくり進む回廊
  if(!G){newGame();G.floor=1;let best=-1;
    for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)for(let f=0;f<4;f++){if(solid(tile(x,y)))continue;let k=0;while(!solid(tile(x+DX[f]*(k+1),y+DY[f]*(k+1)))&&k<9)k++;if(k>best){best=k;G.x=x;G.y=y;G.f=f}}}
  const t=(now/2600)%1;anim={type:'f',t0:now-t*2600,dur:2600};
  G.light=0;renderDungeon(now);anim=null;
  tctx.drawImage(cv,0,0);requestAnimationFrame(titleLoop)}
requestAnimationFrame(titleLoop);
$('#bCont').disabled=!localStorage.getItem('abyss_save');
function start(cont){
  audioInit();titleOn=false;$('#title').style.display='none';MAPS={};
  if(!(cont&&load()))newGame();
  clearLog();
  if(!cont){log('城塞都市リルガ。 町はずれの塔の下に、底の知れない迷宮が 口を開けている。');log('最深部に棲む「深淵の王」を倒し、暁のアミュレットを 持ち帰れ。','sys')}
  else log('冒険の記録を 読みこんだ。','sys');
  requestAnimationFrame(frame);town();
}
$('#bNew').onclick=()=>start(false);$('#bCont').onclick=()=>start(true);
window.__abyss={get G(){return G},get mode(){return mode},get busy(){return busy},get B(){return B},tryMove,battle,enterFloor,dungeonIdle,getMap};
</script>
</body>
