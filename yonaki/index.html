<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>夜鳴村</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--red:#b3121b;--ink:#e8dccb;--dim:#8a7d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block;background:#000}
.hide{display:none!important}
button,input{font-family:inherit;color:var(--ink)}
button{background:rgba(24,8,8,.55);border:1px solid rgba(232,220,203,.32);border-radius:8px;font-size:15px;padding:10px 14px;cursor:pointer}
button:active{background:rgba(140,12,20,.65)}
button:disabled{opacity:.35}
#hud{position:fixed;inset:0;pointer-events:none}
#obj{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top));font-size:12.5px;line-height:1.6;text-shadow:0 0 4px #000,0 0 2px #000;max-width:64vw}
#obj b{color:#d9b28a;font-weight:800;display:block;font-size:14px;letter-spacing:.05em}
#obj .ok{color:#9c9;opacity:.85}
#clock{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));font-size:15px;letter-spacing:.12em;text-shadow:0 0 4px #000;text-align:right}
#clock small{display:block;font-size:10px;letter-spacing:.3em;color:#c44}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:16px;line-height:1.7;text-shadow:0 0 6px #000,0 0 2px #000;opacity:0;transition:opacity .5s;padding:0 22px;white-space:pre-line}
#hint{position:absolute;left:0;right:0;bottom:calc(178px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:#cbbfae;text-shadow:0 0 4px #000;opacity:0;transition:opacity .6s;padding:0 18px}
#sjui{position:absolute;top:calc(58px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.4em;color:#f0dcc6;text-shadow:0 0 4px #000}
#sjname{font-size:16px;letter-spacing:.18em;margin-top:6px}
#sjbar{margin:7px auto 0;width:120px;height:3px;background:rgba(255,255,255,.14)}#sjbar i{display:block;height:100%;background:#d33;width:0}
#stam{position:absolute;left:50%;bottom:calc(166px + env(safe-area-inset-bottom));width:90px;margin-left:-45px;height:3px;background:rgba(255,255,255,.1);opacity:0;transition:opacity .4s}#stam i{display:block;height:100%;background:#cbb;width:100%}
#tag{position:absolute;font-size:11.5px;transform:translate(-50%,-100%);text-shadow:0 0 3px #000;color:#bcd;white-space:nowrap}
#slit{position:absolute;inset:0;background:linear-gradient(#000 0,#000 43%,rgba(0,0,0,.5) 46%,transparent 47.5%,transparent 52.5%,rgba(0,0,0,.5) 54%,#000 57%,#000 100%)}
#pad{position:fixed;inset:0;touch-action:none}
#stick{position:absolute;width:124px;height:124px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:none;transform:translate(-50%,-50%);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.16)}
#btns{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,76px);gap:9px}
#btns button{height:54px;padding:0 4px;font-size:13.5px}
#bAct{grid-column:1/3;height:62px!important;font-size:15.5px!important;position:relative;overflow:hidden}
#bAct .pr{position:absolute;left:0;bottom:0;height:4px;background:#c33;width:0}
#bAct.dis{opacity:.45}
#bLight.on,#bCrouch.on{border-color:#d9b28a;color:#f4e3c8}
#topb{position:absolute;right:12px;top:calc(52px + env(safe-area-inset-top));display:flex;gap:8px}
#topb button{padding:6px 10px;font-size:12.5px}
#ghostb{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}
#ghostb button{min-width:74px;height:54px}
#mapv{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#mapv canvas{max-width:94vw;max-height:78vh;image-rendering:pixelated;border:1px solid #3a2a20}
#note{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:26px}
#note div{background:#d8ccb4;color:#2a1a10;max-width:420px;padding:22px 20px;line-height:1.95;font-size:15px;box-shadow:0 0 40px #000;white-space:pre-line}
#note small{display:block;margin-top:14px;color:#6a5040;font-size:12px;text-align:right}
.scr{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#title{background:radial-gradient(ellipse at 50% 30%,#2a0506 0%,#000 70%)}
#title h1{font-size:68px;margin:0 0 4px;letter-spacing:.22em;color:#c8141e;text-shadow:0 0 24px rgba(200,20,30,.55);font-weight:800;padding-left:.22em}
#title .sub{margin:0 0 18px;color:#b9a896;font-size:13.5px;letter-spacing:.12em}
.row{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:340px}
.col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.col>button{width:100%;font-size:17px;padding:13px}
input[type=text]{background:rgba(255,255,255,.06);border:1px solid rgba(232,220,203,.3);border-radius:8px;padding:10px;font-size:16px;width:100%;user-select:text;-webkit-user-select:text}
#faceP{width:52px;height:52px;flex:none;border-radius:6px;background:#222 center/cover;border:1px solid #444;image-rendering:pixelated}
.note2{font-size:11.5px;color:#7d6f60;line-height:1.7;margin-top:10px}
#lbCode{font-size:44px;letter-spacing:.3em;color:#e6c9a4;padding-left:.3em}
#lbState{color:#b9a896;font-size:14px;min-height:1.5em}
#card{background:#000;gap:14px}
#card div{opacity:0;transition:opacity 1.2s;letter-spacing:.2em}
#cd1{font-size:30px;color:#d7c6b0}#cd2{font-size:15px;color:#a44}#cd3{font-size:14px;color:#b8a896}#cd4{font-size:13px;color:#8d7f70;max-width:320px;line-height:1.8;letter-spacing:.08em!important}
#end h2{font-size:38px;margin:0;letter-spacing:.2em;color:#c8141e;padding-left:.2em}
#end p{color:#b9a896;line-height:1.8;font-size:14px;white-space:pre-line}
#flash{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div id="obj"></div>
  <div id="clock"></div>
  <div id="msg"></div>
  <div id="hint"></div>
  <div id="sjui" class="hide"><div>― 視界ジャック ―</div><div id="sjname"></div><div id="sjbar"><i></i></div></div>
  <div id="stam"><i></i></div>
  <div id="tag" class="hide"></div>
  <div id="slit" class="hide"></div>
</div>
<div id="pad" class="hide">
  <div id="stick"><i></i></div>
  <div id="topb"><button id="bMap">地図</button></div>
  <div id="btns">
    <button id="bLight" class="on">ライト</button><button id="bCrouch">しゃがむ</button>
    <button id="bSJ">視界</button><button id="bRun">走る</button>
    <button id="bAct">調べる<span class="pr"></span></button>
  </div>
  <div id="ghostb" class="hide"><button id="bPrev">◀</button><button id="bNoise">物音</button><button id="bNext">▶</button></div>
</div>
<div id="mapv" class="hide"><canvas id="mapc" width="512" height="512"></canvas><button id="bMapClose">閉じる</button></div>
<div id="note" class="hide"><div><span id="noteT"></span><small>― 拾った手記 ―　（タップで閉じる）</small></div></div>

<div id="title" class="scr">
  <h1>夜鳴村</h1>
  <p class="sub">よなきむら ― ふたりで、夜明けまでに逃げろ</p>
  <div class="row"><div id="faceP"></div><input id="nameI" type="text" maxlength="8" placeholder="名前"><label><button id="bFace" type="button">顔写真</button><input id="faceI" type="file" accept="image/*" hidden></label></div>
  <div class="col" style="margin-top:10px">
    <button id="bSolo">ひとりで</button>
    <button id="bHost">部屋をつくる</button>
    <div class="row"><input id="codeI" type="text" maxlength="4" placeholder="合言葉（4文字）" style="text-transform:uppercase"><button id="bJoin" style="flex:none">入る</button></div>
  </div>
  <p class="note2">イヤホン推奨・スマホは縦持ち<br>左で歩く／右をなぞって見回す／［視界］長押しで他者の目を盗み見る<br>PC：WASD・ドラッグ・Shift走る・C しゃがむ・F ライト・Q 視界・E 調べる・M 地図</p>
</div>
<div id="lobby" class="scr hide">
  <div style="color:#8d7f70;font-size:13px;letter-spacing:.2em">合言葉</div>
  <div id="lbCode">----</div>
  <div id="lbState"></div>
  <div id="lbPeer" class="row"></div>
  <div class="col"><button id="bStart" disabled>はじめる</button><button id="bBack">もどる</button></div>
</div>
<div id="card" class="scr hide"><div id="cd1"></div><div id="cd2"></div><div id="cd3"></div><div id="cd4"></div></div>
<div id="end" class="scr hide"><h2 id="enT"></h2><p id="enS"></p><div class="col"><button id="bAgain">もう一度</button><button id="bTitle">タイトルへ</button></div></div>
<div id="flash"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
THREE.ColorManagement.enabled = false;
const PEER_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';

// ================================================================ 小道具
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; };
function RNG(seed) { let a = (seed >>> 0) || 1; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function segDist(px, pz, ax, az, bx, bz) { const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz; const t = l ? clamp(((px - ax) * dx + (pz - az) * dz) / l, 0, 1) : 0; return Math.hypot(px - ax - dx * t, pz - az - dz * t); }
function plDist(px, pz, pl) { let m = 1e9; for (let i = 0; i < pl.length - 1; i++) m = Math.min(m, segDist(px, pz, pl[i][0], pl[i][1], pl[i + 1][0], pl[i + 1][1])); return m; }
window.__errs = [];
addEventListener('error', e => __errs.push(String(e.message)));
addEventListener('unhandledrejection', e => __errs.push(String(e.reason)));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

// ================================================================ 定数
const S = 144, HC = 4, NR = 0.5, NW = Math.ceil(S / NR), WALL_H = 2.5, BAND = 8;
const T_SIREN = +Q.get('st') || 240, N_SIREN = 4, T_END = T_SIREN * N_SIREN + 25;
const ITEMS = {
  key: { n: '車の鍵', team: 1 }, gas: { n: 'ガソリン缶', team: 1 }, cutter: { n: 'ボルトカッター', team: 1 },
  pipe: { n: '鉄パイプ' }, med: { n: '救急箱' }, note: { n: '手記' },
};
const NOTES = [
  '昭和五十三年 八月二日\nまた雨が赤い。村長は、サイレンが鳴ったら家から出るなと言う。\n出たらどうなるのかは、誰も言わない。',
  '母が帰ってきた。\n三日前に川で見つかったはずの母が。\n目から赤い涙を流しながら、台所で鼻歌をうたっている。',
  'あいつらは昼間の続きをしている。\n畑を耕し、見回りをし、墓に祈る。\n目が合わなければ気づかない。明かりを消せ。',
  '四度目のサイレンで、村は水の底へ還る。\n夜明けまでに村を出ろ。\nふたりなら、きっと。',
  '耳鳴りがする。\n目を閉じると、知らない誰かの目で村が見える。\nあいつらの見ているものが、見える。',
  '押し入れの中で息を殺していた。\nあいつは戸の前で長いこと鼻歌をうたって、それから去った。\n見られていなければ、見つからない。',
];
const LOOKS = [
  { n: '野良着の男', cloth: 0x4a3b2a, pants: 0x2e2a22, hat: 'straw', tool: 'sickle', v: 105 },
  { n: '巡査', cloth: 0x1c2233, pants: 0x151a26, hat: 'cap', tool: 'pipe', v: 95 },
  { n: '看護婦', cloth: 0x8e8a80, pants: 0x7e7a70, hat: null, tool: null, v: 190 },
  { n: '学生', cloth: 0x18181c, pants: 0x18181c, hat: null, tool: null, v: 150 },
  { n: '野良着の女', cloth: 0x5a3440, pants: 0x2e2226, hat: 'scarf', tool: 'hoe', v: 200 },
  { n: '坊主', cloth: 0x121212, pants: 0x121212, hat: null, tool: null, v: 88 },
  { n: '老婆', cloth: 0x3a3a44, pants: 0x2a2a30, hat: 'scarf', tool: null, v: 210 },
];
const MUTTERS = ['いたい…いたいよぉ…', 'おかえりぃ…', 'あけてぇ…あけてよぉ…', 'ひひ…ひひひひ…', 'どこぉ…どこにいるのぉ…', 'さむい…さむいねぇ…', 'みずが…あかい…', 'いっしょに…なろう…', 'もうすぐ…もうすぐだよぉ…'];
const AREAS = ['上ノ沢', '下田堀', '鴉谷', '蛇ノ目', '御霊坂', '合石', '鳴瀬', '狐塚'];
const OBJ_TXT = { car: '車で村を出る', gate: '鉄門を開けて村を出る', tunnel: '隧道の鎖を切って村を出る' };

// ================================================================ 状態
const G = window.G = {
  mode: 'title', me: 0, players: [], enemies: [], W: null, t: 0, time: 0, siren: 0, team: new Set(), obj: {}, noises: [], result: null,
  in: { mx: 0, mz: 0, kx: 0, kz: 0, run: false, act: false, actTap: false, sj: false }, cam: { yaw: 0, pitch: -0.12 },
  sj: { on: false, view: null, clar: 0, obj: null, sayT: 3 }, fx: { red: 0, siren: 0, shake: 0 }, hold: null, it: null,
  name: store.get('ynk_name') || '', faceURL: store.get('ynk_face') || null, nextId: 100, stats: { hits: 0, items: 0 },
  god: Q.has('god'),
};
const me = () => G.players[G.me];
const isHost = () => Net.role === 'host';

// ================================================================ 村をつくる（種から毎回同じものができる）
function genWorld(seed) {
  const R = RNG(seed), rf = (a, b) => a + R() * (b - a), ri = (a, b) => Math.floor(rf(a, b + 1)), pick = a => a[Math.floor(R() * a.length)];
  const W = { seed, solids: [], houses: [], items: [], closets: [], lamps: [], trees: [], bushes: [], graves: [], fields: [], enemies: [], deco: [], objs: {} };
  const solid = (x0, z0, x1, z1, y1, k, ex) => { const s = Object.assign({ x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1), y1, k }, ex); W.solids.push(s); return s; };
  const wave = (n, c0, amp, lo, hi) => { const o = []; let v = 0; for (let i = 0; i < n; i++) { v = clamp(v + rf(-amp, amp), -amp * 1.5, amp * 1.5); o.push(clamp(c0 + v, lo, hi)); } return o; };
  const K = 7, step = (S + 16) / (K - 1);
  const ew = wave(K, rf(S * .4, S * .6), 8, 36, S - 36).map((z, i) => [-8 + i * step, z]);
  const ns = wave(K, rf(S * .4, S * .6), 8, 36, S - 36).map((x, i) => [x, -8 + i * step]);
  // 道の端（村の外へ出る所）は外側へまっすぐ伸ばす
  ew[0][1] = ew[1][1]; ew[K - 1][1] = ew[K - 2][1]; ns[0][0] = ns[1][0]; ns[K - 1][0] = ns[K - 2][0];
  W.roads = [{ pl: ew, w: 5 }, { pl: ns, w: 5 }];
  for (let b = 0; b < 3; b++) {
    const base = pick([ew, ns]); const [bx, bz] = base[ri(2, 4)]; let x = bx, z = bz, a = R() * TAU; const pl = [[x, z]];
    for (let s = 0; s < 3; s++) { a += rf(-.6, .6); x = clamp(x + Math.sin(a) * 12, 20, S - 20); z = clamp(z + Math.cos(a) * 12, 20, S - 20); pl.push([x, z]); }
    W.roads.push({ pl, w: 3.5 });
  }
  const rx0 = R() < .5 ? rf(22, 32) : rf(S - 32, S - 22);
  W.river = { pl: wave(K, rx0, 6, 16, S - 16).map((x, i) => [x, -8 + i * step]), w: 6 };
  const onRoad = (x, z, p = 0) => W.roads.some(r => plDist(x, z, r.pl) < r.w / 2 + p), onRiver = (x, z, p = 0) => plDist(x, z, W.river.pl) < W.river.w / 2 + p;
  const occ = [];
  const hit = (x0, z0, x1, z1) => occ.some(r => x0 < r[2] && x1 > r[0] && z0 < r[3] && z1 > r[1]);
  const clear = (x0, z0, x1, z1, rp = .5, m = 13) => {
    if (x0 < m || z0 < m || x1 > S - m || z1 > S - m || hit(x0, z0, x1, z1)) return false;
    const nx = Math.ceil((x1 - x0) / 1.2), nz = Math.ceil((z1 - z0) / 1.2);
    for (let i = 0; i <= nx; i++) for (let j = 0; j <= nz; j++) { const x = lerp(x0, x1, i / nx), z = lerp(z0, z1, j / nz); if (onRoad(x, z, rp) || onRiver(x, z, 1)) return false; }
    return true;
  };
  // 村の四方の出口
  const along = (pl, ax, v) => { for (let i = 0; i < pl.length - 1; i++) { const a = pl[i], b = pl[i + 1]; if ((a[ax] - v) * (b[ax] - v) <= 0) { const t = (v - a[ax]) / ((b[ax] - a[ax]) || 1); return lerp(a[1 - ax], b[1 - ax], t); } } return pl[0][1 - ax]; };
  const ends = [{ side: 'W', c: along(ew, 0, 10) }, { side: 'E', c: along(ew, 0, S - 10) }, { side: 'N', c: along(ns, 1, 10) }, { side: 'S', c: along(ns, 1, S - 10) }];
  const P = (e, d, o) => e.side === 'W' ? [d, e.c + o] : e.side === 'E' ? [S - d, e.c + o] : e.side === 'N' ? [e.c + o, d] : [e.c + o, S - d];
  const inward = e => e.side === 'W' ? [1, 0] : e.side === 'E' ? [-1, 0] : e.side === 'N' ? [0, 1] : [0, -1];
  W.P = P; W.ends = ends;
  const sEnd = pick(ends);
  const sp0 = P(sEnd, BAND + 6, 0);
  let xEnd = ends[0], bd = -1; for (const e of ends) { if (e === sEnd) continue; const q = P(e, 10, 0), d = Math.hypot(q[0] - sp0[0], q[1] - sp0[1]); if (d > bd) { bd = d; xEnd = e; } }
  W.obj = Q.get('obj') || pick(['car', 'gate', 'tunnel']);
  W.exit = xEnd; W.startEnd = sEnd;
  const inw = inward(sEnd);
  W.spawn = [[sp0[0] - inw[1] * .9, sp0[1] + inw[0] * .9], [sp0[0] + inw[1] * .9, sp0[1] - inw[0] * .9]];
  W.spawnYaw = Math.atan2(inw[0], inw[1]);
  const gapW = W.obj === 'gate' ? 6 : W.obj === 'tunnel' ? 2.4 : 0;
  for (const e of ends) {
    const g = e === xEnd ? gapW : 0, lo = -30 - e.c, hi = S + 30 - e.c;
    const band = (o0, o1) => { const a = P(e, -30, o0), b = P(e, BAND, o1); solid(a[0], a[1], b[0], b[1], 4, 'band'); };
    if (g) { band(lo, -g); band(g, hi); } else band(lo, hi);
    const a = P(e, -30, lo), b = P(e, .6, hi); solid(a[0], a[1], b[0], b[1], 6, 'band');

  $('clock').innerHTML = '午前 ' + hh + ':' + String(mm).padStart(2, '0') + '<small>' + '●'.repeat(Math.min(G.siren, N_SIREN)) + '○'.repeat(Math.max(0, N_SIREN - G.siren)) + '</small>';
  const O = G.obj, W = G.W, ok = b => b ? '<span class="ok">✓</span>' : '□';
  let s = '<b>終了条件：' + OBJ_TXT[W.obj] + '</b>';
  if (W.obj === 'car') s += ok(G.team.has('gas') || O.fuel) + ' ガソリン　' + ok(G.team.has('key')) + ' 車の鍵' + (O.fuel ? '<br>' + ok(O.fuel) + ' 給油' : '');
  if (W.obj === 'gate') s += ok(O.gate || (O.w0 != null && G.t - O.w0 < winWindow())) + ' 巻き上げ機（東）　' + ok(O.gate || (O.w1 != null && G.t - O.w1 < winWindow())) + ' 巻き上げ機（西）<br><span style="opacity:.75">' + (Net.mode === 'solo' ? winWindow() + '秒以内に両方を巻き上げる' : 'ふたりで同時に巻き上げる') + '</span>';
  if (W.obj === 'tunnel') s += ok(G.team.has('cutter') || O.chain) + ' ボルトカッター　' + ok(O.chain) + ' 鎖';
  if (p.weapon) s += '<br><span style="opacity:.7">鉄パイプ</span>'; if (p.med) s += '<span style="opacity:.7">　救急箱×' + p.med + '</span>';
  if (p.st === 'down' && Net.mode !== 'solo') s += '<br><span style="color:#d55">還り人になるまで ' + Math.ceil(p.downT) + '秒</span>';
  if (p.st === 'ghost') s += '<br><span style="color:#d55">あなたは還り人。◀▶で視界を移し、［物音］で敵をそらせ</span>';
  if (p.st === 'escaped') s += '<br><span style="color:#9c9">脱出済み。相棒を見守ろう</span>';
  $('obj').innerHTML = s;
}
let msgTO = 0;
function msg(t) { if (!t) return; const m = $('msg'); m.textContent = t; m.style.opacity = 1; clearTimeout(msgTO); msgTO = setTimeout(() => m.style.opacity = 0, 3200); }
let hintTO = 0;
function hint(t, ms = 5000) { const h = $('hint'); h.textContent = t; h.style.opacity = 1; clearTimeout(hintTO); hintTO = setTimeout(() => h.style.opacity = 0, ms); }
function showNote(t) { $('noteT').textContent = t; $('note').classList.remove('hide'); }
function drawMap() {
  const c = $('mapc'), x = c.getContext('2d'), k = 512 / S, W = G.W;
  x.drawImage(groundCanvas, 0, 0, 512, 512); x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0, 0, 512, 512);
  x.fillStyle = '#5a4630'; for (const h of W.houses) x.fillRect(h.x0 * k, h.z0 * k, (h.x1 - h.x0) * k, (h.z1 - h.z0) * k);
  x.strokeStyle = '#1a120a'; x.lineWidth = 1; for (const h of W.houses) x.strokeRect(h.x0 * k, h.z0 * k, (h.x1 - h.x0) * k, (h.z1 - h.z0) * k);
  x.fillStyle = '#0c140d'; x.fillRect(0, 0, 512, BAND * k); x.fillRect(0, 512 - BAND * k, 512, BAND * k); x.fillRect(0, 0, BAND * k, 512); x.fillRect(512 - BAND * k, 0, BAND * k, 512);
  x.font = 'bold 15px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const mark = (px, pz, t, col = '#e33') => { x.fillStyle = col; x.beginPath(); x.arc(px * k, pz * k, 6, 0, TAU); x.fill(); x.fillStyle = '#fff'; x.strokeStyle = '#000'; x.lineWidth = 3; x.strokeText(t, px * k, pz * k - 14); x.fillText(t, px * k, pz * k - 14); };
  const O = W.objs;
  if (O.car) mark(O.car.x, O.car.z, '車'); if (O.gate) mark(O.gate.c[0], O.gate.c[1], '鉄門'); if (O.chain) mark(O.chain.c[0], O.chain.c[1], '隧道');
  if (O.winches) O.winches.forEach((w, i) => mark(w.x, w.z, '巻' + '東西'[i], '#c80'));
  if (W.shrine) mark(W.shrine.x, W.shrine.z, '神社', '#744');
  for (const p of G.players) { if (p.gone || p.st === 'ghost' || p.st === 'escaped') continue; x.save(); x.translate(p.x * k, p.z * k); x.rotate(-p.yaw); x.fillStyle = p.i === G.me ? '#ff5040' : '#60a0ff'; x.beginPath(); x.moveTo(0, 9); x.lineTo(-6, -6); x.lineTo(6, -6); x.fill(); x.restore(); }
}

// ================================================================ 進行
let lastNow = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, Math.max(0, (now - (lastNow || now)) / 1000)); lastNow = now;
  if (G.mode !== 'game') return;
  try { step(dt); draw(dt); } catch (e) { __errs.push(String(e && e.stack || e)); console.error(e); }
}
function step(dt) {
  G.time += dt;
  if (isHost()) { G.t += dt; hostSiren(); } else G.t += dt;
  updateMe(dt); updateInteract(dt); updateSJ(dt); interp(dt);
  if (isHost()) { aiAll(dt); checkEnd(); }
  updateModels(dt); netTick(dt); updateFX(dt); hud(dt);
  tutorial(dt);
  placeCamera(); audioTick(dt);
}
function tutorial() {
  const T = G.tut || (G.tut = { i: 0 }); const steps = [[1.5, '左側をなぞって歩く／右側をなぞって見回す'], [7, '［視界］を長押しして見回すと、近くにいる者の目を盗み見られる'], [14, 'ライトは目立つ。消せば見つかりにくいが、足元も見えない'], [21, '走ると足音が響く。しゃがめば音を立てずに動ける'], [30, '［地図］で脱出の場所を確かめよう']];
  if (T.i < steps.length && G.time > steps[T.i][0]) { hint(steps[T.i][1], 6000); T.i++; }
}
function startGame(seed, plist) {
  initRenderer(); disposeScene();
  G.mode = 'card'; G.enemies = []; G.t = 0; G.time = 0; G.siren = 0; G.team = new Set(); G.obj = {}; G.noises = []; G.result = null; G.hold = null; G.it = null; G.tut = null; G.nextId = 100; G.stats = { hits: 0, items: 0 }; G.sj = { on: false, view: null, clar: 0, obj: null, sayT: 3 }; G.fx = { red: 0, siren: 0, shake: 0 }; G.poltT = 0;
  G.W = genWorld(seed); hashSolids(G.W); buildNav(G.W); buildScene(G.W);
  G.players = plist.map((q, i) => mkPlayer(i, q));
  for (const d of G.W.enemies) spawnEnemy(d);
  G.cam.yaw = G.W.spawnYaw; G.cam.pitch = -.12;
  Object.assign(G.in, { mx: 0, mz: 0, run: false, act: false, actTap: false, sj: false });
  for (const s of ['title', 'lobby', 'end']) $(s).classList.add('hide');
  $('mapv').classList.add('hide'); $('note').classList.add('hide');
  const skip = Q.has('fast');
  const card = $('card'); card.classList.remove('hide');
  const L = [['cd1', '夜鳴村　' + G.W.area], ['cd2', '午前 零時'], ['cd3', G.players.map(p => p.name).join('　／　')], ['cd4', '土砂崩れで道が塞がれた。\n終了条件：' + OBJ_TXT[G.W.obj]]];
  L.forEach(([id, t]) => { $(id).textContent = t; $(id).style.whiteSpace = 'pre-line'; $(id).style.opacity = 0; });
  L.forEach(([id], i) => setTimeout(() => $(id).style.opacity = 1, skip ? 0 : 300 + i * 700));
  step(0); draw(0);
  setTimeout(() => {
    card.classList.add('hide'); G.mode = 'game'; $('hud').classList.remove('hide'); $('pad').classList.remove('hide'); lastNow = 0;
    msg('……村の外へ抜ける道を探さなければ');
  }, skip ? 50 : 4200);
}
function endGame(v) {
  if (G.result) return; G.result = v; G.mode = 'end';
  try { speechSynthesis.cancel(); } catch (e) { }
  if (AU.eng) { try { AU.eng.o.stop(); } catch (e) { } AU.eng = null; }
  $('hud').classList.add('hide'); $('pad').classList.add('hide');
  const T = { all: ['脱出', 'ふたりとも、村を抜けた。\n振り返ると、赤い雨の向こうでサイレンがまだ鳴っていた。'], partial: ['生還', G.players.length > 1 ? 'ひとりだけが、村を抜けた。\nもうひとりは、今も村で鼻歌をうたっている。' : '村を抜けた。\n赤い雨の向こうで、サイレンがまだ鳴っていた。'], dead: ['死亡', '村は、あなたを帰さなかった。'], dawn: ['夜明けは来なかった', '午前四時。四度目のサイレンとともに、村は赤い水の底へ還った。'], lost: ['通信断', 'ホストとの通信が途切れました。'] }[v.why] || ['終わり', ''];
  if (Net.mode === 'solo' && v.why === 'partial') T[0] = '脱出';
  const mins = Math.floor(G.t / T_SIREN * 60);
  $('enT').textContent = T[0]; $('enS').textContent = T[1] + '\n\n時刻 午前' + Math.floor(mins / 60) + ':' + String(mins % 60).padStart(2, '0') + '　拾った物 ' + G.stats.items + '　殴った回数 ' + G.stats.hits;
  $('bAgain').textContent = isHost() ? 'もう一度（新しい村）' : 'ホストを待つ';
  $('bAgain').disabled = !isHost() && Net.ok;
  setTimeout(() => $('end').classList.remove('hide'), 900);
}
function hostStart() {
  if (G.mode === 'card' || G.mode === 'game') return;
  const seed = +Q.get('seed') || (Math.random() * 1e9) | 0;
  const players = [{ name: G.name || 'ひとり目', face: G.faceURL }];
  if (Net.mode !== 'solo') { if (!G.lobbyPeer) return; players.push({ name: G.lobbyPeer.name, face: G.lobbyPeer.face }); Net.send({ t: 'start', seed, players }); }
  G.me = 0; startGame(seed, players);
}

// ================================================================ タイトル・部屋
function lobbyState(t) { $('lbState').textContent = t; }
function lobbyPeer() {
  const P = G.lobbyPeer, el = $('lbPeer'); el.innerHTML = '';
  if (!P) return; const f = document.createElement('div'); f.id = 'faceP2'; Object.assign(f.style, { width: '44px', height: '44px', borderRadius: '6px', background: '#222 center/cover', border: '1px solid #444' }); if (P.face) f.style.backgroundImage = 'url(' + P.face + ')';
  const n = document.createElement('div'); n.textContent = P.name + (isHost() ? ' が来た' : ' の部屋'); el.append(f, n);
  if (isHost()) { $('bStart').disabled = false; lobbyState('相棒がそろった'); }
}
function showLobby(code) { $('title').classList.add('hide'); $('lobby').classList.remove('hide'); $('lbCode').textContent = code; $('lbPeer').innerHTML = ''; $('bStart').disabled = true; $('bStart').classList.toggle('hide', !isHost()); }
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += A[(Math.random() * A.length) | 0]; return s; }
function refreshFace() { const f = $('faceP'); f.style.backgroundImage = G.faceURL ? 'url(' + G.faceURL + ')' : ''; f.textContent = G.faceURL ? '' : ''; }
function toTitle() {
  netReset(); G.mode = 'title'; G.lobbyPeer = null;
  for (const s of ['lobby', 'end', 'card', 'hud', 'pad']) $(s).classList.add('hide'); $('title').classList.remove('hide');
}
function setupUI() {
  $('nameI').value = G.name; refreshFace();
  $('nameI').addEventListener('input', e => { G.name = e.target.value.trim(); store.set('ynk_name', G.name); });
  $('bFace').addEventListener('click', () => $('faceI').click());
  $('faceI').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return; const im = new Image();
    im.onload = () => { const c = cvs(96), x = c.getContext('2d'), s = Math.min(im.width, im.height); x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2 * .7, s, s, 0, 0, 96, 96); G.faceURL = c.toDataURL('image/jpeg', .72); store.set('ynk_face', G.faceURL); refreshFace(); URL.revokeObjectURL(im.src); };
    im.src = URL.createObjectURL(f);
  });
  $('bSolo').addEventListener('click', () => { auInit(); netReset(); hostStart(); });
  $('bHost').addEventListener('click', async () => {
    auInit(); let code = genCode(); showLobby(code); lobbyState('部屋を用意しています…');
    for (let k = 0; k < 3; k++) { try { await netPeer(code, 'host'); lobbyState('相棒に合言葉を伝えてください'); return; } catch (e) { if (e === 'used') { code = genCode(); $('lbCode').textContent = code; } else { lobbyState('部屋を作れませんでした（通信環境を確かめてください）'); return; } } }
  });
  $('bJoin').addEventListener('click', async () => {
    auInit(); const code = $('codeI').value.trim().toUpperCase(); if (code.length !== 4) { $('codeI').focus(); return; }
    Net.role = 'join'; showLobby(code); lobbyState('部屋を探しています…');
    try { await netPeer(code, 'join'); lobbyState('つながるのを待っています…'); } catch (e) { }
  });
  $('bStart').addEventListener('click', hostStart);
  $('bBack').addEventListener('click', toTitle);
  $('bAgain').addEventListener('click', () => { if (isHost()) { $('end').classList.add('hide'); if (Net.mode !== 'solo' && G.lobbyPeer && Net.ok) { G.mode = 'lobby'; hostStart(); } else { netReset(); G.mode = 'title'; hostStart(); } } });
  $('bTitle').addEventListener('click', toTitle);
  $('note').addEventListener('click', () => $('note').classList.add('hide'));
  $('bMap').addEventListener('click', () => { drawMap(); $('mapv').classList.remove('hide'); });
  $('bMapClose').addEventListener('click', () => $('mapv').classList.add('hide'));
  $('mapv').addEventListener('click', e => { if (e.target.id === 'mapv') $('mapv').classList.add('hide'); });
  // 触る操作
  const pad = $('pad'), stick = $('stick'), T = new Map();
  pad.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return; auInit();
    const left = e.pointerType !== 'mouse' && e.clientX < innerWidth * .45;
    T.set(e.pointerId, { left, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY }); try { pad.setPointerCapture(e.pointerId); } catch (er) { }
    if (left) { stick.style.display = 'block'; stick.style.left = e.clientX + 'px'; stick.style.top = e.clientY + 'px'; stick.firstChild.style.transform = ''; }
  });
  pad.addEventListener('pointermove', e => {
    const t = T.get(e.pointerId); if (!t) return;
    if (t.left) { let dx = e.clientX - t.x0, dy = e.clientY - t.y0; const d = Math.hypot(dx, dy), R = 52; if (d > R) { dx = dx / d * R; dy = dy / d * R; } G.in.mx = dx / R; G.in.mz = -dy / R; stick.firstChild.style.transform = `translate(${dx}px,${dy}px)`; }
    else { G.cam.yaw -= (e.clientX - t.x) * .0065; G.cam.pitch = clamp(G.cam.pitch - (e.clientY - t.y) * .004, -.75, .55); t.x = e.clientX; t.y = e.clientY; }
  });
  const up = e => { const t = T.get(e.pointerId); if (!t) return; T.delete(e.pointerId); if (t.left) { G.in.mx = G.in.mz = 0; stick.style.display = 'none'; } };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  const hold = (id, on, off) => { const b = $(id); b.addEventListener('pointerdown', e => { e.preventDefault(); auInit(); on(); try { b.setPointerCapture(e.pointerId); } catch (er) { } }); for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, off); };
  hold('bAct', () => { G.in.act = true; G.in.actTap = true; }, () => { G.in.act = false; });
  hold('bSJ', () => { G.in.sj = true; }, () => { G.in.sj = false; });
  hold('bRun', () => { G.in.run = true; }, () => { G.in.run = false; });
  $('bLight').addEventListener('click', () => { const p = me(); if (p) { p.light = !p.light; au.door(); } });
  $('bCrouch').addEventListener('click', () => { const p = me(); if (p) p.crouch = !p.crouch; });
  $('bPrev').addEventListener('click', () => sjCycle(-1)); $('bNext').addEventListener('click', () => sjCycle(1));
  $('bNoise').addEventListener('click', () => { const v = G.sj.view; if (v && v.k === 'e' && (G.poltT || 0) <= G.time) { G.poltT = G.time + 20; req('polt', { id: v.o.id }); } });
  // キーボード
  const K = new Set();
  const keyAxes = () => { G.in.kx = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0); G.in.kz = (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0) - (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0); };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || G.mode !== 'game') return; if (e.repeat) return; K.add(e.code); keyAxes(); const p = me(); auInit();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') G.in.run = true;
    if (e.code === 'KeyC') p.crouch = !p.crouch;
    if (e.code === 'KeyF') p.light = !p.light;
    if (e.code === 'KeyQ') G.in.sj = true;
    if (e.code === 'KeyE' || e.code === 'Space') { G.in.act = true; G.in.actTap = true; }
    if (e.code === 'KeyM') { if ($('mapv').classList.contains('hide')) { drawMap(); $('mapv').classList.remove('hide'); } else $('mapv').classList.add('hide'); }
    if (e.code === 'KeyZ') sjCycle(-1); if (e.code === 'KeyX') sjCycle(1); if (e.code === 'KeyR') $('bNoise').click();
  });
  addEventListener('keyup', e => {
    K.delete(e.code); keyAxes();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') G.in.run = false; if (e.code === 'KeyQ') G.in.sj = false; if (e.code === 'KeyE' || e.code === 'Space') G.in.act = false;
  });
  addEventListener('blur', () => { K.clear(); keyAxes(); Object.assign(G.in, { run: false, act: false, sj: false, mx: 0, mz: 0 }); });
}

// ================================================================ テスト用の窓口
G.debug = {
  tp(x, z) { const p = me(); p.x = x; p.z = z; p.tx = x; p.tz = z; },
  give(id) { G.team.add(id); if (id === 'pipe') me().weapon = 'pipe'; if (id === 'med') me().med++; },
  setT(t) { G.t = t; }, bcast, req, handleReq, findPath, los, rayT, genWorld, spawnEnemy, turnPlayer, applyEv, sendP,
  nav: () => G.W.nav, S, BAND, T_SIREN, N_SIREN, T_END, inExitZone, findInteract, seeScore, collide,
};

window.me = me;
setupUI();
requestAnimationFrame(tick);
// URLから自動で始める（テスト用）: ?solo=1 / ?net=local&room=XX&role=host|join
if (Q.has('solo')) { if (Q.get('name')) G.name = Q.get('name'); hostStart(); }
else if (Q.get('net') === 'local') {
  if (Q.get('name')) G.name = Q.get('name');
  netLocal(Q.get('room') || 'TEST', Q.get('role') || 'host');
  showLobby(Q.get('room') || 'TEST');
  lobbyState(isHost() ? '相棒を待っています…（同じ端末の別タブ）' : 'つながるのを待っています…');
}
</script>
