<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>果てなき道 試作：電気の止まった町と電波塔</title>
<style>
html,body{margin:0;height:100%;background:#0b0c10;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════
//  果てなき道（試作）— 電気の止まった町と、てっぺんまで歩いて登れる電波塔
//  移動 WASD/矢印  走る Shift  調べる・使う E/スペース  押しのける F  休む/立つ Z
// ════════════════════════════════════════════════════════════════
const CW=1280,CH=720;
const cv=document.getElementById('c');cv.width=CW;cv.height=CH;const ctx=cv.getContext('2d');
const TEST=/test/.test(location.search);

// ───────── 道具 ─────────
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261014);
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1+7,y*2.1)*.3+vn(x*4.3,y*4.3+3)*.15;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const _hc={};const hx=c=>_hc[c]||(_hc[c]=(n=>[n>>16&255,n>>8&255,n&255])(parseInt(c.slice(1),16)));
const sh=(c,f,a)=>{const[r,g,b]=hx(c);const q=v=>Math.max(0,Math.min(255,v*f))|0;return a==null?`rgb(${q(r)},${q(g)},${q(b)})`:`rgba(${q(r)},${q(g)},${q(b)},${a})`};
const mixc=(c1,c2,t)=>{const a=hx(c1),b=hx(c2);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*clamp(t,0,1)).toString(16).padStart(2,'0')).join('')};
function fp(c,pts,fill,stroke,lw){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke()}}
function ln(c,a,b,col,lw){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.strokeStyle=col;c.lineWidth=lw||1;c.stroke()}
const LVEC=(()=>{const v=[-.7,.45,.55],l=Math.hypot(...v);return v.map(a=>a/l)})();
const shadeF=(x,y,z)=>{const l=Math.hypot(x,y,z)||1;return .55+.6*Math.max(0,(x*LVEC[0]+y*LVEC[1]+z*LVEC[2])/l)};
const JP='"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif';

// ════════════════ 世界のデータ ════════════════
const GW=140,GH=140,N=GW*GH,LH=2.4,MINL=-1,MAXL=10;
const EMPTY=0,FLOOR=1,WALL=2,WIN=3,DOOR=4,RAIL=5,STAIR=6,HOLE=7,SOLIDX=8,SHAFT=9,GLASS=10,ROOF=11;
const FM={none:0,tile:1,wood:2,carpet:3,conc:4,metal:5,roof:6};
const FMCOL=['#000','#cfcac0','#a87e50','#7a5a6a','#8e8b84','#6a6e74','#9a968e'];
const LEV={};for(let L=MINL;L<=MAXL;L++)LEV[L]={t:new Uint8Array(N),fm:new Uint8Array(N),bid:new Uint8Array(N)};
const key=(x,y)=>y*GW+x;
const BLD=[null];// 建物
const DOORS=new Map();// L*N+k → 扉
const OBJ=[];const SOLID={};for(let L=MINL;L<=MAXL;L++)SOLID[L]=new Map();
const RUNS=[],RUNON={},HOLEON={};for(let L=MINL;L<=MAXL;L++){RUNON[L]=new Map();HOLEON[L]=new Map()}

function stamp(L,ox,oy,rows,bid,fm=FM.tile){const g=LEV[L];
  for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch===' ')continue;const x=ox+i,y=oy+j,k=key(x,y);g.bid[k]=bid;g.fm[k]=fm;
    switch(ch){case '#':g.t[k]=WALL;break;case 'W':g.t[k]=WIN;break;case '.':g.t[k]=FLOOR;break;case ',':g.t[k]=FLOOR;g.fm[k]=FM.wood;break;case ':':g.t[k]=FLOOR;g.fm[k]=FM.carpet;break;case ';':g.t[k]=FLOOR;g.fm[k]=FM.conc;break;
      case 'D':g.t[k]=DOOR;addDoor(L,x,y,'D');break;case 'L':g.t[k]=DOOR;addDoor(L,x,y,'D','key_staff');break;case 'K':g.t[k]=DOOR;addDoor(L,x,y,'gate','crowbar');break;
      case 'G':g.t[k]=DOOR;addDoor(L,x,y,'G');break;case 'E':g.t[k]=DOOR;addDoor(L,x,y,'E');break;case 's':g.t[k]=STAIR;break;case 'h':g.t[k]=HOLE;break;case 'x':g.t[k]=SOLIDX;break;
      case 'e':g.t[k]=SHAFT;break;case 'g':g.t[k]=GLASS;break;case 'r':g.t[k]=RAIL;g.fm[k]=FM.conc;break;case 'R':g.t[k]=ROOF;g.fm[k]=FM.roof;break}}}
function addDoor(L,x,y,kind,lock){DOORS.set(L*N+key(x,y),{L,x,y,kind,open:false,lock:lock||null,stuck:kind==='G',axis:'x',bid:LEV[L].bid[key(x,y)]})}
function addRun(L,tiles,dir,entry,arr){const r={L,tiles,dir,len:tiles.length,set:new Set(tiles.map(([x,y])=>key(x,y))),entry:key(...entry),arr:key(...arr),entryXY:entry,arrXY:arr};RUNS.push(r);for(const k of r.set){RUNON[L].set(k,r);HOLEON[L+1].set(k,r)}return r}
function obj(o){o.L=o.L||0;o.w=o.w||1;o.h=o.h||1;OBJ.push(o);if(o.solid!==false)for(let i=0;i<o.w;i++)for(let j=0;j<o.h;j++)SOLID[o.L].set(key(o.x+i,o.y+j),o);return o}

// ───────── 地面（町と、そのまわり） ─────────
const GT=new Uint8Array(N);// 0草 1道路 2歩道 3広場 4土 5畑 6森 7水 8駐車場
const TG={grass:0,road:1,walk:2,plaza:3,dirt:4,field:5,forest:6,water:7,lot:8};
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const d=Math.hypot(x-66,y-58);let t=TG.grass;
  if(d>44&&fbm(x/13,y/13)>.55)t=TG.field;if(fbm(x/17+40,y/17)>.6&&d>36)t=TG.forest;
  const ry=72+Math.sin(x/9)*4+Math.sin(x/23)*6;if(d>40&&Math.abs(y-ry-24)<1.6)t=TG.water;GT[key(x,y)]=t}
const setG=(x0,y0,x1,y1,t)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)GT[key(x,y)]=t};
setG(4,57,135,57,TG.walk);setG(4,62,135,62,TG.walk);setG(47,14,47,56,TG.walk);setG(52,14,52,56,TG.walk);setG(47,63,47,120,TG.walk);setG(52,63,52,120,TG.walk);
setG(4,58,135,61,TG.road);setG(48,10,51,130,TG.road);
setG(53,32,81,56,TG.plaza);setG(79,63,98,76,TG.lot);
for(const[x0,y0]of[[26,46],[37,46],[28,64],[39,64]])setG(x0+3,y0>60?y0-1:y0+8,x0+5,y0>60?y0-1:y0+8,TG.walk);

// ───────── 電波塔（地下1階〜てっぺん） ─────────
const BX=58,BY=38,T_ID=1;BLD.push({id:1,name:'電波塔',wall:'#d6d0c4',inner:'#c9c3b8',roof:'flat'});
stamp(0,BX,BY,[
 '##################',
 '#....#,,,,,,#....#',
 '#....D,,,,,,#hhh.#',
 '#....#,,,,,,#....#',
 '#....#########L###',
 '#....#.sssx.#....W',
 '#....#......#ee..#',
 'W....#......#ee..#',
 '#....#......#.E..#',
 '##D###D######....#',
 '#................#',
 'W................W',
 '#................#',
 '#######WGGW#######'],T_ID);
stamp(-1,BX,BY,[
 '##################',
 '#xxxxxxxxxxx#xxxx#',
 '#xxxxxxxxxxx;sssx#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx#;;;;;;;;;;#',
 '#xxxxx############',
 '##################',
 '##################'],T_ID,FM.conc);
// 塔の芯（階段室）：偶数階は東向きの階段、奇数階は西向きの階段
const coreRows=(L)=>{const even=L%2===0;const top=L===MAXL-1;
  return[even?'###WW###':'####W###',
    even?'#.sssx.#':'#.hhh..#',
    '#......#',
    top?'######K#':(even?'#..hhh.#':'#.xsss.#'),
    '#......#',
    even?'###WW###':'##W#####']};
for(let L=1;L<=MAXL-1;L++){if(L===8)continue;stamp(L,BX+5,BY+4,coreRows(L),T_ID,FM.conc);for(const[x,y]of[[13,6],[14,6],[13,7],[14,7],[14,8]])stamp(L,BX+x,BY+y,['e'],T_ID)}
// 1階の屋根（芯のまわり）
for(let j=0;j<14;j++)for(let i=0;i<18;i++){const k=key(BX+i,BY+j);if(LEV[1].t[k]===EMPTY){LEV[1].t[k]=ROOF;LEV[1].fm[k]=FM.roof;LEV[1].bid[k]=T_ID}}
// 展望台（8階）：八角形の床とガラス
const DCX=BX+8.5,DCY=BY+6.5;
{const inD=(x,y)=>{const dx=x+.5-DCX,dy=y+.5-DCY;return Math.abs(dx)<=9&&Math.abs(dy)<=9&&Math.abs(dx)+Math.abs(dy)<=12.5};
  for(let y=BY-6;y<BY+20;y++)for(let x=BX-4;x<BX+22;x++){if(!inD(x,y))continue;const k=key(x,y),edge=!inD(x+1,y)||!inD(x-1,y)||!inD(x,y+1)||!inD(x,y-1);LEV[8].t[k]=edge?GLASS:FLOOR;LEV[8].fm[k]=FM.wood;LEV[8].bid[k]=T_ID}
  stamp(8,BX+5,BY+4,['####.###','#.sssx.#','#......#','#..hhh.#','#......#','####.###'],T_ID,FM.conc);stamp(8,BX+14,BY+8,['E'],T_ID);for(const[x,y]of[[13,6],[14,6],[13,7],[14,7]])stamp(8,BX+x,BY+y,['e'],T_ID)}
// てっぺん（10階）：芯の屋上
stamp(10,BX+5,BY+4,['rrrrrrrr','r;;;;;;r','r;;;;;;r','r;;;;;;r','r;;;;;;r','rrrrrrrr'],T_ID,FM.conc);
// 階段のつながり
for(let L=0;L<=8;L+=2)addRun(L,[[BX+7,BY+5],[BX+8,BY+5],[BX+9,BY+5]],[1,0],[BX+6,BY+5],[BX+10,BY+5]);
for(let L=1;L<=7;L+=2)addRun(L,[[BX+10,BY+7],[BX+9,BY+7],[BX+8,BY+7]],[-1,0],[BX+11,BY+7],[BX+7,BY+7]);
addRun(-1,[[BX+13,BY+2],[BX+14,BY+2],[BX+15,BY+2]],[1,0],[BX+12,BY+2],[BX+16,BY+2]);

// ───────── 民家・ガソリンスタンド ─────────
const HOUSE=['###W#W###','#:::#,,,#','W:::#,,,W','#:::D,,,#','##D###D##','#,,,,,,,#','W,,,,,,,W','####D####'];
const HCOL=[['#e2d8c4','#a8402c'],['#d8dcd4','#45566b'],['#ece2cc','#5e4c3b'],['#d4c8b4','#4a5a3a']];
const HOUSES=[[26,46,0],[37,46,0],[28,64,1],[39,64,1]];
HOUSES.forEach(([x,y,flip],i)=>{const id=BLD.length;BLD.push({id,name:'民家',wall:HCOL[i][0],inner:'#efe6d6',roof:'gable',roofCol:HCOL[i][1],x,y,w:9,h:8});stamp(0,x,y,flip?[...HOUSE].reverse():HOUSE,id,FM.wood)});
const SHOP_ID=BLD.length;BLD.push({id:SHOP_ID,name:'ガソリンスタンド',wall:'#ece6da',inner:'#f2eee6',roof:'flat',roofCol:'#c9372c'});
stamp(0,88,65,['##WGGW###','#.....#,#','W.....D,#','#.....#,#','#.....#,#','#########'],SHOP_ID);
for(let j=0;j<6;j++)for(let i=0;i<9;i++){const k=key(88+i,65+j);LEV[1].t[k]=ROOF;LEV[1].fm[k]=FM.roof;LEV[1].bid[k]=SHOP_ID}
// 扉の向き
for(const d of DOORS.values()){const g=LEV[d.L],t=(x,y)=>g.t[key(x,y)];const open=(x,y)=>t(x,y)===FLOOR||d.L===0&&t(x,y)===EMPTY;d.axis=(open(d.x,d.y-1)||open(d.x,d.y+1))?'x':'y'}
// 入口のガラス扉は2枚でひと組
for(const d of DOORS.values())if(d.kind==='G')d.group=[...DOORS.values()].filter(e=>e.kind==='G'&&e.L===d.L&&Math.abs(e.x-d.x)+Math.abs(e.y-d.y)<=1);
// 地上の床は地面の絵にも入れる
for(let k=0;k<N;k++)if(LEV[0].bid[k])GT[k]=100+LEV[0].fm[k];

// ───────── 物（家具・機械・乗り物・木） ─────────
const IT={
  water:{n:'水',c:'#5aaef0',use:p=>{p.thirst=clamp(p.thirst+35,0,100);return'のどが うるおった'}},
  juice:{n:'ジュース',c:'#f0a040',use:p=>{p.thirst=clamp(p.thirst+25,0,100);p.hunger=clamp(p.hunger+5,0,100);return'あまい'}},
  bread:{n:'パン',c:'#d8a860',use:p=>{p.hunger=clamp(p.hunger+25,0,100);return'おなかが少しふくれた'}},
  can:{n:'缶詰',c:'#b8b8c0',use:p=>{p.hunger=clamp(p.hunger+40,0,100);return'しっかり食べた'}},
  snack:{n:'おかし',c:'#e85a8a',use:p=>{p.hunger=clamp(p.hunger+12,0,100);return'ちょっと元気'}},
  choco:{n:'チョコ',c:'#7a4a2a',use:p=>{p.hunger=clamp(p.hunger+15,0,100);p.stam=clamp(p.stam+30,0,100);return'力がわいてきた'}},
  bandage:{n:'包帯',c:'#f0ece0',use:p=>{p.hp=clamp(p.hp+30,0,100);return'傷の手当てをした'}},
  key_staff:{n:'スタッフの鍵',c:'#e0c040'},
  crowbar:{n:'バール',c:'#c0392b'},
  jerry_full:{n:'携行缶（満タン）',c:'#c8342a'},
  jerry_empty:{n:'携行缶（から）',c:'#7a4038'},
  postcard:{n:'絵はがき',c:'#8ac0e8'},
  battery:{n:'電池',c:'#4a8a4a'},
};
const notes={};
const furn=(type,x,y,o={})=>obj({type,x,y,...o});
// 塔 1階
furn('counter',BX+2,BY+10,{w:3,name:'チケット売り場',items:['key_staff'],label:'引き出しを調べる'});
furn('rack',BX+13,BY+11,{w:2,name:'パンフレット',solid:true,read:'【電波塔のご案内】\n地上150m 展望台 ／ 地上187m 点検階より上は関係者のみ\nエレベーターは地下の発電設備から電気が送られます'});
furn('vending',BX+16,BY+10,{name:'自動販売機',items:['water','juice','water'],needPower:true});
furn('bench',BX+6,BY+11,{w:2,solid:true});furn('bench',BX+10,BY+11,{w:2,solid:true});
furn('model',BX+8,BY+10,{w:2,name:'塔の模型',read:'塔の模型。\n赤と白の鉄骨が、上にいくほど細くなっていく。\nいちばん上にはアンテナと、赤く光るランプ。'});
for(const[x,y,items]of[[1,2,['snack','postcard']],[1,4,['choco']],[1,6,['juice','snack']],[3,3,['water']],[3,6,['postcard','snack']]])furn('shelf',BX+x,BY+y,{name:'おみやげの棚',items});
furn('case',BX+7,BY+2,{w:2,name:'展示ケース',read:'「あの日の夕焼け」という写真。\n展望台から撮った、まっ赤な街。\n下に小さく：ここから見る景色は、毎日ちがう。'});
furn('case',BX+10,BY+1,{name:'展示ケース',read:'建設中の写真。\n鉄骨の上に座って、お弁当を食べる作業員たち。'});
furn('desk',BX+13,BY+1,{name:'スタッフの机',items:['battery'],read:'走り書きのメモ：\n「停電したら地下の発電機。燃料はスタンドで」'});
furn('locker',BX+16,BY+1,{name:'ロッカー',items:['bread','water']});
// 地下 機械室
furn('generator',BX+8,BY+5,{L:-1,w:2,name:'発電機'});
furn('tank',BX+11,BY+4,{L:-1,name:'燃料タンク（から）',read:'燃料タンク。中はからっぽ。\n「携行缶で給油してください」とテープが貼ってある。'});
furn('breaker',BX+16,BY+6,{L:-1,name:'ブレーカー'});
furn('toolcart',BX+12,BY+9,{L:-1,name:'工具ワゴン',items:['crowbar']});
furn('mattress',BX+7,BY+9,{L:-1,w:2,solid:false,name:'寝袋'});
furn('note',BX+9,BY+9,{L:-1,solid:false,name:'書き置き',read:'誰かの書き置き：\n「ここで三日すごした。\n上の展望台からなら、ほかの町の灯りが見えるかもしれない。\nでも燃料がない。スタンドまで行く勇気もない。\n……先に行く。」'});
furn('pipes',BX+15,BY+3,{L:-1,w:2,solid:true});
// 展望台
for(const[x,y]of[[DCX-.5,DCY+7.5],[DCX-8.5,DCY-.5],[DCX+7.5,DCY-.5],[DCX-.5,DCY-8.5],[DCX+5.5,DCY+5.5],[DCX-6.5,DCY-6.5]])furn('telescope',Math.floor(x),Math.floor(y),{L:8,name:'望遠鏡'});
for(const[x,y]of[[DCX-5.5,DCY+5.5],[DCX+5.5,DCY-5.5],[DCX-6.5,DCY+3.5]])furn('bench',Math.floor(x),Math.floor(y),{L:8,w:2,name:'ベンチ',seat:true});
furn('cafe',Math.floor(DCX-3.5),Math.floor(DCY-7.5),{L:8,w:4,name:'カフェのカウンター',items:['water','bread','choco']});
furn('note',Math.floor(DCX-5.5)+1,Math.floor(DCY+5.5)+1,{L:8,solid:false,name:'ベンチの書き置き',read:'ベンチに残された紙：\n「ここから見る夕焼けが、世界でいちばん好きだった。\nまた来よう。ふたりで。」'});
// 点検階・てっぺん
furn('ladder',BX+11,BY+8,{L:9,name:'てっぺんへのはしご'});
furn('toolbox',BX+6,BY+8,{L:9,name:'点検用の箱',items:['bandage']});
furn('ladder_top',BX+11,BY+8,{L:10,solid:false,name:'下へのはしご'});
furn('antenna',BX+8,BY+6,{L:10,w:1,name:'アンテナ'});
// 民家の家具
HOUSES.forEach(([x,y,f],i)=>{const Y=r=>f?y+7-r:y+r;
  furn('bed',x+1,Y(1),{w:2,name:'ベッド',solid:true});furn('wardrobe',x+3,Y(1),{name:'たんす',items:i%2?['bandage']:['snack']});
  furn('fridge',x+7,Y(1),{name:'冷蔵庫',items:i===0?['water','can']:i===1?['juice']:['water']});furn('kitchen',x+5,Y(1),{w:2,name:'台所の戸棚',items:i===2?['can','can']:['bread']});
  furn('sofa',x+5,Y(6),{w:2,name:'ソファ',solid:true});furn('tv',x+1,Y(6),{w:2,name:'テレビ',solid:true});furn('table',x+6,Y(2),{name:'テーブル',solid:true})});
// ガソリンスタンド
