<script>
'use strict';
// ──────── 00_util.js
// ════════════════════════════════════════════════════════════════
//  果てなき道 — 電気の止まった町。ともだちと、てっぺんまで。
//  移動 WASD/矢印  走る Shift  調べる E/スペース  押しのける F  休む Z
//  地図 M  写真 P  持ち物 1〜9
// ════════════════════════════════════════════════════════════════
const CW = 1280, CH = 720;
const cv = document.getElementById('c'); cv.width = CW; cv.height = CH;
const ctx = cv.getContext('2d');
const TEST = /test/.test(location.search);

function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const R = rng(20261014);
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296 };
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v }
const fbm = (x, y) => vn(x, y) * .55 + vn(x * 2.1 + 7, y * 2.1) * .3 + vn(x * 4.3, y * 4.3 + 3) * .15;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t) };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const _hc = {}; const hx = c => _hc[c] || (_hc[c] = (n => [n >> 16 & 255, n >> 8 & 255, n & 255])(parseInt(c.slice(1), 16)));
const sh = (c, f, a) => { const [r, g, b] = hx(c); const q = v => Math.max(0, Math.min(255, v * f)) | 0; return a == null ? `rgb(${q(r)},${q(g)},${q(b)})` : `rgba(${q(r)},${q(g)},${q(b)},${a})` };
const mixc = (c1, c2, t) => { const a = hx(c1), b = hx(c2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(t, 0, 1)).toString(16).padStart(2, '0')).join('') };
function fp(c, pts, fill, stroke, lw) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++)c.lineTo(pts[i][0], pts[i][1]); c.closePath(); if (fill) { c.fillStyle = fill; c.fill() } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke() } }
function ln(c, a, b, col, lw) { c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.strokeStyle = col; c.lineWidth = lw || 1; c.stroke() }
const LVEC = (() => { const v = [-.7, .45, .55], l = Math.hypot(...v); return v.map(a => a / l) })();
const shadeF = (x, y, z) => { const l = Math.hypot(x, y, z) || 1; return .55 + .6 * Math.max(0, (x * LVEC[0] + y * LVEC[1] + z * LVEC[2]) / l) };
const JP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,system-ui,sans-serif';
const JPM = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif';
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c }
// 1ピクセルずつ色を決める小さな絵
function mkTex(w, h, fn) { const c = mkCanvas(w, h), g = c.getContext('2d'), im = g.createImageData(w, h), d = im.data; for (let y = 0; y < h; y++)for (let x = 0; x < w; x++) { const v = fn(x, y); if (!v) continue; const o = (y * w + x) * 4; d[o] = v[0]; d[o + 1] = v[1]; d[o + 2] = v[2]; d[o + 3] = v[3] == null ? 255 : v[3] } g.putImageData(im, 0, 0); return c }
const col3 = (c, f = 1, n = 0) => { const [r, g, b] = hx(c); return [clamp(r * f + n, 0, 255), clamp(g * f + n, 0, 255), clamp(b * f + n, 0, 255)] };

// ──────── 10_world.js
// ════════════════ 世界のしくみ（マス・階・扉・階段・物） ════════════════
const GW = 160, GH = 160, N = GW * GH, LH = 2.4, MINL = -1, MAXL = 10;
const EMPTY = 0, FLOOR = 1, WALL = 2, WIN = 3, DOOR = 4, RAIL = 5, STAIR = 6, HOLE = 7, SOLIDX = 8, SHAFT = 9, GLASS = 10, ROOF = 11, FENCE = 12;
const WALLISH = new Set([WALL, WIN, DOOR, SHAFT, SOLIDX]);
const FM = { none: 0, tile: 1, wood: 2, carpet: 3, conc: 4, metal: 5, roof: 6, tatami: 7, lino: 8, deck: 9, stone: 10, train: 11 };
const LEV = {}; for (let L = MINL; L <= MAXL; L++)LEV[L] = { t: new Uint8Array(N), fm: new Uint8Array(N), bid: new Uint8Array(N), wv: new Uint8Array(N) };
const key = (x, y) => y * GW + x;
const BLD = [null]; function defBuilding(o) { o.id = BLD.length; o.rooms = o.rooms || []; BLD.push(o); return o.id }
const DOORS = new Map(), OBJ = [], SOLID = {}, RUNS = [], RUNON = {}, HOLEON = {};
for (let L = MINL; L <= MAXL; L++) { SOLID[L] = new Map(); RUNON[L] = new Map(); HOLEON[L] = new Map() }

function addDoor(L, x, y, kind, lock) { const d = { L, x, y, kind, open: kind === 'T', lock: lock || null, stuck: kind === 'G', axis: 'x', bid: LEV[L].bid[key(x, y)], id: 'd' + L + '_' + x + '_' + y }; DOORS.set(L * N + key(x, y), d); return d }
function stamp(L, ox, oy, rows, bid, fm = FM.tile, lockKey) {
  const g = LEV[L];
  for (let j = 0; j < rows.length; j++)for (let i = 0; i < rows[j].length; i++) {
    const ch = rows[j][i]; if (ch === ' ') continue; const x = ox + i, y = oy + j, k = key(x, y);
    g.bid[k] = bid; g.fm[k] = fm; g.wv[k] = Math.floor(hash(x * 7 + L, y * 13) * 16);
    switch (ch) {
      case '#': g.t[k] = WALL; break; case 'W': g.t[k] = WIN; break;
      case '.': g.t[k] = FLOOR; break; case ',': g.t[k] = FLOOR; g.fm[k] = FM.wood; break; case ':': g.t[k] = FLOOR; g.fm[k] = FM.carpet; break; case ';': g.t[k] = FLOOR; g.fm[k] = FM.conc; break;
      case 't': g.t[k] = FLOOR; g.fm[k] = FM.tatami; break; case 'l': g.t[k] = FLOOR; g.fm[k] = FM.lino; break; case 'm': g.t[k] = FLOOR; g.fm[k] = FM.train; break; case 'k': g.t[k] = FLOOR; g.fm[k] = FM.deck; break;
      case 'o': g.t[k] = FLOOR; g.fm[k] = FM.roof; break;
      case 'D': g.t[k] = DOOR; addDoor(L, x, y, 'D'); break; case 'S': g.t[k] = DOOR; addDoor(L, x, y, 'S'); break; case 'T': g.t[k] = DOOR; addDoor(L, x, y, 'T'); break;
      case 'L': g.t[k] = DOOR; addDoor(L, x, y, 'D', lockKey || 'key_staff'); break; case 'K': g.t[k] = DOOR; addDoor(L, x, y, 'gate', 'crowbar'); break;
      case 'G': g.t[k] = DOOR; addDoor(L, x, y, 'G'); break; case 'E': g.t[k] = DOOR; addDoor(L, x, y, 'E'); break;
      case 's': g.t[k] = STAIR; break; case 'h': g.t[k] = HOLE; break; case 'x': g.t[k] = SOLIDX; break; case 'e': g.t[k] = SHAFT; break;
      case 'g': g.t[k] = GLASS; break; case 'r': g.t[k] = RAIL; g.fm[k] = fm === FM.tile ? FM.conc : fm; break; case 'f': g.t[k] = FENCE; g.fm[k] = FM.roof; break; case 'R': g.t[k] = ROOF; g.fm[k] = FM.roof; break;
    }
  }
}
// 文字の絵を、配列で組み立てるための道具
function grid(w, h, ch = '#') { return Array.from({ length: h }, () => Array(w).fill(ch)) }
function gfill(g, x0, y0, x1, y1, ch) { for (let y = y0; y <= y1; y++)for (let x = x0; x <= x1; x++)g[y][x] = ch }
const grows = g => g.map(r => r.join(''));
function addRun(L, tiles, dir, entry, arr) { const r = { L, tiles, dir, len: tiles.length, set: new Set(tiles.map(([x, y]) => key(x, y))), entry: key(...entry), arr: key(...arr), entryXY: entry, arrXY: arr }; RUNS.push(r); for (const k of r.set) { RUNON[L].set(k, r); HOLEON[L + 1].set(k, r) } return r }
// 折り返し階段の芯（外枠 8×6・中 6×4）。下の階から上の階まで、1階ごとに向きが変わる
function makeCore(ox, oy, L0, L1, bid, opt = {}) {
  for (let L = L0; L <= L1; L++) {
    const even = (L - L0) % 2 === 0, up = L < L1, down = L > L0, g = grid(8, 6, '#');
    gfill(g, 1, 1, 6, 4, ';');
    if (even) { if (up) { g[1][2] = g[1][3] = g[1][4] = 's'; g[1][5] = 'x' } if (down) { g[3][3] = g[3][4] = g[3][5] = 'h' } }
    else { if (down) { g[1][2] = g[1][3] = g[1][4] = 'h' } if (up) { g[3][2] = 'x'; g[3][3] = g[3][4] = g[3][5] = 's' } }
    const w = opt.win || [[0, 3], [0, 4], [5, 2]]; for (const [r, c] of w) if (g[r][c] === '#') g[r][c] = 'W';
    for (const d of (opt.doors && opt.doors[L]) || []) g[d[0]][d[1]] = d[2] || 'D';
    stamp(L, ox, oy, grows(g), bid, FM.conc);
    const bx = ox + 1, by = oy + 1;
    if (even && up) addRun(L, [[bx + 1, by], [bx + 2, by], [bx + 3, by]], [1, 0], [bx, by], [bx + 4, by]);
    if (!even && up) addRun(L, [[bx + 4, by + 2], [bx + 3, by + 2], [bx + 2, by + 2]], [-1, 0], [bx + 5, by + 2], [bx + 1, by + 2]);
  }
}
function obj(o) { o.L = o.L || 0; o.w = o.w || 1; o.h = o.h || 1; o.id = o.id || ('o' + OBJ.length); OBJ.push(o); if (o.solid !== false) for (let i = 0; i < o.w; i++)for (let j = 0; j < o.h; j++)SOLID[o.L].set(key(o.x + i, o.y + j), o); return o }
function finishDoors() {
  for (const d of DOORS.values()) { const g = LEV[d.L], t = (x, y) => g.t[key(x, y)]; const open = (x, y) => t(x, y) === FLOOR || t(x, y) === STAIR || d.L === 0 && t(x, y) === EMPTY; d.axis = (open(d.x, d.y - 1) || open(d.x, d.y + 1)) ? 'x' : 'y'; d.bid = g.bid[key(d.x, d.y)] }
  for (const d of DOORS.values()) if (d.kind === 'G') d.group = [...DOORS.values()].filter(e => e.kind === 'G' && e.L === d.L && Math.abs(e.x - d.x) + Math.abs(e.y - d.y) <= 1);
}

// ──────── 20_textures.js
// ════════════════ ドット絵の質感（壁・窓・扉・床・屋根） ════════════════
const TXW = 12, TXH = 29;// 壁1マスぶん：横12×縦29ピクセル（高さ2.4）
const TEX = {}; const texKey = (...a) => a.join('|');
function noiseAt(x, y, s) { return (hash(x * 31 + s, y * 17 + s * 3) - .5) }
// 壁の地
function wallTex(kind, base, v = 0) {
  const id = texKey('w', kind, base, v); if (TEX[id]) return TEX[id];
  const b = hx(base), s = v * 97 + kind.length * 13;
  const streak = [Math.floor(hash(s, 1) * 12), Math.floor(hash(s, 2) * 12)], slen = [6 + hash(s, 3) * 14 | 0, 4 + hash(s, 4) * 10 | 0];
  const t = mkTex(TXW, TXH, (x, y) => {
    let f = 1, n = noiseAt(x, y, s) * 10;
    switch (kind) {
      case 'conc': if (x === 0) f -= .09; if (y === 14) f -= .06; if (y === 0) f -= .1; for (let i = 0; i < 2; i++)if (x === streak[i] && y < slen[i]) f -= .07 * (1 - y / slen[i]); if (y > 25) f -= .05 * (y - 25); break;
      case 'siding': { const r = y % 3; if (r === 0) f -= .16; if (r === 1) f += .06; if (x === 0) f += .05; if (y > 26) f -= .12; n *= .5; break }
      case 'plaster': if (y > 24) { f = .62; if (y === 25) f = .5; n *= 1.4 } if (y === 0) f -= .12; if (x === 0 && y <= 24) f -= .04; break;
      case 'board': if (x % 4 === 0) f -= .16; if (y < 2) f -= .12; n += Math.sin(y * .9 + x * 3) * 4; if (y > 26) f -= .1; break;
      case 'log': { const r = y % 4; if (r === 0) f -= .28; if (r === 1) f += .1; if (r === 3) f -= .08; n += Math.sin(x * 1.3 + y) * 3; break }
      case 'tiles': if (y % 3 === 0 || (x + (Math.floor(y / 3) % 2) * 2) % 4 === 0) f -= .1; if (y > 26) f -= .08; break;
      case 'school': if (y === 12 || y === 13) f -= .1; if (y === 0) f -= .1; if (x === 0) f -= .05; if (y > 26) f -= .14; break;
      case 'metal': { f = 1 + (y < 6 ? .06 : 0) - (y > 24 ? .08 : 0); if (y === 19 || y === 20) return col3('#2f9a5a', 1, n * .4); if (y === 21) return col3('#e07a2a', 1, n * .4); if (x === 0) f -= .08; n *= .4; break }
      case 'shop': if (y >= 1 && y <= 3) return col3('#3a9a5a', 1, n * .3); if (y === 4) return col3('#f0f0f0'); if (y >= 5 && y <= 6) return col3('#3a6ab8', 1, n * .3); if (x === 0) f -= .05; if (y > 26) f -= .1; n *= .4; break;
      case 'shaft': if (x === 0 || x === 11) f -= .12; if ((x === 2 || x === 9) && y % 6 === 3) f += .2; if (y % 12 === 0) f -= .08; break;
      case 'inner': if (y > 26) return col3('#7a5a3a', 1, n); if (y === 26) return col3('#5a4028'); if ((x * 3 + y) % 7 === 0) f -= .03; n *= .4; break;
      case 'innerjp': if (x <= 1) return col3('#8a6440', x === 0 ? .85 : 1, n * .5); if (y < 3) return col3('#8a6440', y === 2 ? .8 : 1); if (y > 26) return col3('#6a4a2e', 1, n * .5); n *= .5; break;

}
// 窓（壁の上に重ねる）。v：0-7ふつう 8-10カーテン 11-12割れ 13-14板 15暗い
const CURT = ['#c84a4a', '#4a7ac8', '#d8b84a', '#7ab86a', '#b87ac8', '#e8e0d0'];
function winTex(v, frame = '#c8ccd0', lit = false, tall = false) {
  const id = texKey('win', v, frame, lit, tall); if (TEX[id]) return TEX[id];
  const y0 = tall ? 3 : 6, y1 = tall ? 26 : 18, x0 = 1, x1 = 10, fr = hx(frame), cur = hx(CURT[v % 6]), side = v % 2;
  const t = mkTex(TXW, TXH, (x, y) => {
    if (x < x0 || x > x1 || y < y0 || y > y1) return null;
    if (x === x0 || x === x1 || y === y0 || y === y1 || (!tall && x === 5 || tall && x === 5 && false) || (tall && y === 15)) return [fr[0], fr[1], fr[2]];
    if (v === 13 || v === 14) { const pl = v === 13 ? Math.floor((y - y0) / 3) % 2 : Math.floor((x + y) / 3) % 2; return col3('#7a5a38', pl ? 1 : .8, noiseAt(x, y, 5) * 12) }

    if (lit) { if (v >= 8 && v <= 10 && (side ? x > 6 : x < 5)) return col3(CURT[v % 6], 1.15, 30); const w = 1 - Math.abs(gy - .5) * .5; return [255 * w, 210 * w, 130 * w] }
    if (v === 15) return [26, 30, 38];
    if (v === 11 || v === 12) { const cx = v === 11 ? 4 : 7, cy = y0 + 5; const d = Math.hypot(x - cx, (y - cy) * .8); if (d < 2.4 + noiseAt(x, y, 9) * 2) return [18, 20, 26]; if (Math.abs((x - cx) - (y - cy)) < .6 || Math.abs((x - cx) + (y - cy) * .5) < .5) return [230, 236, 240] }
    if (v >= 8 && v <= 10 && (side ? x > 6 : x < 5)) { const fold = (x % 2) ? .9 : 1.05; return col3(CURT[v % 6], fold, 0) }

// 扉（壁の上に重ねる）
function doorTex(kind, open = false) {

// 床（1マス 12×12 を菱形に貼る）
function floorTex(fm, v = 0) {

    const n = noiseAt(x, y, fm * 11 + v) * 10;

      case FM.tile: { const g = (x % 6 === 0 || y % 6 === 0) ? .86 : 1; return col3('#d8d4ca', g, n * .5) }
      case FM.wood: { const r = Math.floor(y / 3), seam = y % 3 === 0 || (x + r * 5) % 12 === 0; return col3(r % 2 ? '#a87e50' : '#9a7248', seam ? .8 : 1, n) }

      case FM.roof: { const d = (x === 0 || y === 0) ? .9 : 1; return col3('#9a968e', d, n) }
      case FM.tatami: { if (x === 0 || x === 11) return col3('#3a4a2a', 1, n * .3); const w = (y % 2) ? 1 : .94; return col3('#c8c08a', w, n * .6) }

      case FM.train: { if (y === 0 || y === 11) return col3('#5a5e66'); return col3('#8a8e94', (x % 3 === 0) ? 1.05 : 1, n * .4) }

// 屋根の瓦（くり返し模様）
function roofTex(kind) {
