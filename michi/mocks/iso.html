<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>果てなき道 斜め見下ろしの見本</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;background:#111}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const CW=1280,CH=720;
const Q=new URLSearchParams(location.search),S=Q.get('s')||'tower';
const cv=document.getElementById('c');cv.width=CW;cv.height=CH;const ctx=cv.getContext('2d');

// ───────── 道具 ─────────
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(4242);
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1+7,y*2.1)*.3+vn(x*4.3,y*4.3+3)*.15;
const _hc={};const hx=c=>_hc[c]||(_hc[c]=(n=>[n>>16&255,n>>8&255,n&255])(parseInt(c.slice(1),16)));
const sh=(c,f,a)=>{const[r,g,b]=hx(c);const q=v=>Math.max(0,Math.min(255,v*f))|0;return a==null?`rgb(${q(r)},${q(g)},${q(b)})`:`rgba(${q(r)},${q(g)},${q(b)},${a})`};
const mix=(c1,c2,t)=>{const a=hx(c1),b=hx(c2);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
function fp(c,pts,fill,stroke,lw){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke()}}
function ln(c,a,b,col,lw){c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.strokeStyle=col;c.lineWidth=lw||1;c.stroke()}
const LV=(()=>{const v=[-.7,.45,.55],l=Math.hypot(...v);return v.map(a=>a/l)})();
const shadeF=(x,y,z)=>{const l=Math.hypot(x,y,z)||1;return .55+.6*Math.max(0,(x*LV[0]+y*LV[1]+z*LV[2])/l)};
const GLOWS=[];// 暗くしたあとで光らせる物

// ───────── 見え方（斜め見下ろし） ─────────
function view(cam,k){const TW=48*k,TH=24*k,ZH=24*k,ox=CW/2-(cam.x-cam.y)*TW/2,oy=CH/2-(cam.x+cam.y)*TH/2+(cam.z||0)*ZH;
  return{k,TW,TH,ZH,ox,oy,p:(x,y,z=0)=>[ox+(x-y)*TW/2,oy+(x+y)*TH/2-z*ZH],vis:(mx,my,nx,ny)=>nx+ny>1e-6,dist:(x,y)=>-(x+y),
    gtf:(GS,z=0)=>[TW/2/GS,TH/2/GS,-TW/2/GS,TH/2/GS,ox,oy-z*ZH],wtf:(z=0)=>[TW/2,TH/2,-TW/2,TH/2,ox,oy-z*ZH]}}

// ───────── 地面の模様 ─────────
const T={GR:0,RD:1,SW:2,DT:3,CO:4,FD:5,FF:6,WA:7,SA:8,RK:9,WD:10,MD:11};
function groundTex(W,H,GS,tt,opt={}){const cv=document.createElement('canvas');cv.width=W*GS;cv.height=H*GS;const g=cv.getContext('2d'),im=g.createImageData(W*GS,H*GS),d=im.data;
  const at=(x,y)=>(x<0||y<0||x>=W||y>=H)?-1:tt(x,y);
  for(let y=0;y<H*GS;y++)for(let x=0;x<W*GS;x++){const tx=(x/GS)|0,ty=(y/GS)|0,px=x%GS,py=y%GS,t=tt(tx,ty),h=hash(x,y),n=fbm(x/40,y/40),n2=vn(x/9+50,y/9);let r,gg,b;
    if(t===T.GR||t===T.FF){const base=opt.grass||[86,118,56];if(t===T.GR){r=base[0]+n*28-10;gg=base[1]+n*16;b=base[2]-n*6}else{r=56+n2*10;gg=78+n2*10;b=44}
      const e=(h-.5)*16;r+=e;gg+=e;b+=e*.6;if(h<.07){r+=20;gg+=24;b+=10}if(t===T.FF&&h>.85){r=94;gg=72;b=44}
      if(t===T.GR&&h<(opt.flowers||.004)){const k=hash(x+7,y);if(k<.4){r=230;gg=210;b=100}else if(k<.75){r=220;gg=140;b=160}else{r=240;gg=240;b=240}}}
    else if(t===T.RD){const patch=vn(x/22+9,y/22)>.68;r=gg=b=patch?50:60;const e=(h-.5)*10;r+=e;gg+=e;b+=e+2;if(hash(x>>1,y)<.012){r-=16;gg-=16;b-=16}}
    else if(t===T.SW){r=150;gg=147;b=138;const e=(h-.5)*10;r+=e;gg+=e;b+=e;if(px===0||py===0){r-=26;gg-=26;b-=26}}
    else if(t===T.CO){r=128;gg=125;b=118;const e=(h-.5)*12;r+=e;gg+=e;b+=e;if((tx%3===0&&px===0)||(ty%3===0&&py===0)){r-=18;gg-=18;b-=18}}
    else if(t===T.FD){const fc=opt.field?opt.field(tx,ty):[200,166,74];const row=(y%6);if(row<3){r=fc[0];gg=fc[1];b=fc[2];const e=(hash(x>>1,y>>1)-.5)*30;r+=e;gg+=e;b+=e*.5}else{r=fc[0]*.62;gg=fc[1]*.6;b=fc[2]*.58}}
    else if(t===T.DT){r=124;gg=100;b=72;const e=(h-.5)*20;r+=e;gg+=e;b+=e;if(h<.05){r=150;gg=140;b=126}}
    else if(t===T.WA){r=34;gg=60;b=72;const e=(n-.5)*20;r+=e;gg+=e;b+=e}
    else if(t===T.SA){r=206;gg=188;b=140;const e=(h-.5)*18;r+=e;gg+=e;b+=e}
    else if(t===T.RK){r=118;gg=110;b=100;const e=(n2-.5)*40+(h-.5)*14;r+=e;gg+=e;b+=e}
    else if(t===T.MD){r=104;gg=88;b=66;const e=(h-.5)*14;r+=e;gg+=e;b+=e}
    else if(t===T.WD){const pl=(y%5);r=170;gg=130;b=86;if(pl===0){r=120;gg=88;b=56}const e=(hash(x>>3,(y/5)|0)-.5)*30;r+=e;gg+=e*.8;b+=e*.6}
    // 岸辺のなじませ
    if(t!==T.WA&&t!==T.WD&&[at(tx-1,ty),at(tx+1,ty),at(tx,ty-1),at(tx,ty+1)].includes(T.WA)&&opt.shore!==false&&hash(x+3,y+9)<.35){r=196;gg=180;b=134}
    const o=(y*W*GS+x)*4;d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=255}
  g.putImageData(im,0,0);return cv}

// ───────── 立体（箱・建物・木・人） ─────────
function prism(c,V,poly,z0,z1,col,top,edge){const cx=poly.reduce((s,p)=>s+p[0],0)/poly.length,cy=poly.reduce((s,p)=>s+p[1],0)/poly.length,fs=[];
  for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;let nx=b[1]-a[1],ny=-(b[0]-a[0]);if((mx-cx)*nx+(my-cy)*ny<0){nx=-nx;ny=-ny}if(V.vis(mx,my,nx,ny))fs.push({a,b,d:V.dist(mx,my),nx,ny})}
  fs.sort((p,q)=>q.d-p.d);for(const f of fs)fp(c,[V.p(f.a[0],f.a[1],z0),V.p(f.b[0],f.b[1],z0),V.p(f.b[0],f.b[1],z1),V.p(f.a[0],f.a[1],z1)],sh(col,shadeF(f.nx,f.ny,0)),edge,1);
  if(top!==false)fp(c,poly.map(p=>V.p(p[0],p[1],z1)),top||sh(col,shadeF(0,0,1)),edge,1);return fs}
const box=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const rbox=(x,y,a,l,w)=>{const f=[Math.cos(a),Math.sin(a)],s=[-f[1],f[0]];return[[l,-w],[l,w],[-l,w],[-l,-w]].map(([u,v])=>[x+f[0]*u+s[0]*v,y+f[1]*u+s[1]*v])};
const ngon=(x,y,r,n,ph=0)=>Array.from({length:n},(_,i)=>[x+Math.cos(ph+i/n*Math.PI*2)*r,y+Math.sin(ph+i/n*Math.PI*2)*r]);
const wpt=(V,a,b,u,z)=>{const L=Math.hypot(b[0]-a[0],b[1]-a[1]),k=u/L;return V.p(a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,z)};
function wq(c,V,w,u0,u1,z0,z1,fill,stroke,lw){const q=[wpt(V,w.a,w.b,u0,z0),wpt(V,w.a,w.b,u1,z0),wpt(V,w.a,w.b,u1,z1),wpt(V,w.a,w.b,u0,z1)];fp(c,q,fill,stroke,lw);return q}
// 建物：b={x,y,w,h,z?,hw,hr?,flat?,roof,wall,door:'n|e|s|w',logs?,lit?,winEvery?}
function building(c,V,b){const z0=b.z||0,x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.h,hw=b.hw,along=b.w>=b.h,top=hw+(b.hr||0),k=V.k;
  const walls=[{a:[x0,y0],b:[x1,y0],n:[0,-1],s:'n'},{a:[x1,y0],b:[x1,y1],n:[1,0],s:'e'},{a:[x1,y1],b:[x0,y1],n:[0,1],s:'s'},{a:[x0,y1],b:[x0,y0],n:[-1,0],s:'w'}];
  const mid=w=>[(w.a[0]+w.b[0])/2,(w.a[1]+w.b[1])/2];const P=(x,y,z)=>V.p(x,y,z0+z);const Vz={...V,p:P};
  for(const w of walls.filter(w=>V.vis(...mid(w),w.n[0],w.n[1]))){const f=shadeF(w.n[0],w.n[1],0),L=Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]);
    const pts=[P(...w.a,0),P(...w.b,0),P(...w.b,hw),P(...w.a,hw)];const gable=!b.flat&&(along?(w.s==='e'||w.s==='w'):(w.s==='n'||w.s==='s'));if(gable)pts.splice(3,0,P(...mid(w),top-.02));
    fp(c,pts,sh(b.wall,f));c.save();fp(c,pts,null);c.clip();
    const step=b.logs?.2:.22;if(!b.glass)for(let z=step;z<top;z+=step)ln(c,wpt(Vz,w.a,w.b,0,z),wpt(Vz,w.a,w.b,L,z),b.logs?'rgba(0,0,0,.28)':'rgba(0,0,0,.09)',b.logs?1.6*k:1);
    c.restore();ln(c,pts[0],pts[1],'rgba(0,0,0,.35)',1.5);
    if(b.glass){// ビル：階ごとの窓
      for(let z=.35;z<hw-.2;z+=.62)for(let u=.25;u<L-.3;u+=.62){const lit=hash((b.x*31+u*7)|0,(b.y*17+z*13+w.s.charCodeAt(0))|0);const q=wq(c,Vz,w,u,u+.38,z,z+.38,lit>.55?'#ffcf86':'#2a3440');if(lit>.55)GLOWS.push({poly:q,col:lit>.9?'rgba(170,200,255,.55)':'rgba(255,190,110,.5)'})}continue}
    const isDoor=w.s===b.door;if(isDoor){const q=wq(c,Vz,w,L/2-.42,L/2+.42,0,1.2,sh('#5a3d28',f),'rgba(0,0,0,.4)',1)}
    const n=Math.max(1,Math.floor(L/(b.winEvery||2.1)));
    for(let i=0;i<n;i++){const u=(i+.5)*L/n;if(isDoor&&Math.abs(u-L/2)<1.0)continue;const board=!b.lit&&hash(b.x*13+i*7,w.s.charCodeAt(0)+b.y)<.3;
      if(board){const q=wq(c,Vz,w,u-.42,u+.42,.55,1.15,'#6e5236','rgba(0,0,0,.4)',1);ln(c,q[0],q[2],'#4c3824',2*k);ln(c,q[3],q[1],'#4c3824',2*k)}
      else{const lit=b.lit&&hash(b.x*7+i,b.y*3+w.s.charCodeAt(0))<b.lit;const q=wq(c,Vz,w,u-.4,u+.4,.55,1.15,lit?'#ffc870':'#22303b','#efe9dc',1.4*k);if(lit)GLOWS.push({poly:q,col:'rgba(255,180,90,.6)'});else wq(c,Vz,w,u-.36,u+.1,.85,1.12,'rgba(255,220,180,.18)')}}}
  if(b.flat){fp(c,box(x0,y0,x1,y1).map(p=>P(p[0],p[1],hw)),sh(b.roof,.86),'rgba(0,0,0,.35)',1);fp(c,box(x0+.18,y0+.18,x1-.18,y1-.18).map(p=>P(p[0],p[1],hw)),sh(b.roof,.72));
    if(b.ac)prism(c,Vz,box(x0+.6,y0+.6,x0+1.4,y0+1.2),hw,hw+.4,'#b9bcc1');return}
  const o=.3,e=hw-.12;let faces;
  if(along){const ym=(y0+y1)/2;faces=[{p:[[x0-o,y0-o,e],[x1+o,y0-o,e],[x1+o,ym,top],[x0-o,ym,top]],n:[0,-(top-e),ym-y0+o],m:[(x0+x1)/2,(y0+ym)/2]},{p:[[x0-o,y1+o,e],[x1+o,y1+o,e],[x1+o,ym,top],[x0-o,ym,top]],n:[0,top-e,y1+o-ym],m:[(x0+x1)/2,(ym+y1)/2]}]}
  else{const xm=(x0+x1)/2;faces=[{p:[[x0-o,y0-o,e],[x0-o,y1+o,e],[xm,y1+o,top],[xm,y0-o,top]],n:[-(top-e),0,xm-x0+o],m:[(x0+xm)/2,(y0+y1)/2]},{p:[[x1+o,y0-o,e],[x1+o,y1+o,e],[xm,y1+o,top],[xm,y0-o,top]],n:[top-e,0,x1+o-xm],m:[(xm+x1)/2,(y0+y1)/2]}]}
  faces.sort((p,q)=>V.dist(...q.m)-V.dist(...p.m));
  for(const f of faces){const Pp=f.p.map(q=>P(...q));fp(c,Pp,sh(b.roof,shadeF(...f.n)));for(let i=1;i<7;i++){const a=i/7;ln(c,[Pp[0][0]+(Pp[3][0]-Pp[0][0])*a,Pp[0][1]+(Pp[3][1]-Pp[0][1])*a],[Pp[1][0]+(Pp[2][0]-Pp[1][0])*a,Pp[1][1]+(Pp[2][1]-Pp[1][1])*a],'rgba(0,0,0,.16)',1)}fp(c,Pp,null,'rgba(0,0,0,.4)',1.2)}
  ln(c,P(...faces[0].p[3]),P(...faces[0].p[2]),sh(b.roof,1.35),2*k);
  if(b.chim)prism(c,Vz,box(x0+b.w*.7,y0+b.h*.25,x0+b.w*.7+.6,y0+b.h*.25+.6),hw,top+.55,'#7d6a5c')}
// 木
const blob=(c,x,y,r,ph)=>{c.beginPath();c.arc(x,y,r*.68,0,7);for(let i=0;i<5;i++){const a=ph+i*1.2566;c.moveTo(x+Math.cos(a)*r*.42+r*.5,y+Math.sin(a)*r*.42);c.arc(x+Math.cos(a)*r*.42,y+Math.sin(a)*r*.42,r*.5,0,7)}c.fill()};
function tree(c,V,t){const z0=t.z||0,u=V.TW*.5,b=V.p(t.x,t.y,z0);
  if(t.kind==='pine'){const m=V.p(t.x,t.y,z0+.5);c.fillStyle='#4a3626';c.fillRect(b[0]-2*V.k,m[1],4*V.k,b[1]-m[1]);
    for(let i=0;i<4;i++){const z=z0+.5+i*t.h*.22,w=t.r*(1-i*.2)*u,hh=t.h*.34*V.ZH,p=V.p(t.x,t.y,z);const col=t.col||'#355e3a';
      fp(c,[[p[0]-w,p[1]],[p[0],p[1]-hh],[p[0]+w,p[1]]],sh(col,.75+i*.1));fp(c,[[p[0]-w*.15,p[1]-hh*.15],[p[0],p[1]-hh],[p[0]+w,p[1]]],sh(col,1.1+i*.08))}return}
  const col=t.col||'#4b7533';const m=V.p(t.x,t.y,z0+t.h*.55);c.fillStyle=t.kind==='birch'?'#e8e2d6':'#4a3626';c.fillRect(b[0]-2.4*V.k,m[1],4.8*V.k,b[1]-m[1]);
  const p1=V.p(t.x,t.y,z0+t.h*.72);c.fillStyle=sh(col,.62);blob(c,p1[0],p1[1],t.r*u,t.ph||0);
  const p2=V.p(t.x-.12,t.y+.05,z0+t.h*.85);c.fillStyle=col;blob(c,p2[0]-t.r*u*.12,p2[1],t.r*u*.76,(t.ph||0)+.6);
  const p3=V.p(t.x-.3,t.y+.1,z0+t.h);c.fillStyle=sh(col,1.3);c.beginPath();c.arc(p3[0]-t.r*u*.25,p3[1],t.r*u*.36,0,7);c.fill()}
// 人（ドット絵の立ち絵）。pose: stand walk sit point carry hammer
function person(c,V,x,y,z,o){const[px,py]=V.p(x,y,z);const p=2*V.k*(o.scale||1.1);
  const me=o.kind==='me',fr=o.kind==='fr',zb=o.kind==='z';const skin=me?'#e8b88c':fr?'#d6a27a':'#9fb38f',jacket=me?'#d9782b':fr?'#2f9a96':(o.col||'#5b6e8a'),pants=me?'#3b4a5c':fr?'#5a4b3f':'#3a3d45',hair=me?'#3a2a1f':fr?'#1d1a18':'#3d4a36',pack=me?'#5a7040':fr?'#8a5a32':null;
  const pose=o.pose||'stand',back=!!o.back,ty=pose==='sit'?3.2:0;
  c.save();c.translate(Math.round(px),Math.round(py));c.scale(o.dir||1,1);const Rr=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x*p,y*p,w*p,h*p)};
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(0,0,4*p,1.6*p,0,0,7);c.fill();
  if(pose==='sit'){Rr(-1.5,-4.2,5.5,2,pants);Rr(-1,-3.6,5.2,1.6,sh(pants,.82));Rr(3,-3,1.9,3,pants);Rr(3,-.7,2.6,.9,'#2a2420')}
  else{const st=(pose==='walk'||pose==='carry')?1.4:0;Rr(-2.5,-6,2,6-st*.4,pants);Rr(.5,-6,2,6,sh(pants,.85));Rr(-2.7+st*-.6,-.8-st*.4,2.4,.8,'#2a2420');Rr(.3+st*.5,-.8,2.4,.8,'#2a2420')}
  if(pack&&!back)Rr(-4.7,-12.4+ty,2,5.4,pack);
  if(pose==='hammer'){c.save();c.translate(-1.5*p,(-12.6+ty)*p);c.rotate(-2.5);Rr(0,-.7,5.8,1.5,sh(jacket,.85));c.restore()}
  Rr(-3,-13+ty,6,7.2,jacket);Rr(-3,-13+ty,6,1.2,sh(jacket,.8));Rr(-3,-6.6+ty,6,.8,sh(jacket,.7));
  if(zb){Rr(-1,-11,2,2.4,'rgba(100,30,25,.85)')}
  Rr(-2.2,-17.6+ty,4.6,4.6,skin);
  if(!zb){Rr(-2.4,-18.2+ty,5,1.6,hair);if(back)Rr(-2.4,-18+ty,5,4.4,hair);else Rr(-2.4,-18+ty,1.6,3.4,hair)}else{Rr(-2.2,-17.8+ty,4.6,1,'#4a5a42')}
  if(fr){Rr(-3.2,-18.6+ty,6.6,1,'#c9b27a');Rr(-2.2,-19.9+ty,4.6,1.5,'#c9b27a')}
  if(!back){Rr(1.4,-16+ty,.8,.8,zb?'#e8f0c0':'#222')}
  const arm=(ang,len,item)=>{c.save();c.translate(2.2*p,(-12.3+ty)*p);c.rotate(ang);Rr(0,-.75,len,1.5,sh(jacket,.88));Rr(len-.2,-.75,1.3,1.5,skin);if(item)item();c.restore()};
  if(pose==='stand'||pose==='walk')arm(1.45,5.2);
  else if(pose==='point')arm(-.75,6.4);
  else if(pose==='sit')arm(.35,4.6,o.mug?()=>Rr(4.4,-2.6,1.5,2,'#c94a3a'):null);
  else if(pose==='carry'){arm(.12,4.6);Rr(-7,-12.6+ty,17,1.1,'#c49a68');Rr(-7,-11.5+ty,17,.4,'#8a6440')}
  else if(pose==='hammer'){arm(-2.2,5.6,()=>{Rr(5.2,-.4,1,2.6,'#6a4a30');Rr(4.3,1.8,2.8,1.4,'#5a5e66')})}
