<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>果てなき道 3D見本</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#views{position:fixed;inset:0;display:flex}
#views canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
<div id="views"></div>
<canvas id="ui"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search), S = Q.get('s') || 'tower';
const W = +Q.get('w') || innerWidth, H = +Q.get('h') || innerHeight;

// ───────── 道具 ─────────
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(20261014);
function mkNoise(seed){const r=rng(seed),a=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const p=new Uint8Array(512);for(let i=0;i<512;i++)p[i]=a[i&255];
  const gr=(h,x,y)=>{const g=h&7,u=g<4?x:y,v=g<4?y:x;return((g&1)?-u:u)+((g&2)?-2*v:2*v)};const fd=t=>t*t*t*(t*(t*6-15)+10),l=(a,b,t)=>a+t*(b-a);
  return(x,y)=>{const xf=Math.floor(x),yf=Math.floor(y),X=xf&255,Y=yf&255;x-=xf;y-=yf;const u=fd(x),v=fd(y),A=p[X]+Y,B=p[X+1]+Y;
    return l(l(gr(p[A],x,y),gr(p[B],x-1,y),u),l(gr(p[A+1],x,y-1),gr(p[B+1],x-1,y-1),u),v)*.5}}
const N1 = mkNoise(7), N2 = mkNoise(19);
const fbm=(n,x,y,o=5)=>{let s=0,a=1,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f,y*f);t+=a;a*=.5;f*=2.03}return s/t};
const ridge=(n,x,y,o=5)=>{let s=0,a=1,f=1,t=0;for(let i=0;i<o;i++){s+=a*(1-Math.abs(n(x*f,y*f)*1.6));t+=a;a*=.5;f*=2.1}return s/t};
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const C = c => new THREE.Color(c);
const lerpC=(a,b,t)=>a.clone().lerp(b,Math.min(1,Math.max(0,t)));

// いくつもの形を1つにまとめる（色つき）
function merge(parts){let n=0;const gs=parts.map(({g,c,m})=>{let q=g.index?g.toNonIndexed():g.clone();if(m)q.applyMatrix4(m);n+=q.attributes.position.count;return{q,c:C(c)}});
  const P=new Float32Array(n*3),Nn=new Float32Array(n*3),Cc=new Float32Array(n*3);let o=0;
  for(const{q,c}of gs){q.computeVertexNormals();const p=q.attributes.position.array,nn=q.attributes.normal.array;P.set(p,o*3);Nn.set(nn,o*3);for(let i=0;i<q.attributes.position.count;i++){Cc[(o+i)*3]=c.r;Cc[(o+i)*3+1]=c.g;Cc[(o+i)*3+2]=c.b}o+=q.attributes.position.count}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(Nn,3));g.setAttribute('color',new THREE.BufferAttribute(Cc,3));return g}
const M4=(x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1)=>new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),Array.isArray(s)?new THREE.Vector3(...s):new THREE.Vector3(s,s,s));
function inst(geo,mat,list,shadow){const m=new THREE.InstancedMesh(geo,mat,list.length),d=new THREE.Object3D();
  list.forEach((o,i)=>{d.position.set(...o.p);d.rotation.set(...(o.r||[0,0,0]));const s=o.s??1;Array.isArray(s)?d.scale.set(...s):d.scale.setScalar(s);d.updateMatrix();m.setMatrixAt(i,d.matrix);if(o.c)m.setColorAt(i,o.c instanceof THREE.Color?o.c:C(o.c))});
  m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;if(shadow){m.castShadow=true;m.receiveShadow=true}return m}
const std=(o={})=>new THREE.MeshStandardMaterial({flatShading:true,roughness:.88,metalness:0,...o});
const at=(o,x,y,z,ex={})=>{o.position.set(x,y,z);Object.assign(o,ex);return o};
const glow=c=>new THREE.MeshBasicMaterial({color:C(c).multiplyScalar(3),toneMapped:false});

// 地形：高さの関数と色の関数から、角ばった面の地面を作る
function terrain(size,seg,hf,colf,cx=0,cz=0){const g=new THREE.PlaneGeometry(size,size,seg,seg);g.rotateX(-Math.PI/2);const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i)+cx,z=pos.getZ(i)+cz;pos.setXYZ(i,x,hf(x,z),z)}
  const q=g.toNonIndexed();q.computeVertexNormals();const p=q.attributes.position,n=q.attributes.normal,col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i+=3){const x=(p.getX(i)+p.getX(i+1)+p.getX(i+2))/3,y=(p.getY(i)+p.getY(i+1)+p.getY(i+2))/3,z=(p.getZ(i)+p.getZ(i+1)+p.getZ(i+2))/3;
    const c=colf(x,y,z,n.getY(i));for(let k=0;k<3;k++){col[(i+k)*3]=c.r;col[(i+k)*3+1]=c.g;col[(i+k)*3+2]=c.b}}
  q.setAttribute('color',new THREE.BufferAttribute(col,3));const m=new THREE.Mesh(q,std({vertexColors:true,roughness:.95}));m.receiveShadow=true;return m}
function water(size,seg,y,col,amp,cx=0,cz=0){const g=new THREE.PlaneGeometry(size,size,seg,seg);g.rotateX(-Math.PI/2);const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i)+cx,z=pos.getZ(i)+cz;pos.setXYZ(i,x,y+(N2(x/9,z/9)+N2(x/23+5,z/31)*.8)*amp,z)}
  const q=g.toNonIndexed();q.computeVertexNormals();const m=new THREE.Mesh(q,std({color:col,roughness:.1,metalness:.55,flatShading:true}));m.receiveShadow=true;return m}

// 空
function skyMat(o){return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:C(o.top)},mid:{value:C(o.mid)},hor:{value:C(o.hor)},sunC:{value:C(o.sun)},sunD:{value:o.dir.clone().normalize()},gnd:{value:C(o.gnd||o.hor)},disc:{value:o.disc??1}},
  vertexShader:`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top,mid,hor,sunC,sunD,gnd;uniform float disc;varying vec3 vD;
  void main(){vec3 d=normalize(vD);float h=d.y,s=max(dot(d,sunD),0.);
    vec3 c=mix(hor,mid,smoothstep(0.,.16,h));c=mix(c,top,smoothstep(.12,.75,h));
    float near=pow(s,4.)*(1.-smoothstep(0.,.45,abs(h)));c=mix(c,sunC*1.1,near*.55);
    c+=sunC*(pow(s,24.)*.5+pow(s,300.)*1.5);c+=sunC*smoothstep(.9991,.9996,s)*8.*disc;
    if(h<0.)c=mix(c,gnd,smoothstep(0.,.06,-h));
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`})}
function setupSky(scene,renderer,o){const sm=skyMat(o);const sky=new THREE.Mesh(new THREE.SphereGeometry(60000,32,16),sm);scene.add(sky);
  const es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),sm));const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(es,.02).texture;
  return sky}

// やわらかい光の玉（焚き火・灯台・街灯のにじみ）
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
function halo(col,size,op=1){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:C(col),transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));s.scale.setScalar(size);return s}

// ───────── 人（自分と友達） ─────────
function person(o){const g=new THREE.Group(),P={g};const M=c=>std({color:c,roughness:.8});
  const mk=(geo,c,par,pos,rot)=>{const m=new THREE.Mesh(geo,M(c));m.position.set(...pos);if(rot)m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;par.add(m);return m};
  const hips=new THREE.Group();hips.position.y=.94;g.add(hips);P.hips=hips;
  mk(new THREE.CylinderGeometry(.19,.2,.18,7),o.pants,hips,[0,.02,0]);
  const torso=new THREE.Group();hips.add(torso);P.torso=torso;
  mk(new THREE.CylinderGeometry(.21,.19,.58,7),o.jacket,torso,[0,.33,0]);
  mk(new THREE.CylinderGeometry(.12,.17,.1,7),o.jacket2||o.jacket,torso,[0,.64,0]);
  const neck=new THREE.Group();neck.position.y=.68;torso.add(neck);P.neck=neck;
  mk(new THREE.IcosahedronGeometry(.15,1),o.skin,neck,[0,.14,0]);
  mk(new THREE.SphereGeometry(.163,8,6,0,Math.PI*2,0,Math.PI*.52),o.hair,neck,[0,.16,-.015],[-.25,0,0]);
  if(o.hat)mk(new THREE.CylinderGeometry(.17,.17,.08,8),o.hat,neck,[0,.27,0]);
  const limb=(par,x,y,len,r1,r2,c,cEnd,endGeo)=>{const j=new THREE.Group();j.position.set(x,y,0);par.add(j);mk(new THREE.CylinderGeometry(r1,r2,len,6),c,j,[0,-len/2,0]);
    const k=new THREE.Group();k.position.y=-len;j.add(k);mk(new THREE.CylinderGeometry(r2,r2*.85,len*.95,6),c,k,[0,-len*.47,0]);if(endGeo)mk(endGeo,cEnd,k,[0,-len*.98,endGeo.type==='BoxGeometry'?.05:0]);return{j,k}};
  P.armL=limb(torso,.27,.6,.31,.072,.062,o.jacket,o.skin,new THREE.IcosahedronGeometry(.055,0));
  P.armR=limb(torso,-.27,.6,.31,.072,.062,o.jacket,o.skin,new THREE.IcosahedronGeometry(.055,0));
  P.legL=limb(hips,.1,0,.44,.09,.075,o.pants,o.shoes,new THREE.BoxGeometry(.13,.08,.26));
  P.legR=limb(hips,-.1,0,.44,.09,.075,o.pants,o.shoes,new THREE.BoxGeometry(.13,.08,.26));
  P.armL.j.rotation.z=.12;P.armR.j.rotation.z=-.12;
  if(o.pack){mk(new THREE.BoxGeometry(.36,.44,.2),o.pack,torso,[0,.36,-.21]);mk(new THREE.CylinderGeometry(.08,.08,.42,8),o.roll||'#7b6a4a',torso,[0,.64,-.22],[0,0,Math.PI/2])}
  return P}
const ME={jacket:'#d9782b',jacket2:'#b8611f',pants:'#3b4a5c',skin:'#e6b98f',hair:'#3a2a1f',shoes:'#2a2420',pack:'#55693d'};
const FR={jacket:'#2f8c8a',jacket2:'#256e6c',pants:'#5a4b3f',skin:'#d8a77c',hair:'#1d1a18',shoes:'#30302e',pack:'#8a5a32',hat:'#c9b27a'};
function sit(P,h=.46){P.hips.position.y=h;for(const L of[P.legL,P.legR]){L.j.rotation.x=-Math.PI/2+.1;L.k.rotation.x=Math.PI/2-.05}}

// ───────── 描く準備（画面ひとつ分） ─────────
function makeView(w,h,scene,cam,bloom=[.55,.5,.82]){const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(w,h);
  r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.getElementById('views').appendChild(r.domElement);
  const comp=new EffectComposer(r);comp.setSize(w,h);comp.addPass(new RenderPass(scene,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(w,h),...bloom));comp.addPass(new OutputPass());
  return{r,comp,cam}}
function sunLight(scene,dir,col,int,focus,ext=40){const l=new THREE.DirectionalLight(col,int);l.position.copy(focus).addScaledVector(dir.clone().normalize(),400);l.target.position.copy(focus);scene.add(l,l.target);
  l.castShadow=true;l.shadow.mapSize.set(2048,2048);const c=l.shadow.camera;c.left=-ext;c.right=ext;c.top=ext;c.bottom=-ext;c.near=1;c.far=1200;l.shadow.bias=-.0004;l.shadow.normalBias=.04;return l}

// ───────── 画面の上の文字・アイコン ─────────
const ui=document.getElementById('ui');ui.width=W;ui.height=H;const U=ui.getContext('2d');
const JP='"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif';
function pill(x,y,text,sub,o={}){U.save();U.font=`bold ${o.fs||20}px ${JP}`;const tw=U.measureText(text).width;U.font=`${o.sfs||14}px ${JP}`;const sw=sub?U.measureText(sub).width:0;
  const w=Math.max(tw,sw)+32,h=sub?62:40;U.fillStyle=o.bg||'rgba(12,14,20,.48)';U.beginPath();U.roundRect(x,y,w,h,12);U.fill();
  U.fillStyle='#fff';U.textBaseline='top';U.font=`bold ${o.fs||20}px ${JP}`;U.fillText(text,x+16,y+9);if(sub){U.fillStyle='rgba(255,255,255,.75)';U.font=`${o.sfs||14}px ${JP}`;U.fillText(sub,x+16,y+37)}U.restore();return w}
function rings(x,y,vals){const ic=[['#f0a24a','food'],['#5aaef0','water'],['#f07a5a','warm'],['#e8556a','hp']];
  vals.forEach((v,i)=>{const cx=x+i*54,cy=y,[col,k]=ic[i];U.save();U.fillStyle='rgba(12,14,20,.5)';U.beginPath();U.arc(cx,cy,22,0,7);U.fill();
    U.lineWidth=4;U.strokeStyle='rgba(255,255,255,.18)';U.beginPath();U.arc(cx,cy,18,0,7);U.stroke();U.strokeStyle=col;U.beginPath();U.arc(cx,cy,18,-Math.PI/2,-Math.PI/2+Math.PI*2*v);U.stroke();
    U.fillStyle=col;U.beginPath();
    if(k==='food'){U.arc(cx,cy+2,7,0,7);U.fill();U.fillStyle='#7aa040';U.fillRect(cx-1,cy-9,2,5)}
    else if(k==='water'){U.moveTo(cx,cy-9);U.quadraticCurveTo(cx+8,cy+2,cx,cy+8);U.quadraticCurveTo(cx-8,cy+2,cx,cy-9);U.fill()}
    else if(k==='warm'){U.moveTo(cx,cy-10);U.quadraticCurveTo(cx+9,cy,cx+5,cy+8);U.lineTo(cx-5,cy+8);U.quadraticCurveTo(cx-9,cy,cx,cy-10);U.fill();U.fillStyle='#ffd27a';U.beginPath();U.arc(cx,cy+4,3.5,0,7);U.fill()}
    else{U.moveTo(cx,cy+8);U.bezierCurveTo(cx-12,cy-2,cx-5,cy-11,cx,cy-4);U.bezierCurveTo(cx+5,cy-11,cx+12,cy-2,cx,cy+8);U.fill()}U.restore()})}
function tag(cam,pos,text,col,ox=0,vw=W){const v=pos.clone().project(cam);if(v.z>1)return;const x=ox+(v.x*.5+.5)*vw,y=(-v.y*.5+.5)*H;U.save();U.font=`bold 15px ${JP}`;const w=U.measureText(text).width+18;
  U.fillStyle='rgba(12,14,20,.55)';U.beginPath();U.roundRect(x-w/2,y-30,w,24,8);U.fill();U.fillStyle=col;U.beginPath();U.arc(x-w/2+10,y-18,4,0,7);U.fill();
  U.fillStyle='#fff';U.textBaseline='middle';U.textAlign='left';U.fillText(text,x-w/2+18,y-18);U.restore()}

// ═════════ 1. 電波塔の展望台（日本の都市・夕暮れ） ═════════
function sceneTower(){const scene=new THREE.Scene();
  const sunDir=new THREE.Vector3(-.32,.035,-1).normalize();
  const cam=new THREE.PerspectiveCamera(52,W/H,.1,70000);
  const V=makeView(W,H,scene,cam,[.7,.55,.78]);
  setupSky(scene,V.r,{top:'#141a46',mid:'#5b4a86',hor:'#f2875a',sun:'#ffb36a',gnd:'#20202a',dir:sunDir});
  scene.fog=new THREE.Fog(C('#9a6a86'),900,17000);scene.environmentIntensity=.55;
  scene.add(new THREE.HemisphereLight(C('#9a8ac8'),C('#3a3040'),.6));
  const DECK=120,focus=new THREE.Vector3(0,DECK,-14);sunLight(scene,sunDir,C('#ffb27a'),1.6,focus,22);
  // 地形（右手が湾）
  const coastX=z=>700+260*Math.sin(z/520+1.2)+140*fbm(N1,7,z/380,3);
  const hf=(x,z)=>{const d=x-coastX(z);let h=3+fbm(N1,x/500,z/500,3)*3;if(d>0)h-=d*.07;const r=Math.hypot(x+300,z+2200);h+=sstep(4500,10000,Math.hypot(x,z))*(40+ridge(N2,x/2600,z/2600,4)*380)*(d<0?1:0);return Math.max(h,-25)};
  const groundC=(x,y,z,ny)=>{if(y<.8)return C('#6b6150');if(y>140)return lerpC(C('#4e5a46'),C('#5b5a62'),(y-140)/500);return lerpC(C('#3d4238'),C('#4a5040'),fbm(N2,x/90,z/90,2)+.5)};
  scene.add(terrain(3200,220,hf,groundC));
  const far=terrain(30000,170,(x,z)=>Math.max(Math.abs(x),Math.abs(z))<1600?-30:hf(x,z),groundC);scene.add(far);
  scene.add(water(30000,120,0,C('#253a5a'),.0));
  // 富士山のような山
  {const g=new THREE.ConeGeometry(3400,1500,30,8);const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i);if(y<740&&y>-740){p.setX(i,p.getX(i)*(1+(R()-.5)*.08));p.setZ(i,p.getZ(i)*(1+(R()-.5)*.08))}}
    const q=g.toNonIndexed();q.computeVertexNormals();const pp=q.attributes.position,col=new Float32Array(pp.count*3);
    for(let i=0;i<pp.count;i+=3){const y=(pp.getY(i)+pp.getY(i+1)+pp.getY(i+2))/3,a=Math.atan2(pp.getZ(i),pp.getX(i));const snow=y>260+Math.sin(a*9)*120+Math.sin(a*23)*50;const c=snow?C('#e9ecf4'):C('#3d4058');for(let k=0;k<3;k++)col.set([c.r,c.g,c.b],(i+k)*3)}
    q.setAttribute('color',new THREE.BufferAttribute(col,3));const m=new THREE.Mesh(q,std({vertexColors:true}));m.position.set(-3600,740,-12500);scene.add(m)}
  // 街
  const bl=[],lights=[],homes=[];const PAL=['#9aa3ad','#b8b0a2','#8c96a3','#c9c2b5','#7d8794','#a59b8e','#b9b4ad','#8f8a86'];
  const dt=[[-380,-900,95],[480,-1350,60],[-1000,-350,40]];
  for(let bx=-1500;bx<1500;bx+=64)for(let bz=-1500;bz<1500;bz+=64){const cx=bx+32,cz=bz+32;if(Math.hypot(cx,cz)<70)continue;if(hf(cx,cz)<1.6||hf(cx+25,cz)<1.6)continue;
    if(fbm(N2,cx/300,cz/300,2)>.32){for(let k=0;k<5;k++)homes.push({p:[cx+(R()-.5)*44,hf(cx,cz),cz+(R()-.5)*44],s:[3+R()*4,4+R()*5,3+R()*4],r:[0,R()*3,0]});continue}
    let tall=0;for(const[x,z,a]of dt)tall+=a*Math.exp(-((cx-x)**2+(cz-z)**2)/(2*330*330));
    const n=1+Math.floor(R()*3);for(let k=0;k<n;k++){const w=n===1?22+R()*20:12+R()*14,d=n===1?22+R()*20:12+R()*14;const hgt=6+R()*R()*26+tall*(.15+R()*R()*R()*1.9);
      const ox=n===1?0:(k%2?1:-1)*12,oz=n===1?0:(k>1?1:-1)*12;const c=C(PAL[Math.floor(R()*PAL.length)]).multiplyScalar(.75+R()*.4);
      bl.push({p:[cx+ox,hf(cx,cz),cz+oz],s:[w,hgt,d],c})}}
  const bgeo=new THREE.BoxGeometry(1,1,1);bgeo.translate(0,.5,0);
  const bmat=new THREE.MeshStandardMaterial({color:'#fff',roughness:.55,metalness:.25});
  bmat.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;varying vec3 vON;varying float vSeed;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
        vec4 wp4=vec4(transformed,1.);
        #ifdef USE_INSTANCING
          wp4=instanceMatrix*wp4;vSeed=instanceMatrix[3].x*.013+instanceMatrix[3].z*.071;
        #else
          vSeed=0.;
        #endif
