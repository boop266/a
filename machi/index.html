        break;
      }
      case T.PARKING: {
        col = C.parking; const k = (n - 0.5) * 8;
        if (fu < 0.06 || fu > 0.94) col = C.line;
        col = [col[0] + k, col[1] + k, col[2] + k];
        break;
      }
      case T.GRASS: case T.BANK: {
        const nn = M.vnoise(s, (wx + fu) * 1.3, (wy + fv) * 1.3, 9);
        col = nn > 0.55 ? C.grass : C.grass2;
        if (b === T.BANK) col = C.bank;
        const k = (n2 - 0.5) * 18;
        col = [col[0] + k * 0.6, col[1] + k, col[2] + k * 0.5];
        if (n > 0.93) col = [col[0] + 22, col[1] + 26, col[2] + 10];
        break;
      }
      case T.DIRT: { const k = (n2 - 0.5) * 16; col = [C.dirt[0] + k, C.dirt[1] + k, C.dirt[2] + k]; if (n > 0.95) col = [110, 96, 74]; break; }
      case T.GRAVEL: { const k = (n - 0.5) * 34; col = [C.gravel[0] + k, C.gravel[1] + k, C.gravel[2] + k]; break; }
      case T.SAND: { const k = (n - 0.5) * 14; col = [C.sand[0] + k, C.sand[1] + k, C.sand[2] + k]; if (fu < 0.08 || fv < 0.08 && B(lx, ly - 1) !== T.SAND) col = [150, 140, 120]; break; }
      case T.FIELD: { const k = (fv * 4 % 1 < 0.5 ? 10 : -10) + (n - 0.5) * 8; col = [C.field[0] + k, C.field[1] + k, C.field[2] + k]; break; }
      case T.CROP: { col = (fu * 6 % 1 < 0.55) ? [C.crop[0] + (n - 0.5) * 30, C.crop[1] + (n - 0.5) * 40, C.crop[2]] : C.field; break; }
      case T.PUDDLE: {
        const r = Math.hypot(fu - 0.5, (fv - 0.5) * 1.3);
        col = r < 0.38 ? [C.puddle[0] + (n - 0.5) * 8, C.puddle[1], C.puddle[2] + 6] : [C.dirt[0] - 8, C.dirt[1] - 8, C.dirt[2] - 8];
        break;
      }
      case T.WATER: {
        const wv = Math.sin((wx + fu) * 2.1 + (wy + fv) * 3.3) * 0.5 + 0.5;
        const k = (wv > 0.92 ? 22 : 0) + (n - 0.5) * 6;
        col = [C.water[0] + k, C.water[1] + k, C.water[2] + k];
        const shore = B(lx - 1, ly) !== T.WATER && fu < 0.12 || B(lx + 1, ly) !== T.WATER && fu > 0.88 || B(lx, ly - 1) !== T.WATER && fv < 0.12 || B(lx, ly + 1) !== T.WATER && fv > 0.88;
        if (shore) col = [72, 82, 70];
        break;
      }
      default: col = C.under;
    }
    // 建物の足もとの影（日は左上から）
    if (t !== T.HOUSE && b !== T.WATER) {
      const tallL = TT(lx - 1, ly), tallT = TT(lx, ly - 1);
      let sh = 0;
      if ((tallL === T.HOUSE || tallL === T.SHED) && fu < 0.45) sh = 0.32 * (1 - fu / 0.45);
      if ((tallT === T.HOUSE || tallT === T.SHED) && fv < 0.45) sh = Math.max(sh, 0.32 * (1 - fv / 0.45));
      if ((tallL === T.WALL || tallL === T.HEDGE) && fu < 0.2) sh = Math.max(sh, 0.18);
      if ((tallT === T.WALL || tallT === T.HEDGE) && fv < 0.2) sh = Math.max(sh, 0.18);
      if (t === T.TREE) { const r = Math.hypot(fu - 0.6, fv - 0.6); if (r < 0.5) sh = Math.max(sh, 0.3); }
      if (sh) col = [col[0] * (1 - sh), col[1] * (1 - sh), col[2] * (1 - sh)];
    }
    if (!c.flat) { const k = slopeShade(c, u, v); col = [col[0] * k, col[1] * k, col[2] * k]; }
    const o = (py * GW + px) * 4;
    D[o] = col[0]; D[o + 1] = col[1]; D[o + 2] = col[2]; D[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return cv;
}

// ---------------------------------------------------------------
// 立っている物（塀・家・木・電柱…）の一覧をチャンクごとに作る
// ---------------------------------------------------------------
const objCache = new WeakMap();
function buildObjects(c) {
  const list = [];
  for (let ly = 0; ly < CS; ly++) for (let lx = 0; lx < CS; lx++) {
    const t = c.t[ly * CS + lx], x = c.x0 + lx, y = c.y0 + ly;
    if (t === T.WALL) {
      const wl = (a, b) => { const q = tileOf(c, a, b); return q === T.WALL || q === T.VEND; };
      list.push({ k: 'wall', x, y, d: x + y + 1, h: wl(lx - 1, ly) || wl(lx + 1, ly), v: wl(lx, ly - 1) || wl(lx, ly + 1) });
    }
    else if (t === T.HEDGE) list.push({ k: 'hedge', x, y, d: x + y + 1 });
    else if (t === T.TREE) list.push({ k: 'tree', x, y, d: x + y + 1, v: M.hash(game.seed, x, y, 71) });
  }
  for (const h of c.houses) list.push(Object.assign({ k: 'house', d: (h.x0 + h.x1 + h.y0 + h.y1) / 2 }, h));
  for (const p of c.props) {
    const o = Object.assign({}, p);
    if (p.k === 'car') o.d = p.x + p.y + (p.w + p.h) / 2;
    else if (p.k === 'pipes') o.d = p.x + p.y + 2;
    else if (p.k === 'shed') o.d = p.x + p.y + (p.w + p.h) / 2;
    else if (p.k === 'vend' || p.k === 'swing' || p.k === 'fountain') o.d = p.x + p.y + 1;
    else o.d = p.x + p.y;
    list.push(o);
  }
  return list;
}

// ---------------------------------------------------------------
// 描画の部品
// ---------------------------------------------------------------
function poly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}
const P = (x, y, z) => [Math.round(fx(x, y)), Math.round(fy(x, y, z))];
function box(x0, y0, x1, y1, z0, h, top, left, right) {
  const z1 = z0 + h;
  poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], left);
  poly([P(x1, y1, z0), P(x1, y0, z0), P(x1, y0, z1), P(x1, y1, z1)], right);
  poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], top);
}
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w, h); }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f) | 0, g = Math.min(255, ((n >> 8) & 255) * f) | 0, b = Math.min(255, (n & 255) * f) | 0;
  return `rgb(${r},${g},${b})`;
}
function pline(x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  ctx.fillStyle = col;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy, n = 0;
  for (;;) {
    ctx.fillRect(x0, y0, 1, 1);
    if ((x0 === x1 && y0 === y1) || n++ > 400) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}

// 夜の明かり（描きながら集めて、あとで暗闇に穴をあける）
let lights = [];

function drawHouse(h, night) {
  const fl = h.floors, hw = fl === 2 ? 22 : 12;
  const wc = WALLS[h.wall], rc = ROOFS[h.roof];
  const x0 = h.x0, y0 = h.y0, x1 = h.x1, y1 = h.y1;
  // 壁
  poly([P(x0, y1, 0), P(x1, y1, 0), P(x1, y1, hw), P(x0, y1, hw)], shade(wc, 0.86));
  poly([P(x1, y1, 0), P(x1, y0, 0), P(x1, y0, hw), P(x1, y1, hw)], shade(wc, 0.7));
  // 窓（手前の2面）
  const lit = night > 0 && h.lit;
  for (let f = 0; f < fl; f++) {
    const z = 4 + f * 10;
    for (let x = x0 + 0.8; x < x1 - 0.5; x += 1.6) {
      const sx = Math.round(fx(x, y1)), sy = Math.round(fy(x, y1, z + 4));
      const on = lit && M.hash(game.seed, x * 10 | 0, f, 81) < 0.6;
      rect(sx - 1, sy, 3, 4, on ? '#f2d38a' : '#3a4250');
      rect(sx - 1, sy, 3, 1, on ? '#fff0c0' : '#59626f');
      if (on) lights.push({ z: zb, x: x, y: y1 + 0.3, r: 1.4, a: 0.55 });
    }
    for (let y = y0 + 0.8; y < y1 - 0.5; y += 1.8) {
      const sx = Math.round(fx(x1, y)), sy = Math.round(fy(x1, y, z + 4));
      const on = lit && M.hash(game.seed, y * 10 | 0, f, 82) < 0.5;
      rect(sx - 1, sy, 3, 4, on ? '#e8c47a' : '#323946');
      if (on) lights.push({ z: zb, x: x1 + 0.3, y: y, r: 1.4, a: 0.5 });
    }
  }
  // 玄関・勝手口・壊れた窓（見えている2面だけ）
  for (const e of h.entries || []) {
    if (!e.vis) continue;
    const ax = e.side === 'E' ? x1 : e.tx + 0.5, ay = e.side === 'E' ? e.ty + 0.5 : y1;
    const sx = Math.round(fx(ax, ay));
    if (e.kind === 'door') {
      const sy = Math.round(fy(ax, ay, 10));
      rect(sx - 2, sy, 5, 10, '#5a4a3c'); rect(sx - 2, sy, 5, 1, '#3e3229'); rect(sx + 1, sy + 5, 1, 1, '#c8b070');
      if (e.side === 'S') rect(sx - 3, sy + 10, 7, 1, '#7d7a72');
    } else {
      const sy = Math.round(fy(ax, ay, 9));
      rect(sx - 2, sy, 5, 5, '#15181c');
      rect(sx - 2, sy, 1, 2, '#9fb0bc'); rect(sx + 2, sy + 3, 1, 2, '#9fb0bc'); rect(sx, sy + 4, 1, 1, '#7d8e9a');
      rect(sx - 2, sy - 1, 5, 1, '#6a625a');
    }
  }
  // 屋根（切妻）
  const o = 0.25, rh = Math.min(10, ((h.ridge === 'x' ? (y1 - y0) : (x1 - x0)) / 2) * 3.2);
  const rd = shade(rc, 0.75), rf = rc, rl = shade(rc, 1.15);
  if (h.ridge === 'x') {
    const ym = (y0 + y1) / 2;
    poly([P(x0 - o, y0 - o, hw), P(x1 + o, y0 - o, hw), P(x1 + o, ym, hw + rh), P(x0 - o, ym, hw + rh)], rd);
    poly([P(x1, y0, hw), P(x1, y1, hw), P(x1, ym, hw + rh)], shade(wc, 0.66));
    poly([P(x0 - o, ym, hw + rh), P(x1 + o, ym, hw + rh), P(x1 + o, y1 + o, hw), P(x0 - o, y1 + o, hw)], rf);
    pline(fx(x0 - o, ym), fy(x0 - o, ym, hw + rh), fx(x1 + o, ym), fy(x1 + o, ym, hw + rh), rl);
  } else {
    const xm = (x0 + x1) / 2;
    poly([P(x0 - o, y0 - o, hw), P(x0 - o, y1 + o, hw), P(xm, y1 + o, hw + rh), P(xm, y0 - o, hw + rh)], rd);
    poly([P(x0, y1, hw), P(x1, y1, hw), P(xm, y1, hw + rh)], shade(wc, 0.8));
    poly([P(xm, y0 - o, hw + rh), P(xm, y1 + o, hw + rh), P(x1 + o, y1 + o, hw), P(x1 + o, y0 - o, hw)], shade(rc, 0.92));
    pline(fx(xm, y0 - o), fy(xm, y0 - o, hw + rh), fx(xm, y1 + o), fy(xm, y1 + o, hw + rh), rl);
  }
}

// ブロック塀：つながる向きに薄く立てる
function drawWall(o) {
  const a = 0.36, b = 0.64, x = o.x, y = o.y;
  const col = ['#b9b6ad', '#a19e95', '#8b887f'];
  if (o.v) box(x + a, y, x + b, y + 1, 0, 9, ...col);
  if (o.h || !o.v) box(o.h ? x : x + a, y + a, o.h ? x + 1 : x + b, y + b, 0, 9, ...col);
  if (o.h) { const p1 = P(x, y + b, 4), p2 = P(x + 1, y + b, 4); pline(p1[0], p1[1], p2[0], p2[1], '#8f8c83'); }
  if (o.v) { const p1 = P(x + b, y, 4), p2 = P(x + b, y + 1, 4); pline(p1[0], p1[1], p2[0], p2[1], '#7b786f'); }
}

function drawTree(o) {
  const cx = fx(o.x + 0.5, o.y + 0.5), cy = fy(o.x + 0.5, o.y + 0.5);
  const s = 0.8 + o.v * 0.5;
  rect(cx - 1, cy - 9, 2, 9, '#4d3b2c');
  const g1 = o.v < 0.5 ? '#2f4a2a' : '#34502c', g2 = o.v < 0.5 ? '#3d6034' : '#47693a', g3 = '#5a7e47';
  ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(cx, cy - 15 * s, 7 * s, 0, 6.3); ctx.fill();
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx - 2, cy - 17 * s, 5.5 * s, 0, 6.3); ctx.fill();
  ctx.fillStyle = g3; ctx.beginPath(); ctx.arc(cx - 3, cy - 19 * s, 2.5 * s, 0, 6.3); ctx.fill();
}

function drawPole(o, night, t) {
  const sx = Math.round(fx(o.x, o.y)), sy = Math.round(fy(o.x, o.y));
  rect(sx - 2, sy - 1, 4, 2, 'rgba(0,0,0,.25)');
  rect(sx - 1, sy - 34, 2, 34, '#8b8a84');
  rect(sx, sy - 34, 1, 34, '#a3a29b');
  rect(sx - 4, sy - 31, 9, 1, '#6e6d68');
  if (o.light) {
    rect(sx + 1, sy - 22, 4, 1, '#77766f');
    let on = night > 0.02;
    if (on && o.flick) on = Math.sin(t * 23 + o.x) + Math.sin(t * 7.1 + o.y * 3) > -0.6;
    rect(sx + 4, sy - 22, 2, 2, on ? '#f4f8e8' : '#c9cbc0');
    if (on) lights.push({ z: zb, x: o.x + 0.45, y: o.y + 0.45, r: 3.6, a: 0.85, glow: [230, 240, 210] });
  }
}

function drawWire(o) {
  ctx.strokeStyle = 'rgba(28,30,32,.7)';
  ctx.lineWidth = 1;
  {
    const za = hpx(o.x, o.y), zz = hpx(o.nx, o.ny), keep = zb;
    for (const zoff of [31, 28]) {
      zb = za; const ax = fx(o.x, o.y), ay = fy(o.x, o.y, zoff);
      zb = zz; const bx = fx(o.nx, o.ny), by = fy(o.nx, o.ny, zoff);
      zb = keep;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo((ax + bx) / 2, (ay + by) / 2 + 4, bx, by);
      ctx.stroke();
    }
  }
}

function drawVend(o, night) {
  const x0 = o.x + 0.12, y0 = o.y + 0.2, x1 = o.x + 0.88, y1 = o.y + 0.8;
  box(x0, y0, x1, y1, 0, 15, '#d8d8d4', '#c43a32', '#e8e8e4');
  // 光る面（道路側）
  if (o.face === 'N') {
    poly([P(x0 + 0.1, y0, 3), P(x1 - 0.1, y0, 3), P(x1 - 0.1, y0, 13), P(x0 + 0.1, y0, 13)], night > 0 ? '#eaf4ff' : '#c8d2da');
  } else {
    poly([P(x0 + 0.1, y1, 3), P(x1 - 0.1, y1, 3), P(x1 - 0.1, y1, 13), P(x0 + 0.1, y1, 13)], night > 0 ? '#eaf4ff' : '#c8d2da');
    for (let i = 0; i < 3; i++) { const p = P(x0 + 0.2 + i * 0.22, y1, 11); rect(p[0], p[1], 2, 2, ['#c33', '#36c', '#3a3'][i]); }
  }
  lights.push({ z: zb, x: o.x + 0.5, y: o.y + (o.face === 'N' ? -0.3 : 1.3), r: 2.4, a: 0.8, glow: [200, 225, 255] });
}

function drawCar(o) {
  const x0 = o.x + 0.08, y0 = o.y + 0.08, x1 = o.x + o.w - 0.08, y1 = o.y + o.h - 0.08;
  const col = CARS[o.col];
  box(x0, y0, x1, y1, 2, 6, shade(col, 1.05), shade(col, 0.85), shade(col, 0.7));
  const cx0 = o.w > o.h ? x0 + 0.4 : x0 + 0.1, cx1 = o.w > o.h ? x1 - 0.6 : x1 - 0.1;
  const cy0 = o.h > o.w ? y0 + 0.4 : y0 + 0.1, cy1 = o.h > o.w ? y1 - 0.6 : y1 - 0.1;
  box(cx0, cy0, cx1, cy1, 8, 5, shade(col, 1.0), '#2d3540', '#262c35');
  if (o.old) { const p = P(x0 + 0.5, y1, 6); rect(p[0], p[1], 3, 1, '#6b4a30'); }
}

function drawPipes(o) {
  for (let i = 0; i < 3; i++) {
    const x = o.x + i + 0.5, y = o.y + 0.5;
    const sx = Math.round(fx(x, y)), sy = Math.round(fy(x, y));
    ctx.fillStyle = '#8f8d86'; ctx.beginPath(); ctx.ellipse(sx, sy - 6, 6, 6, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#7b7972'; ctx.beginPath(); ctx.ellipse(sx + 1, sy - 5, 4, 4, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#2e2d2a'; ctx.beginPath(); ctx.ellipse(sx + 1, sy - 5, 3, 3, 0, 0, 6.3); ctx.fill();
  }
  const sx = Math.round(fx(o.x + 1.5, o.y + 0.5)), sy = Math.round(fy(o.x + 1.5, o.y + 0.5));
  ctx.fillStyle = '#9a9890'; ctx.beginPath(); ctx.ellipse(sx, sy - 16, 6, 6, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#2e2d2a'; ctx.beginPath(); ctx.ellipse(sx + 1, sy - 15, 3, 3, 0, 0, 6.3); ctx.fill();
}

function drawSwing(o) {
  const a = P(o.x + 0.1, o.y + 0.5, 0), b = P(o.x + 1.9, o.y + 0.5, 0);
  const at = P(o.x + 0.1, o.y + 0.5, 16), bt = P(o.x + 1.9, o.y + 0.5, 16);
  pline(a[0] - 2, a[1], at[0], at[1], '#6a7d8c'); pline(a[0] + 2, a[1], at[0], at[1], '#6a7d8c');
  pline(b[0] - 2, b[1], bt[0], bt[1], '#6a7d8c'); pline(b[0] + 2, b[1], bt[0], bt[1], '#6a7d8c');
  pline(at[0], at[1], bt[0], bt[1], '#7d93a3');
  const t = performance.now() / 1000;
  for (const f of [0.35, 0.7]) {
    const tp = P(o.x + 0.1 + 1.8 * f, o.y + 0.5, 16), sw = Math.sin(t * 0.9 + f * 5) * 1.2;
    pline(tp[0], tp[1], tp[0] + sw, tp[1] + 11, '#555');
    rect(tp[0] + sw - 1, tp[1] + 11, 3, 1, '#7a4a2a');
  }
}

function drawBusStop(o) {
  const sx = Math.round(fx(o.x, o.y)), sy = Math.round(fy(o.x, o.y));
  rect(sx - 2, sy - 1, 4, 2, 'rgba(0,0,0,.25)');
  rect(sx, sy - 18, 1, 18, '#9a9a96');
  ctx.fillStyle = '#e6e6e0'; ctx.beginPath(); ctx.arc(sx + 0.5, sy - 20, 3.5, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#3a6aa8'; ctx.beginPath(); ctx.arc(sx + 0.5, sy - 20, 2.2, 0, 6.3); ctx.fill();
  const b = P(o.x + 0.4, o.y + 1.2, 0);
  rect(b[0] - 5, b[1] - 4, 10, 2, '#7a5a3a'); rect(b[0] - 4, b[1] - 2, 1, 2, '#555'); rect(b[0] + 3, b[1] - 2, 1, 2, '#555');
}

function drawFountain(o) {
  const b = P(o.x + 0.5, o.y + 0.5, 0);
  rect(b[0] - 3, b[1] - 1, 6, 2, 'rgba(0,0,0,.25)');
  rect(b[0] - 2, b[1] - 9, 4, 9, '#a9a69c'); rect(b[0] + 1, b[1] - 9, 1, 9, '#8f8c83');
  rect(b[0] - 3, b[1] - 10, 6, 2, '#bdbab0'); rect(b[0] - 1, b[1] - 12, 1, 2, '#9aa4ab');
}
function drawVeg(o) {
  if (M.usesLeft(game, o) <= 0) return;
  const b = P(o.x, o.y, 0);
  const col = ['#c63b2c', '#5b2d63', '#d8a030'][o.col];
  rect(b[0] - 2, b[1] - 4, 5, 3, '#4f7a35'); rect(b[0] - 1, b[1] - 3, 2, 2, col); rect(b[0] + 1, b[1] - 2, 1, 1, col);
}
function drawBench(o) { const b = P(o.x + 0.5, o.y + 0.5, 0); rect(b[0] - 5, b[1] - 4, 10, 2, '#7a5a3a'); rect(b[0] - 5, b[1] - 6, 10, 1, '#6a4a2a'); rect(b[0] - 4, b[1] - 2, 1, 2, '#444'); rect(b[0] + 3, b[1] - 2, 1, 2, '#444'); }

function drawShed(o) {
  if (o.wc) box(o.x + 0.1, o.y + 0.1, o.x + o.w - 0.1, o.y + o.h - 0.1, 0, 14, '#8a8f8c', '#c9c4b6', '#a9a496');
  else box(o.x + 0.1, o.y + 0.1, o.x + o.w - 0.1, o.y + o.h - 0.1, 0, 11, '#7c8590', '#9a8a70', '#7f725e');
}

// 人の形（足もとが sx,sy）。o: {top, bottom, skin, hair, face(-1/1), away, phase, moving, arms('down'|'fwd'), seated, zombie}
function drawPerson(sx, sy, o) {
  sx = Math.round(sx); sy = Math.round(sy);
  if (!o.seated) rect(sx - 3, sy - 1, 7, 2, 'rgba(0,0,0,.3)');
  const amp = o.sprint ? 2.4 : 1.2;
  const step = o.moving ? Math.round(Math.sin(o.phase) * amp) : 0;
  const bob = o.moving ? (Math.abs(Math.sin(o.phase)) > 0.6 ? -1 : 0) : 0;
  if (o.crouch) {
    // かがむ（飲む・食べる）
    const y = sy;
    rect(sx - 3, y - 2, 6, 2, o.bottom);
    rect(sx - 2 + (o.face > 0 ? 0 : -1), y - 6, 5, 4, o.top);
    const hx = sx - 2 + o.face + (o.bite ? o.face : 0);
    rect(hx, y - 10, 4, 4, o.skin);
    rect(hx, y - 11, 4, 1, o.hair);
    rect(o.face > 0 ? hx : hx + 3, y - 10, 1, 2, o.hair);
    rect(o.face > 0 ? hx + 3 : hx - 1, y - 7, 2, 1, o.skin);
    return;
  }
  const y = sy + bob - (o.seated ? 4 : 0);
  // 脚
  if (o.seated) {
    rect(sx - 2 + o.face, y - 2, 2, 3, o.bottom); rect(sx + 1 + o.face, y - 1, 2, 3, o.bottom);
  } else {
    const spread = o.sprint && o.moving ? Math.round(Math.sin(o.phase) * 1.5) : 0;
    if (o.kick) {
      // 片足で地面を蹴る
      rect(sx - 2, y - 4, 2, 4, o.bottom);
      rect(o.kick > 0 ? sx + 1 : sx - 4, y - 3, 2, 2, o.bottom); rect(o.kick > 0 ? sx + 3 : sx - 6, y - 1 + 2, 2, 1, o.bottom);
    } else {
    rect(sx - 2 - spread, y - 4 + Math.max(0, step), 2, 4 - Math.max(0, step), o.bottom);
    rect(sx + 1 + spread, y - 4 + Math.max(0, -step), 2, 4 - Math.max(0, -step), o.bottom);
    rect(sx - 2, y - 1 + Math.max(0, step) - Math.max(0, step), 2, 1, '#222');
    }
  }
  // 胴
  rect(sx - 2, y - 9, 5, 5, o.top);
  if (o.zombie) { rect(sx - 1 + (o.kind % 3), y - 7, 1, 1, '#5a2a24'); rect(sx + 1, y - 5, 1, 1, shade(o.top.length === 7 ? o.top : '#444444', 0.6)); }
  // 腕
  if (o.arms === 'fwd') {
    const ax = o.face > 0 ? sx + 3 : sx - 6;
    rect(ax, y - 8, 4, 1, o.skin); rect(ax + (o.face > 0 ? 0 : 1), y - 7, 3, 1, o.top);
  } else if (o.arms === 'out') {
    rect(sx - 5, y - 8, 3, 1, o.top); rect(sx + 3, y - 8, 3, 1, o.top); rect(sx - 6, y - 8, 1, 1, o.skin); rect(sx + 6, y - 8, 1, 1, o.skin);
  } else if (o.arms === 'bar') {
    rect(o.face > 0 ? sx + 3 : sx - 4, y - 8, 2, 1, o.skin);
  } else {
    const sw = o.moving ? Math.round(Math.sin(o.phase) * (o.sprint ? 2 : 1)) : 0;
    rect(sx - 3, y - 8 + sw, 1, 4, o.top); rect(sx + 3, y - 8 - sw, 1, 4, o.top);
    rect(sx - 3, y - 4 + sw, 1, 1, o.skin); rect(sx + 3, y - 4 - sw, 1, 1, o.skin);
  }
  // 頭
  const hx = sx - 2 + (o.zombie ? o.tilt : 0) + (o.sprint && o.moving ? o.face : 0);
  rect(hx, y - 13, 4, 4, o.skin);
  rect(hx, y - 14, 4, 1, o.hair);
  if (o.away) rect(hx, y - 13, 4, 3, o.hair);
  else {
    rect(o.face > 0 ? hx : hx + 3, y - 13, 1, 2, o.hair);
    rect(o.face > 0 ? hx + 2 : hx + 1, y - 12, 1, 1, o.zombie ? '#2a2a24' : '#2a2420');
  }
}

function headingToScreen(h) {
  const c = Math.cos(h), s = Math.sin(h);
  let ex = (c - s) * 8, ey = (c + s) * 4;
  const l = Math.hypot(ex, ey) || 1;
  return [ex / l, ey / l];
}

// スケボー（板と4つのウィール）
function drawSkate(x, y, heading, col, spin) {
  const sx = fx(x, y), sy = fy(x, y);
  const [ex, ey] = headingToScreen(heading);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(sx, sy, 5, 1.5, 0, 0, 6.3); ctx.fill();
  const deck = ['#2a2a2e', '#a33a2a', '#2f5a7a', '#c9a23a'][col % 4];
  const L = 4;
  for (const k of [-1, 1]) {
    const wx = sx + ex * L * 0.65 * k, wy = sy + ey * L * 0.65 * k;
    rect(Math.round(wx - ey * 1.2), Math.round(wy - 1), 1, 1, '#e4dcc0');
    rect(Math.round(wx + ey * 1.2), Math.round(wy - 1), 1, 1, '#e4dcc0');
  }
  pline(sx - ex * L, sy - ey * L - 2, sx + ex * L, sy + ey * L - 2, deck);
  pline(sx - ex * L, sy - ey * L - 1, sx + ex * L, sy + ey * L - 1, shade(deck.length === 7 ? deck : '#2a2a2e', 0.7));
}

function drawBike(x, y, heading, col, spin, fallen, glint) {
  const sx = fx(x, y), sy = fy(x, y);
  const [ex, ey] = headingToScreen(heading);
  const L = 5;
  if (fallen) {
    rect(sx - 6, sy - 1, 12, 2, 'rgba(0,0,0,.25)');
    ctx.fillStyle = '#1c1c1c';
    ctx.beginPath(); ctx.ellipse(sx - ex * L, sy - ey * L * 0.5, 3, 1.5, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx + ex * L, sy + ey * L * 0.5, 3, 1.5, 0, 0, 6.3); ctx.fill();
    pline(sx - ex * L, sy - ey * L * 0.5 - 1, sx + ex * L, sy + ey * L * 0.5 - 1, BIKES[col]);
    rect(sx + ex * L - 1, sy + ey * L * 0.5 - 3, 3, 2, '#77756e');
    return;
  }
  const rx = sx - ex * L, ry = sy - ey * L, fx2 = sx + ex * L, fy2 = sy + ey * L;
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(sx, sy, 7, 2, 0, 0, 6.3); ctx.fill();
  // 車輪（回る影＝スポーク）
  for (const [wx, wy] of [[rx, ry], [fx2, fy2]]) {
    ctx.fillStyle = '#1b1b1b';
    ctx.beginPath(); ctx.ellipse(wx, wy - 3, 2 + Math.abs(ex) * 1.5, 3, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#6b6b6b';
    ctx.beginPath(); ctx.ellipse(wx, wy - 3, 0.8 + Math.abs(ex) * 1.0, 2, 0, 0, 6.3); ctx.fill();
    const a = spin;
    rect(Math.round(wx + Math.cos(a) * (1 + Math.abs(ex))), Math.round(wy - 3 + Math.sin(a) * 2), 1, 1, '#d0d0d0');
    rect(Math.round(wx - Math.cos(a) * (1 + Math.abs(ex))), Math.round(wy - 3 - Math.sin(a) * 2), 1, 1, '#8a8a8a');
  }
  // フレーム
  const c = BIKES[col];
  pline(rx, ry - 4, fx2, fy2 - 5, c);
  pline(sx - ex * 1.5, sy - ey * 1.5 - 7, sx, sy - 3, c);
  rect(sx - ex * 1.8 - 1, sy - ey * 1.8 - 8, 3, 1, '#2a2a2a');   // サドル
  pline(fx2, fy2 - 5, fx2 - ex, fy2 - ey - 9, '#8a8a8a');
  rect(fx2 - ex - 2, fy2 - ey - 10, 4, 1, '#3a3a3a');           // ハンドル
  rect(fx2 + ex * 1.5 - 1, fy2 + ey * 1.5 - 9, 3, 3, '#9a988f');  // かご
  if (glint) { const g = (performance.now() / 300) % 2 < 1; if (g) rect(fx2 - ex - 1, fy2 - ey - 12, 1, 1, '#ffffff'); }
}

// ---------------------------------------------------------------
// 1フレームぶんの描画
// ---------------------------------------------------------------
let lastInside = null, lastInsideZ = null;
const dust = [];
let dustT = 0;
function render(t) {
  const p = game.player;
  const hour = M.hourOf(game.time), Lt = M.lightAt(hour), night = 1 - Lt.day;
  if (game.inside !== lastInside) { lastInside = game.inside; camX = p.x; camY = p.y; dust.length = 0; }
  // カメラ：自転車のときは進む方向を少し先まで見せる
  const look = p.riding ? 0.45 : 0.15;
  const tx = p.x + p.vx * look, ty = p.y + p.vy * look;
  camX += (tx - camX) * Math.min(1, frameDt * 5);
  camY += (ty - camY) * Math.min(1, frameDt * 5);
  camSX = 0; camSY = 0;
  // ピクセルにそろえる
  const ox = isoX(camX, camY), oy = isoY(camX, camY);
  camSX = Math.round(ox) - ox; camSY = Math.round(oy) - oy;
  // 高さ：カメラも一緒に持ち上げる。高い所ほど遠くまで見える（2秒ほどで広がる）
  const ph = game.inside ? 0 : M.heightAt(game.world, p.x, p.y);
  const tz = game.inside ? 0 : M.heightAt(game.world, camX, camY) * LPX;
  if (game.inside !== lastInsideZ) { lastInsideZ = game.inside; camZ = tz; zoom = game.inside ? 1 : M.viewScale(ph); }
  camZ += (tz - camZ) * Math.min(1, frameDt * 5);
  camZ = Math.round(camZ);
  const zt = game.inside ? 1 : M.viewScale(ph);
  zoom += (zt - zoom) * Math.min(1, frameDt * 1.8);
  if (Math.abs(zt - zoom) < 0.002) zoom = zt;
  VX0 = W / 2 - W / 2 * zoom; VX1 = W / 2 + W / 2 * zoom; VY0 = H / 2 - H / 2 * zoom; VY1 = H / 2 + H / 2 * zoom;
  // 本気ダッシュの土ぼこり
  dustT -= frameDt;
  if (p.sprint && dustT <= 0) { dustT = 0.06; dust.push({ x: p.x - Math.cos(p.heading) * 0.3, y: p.y - Math.sin(p.heading) * 0.3, t: 0, r: Math.random() }); }
  for (const d of dust) d.t += frameDt;
  while (dust.length && dust[0].t > 0.45) dust.shift();

  if (game.inside) { zoom = 1; VX0 = 0; VX1 = W; VY0 = 0; VY1 = H; renderInterior(t, Lt, night); }
  else renderOutside(t, Lt, night, hour);
  setZoom(); drawGlint(t); ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 家の出入り：一度暗くなって切り替わる
  if (game.trans) {
    const tr = game.trans, k = 1 - Math.abs(tr.t - tr.dur / 2) / (tr.dur / 2);
    ctx.fillStyle = `rgba(0,0,0,${Math.min(1, Math.max(0, k * 1.25))})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawDust() {
  for (const d of dust) {
    zb = game.inside ? 0 : hpx(d.x, d.y);
    const sx = Math.round(fx(d.x, d.y) + (d.r - 0.5) * 4), sy = Math.round(fy(d.x, d.y, d.t * 8));
    ctx.fillStyle = `rgba(170,160,140,${0.45 * (1 - d.t / 0.45)})`;
    ctx.fillRect(sx, sy, 2, 1);
  }
  zb = 0;
}

// 触れるものの小さなきらめき（自転車・入口・自販機・冷蔵庫…）
function drawGlint(t) {
  const p = game.player;
  if (p.riding || p.mount > 0 || p.act || game.trans) return;
  const it = M.nearestInteract(game);
  if (!it || it.empty) return;
  const z = { bike: 12, entry: 14, exit: 10, fixture: 18, source: it.o && it.o.k === 'veg' ? 6 : 16 }[it.type] || 12;
  zb = game.inside ? 0 : hpx(it.x, it.y);
  const sx = Math.round(fx(it.x, it.y)), sy = Math.round(fy(it.x, it.y, z));
  zb = 0;
  const ph = (t * 1.6) % 1;
  if (ph < 0.55) { ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(sx, sy, 1, 1); }
  if (ph > 0.15 && ph < 0.4) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(sx - 1, sy, 1, 1); ctx.fillRect(sx + 1, sy, 1, 1); ctx.fillRect(sx, sy - 1, 1, 1); ctx.fillRect(sx, sy + 1, 1, 1); }
}

// 暗がりに明かりの穴をあけて重ねる
function applyDark(alpha, holes, col) {
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = `rgba(${col || '5,7,20'},${alpha})`;
  dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'destination-out';
  for (const l of holes) {
    zb = l.z || 0;
    const sx = W / 2 + (fx(l.x, l.y) - W / 2) / zoom, sy = H / 2 + (fy(l.x, l.y) - H / 2) / zoom, rp = l.r * 9 / Math.sqrt(zoom), k = l.a;
    zb = 0;
    if (sx < -rp || sx > W + rp || sy < -rp || sy > H + rp) continue;
    const gr = dctx.createRadialGradient(sx, sy, 0, sx, sy, rp);
    gr.addColorStop(0, `rgba(0,0,0,${k})`);
    gr.addColorStop(0.55, `rgba(0,0,0,${k * 0.6})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.save();
    dctx.translate(sx, sy); dctx.scale(1, 0.62); dctx.translate(-sx, -sy);
    dctx.fillStyle = gr;
    dctx.fillRect(sx - rp, sy - rp, rp * 2, rp * 2);
    dctx.restore();
  }
  ctx.drawImage(darkCv, 0, 0);
}

// 夜はゾンビの目がうっすら光る（見た目だけ）
function drawEyes(list, night, t) {
  const p = game.player;
  for (const z of list) {
    const dd = Math.hypot(z.x - p.x, z.y - p.y);
    if (dd > 20) continue;
    zb = game.inside ? 0 : hpx(z.x, z.y);
    const sx = Math.round(fx(z.x, z.y)), sy = Math.round(fy(z.x, z.y));
    zb = 0;
    if (sx < VX0 || sx > VX1 || sy < VY0 || sy > VY1 + 14) continue;
    if (Math.sin(t * 0.7 + z.id) < -0.95) continue;
    const away = z.state === 1 ? false : (z.id % 2 === 0);
    if (away) continue;
    ctx.fillStyle = `rgba(214,232,186,${0.75 * night * (1 - dd / 22)})`;
    const hx = sx - 2 + ((z.id % 3) - 1);
    ctx.fillRect(hx + (z.face > 0 ? 2 : 1), sy - 12, 1, 1);
    ctx.fillRect(hx + (z.face > 0 ? 3 : 0), sy - 12, 1, 1);
  }
}

function setZoom() {
  if (zoom === 1) ctx.setTransform(1, 0, 0, 1, 0, 0);
  else ctx.setTransform(1 / zoom, 0, 0, 1 / zoom, W / 2 * (1 - 1 / zoom), H / 2 * (1 - 1 / zoom));
}
// 物の足もと（高さを決める点）
function objBase(o) {
  switch (o.k) {
    case 'house': return [(o.x0 + o.x1) / 2, (o.y0 + o.y1) / 2];
    case 'wall': case 'hedge': case 'tree': case 'vend': case 'fountain': return [o.x + 0.5, o.y + 0.5];
    case 'car': case 'shed': return [o.x + o.w / 2, o.y + o.h / 2];
    case 'pipes': return [o.x + 1.5, o.y + 0.5];
    case 'swing': return [o.x + 1, o.y + 0.5];
    default: return [o.x, o.y];
  }
}

function renderOutside(t, Lt, night, hour) {
  const p = game.player;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#20241e';
  ctx.fillRect(0, 0, W, H);
  setZoom();
  ctx.imageSmoothingEnabled = zoom > 1.05;
  lights = [];
  zb = 0;

  // 見えているチャンク。近く（2つ先まで）はくわしく、その外は簡略化した遠景
  const pcx = Math.floor(camX / CS), pcy = Math.floor(camY / CS);
  const RR = Math.min(CFG.world.keepRadius, Math.ceil(zoom * 1.3) + 1);
  const vis = [], far = [];
  let built = 0, impBuilt = 0;
  const inView = (gx, gy, w, h) => !(gx > VX1 || gx + w < VX0 || gy > VY1 + 40 || gy + h < VY0 - 40);
  for (let dy = -RR; dy <= RR; dy++) for (let dx = -RR; dx <= RR; dx++) {
    // 広く見えているときは、細かく描くのはすぐ近くだけ（60fpsを保つため）
    const NR = zoom > 1.7 ? 1 : 2;
    const near = Math.abs(dx) <= NR && Math.abs(dy) <= NR;
    let c = game.world.chunks.get(M.ckey(pcx + dx, pcy + dy));
    if (!c) { if (near) continue; c = M.getChunk(game.world, pcx + dx, pcy + dy); }
    const gx = fx(c.x0, c.y0) - CS * 8, gy = fy(c.x0, c.y0) - TOP;
    if (!inView(gx, gy - IMP_UP, GW, GH + TOP + IMP_UP)) continue;
    if (near) vis.push(c);
    else far.push({ c, dx, dy, gx, gy });
  }
  // 遠景（奥にあるもの）
  const drawFar = after => {
    for (const f of far) {
      if ((f.dx + f.dy > (zoom > 1.7 ? 1 : 2)) !== after) continue;
      let im = impCache.get(f.c);
      if (!im && impBuilt < 3) { im = buildImpostor(f.c); impCache.set(f.c, im); impBuilt++; }
      if (im) ctx.drawImage(im.cv, Math.round(f.gx), Math.round(f.gy - IMP_UP), im.cv.width * 2, im.cv.height * 2);
    }
  };
  drawFar(false);
  for (const c of vis) {
    const gx = fx(c.x0, c.y0) - CS * 8, gy = fy(c.x0, c.y0) - TOP;
    let gc = groundCache.get(c);
    if (!gc && built < 2) { gc = buildGround(c); groundCache.set(c, gc); built++; }
    if (!gc) { const im = impCache.get(c) || buildImpostor(c); impCache.set(c, im); ctx.drawImage(im.cv, Math.round(gx), Math.round(gy - IMP_UP), im.cv.width * 2, im.cv.height * 2); continue; }
    ctx.drawImage(gc, Math.round(gx), Math.round(gy));
  }
  ctx.imageSmoothingEnabled = false;

  drawDust();
  // 立っている物を手前から奥へ並べる
  const objs = [];
  for (const c of vis) {
    if (!groundCache.get(c)) continue;
    let ol = objCache.get(c);
    if (!ol) { ol = buildObjects(c); objCache.set(c, ol); }
    for (const o of ol) {
      const sx = fx(o.x, o.y), sy = fy(o.x, o.y);
      if (sx < VX0 - 80 || sx > VX1 + 80 || sy < VY0 - 20 || sy > VY1 + 100) { if (!(o.k === 'pole' && o.nx !== null)) continue; }
      objs.push(o);
      if (o.k === 'pole' && o.nx !== null) objs.push({ k: 'wire', p: o, d: (o.x + o.y + o.nx + o.ny) / 2 + 0.5 });
    }
  }
  for (const b of game.bikes) objs.push({ k: 'bike', x: b.x, y: b.y, d: b.x + b.y, b });
  for (const z of game.zombies) {
    const sx = fx(z.x, z.y), sy = fy(z.x, z.y);
    if (sx < VX0 - 20 || sx > VX1 + 20 || sy < VY0 - 20 || sy > VY1 + 60) continue;
    objs.push({ k: 'zombie', x: z.x, y: z.y, d: z.x + z.y, z });
  }
  objs.push({ k: 'player', x: p.x, y: p.y, d: p.x + p.y });
  objs.sort((a, b) => a.d - b.d);

  for (const o of objs) {
    if (o.k === 'wire') zb = 0;
    else { const [bx, by] = objBase(o); zb = hpx(bx, by); }
    switch (o.k) {
      case 'wall': drawWall(o); break;
      case 'hedge': box(o.x + 0.05, o.y + 0.05, o.x + 0.95, o.y + 0.95, 0, 8, '#4c6c3a', '#3c5a2e', '#324d27'); { const p2 = P(o.x + 0.5, o.y + 0.5, 8); rect(p2[0] - 2, p2[1] - 1, 1, 1, '#5f8248'); rect(p2[0] + 2, p2[1], 1, 1, '#5f8248'); } break;
      case 'tree': drawTree(o); break;
      case 'house': drawHouse(o, night); break;
      case 'wire': drawWire(o.p); break;
      case 'pole': if (fx(o.x, o.y) > VX0 - 10 && fx(o.x, o.y) < VX1 + 10 && fy(o.x, o.y) > VY0 - 5 && fy(o.x, o.y) < VY1 + 40) drawPole(o, night, t); break;
      case 'vend': drawVend(o, night); break;
      case 'car': drawCar(o); break;
      case 'pipes': drawPipes(o); break;
      case 'swing': drawSwing(o); break;
      case 'busstop': drawBusStop(o); break;
      case 'bench': drawBench(o); break;
      case 'shed': drawShed(o); break;
      case 'fountain': drawFountain(o); break;
      case 'veg': drawVeg(o); break;
      case 'bike': if (o.b.type === 'skate') drawSkate(o.x, o.y, o.b.heading, o.b.col, 0); else drawBike(o.x, o.y, o.b.heading, o.b.col, 0, o.b.fallen, false); break;
      case 'zombie': drawZombie(o.z, t); break;
      case 'player': drawPlayer(t); break;
    }
  }
  drawFar(true);
  // 家の陰に入ったときは輪郭だけ見せる
  zb = hpx(p.x, p.y);
  ctx.globalAlpha = 0.28;
  drawPlayer(t, true);
  ctx.globalAlpha = 1;
  zb = 0;
  // 夜の遠景：街灯・自販機・窓の明かりが点々と見える
  const farLights = [];
  if (night > 0.005) for (const f of far) { const im = impCache.get(f.c); if (im) for (const l of im.lights) farLights.push(l); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // 朝夕の色
  if (Lt.warm > 0.01) {
    ctx.globalCompositeOperation = 'multiply';
    const m = Lt.warm * (1 - night);
    const evening = hour > 12;
    const rC = evening ? [255, 168, 118] : [255, 206, 178];
    ctx.fillStyle = `rgb(${255 - (255 - rC[0]) * m | 0},${255 - (255 - rC[1]) * m | 0},${255 - (255 - rC[2]) * m | 0})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 夜
  if (night > 0.005) {
    const a = (0.86 + Lt.deep * 0.08) * night;
    applyDark(a, [{ x: p.x, y: p.y, r: 7.5, a: 0.95, z: hpx(p.x, p.y) }].concat(lights));
    setZoom();
    // 明かりのにじみ
    ctx.globalCompositeOperation = 'lighter';
    for (const l of farLights) {
      zb = l.z;
      const sx = Math.round(fx(l.x, l.y)), sy = Math.round(fy(l.x, l.y, l.h || 0));
      ctx.fillStyle = `rgba(${l.glow[0]},${l.glow[1]},${l.glow[2]},${0.8 * night})`;
      ctx.fillRect(sx - 1, sy - 1, 2 + (zoom > 2 ? 1 : 0), 2 + (zoom > 2 ? 1 : 0));
    }
    for (const l of lights) {
      if (!l.glow) continue;
      zb = l.z || 0;
      const sx = fx(l.x, l.y), sy = fy(l.x, l.y);
      const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, l.r * 5);
      gr.addColorStop(0, `rgba(${l.glow[0]},${l.glow[1]},${l.glow[2]},${0.09 * night})`);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(sx - l.r * 5, sy - l.r * 5, l.r * 10, l.r * 10);
    }
    zb = 0;
    ctx.globalCompositeOperation = 'source-over';
    drawEyes(game.zombies, night, t);
  }
}

// ---------------------------------------------------------------
// 遠景（簡略化したチャンクの絵：地面は粗く、家と木だけ。半分の解像度）
// ---------------------------------------------------------------
const impCache = new WeakMap();
const IMP_UP = 44;   // 家の高さぶんの余白
const FARCOL = {};
FARCOL[T.ROAD] = [74, 77, 82]; FARCOL[T.BRIDGE] = [96, 98, 102]; FARCOL[T.PARKING] = [92, 94, 98];
FARCOL[T.GRASS] = [88, 116, 60]; FARCOL[T.BANK] = [86, 112, 60]; FARCOL[T.DIRT] = [138, 115, 84]; FARCOL[T.GRAVEL] = [150, 148, 140];
FARCOL[T.SAND] = [196, 178, 140]; FARCOL[T.FIELD] = [104, 80, 58]; FARCOL[T.CROP] = [92, 112, 58]; FARCOL[T.PUDDLE] = [96, 112, 118]; FARCOL[T.WATER] = [58, 86, 100];
function buildImpostor(c) {
  const w = Math.ceil(GW / 2), h = Math.ceil((GH + TOP + IMP_UP) / 2);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const img = g.createImageData(w, h), D = img.data;
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const sx = px * 2 + 1 - CS * 8, sy = py * 2 + 1 - TOP - IMP_UP;
    const [u, v] = unproject(c, sx, sy);
    if (u < 0 || v < 0 || u >= CS || v >= CS) continue;
    const b = c.base[(v | 0) * CS + (u | 0)];
    const col = FARCOL[b] || [60, 58, 54];
    const k = slopeShade(c, u, v) * (0.94 + M.hash(game.seed, c.x0 + px, c.y0 + py, 9) * 0.1);
    const o = (py * w + px) * 4;
    D[o] = col[0] * k; D[o + 1] = col[1] * k; D[o + 2] = col[2] * k; D[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // チャンクの左上の角を基準にした投影（半分の大きさ）
  const lx = (x, y) => ((x - c.x0) - (y - c.y0)) * 4 + CS * 4;
  const ly = (x, y, z) => (((x - c.x0) + (y - c.y0)) * 4 + TOP + IMP_UP - z - hLocal(c, x - c.x0, y - c.y0) * LPX) / 2;
  const pl = (pts, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); };
  const items = [];
  for (const hs of c.houses) items.push({ d: (hs.x0 + hs.x1 + hs.y0 + hs.y1) / 2, hs });
  for (let y = 0; y < CS; y++) for (let x = 0; x < CS; x++) if (c.t[y * CS + x] === T.TREE) items.push({ d: c.x0 + c.y0 + x + y + 1, tr: [c.x0 + x + 0.5, c.y0 + y + 0.5] });
  items.sort((a, b) => a.d - b.d);
  const lights = [];
  for (const it of items) {
    if (it.tr) {
      const [x, y] = it.tr;
      g.fillStyle = '#34502c'; g.beginPath(); g.arc(lx(x, y), ly(x, y, 15), 3.5, 0, 6.3); g.fill();
      continue;
    }
    const hs = it.hs, hz = hs.floors === 2 ? 22 : 12, cxm = (hs.x0 + hs.x1) / 2, cym = (hs.y0 + hs.y1) / 2;
    const base = hLocal(c, cxm - c.x0, cym - c.y0) * LPX;
    const Q = (x, y, z) => [lx(x, y), (((x - c.x0) + (y - c.y0)) * 4 + TOP + IMP_UP - z - base) / 2];
    const wc = WALLS[hs.wall], rc = ROOFS[hs.roof];
    pl([Q(hs.x0, hs.y1, 0), Q(hs.x1, hs.y1, 0), Q(hs.x1, hs.y1, hz), Q(hs.x0, hs.y1, hz)], shade(wc, 0.86));
    pl([Q(hs.x1, hs.y1, 0), Q(hs.x1, hs.y0, 0), Q(hs.x1, hs.y0, hz), Q(hs.x1, hs.y1, hz)], shade(wc, 0.7));
    const rh = 7;
    if (hs.ridge === 'x') { const ym = (hs.y0 + hs.y1) / 2; pl([Q(hs.x0, hs.y0, hz), Q(hs.x1, hs.y0, hz), Q(hs.x1, ym, hz + rh), Q(hs.x0, ym, hz + rh)], shade(rc, 0.75)); pl([Q(hs.x0, ym, hz + rh), Q(hs.x1, ym, hz + rh), Q(hs.x1, hs.y1, hz), Q(hs.x0, hs.y1, hz)], rc); }
    else { const xm = (hs.x0 + hs.x1) / 2; pl([Q(hs.x0, hs.y0, hz), Q(hs.x0, hs.y1, hz), Q(xm, hs.y1, hz + rh), Q(xm, hs.y0, hz + rh)], shade(rc, 0.75)); pl([Q(xm, hs.y0, hz + rh), Q(xm, hs.y1, hz + rh), Q(hs.x1, hs.y1, hz), Q(hs.x1, hs.y0, hz)], shade(rc, 0.92)); }
    if (hs.lit) lights.push({ x: cxm + 0.5, y: hs.y1 + 0.2, z: base, h: 8, r: 1.0, a: 0.5, glow: [242, 211, 138] });
  }
  for (const o of c.props) {
    const z = hLocal(c, o.x - c.x0, o.y - c.y0) * LPX;
    if (o.k === 'pole' && o.light) lights.push({ x: o.x + 0.45, y: o.y + 0.45, z, h: 22, r: 2.2, a: 0.7, glow: [230, 240, 210] });
    else if (o.k === 'vend') lights.push({ x: o.x + 0.5, y: o.y + 0.5, z, h: 8, r: 1.6, a: 0.7, glow: [200, 225, 255] });
  }
  return { cv, lights };
}

// ---------------------------------------------------------------
// 家の中
// ---------------------------------------------------------------
const iCache = new WeakMap();
function buildInteriorGround(I) {
  const GWi = (I.W + I.H) * 8 + 2, GHi = (I.W + I.H) * 4 + 2;
  const cv = document.createElement('canvas');
  cv.width = GWi; cv.height = GHi;
  const g = cv.getContext('2d');
  const img = g.createImageData(GWi, GHi), D = img.data;
  const IT = M.IT;
  for (let py = 0; py < GHi; py++) for (let px = 0; px < GWi; px++) {
    const sx = px - I.H * 8 + 0.5, sy = py + 0.5;
    const u = (sx / 8 + sy / 4) / 2, v = (sy / 4 - sx / 8) / 2;
    if (u < 0 || v < 0 || u >= I.W || v >= I.H) continue;
    const lx = u | 0, ly = v | 0, fu = u - lx, fv = v - ly;
    const tt = I.t[ly * I.W + lx];
    const n = M.hash(game.seed, px + I.W * 97, py + I.H * 31, 401);
    let col;
    if (tt === IT.FLOOR || (tt >= 8 && tt !== IT.WALL)) {
      const plank = Math.floor(v * 3), pv = M.hash(game.seed, plank, Math.floor(u / 2.5 + plank * 0.37), 402);
      col = [138 + pv * 22 + (n - 0.5) * 8, 102 + pv * 16 + (n - 0.5) * 6, 66 + pv * 10];
      if ((v * 3) % 1 < 0.1) col = [col[0] - 26, col[1] - 22, col[2] - 16];
    } else if (tt === IT.TATAMI || tt === IT.FUTON) {
      col = ((u * 9) % 1 < 0.35) ? [176, 176, 118] : [162, 164, 106];
      col = [col[0] + (n - 0.5) * 6, col[1] + (n - 0.5) * 6, col[2]];
      if (fu < 0.06 || fv < 0.06) col = [70, 74, 52];
      if (tt === IT.FUTON && fu > 0.08 && fv > 0.08 && fu < 0.94 && fv < 0.94) col = ((fv * 4) % 1 < 0.5) ? [206, 212, 222] : [176, 188, 210];
    } else if (tt === IT.TILE) {
      col = (((u * 3) | 0) + ((v * 3) | 0)) & 1 ? [196, 196, 188] : [174, 178, 172];
      if ((u * 3) % 1 < 0.08 || (v * 3) % 1 < 0.08) col = [140, 140, 134];
    } else if (tt === IT.GENKAN) {
      col = [116 + (n - 0.5) * 18, 114 + (n - 0.5) * 18, 108 + (n - 0.5) * 18];
    } else col = [42, 38, 34];
    const o = (py * GWi + px) * 4;
    D[o] = col[0]; D[o + 1] = col[1]; D[o + 2] = col[2]; D[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const objs = [];
  for (let y = 0; y < I.H; y++) for (let x = 0; x < I.W; x++) {
    const tt = I.t[y * I.W + x];
    if (tt < 8) continue;
    if (tt <= IT.BROKEN) {
      const back = x === 0 || y === 0, front = x === I.W - 1 || y === I.H - 1;
      objs.push({ k: 'iwall', x, y, tt, back, front, h: back ? 20 : front ? 4 : 13, d: x + y + 1 });
    } else objs.push({ k: 'furn', x, y, tt, d: x + y + 1 });
  }
  return { cv, objs };
}

function drawIWall(o, day) {
  const IT = M.IT, x = o.x, y = o.y;
  if (o.front && (o.tt === IT.DOOR || o.tt === IT.BROKEN)) {
    // 手前の壁の出口：敷居だけ
    const a = P(x + 0.5, y + 0.5, 0);
    rect(a[0] - 4, a[1] - 1, 8, 2, o.tt === IT.DOOR ? '#6b5440' : '#3c4248');
    return;
  }
  box(x, y, x + 1, y + 1, 0, o.h, '#4c463e', '#d2c9b6', '#b8ae99');
  if (!o.back) return;
  // 奥の壁の内側の面（窓・戸）
  const onTop = y === 0 && x !== 0;
  const face = (a, b, z0, z1, col) => {
    if (onTop) poly([P(x + a, y + 1, z0), P(x + b, y + 1, z0), P(x + b, y + 1, z1), P(x + a, y + 1, z1)], col);
    else poly([P(x + 1, y + a, z0), P(x + 1, y + b, z0), P(x + 1, y + b, z1), P(x + 1, y + a, z1)], col);
  };
  if (o.tt === IT.WIN) { face(0.15, 0.85, 8, 17, day > 0.3 ? '#cfdfe8' : '#2a3442'); face(0.48, 0.52, 8, 17, '#8a8a84'); }
  else if (o.tt === IT.BROKEN) { face(0.15, 0.85, 7, 17, day > 0.3 ? '#dfe9ef' : '#1d242c'); face(0.3, 0.4, 10, 17, '#6d7880'); face(0.6, 0.72, 7, 12, '#6d7880'); }
  else if (o.tt === IT.DOOR) { face(0.18, 0.82, 0, 16, '#6b5440'); face(0.65, 0.72, 7, 8, '#c8b070'); }
}

function drawFurn(o) {
  const IT = M.IT, x = o.x, y = o.y;
  switch (o.tt) {
    case IT.FRIDGE:
      box(x + 0.12, y + 0.15, x + 0.88, y + 0.85, 0, 21, '#ecebe6', '#d6d5d0', '#bebdb8');
      { const a = P(x + 0.5, y + 0.85, 13), b = P(x + 0.85, y + 0.85, 13); pline(a[0], a[1], b[0], b[1], '#a8a7a2'); }
      break;
    case IT.SINK:
      box(x + 0.04, y + 0.04, x + 0.96, y + 0.96, 0, 9, '#b9bec2', '#8f7a62', '#7d6a55');
      { const a = P(x + 0.5, y + 0.5, 9); ctx.fillStyle = '#7e868c'; ctx.beginPath(); ctx.ellipse(a[0], a[1], 4, 2, 0, 0, 6.3); ctx.fill(); rect(a[0] - 3, a[1] - 5, 1, 4, '#c9cfd3'); rect(a[0] - 3, a[1] - 5, 3, 1, '#c9cfd3'); }
      break;
    case IT.CUP:
      box(x + 0.1, y + 0.2, x + 0.9, y + 0.8, 0, 15, '#6e5038', '#8a6648', '#765639');
      { const a = P(x + 0.3, y + 0.8, 12), b = P(x + 0.9, y + 0.5, 12); rect(a[0] - 2, a[1], 4, 3, '#a9b6bb'); rect(b[0] - 1, b[1], 3, 3, '#95a2a7'); }
      break;
    case IT.TABLE: box(x + 0.1, y + 0.1, x + 0.9, y + 0.9, 5, 2, '#a07a55', '#7a5a3c', '#6a4d33'); { const a = P(x + 0.2, y + 0.85, 0); rect(a[0], a[1] - 5, 1, 5, '#5a4030'); const b = P(x + 0.85, y + 0.2, 0); rect(b[0], b[1] - 5, 1, 5, '#5a4030'); } break;
    case IT.TV: box(x + 0.15, y + 0.2, x + 0.85, y + 0.8, 0, 4, '#4a3a2c', '#3a2c20', '#33271c'); box(x + 0.3, y + 0.35, x + 0.7, y + 0.6, 4, 9, '#202224', '#141618', '#1b1d20'); break;
    case IT.SHELF: box(x + 0.15, y + 0.15, x + 0.85, y + 0.85, 0, 17, '#7a5a3c', '#8a6648', '#6e5038'); { for (let i = 0; i < 4; i++) { const a = P(x + 0.25 + i * 0.15, y + 0.85, 12); rect(a[0], a[1], 1, 3, ['#8a3a2c', '#2c4a6a', '#c8b070', '#3a5a3a'][i]); } } break;
    case IT.KOTATSU: box(x + 0.05, y + 0.05, x + 0.95, y + 0.95, 0, 4, '#a4553a', '#8e4630', '#7a3c29'); box(x + 0.15, y + 0.15, x + 0.85, y + 0.85, 4, 1, '#b08a5e', '#8a6a48', '#7a5c3e'); break;
  }
}

function renderInterior(t, Lt, night) {
  const p = game.player, I = game.inside, day = Lt.day;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  let ic = iCache.get(I);
  if (!ic) { ic = buildInteriorGround(I); iCache.set(I, ic); }
  ctx.drawImage(ic.cv, Math.round(fx(0, 0) - I.H * 8), Math.round(fy(0, 0)));
  drawDust();
  const objs = ic.objs.slice();
  for (const z of I.zombies) objs.push({ k: 'zombie', z, d: z.x + z.y });
  objs.push({ k: 'player', d: p.x + p.y });
  objs.sort((a, b) => a.d - b.d);
  for (const o of objs) {
    if (o.k === 'iwall') drawIWall(o, day);
    else if (o.k === 'furn') drawFurn(o);
    else if (o.k === 'zombie') drawZombie(o.z, t);
    else drawPlayer(t);
  }
  ctx.globalAlpha = 0.28; drawPlayer(t, true); ctx.globalAlpha = 1;
  // 薄暗い。窓と戸口から外の光が入る
  const holes = [{ x: p.x, y: p.y, r: 4.2, a: 0.7 }];
  const glows = [];
  for (let y = 0; y < I.H; y++) for (let x = 0; x < I.W; x++) {
    const tt = I.t[y * I.W + x];
    if (tt !== M.IT.WIN && tt !== M.IT.BROKEN && tt !== M.IT.DOOR) continue;
    const ix = x === 0 ? 1.2 : x === I.W - 1 ? I.W - 1.2 : x + 0.5, iy = y === 0 ? 1.2 : y === I.H - 1 ? I.H - 1.2 : y + 0.5;
    const isExit = I.exits.some(e => e.x === x && e.y === y);
    const k = (isExit ? 0.9 : 0.75) * day + 0.12;
    holes.push({ x: ix, y: iy, r: isExit ? 2.6 : 2.2, a: k });
    if (day > 0.2) glows.push({ x: ix, y: iy, r: 2.2 });
  }
  applyDark(0.55 + 0.37 * night, holes, '6,6,10');
  ctx.globalCompositeOperation = 'lighter';
  for (const l of glows) {
    const sx = fx(l.x, l.y), sy = fy(l.x, l.y);
    const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, l.r * 8);
    gr.addColorStop(0, `rgba(255,236,200,${0.07 * day})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(sx - l.r * 8, sy - l.r * 8, l.r * 16, l.r * 16);
  }
  ctx.globalCompositeOperation = 'source-over';
  if (night > 0.005) drawEyes(I.zombies, night, t);
}

function drawZombie(z, t) {
  const sx = fx(z.x, z.y), sy = fy(z.x, z.y);
  const chase = z.state === 1;
  const cl = CLOTH[z.kind % CLOTH.length];
  const sway = chase ? 0 : Math.round(Math.sin(t * 1.3 + z.sway) * 0.6);
  const moving = Math.hypot(z.vx, z.vy) > 0.1;
  drawPerson(sx + sway, sy, {
    top: cl[0], bottom: cl[1], skin: '#8f9a7c', hair: z.kind % 4 === 1 ? '#8a8a84' : '#2a2622',
    face: z.face, away: !chase && z.id % 2 === 0 && !moving, phase: z.phase * (chase ? 14 : 5), moving,
    arms: chase ? 'fwd' : 'down', zombie: true, tilt: (z.id % 3) - 1, kind: z.kind,
  });
}

let mountPose = 0;
function drawPlayer(t, ghost) {
  const p = game.player;
  const sx = fx(p.x, p.y), sy = fy(p.x, p.y);
  const [ex, ey] = headingToScreen(p.heading);
  const face = ex >= 0 ? 1 : -1, away = ey < -0.3;
  const sk = p.riding ? p.vehicle === 'skate' : p.mount > 0 && p.mountBike && p.mountBike.type === 'skate';
  if (sk) {
    // スケボー：片足で地面を蹴って乗る。乗っている間はこぐ代わりに蹴る
    const f = p.mount > 0 ? 1 - p.mount / CFG.feel.mount : 1;
    if (p.mount > 0) drawSkate(p.mountBike.x, p.mountBike.y, p.mountBike.heading, p.mountBike.col, 0);
    else drawSkate(p.x, p.y, p.heading, p.bikeCol, p.walkPhase);
    const kicking = p.mount > 0 ? f < 0.7 : (p.kick && Math.sin(p.walkPhase * 1.2) > 0);
    drawPerson(sx, sy - 2, { top: '#3b4d63', bottom: '#2c2c33', skin: '#e0b896', hair: '#1e1a18', face, away, phase: 0, moving: false, arms: 'out', kick: kicking ? -face : 0 });
    return;
  }
  if (p.riding || p.mount > 0) {
    const f = p.mount > 0 ? 1 - p.mount / CFG.feel.mount : 1;
    if (p.mount > 0) drawBike(p.mountBike.x, p.mountBike.y, p.mountBike.heading, p.mountBike.col, 0, false, false);
    if (p.riding) drawBike(p.x, p.y, p.heading, p.bikeCol, p.walkPhase, false, false);
    // またがる一瞬：足を上げて腰を落とす
    const lift = p.mount > 0 ? Math.round(Math.sin(f * Math.PI) * 3) : 0;
    drawPerson(sx - ex * 1.5, sy - ey * 1.5 - lift, {
      top: '#3b4d63', bottom: '#2c2c33', skin: '#e0b896', hair: '#1e1a18', face, away, phase: p.walkPhase * 2, moving: false,
      arms: p.riding ? 'bar' : 'down', seated: f > 0.6,
    });
    return;
  }
  if (p.act) {
    const k = 1 - p.act.t / p.act.dur;
    drawPerson(sx, sy, { top: '#3b4d63', bottom: '#2c2c33', skin: '#e0b896', hair: '#1e1a18', face, crouch: true, bite: p.act.kind === 'eat' && (k * 6 % 1) < 0.5 });
    return;

    L.windF.frequency.setTargetAtTime(250 + gust * 500 + hh * 220, ac.currentTime, 0.7);
    setL(L.grass, env.grass * gust * 0.05 * io, 0.8);
    const wv = env.wd < 99 ? Math.min(1, 1 / (1 + (env.wd / 3.5) ** 2) + env.water) : 0;
    setL(L.water, wv * 0.35 * io, 0.6);
    setL(L.waterB, wv * 0.04 * (0.5 + Math.random()) * io, 0.05);
    setL(L.city, 0.35 * (0.6 + day * 0.4) * (1 - env.open * 0.3) * (game.inside ? 0.5 : 1), 2);
    setL(L.room, game.inside ? 0.05 : 0, 0.3);
    // 息づかい：本気ダッシュで荒くなり、スタミナが戻るまで続く
    pant = Math.max(0, Math.min(1, pant + (p.sprint ? dt * 0.6 : -dt * 0.12)));
    const want = Math.max(pant, p.tired ? 0.8 : 0, (1 - p.stamina / CFG.needs.max) * 0.7);
    breathT -= dt;
    if (want > 0.12 && breathT <= 0) { breathT = 0.95 - want * 0.55; breath(want, inhale = !inhale); }
    // 腹の虫
    if (p.food < 20 && Math.random() < dt * 0.05) growl();
    // 乗り物（下り坂で速度が乗ると、風切り音が強く・高くなる）
    const sk = p.riding && p.vehicle === 'skate', bk = p.riding && !sk;
    const v = p.riding ? p.speed : 0, vr = v / CFG.speed.bike;
    setL(L.speedWind, vr * vr * 0.32, 0.15);
    L.speedWindF.frequency.setTargetAtTime(500 + vr * 1100, ac.currentTime, 0.2);
    setL(L.tire, bk ? vr * 0.5 : 0, 0.1);
    L.tireF.frequency.setTargetAtTime(150 + vr * 500 + (env.grass > 0.5 ? 400 : 0), ac.currentTime, 0.1);
    setL(L.chain, bk && p.pedal ? vr * 0.11 : 0, 0.08);
    L.chainF.frequency.setTargetAtTime(300 + vr * 1300, ac.currentTime, 0.1);
    // スケボー：ゴーッという転がり。悪い地面ではザラザラ
    const rough = sk ? (['grass', 'gravel', 'dirt'].includes((M.SURF[M.baseAt(game.world, p.x, p.y)] || [])[2]) ? 1 : 0) : 0;
    setL(L.roll, sk ? Math.min(1, v / 2.8) * 0.55 : 0, 0.08);
    L.rollF.frequency.setTargetAtTime(160 + v * 90 + rough * 200, ac.currentTime, 0.1);
    setL(L.grit, sk ? (0.02 + rough * 0.08) * Math.min(1, v / 1.5) : 0, 0.08);
    if (sk && v > 0.3) {
      // 路面の継ぎ目でカタン
      rollAcc += v * CFG.speed.unit * dt;
      if (rollAcc > 1.7) { rollAcc = 0; const t = ac.currentTime; burst(t, 0.02, 'bandpass', 1400, 2, 0.12); burst(t + 0.05, 0.02, 'bandpass', 1300, 2, 0.1); }
      // 地面を蹴る音
      kickT -= dt;
      if (p.kick && kickT <= 0) { kickT = 0.55; burst(ac.currentTime, 0.16, 'bandpass', 1300, 0.8, 0.08, 0, 0, 0.03); }
    }
    // こがずに流しているときはラチェットの音
    if (bk && !p.pedal && v > 0.4) {
      clickT -= dt;
      if (clickT <= 0) { clickT = 0.5 / (v + 0.5); burst(ac.currentTime, 0.012, 'bandpass', 4500, 5, 0.05); }
    }
    setL(L.hum, env.vend < 8 ? 0.025 / (1 + (env.vend / 2) ** 2) : 0, 0.3);

    // 生き物たち
    const r = (rate) => Math.random() < rate * dt;
    const rp = () => Math.random() * 1.8 - 0.9;
    if (r(day * (0.12 + env.trees * 3 + env.grass * 0.4) * (1 + Lt.morning * 2))) bird(rp(), (0.025 + Math.random() * 0.03) * io);
    if (r(day * 0.025 * (1 + Lt.warm * 4))) crow(rp(), (0.035 + Math.random() * 0.03) * (game.inside ? 0.4 : 1));
    if (r(night * (1.2 + env.grass * 6 + env.field * 4))) cricket(rp(), (0.006 + Math.random() * 0.012) * io);
    if (r(night * (env.field * 5 + (env.wd < 12 ? 2 : 0)))) frog(rp(), (0.03 + Math.random() * 0.03) * io);
    if (r(0.006)) dog(rp());
    if (r(0.0018)) siren(rp() * 1.1);
    // 17時
    const day0 = Math.floor((game.time / CFG.time.secondsPerHour + CFG.time.startHour) / 24);
    if (h >= 17 && h < 17.2 && chimeDone !== day0) { chimeDone = day0; chime(); }

    // ゾンビの声と足音（家の中では中の者だけ）
    const zl = game.inside ? game.inside.zombies : game.zombies;
    for (const z of zl) {
      const d = Math.hypot(z.x - p.x, z.y - p.y);
      if (d > 24) continue;
      const pan = relPan(z.x, z.y);
      let gt = groanAt.get(z.id);
      if (gt === undefined) gt = Math.random() * 8;
      gt -= dt;
      if (gt <= 0) { groan(z, d, pan, z.state === 1, false); gt = z.state === 1 ? 1.1 + Math.random() * 1.8 : 4 + Math.random() * 9; }
      groanAt.set(z.id, gt);
      if (z.state === 1 && d < 16) {
        let st = (stepAt.get(z.id) || 0) - dt;
        if (st <= 0) { zstep(d, pan); st = 0.17 + Math.random() * 0.03; }
        stepAt.set(z.id, st);
      }
    }
    if (groanAt.size > 400) { const live = new Set(game.zombies.map(z => z.id)); for (const k of groanAt.keys()) if (!live.has(k)) { groanAt.delete(k); stepAt.delete(k); } }

    for (const e of events) {
      const t = ac.currentTime;
      if (e.t === 'step') footstep(e.mat, e.dash, e.sprint);
      else if (e.t === 'door') { if (e.kind === 'window') glass(t); else creak(t); }
      else if (e.t === 'drink') gulps(t);
      else if (e.t === 'eat') bites(t);
      else if (e.t === 'vend') { tone(t, 'sine', 120, 70, 0.18, 0.25); burst(t, 0.12, 'lowpass', 600, 1, 0.2); burst(t + 0.28, 0.18, 'highpass', 3000, 0.7, 0.05, 0, 0, 0.01); }
      else if (e.t === 'empty') { tone(t, 'sine', 180, 120, 0.08, 0.12); burst(t, 0.05, 'bandpass', 900, 2, 0.1); }
      else if (e.t === 'tired') breath(1, true);
      else if (e.t === 'mount') { if (e.v === 'skate') skateOn(t); else { kickstand(t); chainRattle(t); } }
      else if (e.t === 'dismount') { if (e.v === 'skate') { burst(t, 0.03, 'bandpass', 900, 1.5, 0.2); tone(t, 'sine', 140, 80, 0.08, 0.15); } else kickstand(t); }
      else if (e.t === 'bump') { tone(t, 'sine', 90, 50, 0.15, 0.3); burst(t, 0.15, 'bandpass', 2600, 3, 0.12, 0, 0.2); }
      else if (e.t === 'notice') { const z = zl.find(q => q.id === e.id); if (z) { groan(z, Math.hypot(z.x - p.x, z.y - p.y), relPan(z.x, z.y), true, true); groanAt.set(z.id, 1.5 + Math.random()); } }
    }
  }

  function kill() {
    dead = true;
    if (!ac) return;
    try { master.gain.cancelScheduledValues(0); master.gain.setValueAtTime(0, ac.currentTime); master.gain.value = 0; master.disconnect(); } catch (e) { }
    try { ac.suspend(); ac.close(); } catch (e) { }
  }
  function suspend(on) { if (!ac || dead) return; try { on ? ac.suspend() : ac.resume(); } catch (e) { } }
  function resume() { if (ac && !dead && ac.state !== 'running') ac.resume(); }
  return { init, update, kill, suspend, resume };
})();

// ---------------------------------------------------------------
// 入力（左下スティックは指が触れたときだけ出る。タップで乗る／降りる）
// ---------------------------------------------------------------
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, mx: 0, my: 0, t0: 0, moved: false, alpha: 0 };
const taps = new Map();
let interactQueued = false;
const keys = new Set();
const STICK_R = 52;
let alive = true;

function firstTouch() {
  Snd.init(); Snd.resume();
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) { el.requestFullscreen({ navigationUI: 'hide' }).then(() => { try { screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } }).catch(() => { }); }
}
function onDown(e) {
  if (!alive) return;
  e.preventDefault();
  firstTouch();
  const x = e.clientX, y = e.clientY;
  if (stick.id === null && x < window.innerWidth * 0.55) {
    stick.id = e.pointerId; stick.ox = x; stick.oy = y; stick.x = x; stick.y = y; stick.t0 = performance.now(); stick.moved = false;
  } else {
    taps.set(e.pointerId, { x, y, t0: performance.now() });
  }
}
function onMove(e) {
  if (!alive) return;
  if (e.pointerId === stick.id) {
    stick.x = e.clientX; stick.y = e.clientY;
    let dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > 8) stick.moved = true;
    if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
    stick.mx = dx / STICK_R; stick.my = dy / STICK_R;
  }
}
function onUp(e) {
  if (!alive) return;
  if (e.pointerId === stick.id) {
    if (!stick.moved && performance.now() - stick.t0 < 300) interactQueued = true;
    stick.id = null; stick.mx = stick.my = 0;
  } else {
    const tp = taps.get(e.pointerId);
    if (tp && performance.now() - tp.t0 < 400 && Math.hypot(e.clientX - tp.x, e.clientY - tp.y) < 20) interactQueued = true;
    taps.delete(e.pointerId);
  }
}
function onKeyDown(e) {
  if (!alive) return;
  firstTouch();
  keys.add(e.code);
  if (e.code === 'Space' || e.code === 'KeyE' || e.code === 'Enter') { interactQueued = true; e.preventDefault(); }
}
function onKeyUp(e) { keys.delete(e.code); }
const noMenu = e => e.preventDefault();
window.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);
window.addEventListener('contextmenu', noMenu);

// 画面の向き（上下左右）をワールドの向きに直す
function screenToWorld(ux, uy) {
  const mag = Math.min(1, Math.hypot(ux, uy));
  if (mag < 0.001) return [0, 0];
  const a = ux / 8, b = uy / 4;
  let wx = (a + b) / 2, wy = (b - a) / 2;
  const l = Math.hypot(wx, wy) || 1;
  return [wx / l * mag, wy / l * mag];
}
function readInput() {
  let ux = stick.mx, uy = stick.my, dash = false, sprint = false;
  let kx = 0, ky = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) kx -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) kx += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) ky -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) ky += 1;
  if (kx || ky) {
    const l = Math.hypot(kx, ky);
    // キーボード：矢印/WASD＝歩き、Shift＝ダッシュ、X（または Z）＝本気ダッシュ
    sprint = keys.has('KeyX') || keys.has('KeyZ');
    dash = sprint || keys.has('ShiftLeft') || keys.has('ShiftRight');
    ux = kx / l * (dash ? 0.75 : 0.42); uy = ky / l * (dash ? 0.75 : 0.42);
  }
  const [mx, my] = screenToWorld(ux, uy);
  const r = { mx, my, dash, sprint, interact: interactQueued };
  interactQueued = false;
  return r;
}

function drawUI(t) {
  uctx.clearRect(0, 0, ui.width, ui.height);
  const s = DPR, p = game.player, N = CFG.needs;
  // バー（数字なし。長さだけ）：下の中央にスタミナ、左下に空腹と水分
  const iw = window.innerWidth, ih = window.innerHeight;
  const bar = (x, y, w, v, col) => {
    const f = Math.max(0, Math.min(1, v / N.max));
    const low = f < 0.25 ? 0.55 + 0.45 * Math.abs(Math.sin(t * 4)) : 1;
    uctx.fillStyle = 'rgba(255,255,255,0.13)';
    uctx.fillRect(x * s, y * s, w * s, 3 * s);
    uctx.fillStyle = col.replace('A', String(0.85 * low));
    uctx.fillRect(x * s, y * s, w * f * s, 3 * s);
  };
  const sw = Math.min(200, iw * 0.24);
  bar((iw - sw) / 2, ih - 12, sw, p.stamina, p.tired ? 'rgba(200,120,100,A)' : 'rgba(236,232,220,A)');
  bar(16, ih - 19, 92, p.food, 'rgba(214,160,92,A)');
  bar(16, ih - 12, 92, p.water, 'rgba(126,178,216,A)');

  const on = stick.id !== null;
  stick.alpha += ((on ? 1 : 0) - stick.alpha) * (on ? 0.5 : 0.25);
  if (stick.alpha < 0.02) return;
  const a = stick.alpha, m = Math.hypot(stick.mx, stick.my);
  uctx.lineWidth = 2 * s;
  uctx.strokeStyle = `rgba(255,255,255,${(m >= CFG.stick.sprintAt ? 0.45 : 0.22) * a})`;
  uctx.beginPath(); uctx.arc(stick.ox * s, stick.oy * s, STICK_R * s, 0, 6.3); uctx.stroke();
  uctx.fillStyle = `rgba(255,255,255,${(0.2 + (m >= CFG.stick.dashAt ? 0.1 : 0) + (m >= CFG.stick.sprintAt ? 0.15 : 0)) * a})`;
  uctx.beginPath(); uctx.arc((stick.ox + stick.mx * STICK_R) * s, (stick.oy + stick.my * STICK_R) * s, 20 * s, 0, 6.3); uctx.fill();
}

// ---------------------------------------------------------------
// 終わり：次のフレームで真っ黒・無音・何も受け付けない
// ---------------------------------------------------------------
function blackout() {
  alive = false;
  Snd.kill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, view.width, view.height);
  uctx.clearRect(0, 0, ui.width, ui.height);
  window.removeEventListener('pointerdown', onDown);
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onUp);
  window.removeEventListener('keydown', onKeyDown);
  window.removeEventListener('keyup', onKeyUp);
  const swallow = e => { e.preventDefault(); e.stopPropagation(); };
  for (const ev of ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'keydown', 'click', 'wheel']) window.addEventListener(ev, swallow, { capture: true, passive: false });
  document.body.style.cursor = 'none';
}

// ---------------------------------------------------------------
// メインループ
// ---------------------------------------------------------------
const STEP = 1 / 60;
let acc = 0, lastT = performance.now(), frameDt = 0;
camX = game.player.x; camY = game.player.y;
resize();
function frame(now) {
  if (!alive) return;
  frameDt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  acc += frameDt;
  const inp = readInput();
  let first = true;
  while (acc >= STEP) {
    M.step(game, first ? inp : { mx: inp.mx, my: inp.my, dash: inp.dash, sprint: inp.sprint }, STEP);
    first = false;
    acc -= STEP;
    if (game.dead) break;
  }
  if (first && inp.interact) interactQueued = true;   // 今回は1歩も進まなかったので次へ持ち越す
  if (game.dead) { blackout(); return; }
  Snd.update(frameDt, game.events);
  game.events.length = 0;
  render(now / 1000);
  drawUI(now / 1000);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (!alive) return;
  Snd.suspend(document.hidden);
  lastT = performance.now(); acc = 0;
});
requestAnimationFrame(frame);
})();
</script>
</body>
