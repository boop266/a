<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>だっしゅつ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0c12;color:#f0e8d4;font-family:monospace;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:8px;background:#000a;box-shadow:0 0 0 2px #fff4;display:grid;place-items:center}
.hud canvas{position:static;width:28px;height:28px;image-rendering:pixelated}
#pad{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:150px;height:150px}
#pad i{position:absolute;background:#ffffff38;box-shadow:inset 0 0 0 2px #ffffff66}
#pad i:nth-child(1){left:50px;top:0;width:50px;height:150px;border-radius:8px}
#pad i:nth-child(2){left:0;top:50px;width:150px;height:50px;border-radius:8px}
#pad i:nth-child(3){left:50px;top:50px;width:50px;height:50px;background:#ffffff38;box-shadow:none}
.btn{position:fixed;width:70px;height:70px;border-radius:50%;background:#ffffff30;box-shadow:inset 0 0 0 2px #ffffff70;display:grid;place-items:center;font:bold 24px monospace;color:#fff}
.btn.on,#pad.on i{background:#ffffff66}
#ba{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(90px + env(safe-area-inset-bottom,0px))}
#bb{right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0d0c12dd;font-size:30px;letter-spacing:.2em;color:#ffd35a}
#win button{font:20px monospace;padding:10px 22px;border:0;border-radius:8px;background:#c8501e;color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><canvas id="hk" width="12" height="12"></canvas></div>
<div id="pad"><i></i><i></i><i></i></div>
<div class="btn" id="bb">B</div><div class="btn" id="ba">A</div>
<div id="win">だっしゅつ！<button id="again">もう一回</button></div>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d');
// ===== ドット絵 =====
const PAL={h:'#3a2a1c',s:'#f2c8a0',e:'#222',b:'#2a2a2a',c:'#e8823a',y:'#ffd35a',Y:'#c89a2a'};
const SPR={
 down:["....hhhh....","...hhhhhh...","...hssssh...","...sesses...","...ssssss...","....ssss....","..cccccccc..",".scccccccs..",".s.cccccc.s.","...cccccc...","...cc..cc...","...bb..bb..."],
 up:  ["....hhhh....","...hhhhhh...","...hhhhhh...","...hhhhhh...","...shhhhs...","....ssss....","..cccccccc..",".scccccccs..",".s.cccccc.s.","...cccccc...","...cc..cc...","...bb..bb..."],
 side:["....hhhh....","...hhhhhh...","...hhhsss...","...hhssse...","...hsssss...","....ssss....","...cccccc...","...cccccs...","...ccccs....","...cccccc...","...cc.cc....","...bb.bb...."],
 key:["....yyyy....","...y....y...","...y....y...","....yyyy....",".....yY.....",".....yY.....",".....yyyY...",".....yY.....",".....yyY....",".....yY....."]};
const SC={};function spr(n){if(SC[n])return SC[n];const a=SPR[n],c=document.createElement('canvas');c.width=a[0].length;c.height=a.length;const x=c.getContext('2d');
 a.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}));return SC[n]=c}
// ===== 地図 =====
// h：高さ（0〜2）。壁は高さ3。st：階段（上る向き [dx,dy]、なければ null）
const MW=24,MH=22,TOP=3,LH=12;
let C,P,key,door,won;
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const cell=(x,y)=>C[y]&&C[y][x];
function gen(){
 for(let tries=0;tries<200;tries++){
  C=[...Array(MH)].map((_,y)=>[...Array(MW)].map((_,x)=>({h:0,wall:x==0||y==0||x==MW-1||y==MH-1,st:null})));
  C.forEach((r,y)=>r.forEach(c=>{if(c.wall)c.h=y==MH-1?0:TOP}));
  const rects=[];
  const raise=(x,y,w,h,L)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){const c=cell(i,j);if(c&&!c.wall&&c.h<L)c.h=L}rects.push({x,y,w,h,L})};
  for(let n=ri(3,5);n--;){const w=ri(5,10),h=ri(4,8),x=ri(2,MW-w-2),y=ri(3,MH-h-3);raise(x,y,w,h,1);
   if(rnd()<.7&&w>=5&&h>=4){const w2=ri(2,w-3),h2=ri(2,h-2);raise(ri(x+1,x+w-1-w2),ri(y+1,y+h-1-h2),w2,h2,2)}}
  // 階段：高い所のふちの外側（一段低い所）に、上る向きをつけて置く
  rects.forEach(r=>{let k=ri(1,2);for(let t=0;t<40&&k;t++){const side=ri(0,3);let x,y,d;
   if(side==0){x=ri(r.x,r.x+r.w-1);y=r.y+r.h;d=[0,-1]}else if(side==1){x=ri(r.x,r.x+r.w-1);y=r.y-1;d=[0,1]}else if(side==2){x=r.x-1;y=ri(r.y,r.y+r.h-1);d=[1,0]}else{x=r.x+r.w;y=ri(r.y,r.y+r.h-1);d=[-1,0]}
   const c=cell(x,y),hi=cell(x+d[0],y+d[1]);if(!c||c.wall||c.st||!hi||hi.wall||hi.st||hi.h!=c.h+1)continue;c.st=d;k--}});
  // はじめの場所（下の方の低い所）、鍵（いちばん高い所）、出口（上の壁）
  const low=[],top=[];let mx=0;C.forEach((r,y)=>r.forEach((c,x)=>{if(!c.wall&&!c.st)mx=Math.max(mx,c.h)}));
  C.forEach((r,y)=>r.forEach((c,x)=>{if(c.wall||c.st)return;if(c.h==0&&y>=MH-5)low.push([x,y]);if(c.h==mx)top.push([x,y])}));
  const dc=[];for(let x=2;x<MW-2;x++){const b=cell(x,1);if(b.h==0&&!b.st)dc.push(x)}
  if(!low.length||!top.length||!dc.length)continue;
  const s=low[ri(0,low.length-1)];key=top[ri(0,top.length-1)];door={x:dc[ri(0,dc.length-1)],y:0,open:false};
  const D=reach(s[0],s[1]);if(!D.has(key+'')||!D.has(door.x+',1'))continue;
  P={x:s[0],y:s[1],px:s[0],py:s[1],ph:hOf(s[0],s[1]),f:'up',flip:false,key:false,mv:0};won=false;return}
}
const hOf=(x,y)=>{const c=cell(x,y);return c.h+(c.st?.5:0)};
// 一歩うごけるか：同じ高さ、または階段で一段
function can(x,y,dx,dy){const a=cell(x,y),b=cell(x+dx,y+dy);if(!b)return false;
 if(b.wall)return door.open&&x+dx==door.x&&y+dy==door.y;
 if(a.wall)return false;
 if(a.h==b.h)return true;
 if(a.st&&b.h==a.h+1&&a.st[0]==dx&&a.st[1]==dy)return true;
 if(b.st&&a.h==b.h+1&&b.st[0]==-dx&&b.st[1]==-dy)return true;
 return false}
function reach(sx,sy){const S=new Set([sx+','+sy]),q=[[sx,sy]];while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(x+dx)+','+(y+dy);if(!S.has(k)&&can(x,y,dx,dy)){S.add(k);q.push([x+dx,y+dy])}}}return S}
// ===== 操作（十字キーとA・B／キーボードは矢印とZ・X） =====
let dir=null,aHit=false;const K={arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0]},held=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(K[k]){held.add(k);e.preventDefault()}if(k=='z'&&!e.repeat)aHit=true});
addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
const pad=document.getElementById('pad');let padId=null,padDir=null;
function padAt(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(Math.hypot(x,y)<12){padDir=null;return}padDir=Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)]}
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(e.pointerId);pad.classList.add('on');padAt(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padAt(e)});
const padUp=e=>{if(e.pointerId===padId){padId=null;padDir=null;pad.classList.remove('on')}};pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);
[['ba',()=>aHit=true],['bb',()=>{}]].forEach(([id,f])=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{b.classList.add('on');f()});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')))});
// ===== 動き =====
function face(d){P.f=d[1]<0?'up':d[1]>0?'down':'side';if(d[0])P.flip=d[0]<0}
const fd=()=>P.f=='up'?[0,-1]:P.f=='down'?[0,1]:[P.flip?-1:1,0];
function update(dt){if(won)return;P.mv-=dt;
 let d=padDir;if(!d)for(const k of held){d=K[k];break}
 if(P.mv<=0&&d){face(d);if(can(P.x,P.y,d[0],d[1])){P.x+=d[0];P.y+=d[1];P.mv=150;if(cell(P.x,P.y).wall){won=true;setTimeout(()=>document.getElementById('win').style.display='flex',400)}}else P.mv=90}
 if(aHit){aHit=false;const[dx,dy]=fd();
  if(!P.key&&((P.x==key[0]&&P.y==key[1])||(P.x+dx==key[0]&&P.y+dy==key[1]&&can(P.x,P.y,dx,dy)))){P.key=true;pop(key[0],key[1],'#ffd35a');hud()}
  else if(P.key&&!door.open&&P.x+dx==door.x&&P.y+dy==door.y){door.open=true;pop(door.x,door.y+1,'#bff5a8')}}
 const k=Math.min(1,dt/80);P.px+=(P.x-P.px)*k;P.py+=(P.y-P.py)*k;P.ph+=(hOf(P.x,P.y)-P.ph)*k}
let fx=[];function pop(x,y,c){const h=hOf(x,y);for(let i=0;i<16;i++)fx.push({x:x*16+8,y:y*16+8-h*LH,vx:(rnd()-.5)*3,vy:-rnd()*3,t:30,c})}
// ===== 描く =====
const TOPC=['#6a9a4a','#8ab85a','#b0d070'],TOPC2=['#64924a','#82b056','#a8c86a'],FACE=['#6a4a2e','#7a5634','#8a623a'];
let W,H,dpr,S,cam={x:0,y:0};
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;S=Math.max(2,Math.min(W,H)/(16*10))}addEventListener('resize',resize);resize();
function draw(now){g.setTransform(1,0,0,1,0,0);g.fillStyle='#0d0c12';g.fillRect(0,0,cv.width,cv.height);
 const tx=P.px*16+8,ty=P.py*16+8-P.ph*LH;cam.x+=(tx-cam.x)*.15;cam.y+=(ty-cam.y)*.15;
 g.imageSmoothingEnabled=false;g.setTransform(S*dpr,0,0,S*dpr,Math.round((W/2-cam.x*S)*dpr),Math.round((H/2-cam.y*S)*dpr));
 for(let y=0;y<MH;y++){
  for(let x=0;x<MW;x++){const c=C[y][x],X=x*16,hh=c.h*LH+(c.st?LH/2:0),Y=y*16-hh,s=cell(x,y+1);
   // 前の面（南の段差）
   const below=s?s.h*LH+(s.st?LH/2:0):0,fh=hh-below;
   if(fh>0){g.fillStyle=c.wall?'#4a4458':FACE[Math.min(2,c.h)];g.fillRect(X,Y+16,16,fh);g.fillStyle='#00000030';for(let k=4;k<fh;k+=LH)g.fillRect(X,Y+16+k,16,1);g.fillStyle='#ffffff18';g.fillRect(X,Y+16,16,1)}
   // 上の面
   if(c.wall){g.fillStyle='#5c5570';g.fillRect(X,Y,16,16);g.fillStyle='#4a4458';g.fillRect(X,Y+7,16,1);g.fillRect(X+((x+y)%2?4:11),Y,1,7);g.fillRect(X+((x+y)%2?10:3),Y+8,1,8)}
   else{g.fillStyle=((x+y)&1)?TOPC[c.h]:TOPC2[c.h];g.fillRect(X,Y,16,16);
    if(((x*7+y*13)%5)==0){g.fillStyle='#00000018';g.fillRect(X+4,Y+6,1,2);g.fillRect(X+10,Y+11,1,2)}
    // ふちの線：となりが低いと影、高いと明るく
    const e=cell(x+1,y),w=cell(x-1,y),n=cell(x,y-1);g.fillStyle='#00000040';if(e&&!e.wall&&e.h<c.h)g.fillRect(X+15,Y,1,16);if(w&&!w.wall&&w.h<c.h)g.fillRect(X,Y,1,16);
    if(n&&!n.wall&&n.h<c.h){g.fillStyle='#ffffff40';g.fillRect(X,Y,16,1)}
    if(n&&!n.wall&&n.h>c.h){g.fillStyle='#00000038';g.fillRect(X,Y,16,5)}}
   // 階段
   if(c.st){g.fillStyle='#b8a888';g.fillRect(X+1,Y+1,14,14);g.fillStyle='#7a6a54';const[a,b]=c.st;
    for(let k=0;k<4;k++){if(b)g.fillRect(X+1,Y+1+k*4+(b<0?0:3),14,1);else g.fillRect(X+1+k*4+(a<0?0:3),Y+1,1,14)}
    g.fillStyle='#ffffff50';if(b<0)g.fillRect(X+6,Y+3,4,1);if(b>0)g.fillRect(X+6,Y+12,4,1);if(a<0)g.fillRect(X+3,Y+6,1,4);if(a>0)g.fillRect(X+12,Y+6,1,4)}
   // 出口の扉（上の壁の前の面に）
   if(x==door.x&&y==door.y){const dy=Y+16+fh-15;if(door.open){g.fillStyle='#bff5a8';g.fillRect(X+2,dy,12,15)}else{g.fillStyle='#7a4a24';g.fillRect(X+2,dy,12,15);g.fillStyle='#5a3418';g.fillRect(X+7,dy,1,15);g.fillStyle='#ffd35a';g.fillRect(X+6,dy+7,4,4);g.fillStyle='#2a2030';g.fillRect(X+7,dy+8,2,2);
     g.fillStyle=`rgba(255,211,90,${.15+.15*Math.sin(now/250)})`;g.fillRect(X,dy-1,16,16)}}}
  // この列の上にいる物
  if(!P.key&&key[1]==y){const kx=key[0]*16+2,ky=y*16-hOf(key[0],y)*LH+2+Math.sin(now/300)*1.5;g.fillStyle='#00000030';g.fillRect(kx+1,y*16-hOf(key[0],y)*LH+13,10,2);g.drawImage(spr('key'),kx,ky)}
  if(Math.round(P.py)==y&&!won){const X=P.px*16,Y=P.py*16-P.ph*LH;g.fillStyle='#00000040';g.fillRect(X+3,Y+14,10,2);const moving=Math.abs(P.x-P.px)+Math.abs(P.y-P.py)>.05;
   g.save();if(P.f=='side'&&P.flip){g.translate(X*2+16,0);g.scale(-1,1)}g.drawImage(spr(P.f),X+2,Y+2+(moving?Math.sin(now/50)*.7:0));g.restore()}}
 fx.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=.15;f.t--;g.globalAlpha=f.t/30;g.fillStyle=f.c;g.fillRect(f.x,f.y,2,2)});g.globalAlpha=1;fx=fx.filter(f=>f.t>0)}
function hud(){const x=document.getElementById('hk').getContext('2d');x.clearRect(0,0,12,12);x.globalCompositeOperation='source-over';x.drawImage(spr('key'),0,1);if(!P.key){x.globalCompositeOperation='source-in';x.fillStyle='#ffffff40';x.fillRect(0,0,12,12)}}
let last=0;function frame(t){const dt=Math.min(50,t-(last||t));last=t;update(dt);draw(t);requestAnimationFrame(frame)}
function start(){gen();hud();cam.x=P.x*16+8;cam.y=P.y*16;document.getElementById('win').style.display='none'}
document.getElementById('again').onclick=start;
start();requestAnimationFrame(frame);
window.__esc={get C(){return C},get P(){return P},get key(){return key},get door(){return door},get won(){return won},can,gen:start,reach};
})();
</script>
</body></html>
