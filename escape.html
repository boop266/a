<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>だっしゅつ</title>
<style>
*{box-sizing:border-box}

#c{position:absolute;inset:0;width:100%;height:100%;display:block}

#pad{position:absolute;left:24px;bottom:22px;width:140px;height:140px}
#pad i{position:absolute;background:#ffffff38;box-shadow:inset 0 0 0 2px #ffffff66}
#pad i:nth-child(1){left:47px;top:0;width:46px;height:140px;border-radius:8px}
#pad i:nth-child(2){left:0;top:47px;width:140px;height:46px;border-radius:8px}
#pad i:nth-child(3){left:47px;top:47px;width:46px;height:46px;box-shadow:none}

.btn.on,#pad.on i{background:#ffffff66}
#ba{right:24px;bottom:84px}#bb{right:100px;bottom:30px}

</style></head><body>
<div id="root">
<canvas id="c"></canvas>
<div class="hud"><canvas id="hk" width="12" height="12"></canvas></div>
<div id="pad"><i></i><i></i><i></i></div>
<div class="btn" id="bb">B</div><div class="btn" id="ba">A</div>
<div id="win">だっしゅつ！<button id="again">もう一回</button></div>
</div>
<script>
(()=>{
const root=document.getElementById('root'),cv=document.getElementById('c'),g=cv.getContext('2d');
// ===== ドット絵（人・鍵） =====
const PAL={h:'#3a2a1c',s:'#f2c8a0',e:'#222',b:'#2a2a2a',c:'#e8823a',C:'#c86a2a',y:'#ffd35a',Y:'#c89a2a'};
const SPR={
 down:["....hhhh....","...hhhhhh...","...hssssh...","...sesses...","...ssssss...","....ssss....","..cccccccc..",".sccCCcccs..",".s.cccccc.s.","...cccccc...","...cc..cc...","...bb..bb..."],
 up:  ["....hhhh....","...hhhhhh...","...hhhhhh...","...hhhhhh...","...shhhhs...","....ssss....","..cccccccc..",".scccccccs..",".s.cccccc.s.","...cccccc...","...cc..cc...","...bb..bb..."],
 side:["....hhhh....","...hhhhhh...","...hhhsss...","...hhssse...","...hsssss...","....ssss....","...cccccc...","...cccCcs...","...ccccs....","...cccccc...","...cc.cc....","...bb.bb...."],
 key:["....yyyy....","...y....y...","...y....y...","....yyyy....",".....yY.....",".....yY.....",".....yyyY...",".....yY.....",".....yyY....",".....yY....."]};
const SC={};function spr(n){if(SC[n])return SC[n];const a=SPR[n],c=document.createElement('canvas');c.width=a[0].length;c.height=a.length;const x=c.getContext('2d');
 a.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!='.'){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}));return SC[n]=c}
// ===== 刑務所をつくる =====
// t：floor 床 / wall 壁 / bars 鉄格子 / gate 外への門。h：高さ。st：階段（上る向き）。obj：置いてある物。out：塀の外
const MW=46,MH=28,LH=14;
const BLOCK={bedT:1,bedB:1,toilet:1,rtable:1,mtable:1,counter:1,desk:1,bench:1,hoop:1,pullbar:1,locker:1,vend:1,weights:1,sbench:1};
let C,P,key,gate,won,ROOMS=[];
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
const cell=(x,y)=>C[y]&&C[y][x];
function gen(){
 for(let tries=0;tries<300;tries++){
  C=[...Array(MH)].map((_,y)=>[...Array(MW)].map((_,x)=>{
   const out=x==0||y==0||x==MW-1||y==MH-1,per=!out&&(x==1||y==1||x==MW-2||y==MH-2);
   return out?{t:'floor',fl:'grass',h:0,out:true}:per?{t:'wall',h:y==MH-2?1:3,per:true}:{t:'wall',h:2}}));
  // 監房棟（左か右）と、そのほかの部屋
  const cw=ri(17,21),left=rnd()<.5;
  const CB=left?{x0:1,x1:1+cw,y0:1,y1:MH-2,type:'cb'}:{x0:MW-2-cw,x1:MW-2,y0:1,y1:MH-2,type:'cb'};
  const rest=left?{x0:1+cw,x1:MW-2,y0:1,y1:MH-2}:{x0:1,x1:MW-2-cw,y0:1,y1:MH-2};
  let leaves=[rest];
  while(leaves.length<4){leaves.sort((a,b)=>(b.x1-b.x0)*(b.y1-b.y0)-(a.x1-a.x0)*(a.y1-a.y0));const r=leaves.shift();
   const w=r.x1-r.x0,h=r.y1-r.y0,vert=w>h*1.3?true:h>w*1.3?false:rnd()<.5;
   if(vert&&w>=14){const s=ri(r.x0+7,r.x1-7);leaves.push({x0:r.x0,x1:s,y0:r.y0,y1:r.y1},{x0:s,x1:r.x1,y0:r.y0,y1:r.y1})}
   else if(!vert&&h>=12){const s=ri(r.y0+6,r.y1-6);leaves.push({x0:r.x0,x1:r.x1,y0:r.y0,y1:s},{x0:r.x0,x1:r.x1,y0:s,y1:r.y1})}
   else{leaves.push(r);break}}
  if(leaves.length<3)continue;
  leaves.sort((a,b)=>(b.x1-b.x0)*(b.y1-b.y0)-(a.x1-a.x0)*(a.y1-a.y0));
  const types=['guard','mess','shower','work'];leaves.forEach((r,i)=>r.type=i==0?'yard':types[i-1]||'work');
  const rooms=[CB,...leaves];
  const FL={cb:'lino',yard:'asph',guard:'lino',mess:'lino',shower:'tile',work:'conc'};
  rooms.forEach(r=>{for(let y=r.y0+1;y<r.y1;y++)for(let x=r.x0+1;x<r.x1;x++)C[y][x]={t:'floor',fl:FL[r.type],h:0,room:r.type}});
  // 監房棟の中：上の階の牢屋・通路（手すり）・鉄の階段・吹き抜けの広間・下の階の牢屋
  const a=CB.x0+1,b=CB.x1-1,c=CB.y0+1,d=CB.y1-1;const cells=[];
  const n=Math.floor((b-a+2)/4);
  for(let y=c;y<=c+4;y++)for(let x=a;x<=b;x++)C[y][x]={t:y==c+3?'bars':'floor',fl:y==c+4?'steel':'cellf',h:1,rail:y==c+4};
  for(let y=d-3;y<=d;y++)for(let x=a;x<=b;x++)C[y][x]={t:y==d-3?'bars':'floor',fl:'cellf',h:0};
  for(let k=0;k<n;k++){const wx=a+4*k+3;if(wx>b)break;for(const y of[c,c+1,c+2,c+3,d-3,d-2,d-1,d])C[y][wx]={t:'wall',h:2}}
  for(let x=a+4*n-1;x<=b;x++)for(const y of[c,c+1,c+2,c+3,d-3,d-2,d-1,d])C[y][x]={t:'wall',h:2};
  for(let k=0;k<n;k++){const x0=a+4*k;if(x0+2>b)break;
   // 上の階：ベッド（左）・便器と洗面台（右奥）、格子のまん中が戸
   C[c][x0].obj='bedT';C[c+1][x0].obj='bedB';C[c][x0+2].obj='toilet';C[c+3][x0+1]={t:'floor',fl:'cellf',h:1,bdoor:true};cells.push([x0+1,c+1]);
   C[d-1][x0].obj='bedT';C[d][x0].obj='bedB';C[d][x0+2].obj='toilet';C[d-3][x0+1]={t:'floor',fl:'cellf',h:0,bdoor:true};cells.push([x0+1,d-1])}
  const stx=[];for(let i=0;i<2;i++){const x=ri(a+1,b-1);if(stx.some(s=>Math.abs(s-x)<4))continue;stx.push(x);C[c+5][x]={t:'floor',fl:'steel',h:0,st:[0,-1]}}
  for(let y=c+7;y<=d-6;y+=3)for(let x=a+2;x<=b-2;x+=4)if(rnd()<.6&&!stx.some(s=>Math.abs(s-x)<2))C[y][x].obj='rtable';
  for(const x of[a,b])if(!C[c+6][x].obj&&!C[c+5][x].st&&rnd()<.8)C[c+6][x].obj='vend';
  // ほかの部屋の中身
  leaves.forEach(r=>{const x0=r.x0+1,x1=r.x1-1,y0=r.y0+1,y1=r.y1-1;
   if(r.type=='guard'){ // 看守室：一段高い見張り台に机とモニター。鍵は机の上
    for(let y=y0;y<=y0+1;y++)for(let x=x0;x<=x1;x++)C[y][x]={t:'floor',fl:'plat',h:1};
    const sx=ri(x0,x1);C[y0+2][sx]={t:'floor',fl:'steel',h:0,st:[0,-1]};
    const ds=[];for(let x=x0;x<=x1;x+=2){C[y0][x].obj='desk';ds.push(x)}r.key=[pick(ds),y0];
    for(let y=y0+3;y<=y1;y++)if(!C[y][x1].st)C[y][x1].obj='locker'}
   if(r.type=='mess'){for(let x=x0;x<=x1;x++)C[y0][x].obj='counter';
    for(let y=y0+2;y<y1;y+=2)for(let x=x0+1;x<x1;x++)if((x-x0)%6!=0)C[y][x].obj='mtable'}
   if(r.type=='shower'){for(let x=x0+1;x<=x1-1;x+=2)C[y0][x].obj='shower';for(let x=x0+1;x<x1;x++)if(rnd()<.6)C[y1][x].obj='sbench'}
   if(r.type=='work'){for(let y=y0+1;y<y1;y+=3)for(let x=x0+1;x<x1;x+=3)C[y][x].obj='bench'}
   if(r.type=='yard'){const w=x1-x0+1,h=y1-y0+1;
    const hx=ri(x0+2,x1-2);C[y0][hx].obj='hoop';r.court={x:Math.max(x0,hx-3),y:y0,w:Math.min(7,x1-Math.max(x0,hx-3)+1),h:Math.min(5,y1-y0)};C[y1][ri(x0,x1)].obj='pullbar';for(let i=0;i<2;i++){const wx=ri(x0,x1),wy=ri(y0+1,y1);if(C[wy][wx].t=='floor'&&!C[wy][wx].obj&&!C[wy][wx].h)C[wy][wx].obj='weights'}
    if(w>=8&&h>=7){const bw=ri(4,Math.min(7,w-3)),bx=ri(x0+1,x1-bw),by=ri(y0+2,y1-3);  // 観覧席（一段高い）
     for(let y=by;y<by+2;y++)for(let x=bx;x<bx+bw;x++)C[y][x]={t:'floor',fl:'plat',h:1};C[by+2][ri(bx,bx+bw-1)]={t:'floor',fl:'steel',h:0,st:[0,-1]}}}});
  // 部屋どうしの出入口（どこへでも行けるように）
  const free=v=>v.t=='floor'&&!v.h&&!v.obj&&!v.st&&!v.bdoor;
  const adj=[];for(let i=0;i<rooms.length;i++)for(let j=0;j<rooms.length;j++){if(i==j)continue;const A=rooms[i],B=rooms[j];
   if(A.x1==B.x0){const ys=[];for(let y=Math.max(A.y0,B.y0)+1;y<=Math.min(A.y1,B.y1)-1;y++)if(free(cell(A.x1-1,y))&&free(cell(A.x1+1,y)))ys.push(y);if(ys.length)adj.push([i,j,ys.map(y=>[A.x1,y])])}
   if(A.y1==B.y0){const xs=[];for(let x=Math.max(A.x0,B.x0)+1;x<=Math.min(A.x1,B.x1)-1;x++)if(free(cell(x,A.y1-1))&&free(cell(x,A.y1+1)))xs.push(x);if(xs.length)adj.push([i,j,xs.map(x=>[x,A.y1])])}}
  const grp=rooms.map((_,i)=>i),fd=i=>grp[i]==i?i:grp[i]=fd(grp[i]);
  adj.sort(()=>rnd()-.5).forEach(([i,j,ps],k)=>{if(fd(i)!=fd(j)||k%5==0){grp[fd(i)]=fd(j);const[x,y]=pick(ps);C[y][x]={t:'floor',fl:'conc',h:0,door:true}}});
  // 外への門：運動場に面した塀
  const Yd=leaves.find(r=>r.type=='yard'),G=leaves.find(r=>r.type=='guard');if(!G)continue;
  const gc=[];
  for(let x=Yd.x0+1;x<Yd.x1;x++){if(Yd.y0==1)gc.push([x,1,0,1]);if(Yd.y1==MH-2)gc.push([x,MH-2,0,-1])}
  for(let y=Yd.y0+1;y<Yd.y1;y++){if(Yd.x0==1)gc.push([1,y,1,0]);if(Yd.x1==MW-2)gc.push([MW-2,y,-1,0])}
  const okg=gc.filter(([x,y,dx,dy])=>free(cell(x+dx,y+dy)));if(!okg.length)continue;
  const gp=pick(okg);gate={x:gp[0],y:gp[1],open:false};C[gp[1]][gp[0]]={t:'gate',h:0,fl:'conc'};
  key=G.key;
  const s=pick(cells);
  const D=reach(s[0],s[1]);if(!D.has(key[0]+','+(key[1]+1))||!D.has((gp[0]+gp[2])+','+(gp[1]+gp[3])))continue;
  P={x:s[0],y:s[1],px:s[0],py:s[1],ph:hOf(s[0],s[1]),f:'down',flip:false,key:false,mv:0};won=false;ROOMS=rooms;return}
}
const hOf=(x,y)=>{const c=cell(x,y);return c.h+(c.st?.5:0)};
function can(x,y,dx,dy){const a=cell(x,y),b=cell(x+dx,y+dy);if(!b)return false;
 if(b.t=='gate')return gate.open;
 if(b.t!='floor'||BLOCK[b.obj])return false;
 if(a.h==b.h)return true;
 if(a.st&&b.h==a.h+1&&a.st[0]==dx&&a.st[1]==dy)return true;
 if(b.st&&a.h==b.h+1&&b.st[0]==-dx&&b.st[1]==-dy)return true;
 return false}
function reach(sx,sy){const S=new Set([sx+','+sy]),q=[[sx,sy]];while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(x+dx)+','+(y+dy);if(!S.has(k)&&can(x,y,dx,dy)){S.add(k);q.push([x+dx,y+dy])}}}return S}
// ===== 横画面 =====
let W,H,dpr,S,rot=false,cam={x:0,y:0};
function resize(){const iw=innerWidth,ih=innerHeight;rot=ih>iw;W=rot?ih:iw;H=rot?iw:ih;
 root.style.width=W+'px';root.style.height=H+'px';root.style.transform=rot?`translate(${iw}px,0) rotate(90deg)`:'none';
 dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;S=Math.max(1,Math.floor(H*dpr/(16*11)))/dpr}
addEventListener('resize',resize);resize();
// ===== 操作（十字キーとA・B／キーボードは矢印とZ・X） =====
let aHit=false,tap=null;const K={arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0]},held=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(K[k]){held.add(k);if(!e.repeat)tap=K[k];e.preventDefault()}if(k=='z'&&!e.repeat)aHit=true});
addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
const pad=document.getElementById('pad');let padId=null,padDir=null;
function padAt(e){const r=pad.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(rot)[x,y]=[y,-x];
 if(Math.hypot(x,y)<12){padDir=null;return}padDir=Math.abs(x)>Math.abs(y)?[Math.sign(x),0]:[0,Math.sign(y)]}
pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(e.pointerId);pad.classList.add('on');padAt(e);if(padDir)tap=padDir});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padAt(e)});
const padUp=e=>{if(e.pointerId===padId){padId=null;padDir=null;pad.classList.remove('on')}};pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);
[['ba',()=>aHit=true],['bb',()=>{}]].forEach(([id,f])=>{const b=document.getElementById(id);b.addEventListener('pointerdown',()=>{b.classList.add('on');f()});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')))});
// ===== 動き =====
function face(d){P.f=d[1]<0?'up':d[1]>0?'down':'side';if(d[0])P.flip=d[0]<0}
const fdir=()=>P.f=='up'?[0,-1]:P.f=='down'?[0,1]:[P.flip?-1:1,0];
function update(dt){if(won)return;P.mv-=dt;
 let d=padDir;if(!d)for(const k of held){d=K[k];break}if(!d&&tap&&P.mv<=0)d=tap;if(P.mv<=0)tap=null;
 if(P.mv<=0&&d){face(d);if(can(P.x,P.y,d[0],d[1])){P.x+=d[0];P.y+=d[1];P.mv=150;if(cell(P.x,P.y).out){won=true;setTimeout(()=>document.getElementById('win').style.display='flex',400)}}else P.mv=90}
 if(aHit){aHit=false;const[dx,dy]=fdir(),fx2=P.x+dx,fy2=P.y+dy;
  if(!P.key&&((P.x==key[0]&&P.y==key[1])||(fx2==key[0]&&fy2==key[1]))){P.key=true;pop(key[0],key[1],'#ffd35a');hud()}
  else if(P.key&&!gate.open&&fx2==gate.x&&fy2==gate.y){gate.open=true;pop(gate.x,gate.y,'#bff5a8')}}
 const k=Math.min(1,dt/80);P.px+=(P.x-P.px)*k;P.py+=(P.y-P.py)*k;P.ph+=(hOf(P.x,P.y)-P.ph)*k}
let fx=[];function pop(x,y,c){const h=hOf(x,y);for(let i=0;i<16;i++)fx.push({x:x*16+8,y:y*16+8-h*LH,vx:(rnd()-.5)*3,vy:-rnd()*3,t:30,c})}
// ===== 描く =====
// 1列ずつ下ごしらえした絵（床・段差の面・壁・置き物）を、奥の列から順に重ねる。人は自分の列のあとに描くので、手前の壁や格子に正しく隠れる
const TP=80,RH=TP+16+64;
const hs=(x,y,k)=>{let n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(k||0,982451653))|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296};
const topH=c=>c.h*LH+(c.st?LH/2:0);
let ROWS=[],LIGHT=null,ANIM=[];
let q=null;const R=(c,x,y,w,h)=>{q.fillStyle=c;q.fillRect(x,y,w,h)};
function vgrad(x,y,w,h,c0,c1){const gr=q.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c0);gr.addColorStop(1,c1);q.fillStyle=gr;q.fillRect(x,y,w,h)}
function hgrad(x,y,w,h,c0,c1){const gr=q.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,c0);gr.addColorStop(1,c1);q.fillStyle=gr;q.fillRect(x,y,w,h)}
function oval(x,y,rx,ry,c){q.fillStyle=c;q.beginPath();q.ellipse(x,y,rx,ry,0,0,7);q.fill()}
function shadow(x,y,w,h){oval(x+w/2+1.5,y+h-1,w/2+1,3,'#00000048')}
// --- 床（ざらつき入りの16×16を4種ずつ作っておく）
const FT={};
function ftile(fl,v){const k=fl+v;if(FT[k])return FT[k];const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d'),im=x.createImageData(16,16),d=im.data;
 const n=(i,j,s)=>hs(i+v*17,j+v*31,s);
 for(let j=0;j<16;j++)for(let i=0;i<16;i++){let r,g2,b;const z=n(i,j,1);
  if(fl=='lino'){const t=((i>>3)+(j>>3))&1;[r,g2,b]=t?[198,190,170]:[184,176,158];const f=n(i,j,2);if(f<.06){r-=28;g2-=26;b-=22}else if(f>.95){r+=14;g2+=14;b+=12}if(i%8==0||j%8==0){r-=12;g2-=12;b-=12}}
  else if(fl=='cellf'){[r,g2,b]=[140,137,128];const f=z*18-9;r+=f;g2+=f;b+=f;if(n(i>>1,j>>1,3)<.08){r-=14;g2-=14;b-=12}}
